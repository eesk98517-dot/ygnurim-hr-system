        const LeaveActionModal = ({ onClose, staffList, adminName, initialData = null, showAlert }) => {
            const isEdit = !!(initialData && initialData.id); 
            const [selectedStaffId, setSelectedStaffId] = useState(initialData?.staffId || '');
            const [staffSearch, setStaffSearch] = useState('');
            const [isStaffDropdownOpen, setIsStaffDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            const [dateMode, setDateMode] = useState('single'); 
            const [leaveDate, setLeaveDate] = useState(initialData?.date || toLocalYMD(new Date()));
            const [endDate, setEndDate] = useState(initialData?.date || toLocalYMD(new Date()));
            const [customDates, setCustomDates] = useState([]); 
            const [customDateInput, setCustomDateInput] = useState('');
            const [customYear, setCustomYear] = useState(new Date().getFullYear());

            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1'); 
            const [leaveHourValue, setLeaveHourValue] = useState(''); 
            const [reason, setReason] = useState(initialData?.reason || '');
            const [msg, setMsg] = useState('');

            useEffect(() => {
                const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsStaffDropdownOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => {
                if (initialData && staffList.length > 0) {
                    const staff = staffList.find(s => s.id === initialData.staffId);
                    if (staff) setStaffSearch(`${staff.name}`);
                }
            }, [initialData, staffList]);

            useEffect(() => { if (dateMode === 'multi') { setInputType('day'); setLeaveDayType('1'); } }, [dateMode]);

            useEffect(() => {
                if (initialData && isEdit) {
                    const days = safeParseFloat(initialData.days);
                    if (days === 1 || days === 0.5) { setInputType('day'); setLeaveDayType(String(days)); }
                    else { setInputType('hour'); setLeaveHourValue(String(days)); }
                }
            }, [initialData, isEdit]);

            const filteredStaffList = useMemo(() => {
                return staffList.sort((a,b) => a.name.localeCompare(b.name)).filter(s => s.name.toLowerCase().includes(staffSearch.toLowerCase()));
            }, [staffList, staffSearch]);

            const handleAddCustomDate = () => {
                if (!customDateInput.trim()) return;
                if (!selectedStaffId) { setMsg('❌ 먼저 상단에서 직원을 선택해주세요.'); return; }
                
                const staff = staffList.find(s => s.id === selectedStaffId);
                const dailyHours = staff ? (safeParseFloat(staff.workHours) || 8) : 8; 
                let deductHours = 0;
                
                if (inputType === 'day') deductHours = (leaveDayType === '1') ? dailyHours : dailyHours / 2;
                else { deductHours = safeParseFloat(leaveHourValue); if (deductHours <= 0) { setMsg('❌ 시간을 올바르게 입력하세요.'); return; } }
                const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;
                
                const parts = customDateInput.split(/[, ]+/);
                const newParsedDates = [];

                parts.forEach(p => {
                    const s = p.trim(); if (!s) return; let parsedDate = '';
                    const matchFull = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})$/);
                    const matchMonthDay = s.match(/^(\d{1,2})[\.\-\/](\d{1,2})$/);
                    
                    if (matchFull) parsedDate = `${matchFull[1]}-${matchFull[2].padStart(2, '0')}-${matchFull[3].padStart(2, '0')}`;
                    else if (matchMonthDay) parsedDate = `${customYear}-${matchMonthDay[1].padStart(2, '0')}-${matchMonthDay[2].padStart(2, '0')}`;
                    else if (s.match(/^\d{4}-\d{2}-\d{2}$/)) parsedDate = s; 
                    
                    if (parsedDate && !customDates.some(cd => cd.date === parsedDate)) newParsedDates.push({ date: parsedDate, type: typeText, deductHours });
                });

                if (newParsedDates.length > 0) { setCustomDates([...customDates, ...newParsedDates].sort((a,b) => a.date.localeCompare(b.date))); setCustomDateInput(''); setMsg(''); } 
                else setMsg('❌ 날짜 형식을 확인해주세요 (예: 4.1, 2026.5.21)');
            };

            const validDates = useMemo(() => {
                if (dateMode === 'single') return [leaveDate];
                if (dateMode === 'custom') return customDates.map(c => c.date); 
                
                let dates = []; let curr = new Date(leaveDate); let last = new Date(endDate);
                if (curr > last) return []; 
                const staff = staffList.find(s => s.id === selectedStaffId);
                const offDays = staff && staff.offDays ? staff.offDays : [0]; 

                while(curr <= last) {
                    if(!offDays.includes(curr.getDay())) dates.push(toLocalYMD(curr));
                    curr.setDate(curr.getDate() + 1);
                }
                return dates;
            }, [leaveDate, endDate, customDates, dateMode, selectedStaffId, staffList]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedStaffId) { setMsg('❌ 직원을 검색하여 선택해주세요.'); return; }
                const staff = staffList.find(s => s.id === selectedStaffId);
                if (!staff) { setMsg('❌ 올바른 직원을 선택해주세요.'); return; }

                const dailyHours = safeParseFloat(staff.workHours) || 8; 
                let deductHours = 0;

                if (inputType === 'day') deductHours = (leaveDayType === '1') ? dailyHours : dailyHours / 2;
                else { deductHours = safeParseFloat(leaveHourValue); if (deductHours <= 0) { setMsg('❌ 시간을 입력하세요.'); return; } }

                if ((dateMode === 'multi' || dateMode === 'custom') && validDates.length === 0) { setMsg('❌ 선택된 날짜가 없습니다. (휴무일일 수 있습니다)'); return; }

                setMsg('처리 중...');
                try {
                    let newHistory = [...(staff.leaveHistory || [])];
                    const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;
                    
                    if (isEdit) {
                        const targetIdx = newHistory.findIndex(h => h.id === initialData.id);
                        if (targetIdx !== -1) newHistory[targetIdx] = { ...newHistory[targetIdx], date: safeDate(leaveDate), days: deductHours, type: typeText, reason, addedBy: adminName };
                    } else {
                        if (dateMode === 'custom') {
                            customDates.forEach((item, idx) => newHistory.push({ id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, date: safeDate(item.date), days: item.deductHours, type: item.type, reason, addedBy: adminName, createdAt: new Date().toISOString() }));
                        } else {
                            validDates.forEach((d, idx) => newHistory.push({ id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, date: safeDate(d), days: deductHours, type: typeText, reason, addedBy: adminName, createdAt: new Date().toISOString() }));
                        }
                    }

                    const currentInfo = calculateAnnualLeave(staff.joinDate);
                    const totalUsedHours = newHistory.reduce((acc, curr) => (curr.date >= currentInfo.startDate && curr.date <= currentInfo.endDate) ? acc + (safeParseFloat(curr.days) || 0) : acc, 0);

                    await db.collection('users').doc(selectedStaffId).update({ annualLeaveUsed: totalUsedHours, annualLeaveTotal: currentInfo.total, annualLeavePeriod: currentInfo.period, leaveHistory: newHistory });
                    setMsg('✅ 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 1000);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            const currentYearNum = new Date().getFullYear();
            const yearOptions = [currentYearNum + 1, currentYearNum, currentYearNum - 1, currentYearNum - 2, currentYearNum - 3, currentYearNum - 4];

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[500] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto pt-20">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative my-auto">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">{isEdit ? '연차 수정' : '연차 등록'}</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="relative" ref={dropdownRef}>
                                <label className="block text-xs font-bold text-slate-500 mb-1">직원 검색 및 선택</label>
                                <input type="text" className="w-full border rounded-xl p-3 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder={isEdit ? "" : "직원 이름 검색..."} value={staffSearch} onChange={(e) => { setStaffSearch(e.target.value); setIsStaffDropdownOpen(true); setSelectedStaffId(''); }} onFocus={() => { if(!isEdit) setIsStaffDropdownOpen(true); }} disabled={isEdit} required />
                                {isStaffDropdownOpen && !isEdit && (
                                    <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                        {filteredStaffList.length > 0 ? filteredStaffList.map(s => (
                                            <div key={s.id} className="p-3 text-sm hover:bg-blue-50 cursor-pointer border-b last:border-b-0 border-slate-50" onClick={() => { setSelectedStaffId(s.id); setStaffSearch(`${s.name}`); setIsStaffDropdownOpen(false); }}>
                                                <span className="font-bold text-slate-800">{s.name}</span> <span className="text-slate-500 text-xs">(일 {s.workHours || 8}h)</span>
                                            </div>
                                        )) : <div className="p-3 text-sm text-slate-400 text-center">검색 결과가 없습니다.</div>}
                                    </div>
                                )}
                            </div>
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <label className="block text-xs font-bold text-slate-700 mb-2">등록 단위 선택</label>
                                <div className={`flex gap-2 mb-2 ${dateMode === 'multi' ? 'opacity-50 pointer-events-none' : ''}`}>
                                    <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="day" checked={inputType === 'day'} onChange={() => setInputType('day')} className="hidden"/>일 단위</label>
                                    <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="hour" checked={inputType === 'hour'} onChange={() => setInputType('hour')} className="hidden"/>시간 단위</label>
                                </div>
                                {inputType === 'day' ? (
                                    <div className="flex gap-2">
                                        <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '1' ? 'bg-blue-50 border-blue-200 text-blue-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="1" checked={leaveDayType === '1'} onChange={() => setLeaveDayType('1')} className="hidden"/>연차 (1일)</label>
                                        <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '0.5' ? 'bg-orange-50 border-orange-200 text-orange-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="0.5" checked={leaveDayType === '0.5'} onChange={() => setLeaveDayType('0.5')} className="hidden"/>반차 (0.5일)</label>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2"><input type="number" value={leaveHourValue} onChange={e => setLeaveHourValue(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center focus:ring-2 focus:ring-blue-100 bg-white" placeholder="시간 입력 (예: 2)" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>
                                )}
                            </div>
                            {!isEdit && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-2">날짜 입력 방식</label>
                                    <div className="flex bg-slate-100 p-1 rounded-xl mb-3">
                                        <button type="button" onClick={() => setDateMode('single')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'single' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>단일 날짜</button>
                                        <button type="button" onClick={() => setDateMode('multi')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'multi' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>기간 설정</button>
                                        <button type="button" onClick={() => setDateMode('custom')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'custom' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>지정일 선택</button>
                                    </div>
                                </div>
                            )}
                            {dateMode === 'single' && (<div><label className="block text-xs font-bold text-slate-500 mb-1">날짜 선택</label><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" required /></div>)}
                            {dateMode === 'multi' && (
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <label className="block text-xs font-bold text-blue-600 mb-1">기간 선택 (직원 휴무일 자동 제외 / 연차 1일 단위 전용)</label>
                                    <div className="flex items-center gap-2">
                                        <input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required /><span className="text-slate-400 font-bold">~</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required />
                                    </div>
                                </div>
                            )}
                            {dateMode === 'custom' && (
                                <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                    <label className="block text-xs font-bold text-purple-600 mb-1">지정일 추가 (위에서 선택한 단위로 개별 저장됩니다)</label>
                                    <div className="flex items-center gap-2 mb-3">
                                        <select value={customYear} onChange={e => setCustomYear(parseInt(e.target.value))} className="border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 bg-white font-bold text-purple-700">{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                                        <input type="text" placeholder="예: 4.1, 5.21" value={customDateInput} onChange={e => setCustomDateInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter') { e.preventDefault(); handleAddCustomDate(); } }} className="flex-1 border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200" />
                                        <button type="button" onClick={handleAddCustomDate} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 transition">추가</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {customDates.map(d => (
                                            <span key={d.date} className="bg-white border border-purple-200 text-purple-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm">{d.date} <span className="text-[10px] bg-purple-100 px-1 rounded">{d.type}</span><button type="button" onClick={() => setCustomDates(customDates.filter(cd => cd.date !== d.date))} className="text-purple-400 hover:text-purple-600 p-0.5 rounded-full hover:bg-purple-50">✕</button></span>
                                        ))}
                                        {customDates.length === 0 && <span className="text-xs text-purple-400 font-medium">추가된 날짜가 없습니다.</span>}
                                    </div>
                                    <p className="text-xs text-purple-500 font-bold mt-3 text-center bg-white py-1 rounded border border-purple-100">총 {customDates.length}일 등록 예정</p>
                                </div>
                            )}
                            <div><label className="block text-xs font-bold text-slate-500 mb-1">사유</label><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="사유 입력" /></div>
                            <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">{isEdit ? '수정 내용 저장' : '연차 등록하기'}</button>
                            {msg && <p className="text-xs text-center font-bold text-red-500">{msg}</p>}
                        </form>
                    </div>
                </div>
            );
        };

        const PromotionAuditModal = ({ staffList, onClose, showAlert, onOpenModal }) => {
            const today = new Date();
            const defaultMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            
            const [step, setStep] = useState(1);
            const [mappings, setMappings] = useState([]);
            const [results, setResults] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            
            // 촉진 대상자 필터링 상태 추가
            const [isPromoFilterEnabled, setIsPromoFilterEnabled] = useState(false);
            const [filterPromoMonth, setFilterPromoMonth] = useState(defaultMonth);

            const handleFileSelect = (e) => {
                const selectedFiles = Array.from(e.target.files);
                if(selectedFiles.length === 0) return;
                const newMappings = selectedFiles.map(file => {
                    let guessedMonth = '';
                    const match = file.name.match(/(\d{2,4})[년\-\._\s]+(\d{1,2})[월\-\._\s]/);
                    if(match) { let y = match[1]; if(y.length === 2) y = '20' + y; let m = match[2].padStart(2, '0'); guessedMonth = `${y}-${m}`; }
                    return { file, month: guessedMonth, id: Math.random().toString() };
                });
                setMappings([...mappings, ...newMappings]); setStep(2); e.target.value = '';
            };

            const handleRemoveFile = (id) => { const updated = mappings.filter(m => m.id !== id); setMappings(updated); if(updated.length === 0) setStep(1); };
            const handleMonthChange = (id, val) => { setMappings(mappings.map(m => m.id === id ? { ...m, month: val } : m)); };

            const runAudit = async () => {
                if(mappings.some(m => !m.month)) { showAlert("모든 파일의 '대조할 월'을 지정해주세요."); return; }
                setIsProcessing(true);
                try {
                    const excelDataMap = {}; 
                    for(const mapItem of mappings) {
                        const buffer = await new Promise((resolve, reject) => {
                            const reader = new FileReader(); reader.onload = (e) => resolve(new Uint8Array(e.target.result)); reader.onerror = (e) => reject(e); reader.readAsArrayBuffer(mapItem.file);
                        });
                        const wb = XLSX.read(buffer, { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        let nameCol = -1, hourCol = -1; let startRow = 1;
                        for (let i = 0; i < Math.min(5, jsonData.length); i++) {
                            const row = jsonData[i]; if (!row) continue;
                            for (let j = 0; j < row.length; j++) {
                                const val = String(row[j] || '').replace(/\s/g, '');
                                if (val.includes('이름') || val.includes('성명') || val.includes('근로지원인')) nameCol = j;
                                if (val.includes('휴가') || val.includes('사용시간') || val.includes('시간') || val === '연차') hourCol = j;
                            }
                            if (nameCol !== -1 && hourCol !== -1) { startRow = i + 1; break; }
                        }
                        if (nameCol === -1) nameCol = 1; if (hourCol === -1) hourCol = 5;
                        for(let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if(!row || row.length === 0) continue;
                            const name = String(row[nameCol] || '').trim(); const hours = safeParseFloat(row[hourCol]);
                            if(name && hours > 0) { const normName = normalizeString(name); const key = `${normName}_${mapItem.month}`; excelDataMap[key] = (excelDataMap[key] || 0) + hours; }
                        }
                    }

                    const auditRes = [];
                    let targetStaffList = staffList;

                    // 특정 월 촉진 대상자만 필터링
                    if (isPromoFilterEnabled && filterPromoMonth) {
                        const [pY, pM] = filterPromoMonth.split('-').map(Number);
                        targetStaffList = staffList.filter(staff => getPromotionStatus(staff, pY, pM) !== null);
                    }

                    if (isPromoFilterEnabled && targetStaffList.length === 0) {
                         showAlert(`${filterPromoMonth} 기준 연차 촉진 대상자가 없습니다.`);
                         setIsProcessing(false);
                         return;
                    }

                    targetStaffList.forEach(staff => {
                        const normName = normalizeString(staff.name); const dbMonths = {};
                        (staff.leaveHistory || []).forEach(leave => { if(!leave.date) return; const ym = leave.date.substring(0,7); dbMonths[ym] = (dbMonths[ym] || 0) + safeParseFloat(leave.days); });
                        const allMonths = new Set([...Object.keys(dbMonths)]); mappings.forEach(m => allMonths.add(m.month));
                        allMonths.forEach(ym => {
                            if(!mappings.some(m => m.month === ym)) return;
                            const exH = excelDataMap[`${normName}_${ym}`] || 0; const dbH = dbMonths[ym] || 0;
                            if(exH !== dbH) auditRes.push({ id: `${staff.id}_${ym}`, staffId: staff.id, name: staff.name, month: ym, excelHours: exH, dbHours: dbH, diff: Math.abs(exH - dbH), type: exH > dbH ? 'missing_in_db' : 'over_in_db' });
                        });
                    });
                    auditRes.sort((a,b) => a.month.localeCompare(b.month) || a.name.localeCompare(b.name)); setResults(auditRes); setStep(3);
                } catch(e) { showAlert("대조 중 오류 발생: " + e.message); }
                setIsProcessing(false);
            };

            const handleDownloadResults = () => {
                if (!results || results.length === 0) { showAlert("다운로드할 오차 내역이 없습니다."); return; }
                const wsData = [ [`양지누림 촉진 대상자 월별 연차 대조 결과`], [`출력 일자: ${new Date().toLocaleDateString()}`], [], ['이름', '발생 월', '엑셀 사용시간', '시스템(DB) 내역', '오차 시간', '상태'] ];
                results.forEach(r => { wsData.push([r.name, r.month, `${r.excelHours}h`, `${r.dbHours}h`, `${r.diff}h`, r.type === 'missing_in_db' ? '엑셀에만 있음 (DB 누락)' : 'DB에만 있음 (과다)']); });
                const ws = XLSX.utils.aoa_to_sheet(wsData); ws['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 25 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "오차리포트"); XLSX.writeFile(wb, `양지누림_사전대조_오차리포트_${toLocalYMD(new Date()).replace(/-/g, '')}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-[400] animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]">
                        <button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <div className="mb-6 border-b pb-4"><h3 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Icons.CheckCircle /> 촉진 대상자 다중 엑셀 대조 (Audit)</h3><p className="text-sm text-slate-500 font-bold mt-2">수십 개의 엑셀을 한 번에 올려 월별 누락을 핀포인트로 찾아내고 즉시 보완합니다.</p></div>
                        {isProcessing && (<div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center rounded-3xl backdrop-blur-sm"><div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div><p className="font-bold text-indigo-700">모든 엑셀 데이터를 월별로 병합하여 분석 중입니다...</p></div>)}
                        
                        {!results && !isProcessing && (
                            <div className="mb-4 bg-orange-50 p-4 rounded-xl border border-orange-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <div>
                                    <label className="flex items-center gap-2 cursor-pointer font-black text-orange-800">
                                        <input type="checkbox" checked={isPromoFilterEnabled} onChange={e => setIsPromoFilterEnabled(e.target.checked)} className="w-4 h-4 accent-orange-600" />
                                        특정 월 촉진 대상자만 필터링하여 대조
                                    </label>
                                    <p className="text-xs text-orange-600 mt-1 font-bold pl-6">체크 시, 지정한 월에 연차 촉진 대상이 되는 직원들만 대조하여 추출합니다.</p>
                                </div>
                                {isPromoFilterEnabled && (
                                    <input type="month" value={filterPromoMonth} onChange={e => setFilterPromoMonth(e.target.value)} className="border-2 border-orange-300 rounded-lg px-3 py-1.5 text-sm font-bold outline-none focus:border-orange-500 bg-white text-orange-800" />
                                )}
                            </div>
                        )}

                        {step === 1 && (
                            <div className="flex flex-col items-center justify-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300">
                                <div className="bg-indigo-100 text-indigo-500 w-16 h-16 rounded-full flex items-center justify-center mb-4"><Icons.Upload /></div><p className="font-bold text-slate-700 text-lg mb-2">대조할 여러 달의 엑셀 파일을 모두 선택해주세요</p><p className="text-sm text-slate-500 mb-6">파일을 여러 개 드래그하거나 클릭하여 한 번에 업로드할 수 있습니다.</p>
                                <input type="file" id="multi-audit-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="multi-audit-upload" className="cursor-pointer bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">엑셀 파일 여러 개 선택하기</label>
                            </div>
                        )}
                        {step === 2 && (
                            <div className="flex flex-col flex-1 overflow-hidden">
                                <div className="bg-indigo-50 p-4 rounded-xl mb-4 border border-indigo-100 flex justify-between items-center">
                                    <div><p className="font-bold text-indigo-800">총 {mappings.length}개의 파일이 준비되었습니다.</p><p className="text-xs text-indigo-600 mt-1">시스템이 유추한 월이 맞는지 확인해주세요. (틀렸다면 직접 수정 가능)</p></div>
                                    <div className="flex gap-2"><input type="file" id="add-more-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="add-more-upload" className="cursor-pointer bg-white text-indigo-600 border border-indigo-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition">+ 파일 추가</label><button onClick={runAudit} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-indigo-700 transition shadow-md">월별 정밀 대조 시작</button></div>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                                    {mappings.map((m) => (
                                        <div key={m.id} className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 hover:border-indigo-300 transition shadow-sm">
                                            <div className="flex items-center gap-3 overflow-hidden"><div className="bg-slate-100 p-2 rounded-lg text-slate-500"><Icons.FileText /></div><span className="font-bold text-slate-700 truncate max-w-[200px] md:max-w-[400px] text-sm">{m.file.name}</span></div>
                                            <div className="flex items-center gap-3"><input type="month" value={m.month} onChange={(e) => handleMonthChange(m.id, e.target.value)} className={`border rounded-lg px-3 py-1.5 text-sm font-bold outline-none transition ${!m.month ? 'border-red-400 bg-red-50 text-red-600' : 'border-indigo-200 bg-indigo-50/30 text-indigo-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100'}`} required /><button onClick={() => handleRemoveFile(m.id)} className="text-slate-400 hover:text-red-500 p-1 rounded-md hover:bg-red-50 transition"><Icons.Trash /></button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {step === 3 && (
                            <div className="flex flex-col flex-1 overflow-hidden">
                                <div className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div><span className="font-black text-slate-800 text-lg">오차 검출: <span className="text-red-600">{results.length}</span>건</span><p className="text-xs font-bold text-slate-500 mt-1">대조가 완료되었습니다. 오차가 있는 내역만 표시됩니다.</p></div>
                                    <div className="flex gap-2"><button onClick={handleDownloadResults} className="bg-green-50 text-green-700 border border-green-200 px-4 py-2 rounded-xl font-bold text-sm hover:bg-green-100 transition shadow-sm flex items-center gap-2"><Icons.Download /> 결과 엑셀</button><button onClick={() => { setStep(1); setMappings([]); setResults(null); }} className="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-700 transition shadow-sm">초기화</button></div>
                                </div>
                                <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar relative">
                                    {results.length > 0 ? (
                                        <table className="w-full text-sm text-left whitespace-nowrap">
                                            <thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center">발생 월</th><th className="p-3 text-center text-slate-500 border-l border-slate-200">엑셀 기록</th><th className="p-3 text-center text-slate-500">DB(시스템)</th><th className="p-3 text-center text-red-500">오차 시간</th><th className="p-3 text-center w-32">즉시 보완</th></tr></thead>
                                            <tbody className="divide-y divide-slate-100 bg-white">
                                                {results.map((r) => (
                                                    <tr key={r.id} className="hover:bg-red-50/30 transition">
                                                        <td className="p-3 font-bold text-slate-800">{r.name}</td><td className="p-3 text-center font-bold text-indigo-600">{r.month}</td><td className="p-3 text-center font-bold text-slate-600 border-l border-slate-100">{r.excelHours}h</td><td className="p-3 text-center font-bold text-slate-600">{r.dbHours}h</td>
                                                        <td className="p-3 text-center"><span className="bg-red-50 text-red-600 px-2 py-1 rounded font-black border border-red-100">{r.diff}h 차이</span><div className="text-[10px] text-red-400 mt-1">{r.type === 'missing_in_db' ? 'DB에 누락됨' : 'DB에 너무 많음'}</div></td>
                                                        <td className="p-3 text-center"><button onClick={() => onOpenModal(r.staffId)} className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center justify-center gap-1 w-full active:scale-95"><Icons.Plus /> 연차 등록</button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-full py-20 text-slate-400"><div className="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-4 border border-green-100 shadow-sm"><Icons.CheckCircle /></div><p className="font-bold text-lg text-slate-700">모든 데이터가 완벽하게 일치합니다!</p><p className="text-sm mt-1">업로드하신 엑셀 파일과 DB 내역에 오차가 없습니다.</p></div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LeaveManagementTab = ({ staffList, adminName, onOpenModal, onEditClick, isPastMode = false, isResignedTab = false, onNameClick, showConfirm, showAlert }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear() - 1); 
            const [showNegativeOnly, setShowNegativeOnly] = useState(false); 
            const [showCheckOnly, setShowCheckOnly] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' }); 
            const [calendarStaff, setCalendarStaff] = useState(null);
            const [showMonthlyModal, setShowMonthlyModal] = useState(false);
            const [showVerificationModal, setShowVerificationModal] = useState(false); 

            const handleResetFilters = () => { setSearchTerm(''); setShowNegativeOnly(false); setShowCheckOnly(false); setSortConfig({ key: 'name', direction: 'asc' }); if(isPastMode) setSelectedYear(new Date().getFullYear() - 1); };

            const handleResetAllLeaveHistory = () => {
                showConfirm('모든 직원의 연차 사용 내역을 완전히 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.', async () => {
                    try { const batch = db.batch(); staffList.forEach(s => { batch.update(db.collection('users').doc(s.id), { leaveHistory: [], annualLeaveUsed: 0 }); }); await batch.commit(); showAlert('전체 연차 내역이 초기화되었습니다.'); } catch(e) { showAlert('오류: ' + e.message); }
                });
            };

            const filteredList = useMemo(() => {
                let data = staffList.map(staff => {
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const leaveInfo = isPastMode ? calculateLeaveForYear(staff.joinDate, selectedYear) : calculateAnnualLeave(staff.joinDate);
                    const allHistory = (staff.leaveHistory || []).sort((a,b) => new Date(b.date) - new Date(a.date));
                    const activeHistory = allHistory.filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                    const usedHours = activeHistory.reduce((acc, cur) => acc + (safeParseFloat(cur.days) || 0), 0);
                    const totalDays = leaveInfo.total || 0; const totalHours = totalDays * dailyHours; const remainingHours = totalHours - usedHours;
                    const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0; const remainingDays = dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0;
                    
                    const dateCounts = {}; activeHistory.forEach(h => { if (h.date) dateCounts[h.date] = (dateCounts[h.date] || 0) + 1; });
                    const needsCheck = activeHistory.some(h => dateCounts[h.date] > 1);
                    const displayHistory = activeHistory.map(h => ({ ...h, isWarn: dateCounts[h.date] > 1 }));
                    return { ...staff, dailyHours, leaveInfo, totalDays, totalHours, usedHours, remainingHours, usedDays, remainingDays, displayHistory, notJoined: leaveInfo.notJoined, resignDate: staff.resignDate, needsCheck };
                });

                let result = data.filter(d => {
                    if (!isResignedTab && d.notJoined) return false;
                    return (d.name && d.name.includes(searchTerm)) && (showNegativeOnly ? d.remainingHours < 0 : true) && (showCheckOnly ? d.needsCheck : true);
                });

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        let aVal = a[sortConfig.key]; let bVal = b[sortConfig.key];
                        if (sortConfig.key === 'total') { aVal = a.totalHours; bVal = b.totalHours; }
                        if (sortConfig.key === 'used') { aVal = a.usedHours; bVal = b.usedHours; }
                        if (sortConfig.key === 'remaining') { aVal = a.remainingHours; bVal = b.remainingHours; }
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return result;
            }, [staffList, selectedYear, isPastMode, searchTerm, showNegativeOnly, showCheckOnly, isResignedTab, sortConfig]);

            const handleSort = (key) => { let direction = 'asc'; if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc'; setSortConfig({ key, direction }); };
            const getSortIcon = (key) => { if (sortConfig.key !== key) return <span className="text-slate-300 ml-1">⇅</span>; return sortConfig.direction === 'asc' ? <span className="text-blue-600 ml-1"><Icons.SortAsc /></span> : <span className="text-blue-600 ml-1"><Icons.SortDesc /></span>; };

            const handleDeleteLeave = (data, leaveId) => {
                showConfirm('이 휴가 내역을 삭제하시겠습니까?', async () => {
                    try {
                        const newHistory = (data.leaveHistory || []).filter(h => h.id !== leaveId);
                        const currentInfo = calculateAnnualLeave(data.joinDate);
                        const totalUsedHours = newHistory.reduce((acc, curr) => (curr.date >= currentInfo.startDate && curr.date <= currentInfo.endDate) ? acc + (safeParseFloat(curr.days) || 0) : acc, 0);
                        await db.collection('users').doc(data.id).update({ annualLeaveUsed: totalUsedHours, annualLeaveTotal: currentInfo.total, annualLeavePeriod: currentInfo.period, leaveHistory: newHistory });
                    } catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            return (
                <div className="space-y-6 relative">
                    <div className="sticky top-0 z-30 bg-[#F1F5F9] pb-4 pt-2 -mt-2">
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                                <div><h3 className="font-bold text-lg text-slate-800">{isPastMode ? '과년도' : '연차 관리'}</h3><p className="text-xs text-slate-500 font-bold">시간 단위(Hour) 관리 · 총 <span className="text-blue-600">{filteredList.length}</span>명</p></div>
                                {isPastMode && (<select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))} className="bg-white border rounded-lg px-3 py-1.5 outline-none">{[...Array(5)].map((_, i) => { const y = new Date().getFullYear() - i; return <option key={y} value={y}>{y}년</option> })}</select>)}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 md:gap-3 w-full md:w-auto">
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-orange-50 px-3 py-2 rounded-xl border border-orange-100 hover:bg-orange-100 transition" title="같은 날짜에 2개 이상의 연차가 등록된 직원을 찾습니다"><input type="checkbox" checked={showCheckOnly} onChange={(e) => setShowCheckOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-orange-600 whitespace-nowrap flex items-center gap-1"><Icons.Alert /> 중복 확인</span></label>
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border hover:bg-slate-100 transition"><input type="checkbox" checked={showNegativeOnly} onChange={(e) => setShowNegativeOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-red-500 whitespace-nowrap">초과자만</span></label>
                                <div className="flex w-full md:w-auto items-center gap-1"><input type="text" placeholder="이름 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-32 px-4 py-2 border rounded-xl text-sm outline-none mt-2 md:mt-0" /><button onClick={handleResetFilters} className="p-2.5 mt-2 md:mt-0 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition border border-slate-200" title="필터/검색 초기화"><Icons.Refresh /></button></div>
                                <div className="flex w-full md:w-auto gap-2 mt-2 md:mt-0 hidden md:flex">
                                    {!isResignedTab && <button onClick={handleResetAllLeaveHistory} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-red-100 transition" title="모든 직원의 연차 내역을 삭제합니다">전체 연차 초기화</button>}
                                    <button onClick={() => setShowMonthlyModal(true)} className="flex-1 md:flex-none bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-teal-700 transition shadow-sm" title="과거 특정 월을 선택하여 연차 현황을 조회 및 다운로드합니다."><Icons.FileText /> 월간 보고서</button>
                                    <button onClick={() => setShowVerificationModal(true)} className="flex-1 md:flex-none bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-indigo-700 transition shadow-sm" title="엑셀 파일과 시스템(DB)을 대조하여 누락된 연차를 찾습니다"><Icons.CheckCircle /> 엑셀 대조 검증</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap md:whitespace-normal">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('name')}><div className="flex items-center">이름 {getSortIcon('name')}</div></th>
                                    <th className="p-4 text-center text-blue-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('total')}><div className="flex items-center justify-center">총 연차 {getSortIcon('total')}</div></th>
                                    <th className="p-4 text-center text-red-500 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('used')}><div className="flex items-center justify-center">사용 {getSortIcon('used')}</div></th>
                                    <th className="p-4 text-center text-green-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('remaining')}><div className="flex items-center justify-center">잔여 {getSortIcon('remaining')}</div></th>
                                    <th className="p-4 w-44">기간</th><th className="p-4 min-w-[200px]">내역</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredList.map((data) => {
                                    const isDateError = !data.joinDate || data.joinDate.length < 8;
                                    return (
                                        <tr key={data.id} className="hover:bg-slate-50 transition">
                                            <td className="p-4">
                                                <div className="flex items-center gap-2">
                                                    <div className="font-bold text-slate-800 cursor-pointer hover:underline hover:text-blue-600" onClick={() => onNameClick && onNameClick(data)}>{data.name}</div>
                                                    <button onClick={() => setCalendarStaff(data)} className="text-blue-500 bg-blue-50 p-1.5 rounded-lg hover:bg-blue-100 hover:shadow-sm transition" title={`${data.name}의 개인 연차 캘린더 보기`}><Icons.Calendar /></button>
                                                </div>
                                                {data.workHours && <div className="text-xs text-slate-500 mt-1">일 {data.workHours}h</div>}
                                                {data.needsCheck && <div className="text-xs text-orange-600 font-bold mt-1 flex items-center gap-1 animate-pulse"><Icons.Alert /> 중복 입력 확인필요</div>}
                                            </td>
                                            <td className="p-4 text-center font-bold text-blue-600">{isDateError ? <span className="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">입사일 확인</span> : <>{fmt(data.totalHours)}h <span className="text-xs font-normal text-slate-400">({data.totalDays}일)</span></>}</td>
                                            <td className="p-4 text-center font-bold text-red-500">{fmt(data.usedHours)}h <span className="text-xs font-normal text-slate-400">({data.usedDays}일)</span></td>
                                            <td className={`p-4 text-center font-black text-lg ${data.remainingHours < 0 ? 'text-red-600 animate-pulse' : 'text-green-600'}`}>{fmt(data.remainingHours)}h <span className="text-xs font-normal text-slate-400">({data.remainingDays}일)</span></td>
                                            <td className="p-4 text-xs text-slate-400">{data.leaveInfo.period}</td>
                                            <td className="p-4">{data.displayHistory.length > 0 ? (
                                                <div className="max-h-32 overflow-y-auto space-y-1 scrollbar-thin pr-2">
                                                    {data.displayHistory.map((rec, i) => (
                                                        <div key={rec.id || i} className={`flex items-center justify-between text-xs p-2 rounded-lg border md:group hover:border-blue-200 transition ${rec.isWarn ? 'bg-orange-50 border-orange-200 shadow-inner' : 'bg-slate-50'}`}>
                                                            <div className="flex items-center gap-2">
                                                                <span className={`font-bold ${rec.isWarn ? 'text-orange-700' : ''}`}>{rec.date}</span><span className={`px-1.5 rounded text-[10px] font-bold ${rec.days >= data.dailyHours ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}`}>{fmt(rec.days)}h ({rec.type})</span>{rec.isWarn && <span className="text-orange-500" title="이 날짜에 연차가 2번 이상 중복 입력되었습니다!"><Icons.Alert /></span>}
                                                            </div>
                                                            <div className="flex gap-1 ml-2 flex-shrink-0 opacity-100"><button type="button" onClick={() => onEditClick(data.id, 0, rec)} className="text-blue-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-blue-50 transition"><Icons.Edit /></button><button type="button" onClick={() => handleDeleteLeave(data, rec.id)} className="text-red-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-red-50 transition"><Icons.Trash /></button></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : <span className="text-slate-300 text-xs">-</span>}</td>
                                        </tr>
                                    );
                                })}
                                {filteredList.length === 0 && <tr><td colSpan="6" className="p-12 text-center text-slate-400">데이터가 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {!isResignedTab && (
                        <div className="fixed bottom-6 right-6 md:bottom-10 md:right-10 flex flex-col gap-3 z-40">
                            <button onClick={() => setShowMonthlyModal(true)} className="md:hidden bg-teal-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(13,148,136,0.4)] hover:bg-teal-700 active:scale-95 transition-all" title="보고서 다운로드"><Icons.FileText /></button>
                            <button onClick={() => setShowVerificationModal(true)} className="md:hidden bg-indigo-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(79,70,229,0.4)] hover:bg-indigo-700 active:scale-95 transition-all" title="엑셀 대조 검증"><Icons.CheckCircle /></button>
                            <button onClick={() => onOpenModal()} className="bg-blue-600 text-white w-14 h-14 md:w-auto md:px-6 md:py-4 md:h-auto rounded-full flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(37,99,235,0.4)] hover:bg-blue-700 active:scale-95 md:hover:-translate-y-1 transition-all" title="연차 등록"><Icons.Plus /><span className="font-bold text-sm whitespace-nowrap hidden md:inline">연차 등록</span></button>
                        </div>
                    )}

                    {calendarStaff && <PersonalCalendarModal staff={calendarStaff} onClose={() => setCalendarStaff(null)} onOpenModal={onOpenModal} onEditClick={onEditClick} />}
                    {showMonthlyModal && <MonthlyReportModal staffList={staffList} onClose={() => setShowMonthlyModal(false)} showAlert={showAlert} />}
                    {showVerificationModal && <ExcelVerificationModal staffList={staffList} onClose={() => setShowVerificationModal(false)} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staffList, setStaffList] = useState([]);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [editingLeaveData, setEditingLeaveData] = useState(null);
            const [viewingStaffDetail, setViewingStaffDetail] = useState(null);
            const [showUpdateModal, setShowUpdateModal] = useState(false);
            
            const [adminName, setAdminName] = useState(localStorage.getItem('ygnurim_admin_name') || '');
            const [forceUpdateRequired, setForceUpdateRequired] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]); 

            const [alertData, setAlertData] = useState(null); 
            const [confirmData, setConfirmData] = useState(null);

            const showAlert = (msg) => setAlertData({ msg });
            const showConfirm = (msg, onConfirm) => setConfirmData({ msg, onConfirm });

            const addToast = (msg, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            };

            const isInitialLoad = useRef(true);
            const prevStaffList = useRef([]);

            useEffect(() => {
                if (!user) return;

                const checkVersionFromUrl = async () => {
                    try {
                        const response = await fetch(`https://eesk98517-dot.github.io/ygnurim-hr-system/?t=${new Date().getTime()}`, { 
                            cache: 'no-store',
                            headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                        });
                        const text = await response.text();
                        const match = text.match(/SYSTEM_VERSION\s*=\s*["']([\d.]+)["']/);
                        if (match && match[1]) {
                            if (compareVersions(match[1], SYSTEM_VERSION) > 0) {
                                setForceUpdateRequired(true);
                            }
                        }
                    } catch (err) { console.log('URL Version sync check failed:', err); }
                };

                checkVersionFromUrl();
                const versionInterval = setInterval(checkVersionFromUrl, 15000);

                const lastVersion = localStorage.getItem('ygnurim_version');
                if (lastVersion !== SYSTEM_VERSION) {
                    setShowUpdateModal(true);
                }

                let unsubUsers = () => {};

                if (user.role === 'admin') {
                    unsubUsers = db.collection('users').onSnapshot((snapshot) => {
                        const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(u => u.role === 'staff');
                        
                        if (!isInitialLoad.current && adminName) {
                            list.forEach(newStaff => {
                                const oldStaff = prevStaffList.current.find(s => s.id === newStaff.id);
                                if (oldStaff) {
                                    const newLeaves = (newStaff.leaveHistory || []).filter(nh => !(oldStaff.leaveHistory || []).some(oh => oh.id === nh.id));
                                    newLeaves.forEach(leave => {
                                        if (leave.addedBy && leave.addedBy !== adminName) {
                                            addToast(`[실시간] ${leave.addedBy}님이 ${newStaff.name} 직원의 연차를 등록/수정했습니다.`, 'success');
                                        }
                                    });
                                }
                            });
                        }
                        
                        prevStaffList.current = list;
                        isInitialLoad.current = false;
                        setStaffList(list);
                    });
                }

                return () => { clearInterval(versionInterval); unsubUsers(); };
            }, [user, adminName]);

            const handleUpdateConfirm = () => {
                localStorage.setItem('ygnurim_version', SYSTEM_VERSION);
                setShowUpdateModal(false);
            };

            const handleAdminNameSave = (name) => {
                localStorage.setItem('ygnurim_admin_name', name);
                setAdminName(name);
            };

            const handleTabClick = (tab) => { setActiveTab(tab); setIsMobileMenuOpen(false); };
            const handleLogout = async () => { try { await auth.signOut(); } catch(e) {} setUser(null); };
            const handleEditLeave = (staffId, index, data) => { setEditingLeaveData({ ...data, staffId, index }); setShowLeaveModal(true); };
            const closeLeaveModal = () => { setShowLeaveModal(false); setEditingLeaveData(null); };

            const handleOpenModal = (staffId = null) => {
                setEditingLeaveData(staffId ? { staffId } : null);
                setShowLeaveModal(true);
            };

            if (!user) return <Login onLogin={setUser} />;
            
            if (user.role === 'staff') {
                return (
                    <>
                        {forceUpdateRequired && <ForceUpdateModal />}
                        {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                        {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                        {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                        <StaffPortal user={user} onLogout={handleLogout} showAlert={showAlert} showConfirm={showConfirm} />
                    </>
                );
            }

            const activeStaffs = staffList.filter(s => s.status !== 'resigned');

            const dashStats = {
                totalStaff: activeStaffs.length,
                todayLeaves: (() => {
                    const todayStr = toLocalYMD(new Date());
                    return activeStaffs.filter(s => (s.leaveHistory || []).some(h => h.date === todayStr)).length;
                })(),
                warningStaff: activeStaffs.filter(s => {
                    const li = calculateAnnualLeave(s.joinDate);
                    const dh = safeParseFloat(s.workHours) || 8;
                    const used = (s.leaveHistory || []).filter(h => h.date >= li.startDate && h.date <= li.endDate).reduce((acc,cur) => acc + safeParseFloat(cur.days), 0);
                    return ((li.total || 0) * dh) - used < 0;
                }).length
            };

            return (
                <div className="flex h-screen bg-[#F1F5F9] font-sans overflow-hidden text-slate-800">
                    {forceUpdateRequired && <ForceUpdateModal />}
                    {!adminName && <AdminNameModal onSave={handleAdminNameSave} />}
                    {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                    {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                    {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                    
                    {viewingStaffDetail && <StaffDetailModal staff={viewingStaffDetail} onClose={() => setViewingStaffDetail(null)} />}

                    <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`pointer-events-auto px-4 py-3 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 animate-slide-in-right border ${t.type === 'success' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                                <Icons.Info /> {t.msg}
                            </div>
                        ))}
                    </div>

                    <div className={`fixed inset-0 bg-slate-900/50 z-40 md:hidden transition-opacity ${isMobileMenuOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsMobileMenuOpen(false)}></div>
                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50 transform transition-transform duration-300 md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
                        <div className="p-6 text-center border-b border-slate-800">
                            <img src="logo.png" alt="양지누림" className="h-10 mx-auto mb-3 object-contain invert brightness-0" onError={(e) => { e.target.onerror = null; e.target.style.display='none'; }} />
                            <h2 className="text-xl font-black tracking-tight">양지누림 HR</h2>
                            <p className="text-xs text-slate-400 mt-1 uppercase tracking-widest">Admin Portal</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {[
                                { id: 'dashboard', icon: <Icons.Grid />, label: '대시보드' },
                                { id: 'leave', icon: <Icons.Calendar />, label: '연차 관리' },
                                { id: 'past', icon: <Icons.History />, label: '과년도 관리' },
                                { id: 'staff', icon: <Icons.Users />, label: '직원 명부' },
                                { id: 'promotion', icon: <Icons.Megaphone />, label: '연차 촉진' },
                                { id: 'resigned', icon: <Icons.UserMinus />, label: '퇴사자 관리' },
                            ].map(item => (
                                <button key={item.id} onClick={() => handleTabClick(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition text-sm ${activeTab === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {item.icon} {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="bg-slate-800 rounded-xl p-3 mb-3 flex items-center justify-between border border-slate-700">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-blue-400"><Icons.User /></div>
                                    <div className="text-left truncate max-w-[120px]"><p className="text-xs font-bold text-white truncate">{adminName}</p><p className="text-[10px] text-slate-400">관리자 계정</p></div>
                                </div>
                                <button onClick={() => setAdminName('')} className="p-1.5 text-slate-400 hover:text-white transition"><Icons.Edit /></button>
                            </div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-red-400 transition font-bold text-sm"><Icons.LogOut /> 로그아웃</button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        <header className="bg-white px-4 md:px-8 py-4 shadow-sm flex justify-between items-center z-30 sticky top-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><Icons.Menu /></button>
                                <h1 className="text-xl font-black text-slate-800">
                                    {activeTab === 'dashboard' && '종합 대시보드'}
                                    {activeTab === 'leave' && '연차 등록 및 관리'}
                                    {activeTab === 'past' && '과년도 연차 기록'}
                                    {activeTab === 'staff' && '전체 직원 명부'}
                                    {activeTab === 'promotion' && '미사용 연차 사용 촉진'}
                                    {activeTab === 'resigned' && '퇴사자 정보 관리'}
                                </h1>
                            </div>
                            <div className="flex items-center gap-2"><span className="text-[10px] md:text-xs font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded hidden sm:inline-block">v{SYSTEM_VERSION}</span></div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-[#F1F5F9] custom-scrollbar">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                                            <div className="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500"><Icons.Users /></div>
                                            <div><p className="text-sm font-bold text-slate-500">재직중인 직원</p><p className="text-2xl font-black text-slate-800">{dashStats.totalStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-teal-300 transition" onClick={() => setActiveTab('leave')}>
                                            <div className="w-14 h-14 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-500"><Icons.Calendar /></div>
                                            <div><p className="text-sm font-bold text-slate-500">금일 휴가자</p><p className="text-2xl font-black text-slate-800">{dashStats.todayLeaves}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-red-300 transition" onClick={() => setActiveTab('leave')}>
                                            <div className="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-red-500"><Icons.Alert /></div>
                                            <div><p className="text-sm font-bold text-slate-500">연차 초과자</p><p className="text-2xl font-black text-red-500">{dashStats.warningStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
                                        <div className="xl:col-span-2 h-full">
                                            <CalendarView staffList={activeStaffs} onEditClick={handleEditLeave} />
                                        </div>
                                        <div className="xl:col-span-1 bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6 animate-fade-in flex flex-col h-[500px]">
                                            <div className="flex justify-between items-center mb-6">
                                                <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm md:text-base"><Icons.Info /> 버전 업데이트 로그</h3>
                                                <span className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-full font-bold">Stable Release</span>
                                            </div>
                                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-6">
                                                {UPDATE_LOGS.map((log, idx) => (
                                                    <div key={idx} className="relative pl-5 border-l-2 border-slate-100 pb-2">
                                                        <div className={`absolute w-3 h-3 rounded-full -left-[7px] top-1 border-2 border-white ${idx === 0 ? 'bg-blue-500' : 'bg-slate-300'}`}></div>
                                                        <div className="flex flex-col mb-2">
                                                            <div className="flex justify-between items-center">
                                                                <span className={`font-black text-sm ${idx === 0 ? 'text-blue-600' : 'text-slate-600'}`}>v{log.version}</span>
                                                                <span className="text-[10px] text-slate-400 font-bold">{log.date}</span>
                                                            </div>
                                                        </div>
                                                        <ul className="space-y-2 mt-2">
                                                            {log.details.map((desc, i) => (
                                                                <li key={i} className="text-[11px] md:text-xs text-slate-600 flex gap-2 items-start font-medium">
                                                                    <span className="text-slate-400 mt-0.5">-</span>
                                                                    <span className="leading-relaxed whitespace-pre-wrap flex-1">{desc}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'leave' && <LeaveManagementTab staffList={activeStaffs} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={(staff) => setViewingStaffDetail(staff)} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'past' && <LeaveManagementTab staffList={activeStaffs} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} isPastMode={true} onNameClick={(staff) => setViewingStaffDetail(staff)} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'staff' && <StaffTab staffList={staffList} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'promotion' && <PromotionTab staffList={activeStaffs} showAlert={showAlert} onOpenModal={handleOpenModal} />}
                            {activeTab === 'resigned' && <ResignedStaffTab staffList={staffList} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={(staff) => setViewingStaffDetail(staff)} showConfirm={showConfirm} showAlert={showAlert} />}
                        </main>
                        
                        {showLeaveModal && <LeaveActionModal onClose={closeLeaveModal} staffList={staffList} adminName={adminName} initialData={editingLeaveData} showAlert={showAlert} />}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>

        const findColumns = (jsonData, needs, scanRows = 10) => {

        };

        const getPromotionStatus = (staff, checkYear, checkMonth) => {
            if (!staff.joinDate) return null;
            const [jYear, jMonth, jDay] = safeDate(staff.joinDate).split('-').map(Number);
            if (isNaN(jYear)) return null;
            for (let baseYear = checkYear - 1; baseYear <= checkYear; baseYear++) {
                if (baseYear < jYear) continue;
                const leaveInfo = calculateLeaveForYear(staff.joinDate, baseYear);
                if (leaveInfo.notJoined) continue;
                const [eYear, eMonth, eDay] = leaveInfo.endDate.split('-').map(Number);
                const endDate = new Date(eYear, eMonth - 1, eDay);
                if (leaveInfo.yearsWorked < 1) {
                    const notifyDate = new Date(jYear, jMonth - 1, jDay);
                    notifyDate.setFullYear(notifyDate.getFullYear() + 1); notifyDate.setMonth(notifyDate.getMonth() - 3);
                    if (notifyDate.getFullYear() === checkYear && (notifyDate.getMonth() + 1) === checkMonth) return { type: '1년미만 1차', msg: '1년 도래 3개월 전', color: 'bg-purple-100 text-purple-700', leaveInfo, baseYear };
                } else {
                    const n1 = new Date(endDate); n1.setMonth(n1.getMonth() - 6);
                    const n2 = new Date(endDate); n2.setMonth(n2.getMonth() - 2);
                    if (n1.getFullYear() === checkYear && (n1.getMonth() + 1) === checkMonth) return { type: '1차 촉진', msg: '만료 6개월 전', color: 'bg-blue-100 text-blue-700', leaveInfo, baseYear };
                    if (n2.getFullYear() === checkYear && (n2.getMonth() + 1) === checkMonth) return { type: '2차 촉진', msg: '만료 2개월 전', color: 'bg-red-100 text-red-700', leaveInfo, baseYear };
                }
            } return null;
        };

        // [공통화] 지정일 문자열 파싱 (4.1 / 2026.5.21 / 2026-05-21)
        const parseCustomDates = (input, defaultYear) => {
            const out = [];
            input.split(/[, ]+/).forEach(p => {
                const s = p.trim(); if (!s) return;
                const mFull = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})$/);
                const mMd = s.match(/^(\d{1,2})[\.\-\/](\d{1,2})$/);
                if (mFull) out.push(`${mFull[1]}-${mFull[2].padStart(2,'0')}-${mFull[3].padStart(2,'0')}`);
                else if (mMd) out.push(`${defaultYear}-${mMd[1].padStart(2,'0')}-${mMd[2].padStart(2,'0')}`);
                else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) out.push(s);
            });
            return out;
        };

        // [공통화] 기간 내 근무일(휴무일 제외) 나열
        const listWorkingDates = (start, end, offDays) => {
            const dates = []; const curr = new Date(start); const last = new Date(end);
            if (isNaN(curr.getTime()) || isNaN(last.getTime()) || curr > last) return dates;
            const off = offDays && offDays.length ? offDays : [0];
            while (curr <= last) { if (!off.includes(curr.getDay())) dates.push(toLocalYMD(curr)); curr.setDate(curr.getDate() + 1); }
            return dates;
        };

        // ============ [v6.12.0] 시간(Hour) 단위 정밀 계산 유틸 ============
        // "HH:MM" 문자열을 분(minute)으로 변환. 잘못된 값이면 null.
        const timeToMinutes = (t) => {
            if (!t || typeof t !== 'string' || !/^\d{1,2}:\d{2}$/.test(t)) return null;
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return null;
            return h * 60 + m;
        };
        // [v6.13.0] 실제 차감 시간 = 연차 구간에서 '휴게와 겹치는 부분만' 뺀 시간.
        // 이전에는 (연차시간 − 휴게시간)을 무조건 빼서, 휴게가 연차 시간대 밖(예: 연차 9~12시, 휴게 12~13시)이어도
        // 차감되는 버그가 있었습니다. 이제 두 구간의 교집합(overlap)만 계산해 빼므로,
        //   · 연차 09:00~12:00 / 휴게 12:00~13:00 → 겹침 0분 → 3시간 (정상)
        //   · 연차 09:00~18:00 / 휴게 12:00~13:00 → 겹침 60분 → 8시간
        //   · 연차 09:00~12:30 / 휴게 12:00~13:00 → 겹침 30분 → 3시간
        // 반환: { hours, error, workMin, overlapMin } — error가 있으면 hours는 0.
        const calcLeaveHours = (startT, endT, breakStartT, breakEndT) => {
            const s = timeToMinutes(startT), e = timeToMinutes(endT);
            if (s === null || e === null) return { hours: 0, error: '연차 시작·종료 시간을 입력하세요.', workMin: 0, overlapMin: 0 };
            if (e <= s) return { hours: 0, error: '연차 종료 시간은 시작 시간보다 뒤여야 합니다.', workMin: 0, overlapMin: 0 };
            const workMin = e - s;
            const bs = timeToMinutes(breakStartT), be = timeToMinutes(breakEndT);
            // 휴게시간은 필수 입력. 둘 다 있어야 유효한 것으로 처리.
            if (bs === null || be === null) return { hours: 0, error: '휴게 시작·종료 시간을 입력하세요.', workMin, overlapMin: 0 };
            if (be < bs) return { hours: 0, error: '휴게 종료 시간은 시작 시간보다 뒤여야 합니다.', workMin, overlapMin: 0 };
            // 교집합(overlap) = 두 구간이 실제로 겹치는 분. 겹치지 않으면 0.
            const overlapMin = Math.max(0, Math.min(e, be) - Math.max(s, bs));
            const net = workMin - overlapMin;
            if (net <= 0) return { hours: 0, error: '휴게시간을 빼면 실제 차감 시간이 0 이하입니다.', workMin, overlapMin };
            return { hours: Math.round((net / 60) * 100) / 100, error: '', workMin, overlapMin };
        };
        // 시간 값을 사람이 읽기 좋은 라벨로 (예: 8 → '8시간', 4.5 → '4.5시간')
        const hourLabel = (h) => `${fmt(h)}시간`;

        // ============ [v6.13.0] 24시간제 시각 선택기 (시·분 드롭다운) ============
        // 브라우저 type="time"이 로케일에 따라 '오전 12:00'처럼 12시간제로 보이는 문제를 해결하기 위해,
        // 항상 24시간제(0시~23시)로 보이는 시·분 드롭다운으로 대체합니다.
        // value/onChange는 기존과 동일하게 "HH:MM" 문자열을 주고받아 계산 로직과 100% 호환됩니다.
        // accent: 'blue'(연차) | 'orange'(휴게) — 포커스 테두리 색만 다릅니다.
        const TimeSelect = ({ value, onChange, accent }) => {
            const [hh, mm] = (value && /^\d{1,2}:\d{2}$/.test(value)) ? value.split(':').map(Number) : [0, 0];
            const border = accent === 'orange' ? 'border-orange-200 focus:border-orange-500' : 'border-slate-200 focus:border-blue-500';
            const setHour = (h) => onChange(`${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`);
            const setMin = (m) => onChange(`${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
            const minutes = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
            const minuteOpts = minutes.includes(mm) ? minutes : [...minutes, mm].sort((a, b) => a - b);
            return (
                <div className="flex items-center gap-1">
                    <select value={hh} onChange={e => setHour(parseInt(e.target.value))} className={`flex-1 min-w-0 border ${border} rounded-lg p-2.5 md:p-2 text-sm outline-none bg-white font-bold text-center cursor-pointer`}>
                        {Array.from({ length: 24 }, (_, h) => <option key={h} value={h}>{h}시</option>)}
                    </select>
                    <select value={mm} onChange={e => setMin(parseInt(e.target.value))} className={`flex-1 min-w-0 border ${border} rounded-lg p-2.5 md:p-2 text-sm outline-none bg-white font-bold text-center cursor-pointer`}>
                        {minuteOpts.map(m => <option key={m} value={m}>{String(m).padStart(2, '0')}분</option>)}
                    </select>
                </div>
            );
        };

        // ============ [v6.13.0] 통합 미니 캘린더 (날짜방식 탭 제거) ============
        // 이제 모드 구분 없이 '클릭한 날짜들'을 모두 등록합니다. value는 항상 'YYYY-MM-DD' 배열.
        //  · 기본        : 날짜를 누를 때마다 선택/해제 토글
        //  · 범위 채우기 : 상단 토글을 켜고 두 날짜를 클릭하면 그 사이를 전부 선택(휴무일 자동 제외)
        // offDays: 휴무 요일은 흐리게 표시하고, 범위 채우기 시 자동 제외합니다(개별 클릭은 그래도 가능).
        const MiniCalendar = ({ value, onChange, offDays, takenDates }) => {
            const arr = Array.isArray(value) ? value : [];
            const taken = takenDates instanceof Set ? takenDates : new Set();
            const [viewDate, setViewDate] = useState(() => {
                const base = arr.length ? new Date(arr[arr.length - 1]) : new Date();
                return isNaN(base.getTime()) ? new Date() : base;
            });
            const [rangeMode, setRangeMode] = useState(false);
            const [rangeAnchor, setRangeAnchor] = useState(null); // 범위 채우기 시작점

            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());
            const off = offDays && offDays.length ? offDays : [0];

            const isSelected = (dateStr) => arr.includes(dateStr);

            const handleClick = (dateStr) => {
                if (rangeMode) {
                    if (!rangeAnchor) { setRangeAnchor(dateStr); return; }
                    // 두 번째 클릭 → anchor~dateStr 사이 근무일을 모두 선택에 합칩니다.
                    const a = rangeAnchor < dateStr ? rangeAnchor : dateStr;
                    const b = rangeAnchor < dateStr ? dateStr : rangeAnchor;
                    const span = listWorkingDates(a, b, off);
                    const merged = Array.from(new Set([...arr, ...span])).sort();
                    onChange(merged);
                    setRangeAnchor(null);
                    return;
                }
                onChange(arr.includes(dateStr) ? arr.filter(d => d !== dateStr) : [...arr, dateStr].sort());
            };

            const toggleRangeMode = () => { setRangeMode(v => !v); setRangeAnchor(null); };

            return (
                <div className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm select-none">
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={() => setViewDate(new Date(year, month - 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronLeft /></button>
                        <div className="flex items-center gap-2">
                            <span className="font-black text-slate-800 text-sm">{year}년 {month + 1}월</span>
                            <button type="button" onClick={() => setViewDate(new Date())} className="text-[10px] font-bold text-blue-600 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-md hover:bg-blue-100 transition">오늘</button>
                        </div>
                        <button type="button" onClick={() => setViewDate(new Date(year, month + 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex items-center justify-between mb-2 gap-2">
                        <button type="button" onClick={toggleRangeMode} className={`flex-1 text-[11px] font-bold py-1.5 rounded-lg border transition ${rangeMode ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>
                            {rangeMode ? (rangeAnchor ? '끝 날짜를 클릭하세요' : '시작 날짜를 클릭하세요') : '📆 기간 한 번에 선택'}
                        </button>
                        {arr.length > 0 && <button type="button" onClick={() => { onChange([]); setRangeAnchor(null); }} className="text-[11px] font-bold py-1.5 px-3 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-red-500 transition">전체 해제</button>}
                    </div>
                    <div className="grid grid-cols-7 gap-1 mb-1">
                        {WEEK_LABELS.map((d, i) => (<div key={d} className={`text-center text-[10px] font-bold py-1 ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-slate-400'}`}>{d}</div>))}
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                        {weeks.flat().map((d, idx) => {
                            if (!d) return <div key={idx} />;
                            const dateStr = `${prefix}-${String(d).padStart(2, '0')}`;
                            const sel = isSelected(dateStr);
                            const isAnchor = rangeMode && rangeAnchor === dateStr;
                            const isToday = dateStr === todayStr;
                            const isTaken = taken.has(dateStr);
                            const dow = idx % 7;
                            const isOff = off.includes(dow);
                            let cls = 'text-slate-700';
                            if (isAnchor) cls = 'bg-amber-500 text-white font-black shadow-md ring-2 ring-amber-300';
                            else if (sel) cls = 'bg-blue-600 text-white font-black shadow-md';
                            else if (isToday) cls = 'ring-2 ring-blue-400 text-blue-600 font-bold';
                            else if (dow === 0) cls = 'text-red-400';
                            else if (dow === 6) cls = 'text-blue-400';
                            return (
                                <button key={idx} type="button" onClick={() => handleClick(dateStr)} title={isTaken ? '이미 등록된 휴가가 있는 날' : ''} className={`relative h-9 rounded-lg text-xs transition flex items-center justify-center hover:bg-slate-100 ${cls} ${isOff && !sel && !isAnchor ? 'opacity-40' : ''}`}>
                                    {d}
                                    {isTaken && <span className={`absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full ${sel ? 'bg-white' : 'bg-orange-400'}`}></span>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ------------------ 아이콘 세트 ------------------
        const Icons = {
            Menu: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            Grid: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Users: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Briefcase: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Upload: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2 2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            SortAsc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>,
            SortDesc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>,
            History: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>,
            UserMinus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
            Megaphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11l8-5v12l-8-5H3v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>,
            FileText: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Alert: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            Info: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            Refresh: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            ChevronLeft: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,

        const AdminNameModal = ({ onSave }) => { const [name, setName] = useState(''); return (<div className="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-[300] animate-fade-in backdrop-blur-sm px-4"><div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md relative text-center border-4 border-blue-500"><div className="text-blue-500 mb-4 flex justify-center scale-125"><Icons.User /></div><h3 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">관리자 식별</h3><p className="text-slate-500 font-bold mb-6 text-sm leading-relaxed">공용 관리자 계정을 사용 중입니다.<br/>작업 이력에 남길 성함을 입력해주세요.</p><input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl font-bold text-center mb-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition" placeholder="예: 홍길동 대리" /><button onClick={() => name.trim() && onSave(name.trim())} className={`w-full py-4 rounded-2xl font-black transition shadow-lg text-sm ${name.trim() ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-blue-200' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>설정 완료</button></div></div>); };
        const VersionAlertModal = ({ onClose }) => (<div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] animate-fade-in backdrop-blur-md px-4"><div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md relative border-4 border-blue-500"><div className="text-blue-600 mb-4 flex justify-center"><Icons.Info /></div><h3 className="text-xl md:text-2xl font-black text-slate-800 text-center mb-2 font-sans">양지누림 시스템 업데이트</h3><p className="text-center text-blue-600 font-bold mb-6">v{SYSTEM_VERSION} 배포 완료</p><div className="bg-slate-50 p-4 rounded-2xl mb-6 space-y-2 text-xs md:text-sm text-slate-600 border border-slate-100 font-medium"><p className="text-blue-600 font-bold">🌟 <b>핵심 업데이트 내역</b></p>{UPDATE_LOGS[0].details.map((d, i) => <p key={i}>{d}</p>)}</div><button onClick={onClose} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-200 uppercase tracking-widest text-sm">확인했습니다</button></div></div>);

        // ------------------ [신규 v6.10.0] 초기 비밀번호 강제 변경 화면 ------------------
        // 초기 비밀번호(123456)로 로그인한 직원에게만 노출됩니다.
        // ① Firebase Auth의 실제 로그인 비밀번호를 새 값으로 교체(updatePassword)하고,
        // ② DB(users 컬렉션)의 tempPw 를 빈 문자열('')로 지워 다음부터는 이 화면이 뜨지 않게 합니다.
        const ForcePwChangeModal = ({ user, onDone, onLogout }) => {
            const [pw1, setPw1] = useState('');
            const [pw2, setPw2] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleChange = async () => {
                setError('');
                if (pw1.length < 6) { setError('비밀번호는 최소 6자리 이상이어야 합니다.'); return; }
                if (pw1 === '123456') { setError('초기 비밀번호와 다른 새 비밀번호를 입력해주세요.'); return; }
                if (pw1 !== pw2) { setError('두 비밀번호가 일치하지 않습니다. 다시 확인해주세요.'); return; }
                setLoading(true);
                try {
                    // ① Firebase 로그인 비밀번호 실제 변경
                    const current = auth.currentUser;
                    if (!current) throw new Error('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
                    await current.updatePassword(pw1);
                    // ② DB의 tempPw 해제 → 다시는 이 화면이 뜨지 않음
                    await db.collection('users').doc(user.email).update({ tempPw: '' });
                    onDone();
                } catch (err) {
                    if (err.code === 'auth/requires-recent-login') {
                        setError('보안을 위해 다시 로그인이 필요합니다. 로그아웃 후 초기 비밀번호로 다시 로그인해주세요.');
                    } else if (err.code === 'auth/weak-password') {
                        setError('비밀번호가 너무 단순합니다. 6자리 이상으로 조금 더 복잡하게 설정해주세요.');
                    } else {
                        setError('변경 중 오류가 발생했습니다: ' + err.message);
                    }
                } finally { setLoading(false); }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-[500] animate-fade-in backdrop-blur-md px-4">
                    <div className="bg-white p-7 md:p-8 rounded-3xl shadow-2xl w-full max-w-md relative border-4 border-blue-500">
                        <div className="text-blue-600 mb-4 flex justify-center scale-125"><Icons.Lock /></div>
                        <h3 className="text-xl md:text-2xl font-black text-slate-800 text-center mb-2 tracking-tight">비밀번호를 변경해주세요</h3>
                        <p className="text-center text-slate-500 font-bold mb-6 text-sm leading-relaxed">현재 <b className="text-blue-600">초기 비밀번호</b>를 사용 중입니다.<br/>안전한 이용을 위해 <b className="text-slate-700">나만의 새 비밀번호</b>로 변경해주세요.</p>
                        <div className="space-y-3">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1.5">새 비밀번호 (6자리 이상)</label>
                                <input type="password" value={pw1} onChange={e => setPw1(e.target.value)} className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" placeholder="새 비밀번호 입력" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1.5">새 비밀번호 확인</label>
                                <input type="password" value={pw2} onChange={e => setPw2(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !loading) handleChange(); }} className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" placeholder="한 번 더 입력" />
                            </div>
                        </div>
                        {error && <p className="text-red-500 text-xs font-bold text-center mt-4 bg-red-50 py-2 rounded-lg border border-red-100 whitespace-pre-wrap leading-relaxed">{error}</p>}
                        <button onClick={handleChange} disabled={loading} className="w-full mt-6 bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-200 text-sm disabled:opacity-50 flex items-center justify-center gap-2"><Icons.Lock /> {loading ? '변경하는 중...' : '비밀번호 변경하고 시작하기'}</button>
                        <button onClick={onLogout} className="w-full mt-2 text-slate-400 hover:text-slate-600 py-2 rounded-xl font-bold text-xs transition">나중에 하기 (로그아웃)</button>
                    </div>
                </div>
            );
        };

        // ------------------ [신규 v6.7.0] 직원 페이지 사용 가이드 모달 ------------------
        const GUIDE_STEPS = [
            {
                icon: '👋', color: 'blue',
                title: '양지누림 연차 시스템에 오신 것을 환영합니다',
                desc: '이 시스템은 내 연차 현황을 실시간으로 확인하고, 사용한 휴가를 직접 등록하는 공간입니다.',
                points: ['총 발생 / 사용 / 잔여 연차를 한눈에 확인', '휴가 사용 후 직접 등록 가능', '모든 휴가는 이제 시간(Hour) 단위로 관리됩니다', '모바일에서도 동일하게 이용 가능']
            },
            {
                icon: '📊', color: 'teal',
                title: '① 상단 카드에서 내 연차를 확인하세요',
                desc: '화면 맨 위 3개의 카드가 나의 연차 현황입니다.',
                points: ['파란색 = 올해 발생한 총 연차(시간)', '빨간색 = 지금까지 사용한 시간', '초록색 = 앞으로 쓸 수 있는 잔여 시간', '괄호 안 (일) 수치는 하루 근무시간으로 환산한 참고값입니다']
            },
            {
                icon: '🗓️', color: 'blue',
                title: '② 먼저 달력에서 날짜를 선택하세요',
                desc: '방식 구분 없이, 달력에서 원하는 날짜를 누르면 됩니다.',
                points: ['하루만 쓸 땐 그 날짜 하나만 클릭', '흩어진 여러 날은 눌러서 자유롭게 추가·해제', '연속된 기간은 [기간 한 번에 선택]을 켜고 시작·끝 날 클릭', '휴무일은 흐리게 표시되고 기간 선택 시 자동 제외됩니다']
            },
            {
                icon: '⏱️', color: 'purple',
                title: '③ 시간으로 정확하게 신청하기',
                desc: '날짜를 고른 뒤 시간을 입력하면 실제 차감 시간이 자동 계산됩니다.',
                points: ['연차 시작·종료 시간을 입력합니다', '휴게가 있으면 휴게 시간도 입력(없으면 0시 0분 그대로)', '연속된 기간을 고르면 온종일 휴가로 처리돼 시간 입력이 잠깁니다', '날짜마다 다르게(오늘 반차·내일 연차) 쓰려면 [목록에 담기]로 여러 건을 쌓아 한 번에 등록']
            },
            {
                icon: '📅', color: 'orange',
                title: '④ 달력에서 내역 확인·수정·삭제',
                desc: '오른쪽 "나의 휴가 내역"이 월별 달력으로 바뀌었습니다.',
                points: ['하루를 다 쓰면 파랑, 일부만 쓰면 주황으로 표시', '휴가 블록을 누르면 시간·사유 상세가 열려 수정·삭제 가능', '[여러 개 삭제]를 누르면 여러 건을 골라 한 번에 삭제', '이 안내는 상단 [사용법] 버튼으로 언제든 다시 볼 수 있습니다']
            }
        ];


        // ============ [신규 v6.8.0] 스포트라이트 오버레이 투어 ============
        // 실제 화면 요소를 밝게 뚫어 보여주며 위치를 안내합니다.
        // data-tour="키" 속성이 달린 요소를 찾아 좌표를 계산합니다.
        const TOUR_STEPS = [
            { key: 'stats',   badge: '①', title: '내 연차 현황', body: '총 발생 · 사용 · 잔여가 이 3개의 카드에 시간(Hour) 단위로 표시됩니다. 초록색 잔여가 앞으로 쓸 수 있는 시간입니다.' },
            { key: 'datemode',badge: '②', title: '1단계 · 날짜 선택 안내', body: '먼저 아래 달력에서 원하는 날짜를 누릅니다. 여러 날을 눌러 한 번에 등록할 수 있어요.' },
            { key: 'calendar',badge: '③', title: '2단계 · 달력에서 클릭', body: '날짜를 누르면 선택/해제됩니다. 연속된 기간은 [기간 한 번에 선택]을 켜고 시작·끝 날을 클릭하면 사이가 모두 채워져요(휴무일 자동 제외).' },
            { key: 'time',    badge: '④', title: '3단계 · 시간 입력', body: '연차·휴게 시간을 입력하면 실제 차감 시간이 자동 계산됩니다. 연속된 기간을 고르면 온종일 휴가로 처리돼 이 칸은 자동으로 잠깁니다.' },
            { key: 'submit',  badge: '⑤', title: '4단계 · 담기 또는 등록', body: '한 건이면 바로 [등록]하세요. 날짜마다 다르게 쓰려면 [목록에 담기]로 여러 건을 쌓은 뒤 [전체 등록]을 누르면 한 번에 처리됩니다.' },
            { key: 'history', badge: '⑥', title: '달력에서 내역 확인', body: '등록한 휴가가 오른쪽 달력에 표시됩니다. 블록을 누르면 상세가 열리고, 거기서 바로 수정·삭제할 수 있어요.' }
        ];

        const TIP_W = 320, TIP_H_EST = 210, GAP = 14, EDGE = 12;

        const StaffTourOverlay = ({ onClose }) => {
            const [idx, setIdx] = useState(0);
            const [rect, setRect] = useState(null);      // 대상 요소 좌표 (없으면 null → 하단 고정)
            const [tipPos, setTipPos] = useState(null);  // 말풍선 좌표 (null → 하단 고정)
            const [ready, setReady] = useState(false);

            // 현재 단계에서 실제로 존재하는 요소만 추려 둡니다 (없는 단계는 자동 건너뜀)
            const steps = useMemo(() => TOUR_STEPS.filter(st => document.querySelector(`[data-tour="${st.key}"]`)), []);
            const total = steps.length;
            const step = steps[idx];
            const isLast = idx === total - 1;

            const applyRect = useCallback((r, vw, vh) => {
                const pad = 8;
                const hole = { top: r.top - pad, left: r.left - pad, width: r.width + pad * 2, height: r.height + pad * 2 };
                setRect(hole);

                // 좁은 화면이면 계산하지 않고 하단 고정 카드로 착지합니다
                if (vw < 640) { setTipPos(null); setReady(true); return; }

                // 아래 → 위 → 오른쪽 → 왼쪽 순으로 자리를 찾습니다
                let pos = null;
                if (hole.top + hole.height + GAP + TIP_H_EST < vh - EDGE) {
                    pos = { top: hole.top + hole.height + GAP, left: hole.left + hole.width / 2 - TIP_W / 2 };
                } else if (hole.top - GAP - TIP_H_EST > EDGE) {
                    pos = { top: hole.top - GAP - TIP_H_EST, left: hole.left + hole.width / 2 - TIP_W / 2 };
                } else if (hole.left + hole.width + GAP + TIP_W < vw - EDGE) {
                    pos = { top: Math.max(EDGE, hole.top), left: hole.left + hole.width + GAP };
                } else if (hole.left - GAP - TIP_W > EDGE) {
                    pos = { top: Math.max(EDGE, hole.top), left: hole.left - GAP - TIP_W };
                }

                if (!pos) { setTipPos(null); setReady(true); return; }
                // 화면 밖으로 넘어가면 안쪽으로 당깁니다
                pos.left = Math.min(Math.max(EDGE, pos.left), vw - TIP_W - EDGE);
                pos.top = Math.min(Math.max(EDGE, pos.top), vh - TIP_H_EST - EDGE);
                setTipPos(pos); setReady(true);
            }, []);

            const measure = useCallback(() => {
                if (!step) return;
                const el = document.querySelector(`[data-tour="${step.key}"]`);
                if (!el) { setRect(null); setTipPos(null); setReady(true); return; }

                const vw = window.innerWidth, vh = window.innerHeight;
                const r = el.getBoundingClientRect();

                // 대상이 화면 밖이면 스크롤로 끌어온 뒤 다시 측정합니다
                if (r.top < 60 || r.bottom > vh - 60) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => {
                        const el2 = document.querySelector(`[data-tour="${step.key}"]`);
                        if (el2) applyRect(el2.getBoundingClientRect(), window.innerWidth, window.innerHeight);
                    }, 380);
                    return;
                }
                applyRect(r, vw, vh);
            }, [step, applyRect]);

            const finish = useCallback(() => { try { localStorage.setItem(TOUR_KEY, '1'); } catch (e) {} onClose(); }, [onClose]);

            useEffect(() => { setReady(false); measure(); }, [idx, measure]);


            useEffect(() => {
                const onResize = () => measure();
                const onKey = (e) => { if (e.key === 'Escape') finish(); };
                window.addEventListener('resize', onResize);
                window.addEventListener('scroll', onResize, true);
                window.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('resize', onResize); window.removeEventListener('scroll', onResize, true); window.removeEventListener('keydown', onKey); };
            }, [measure, finish]);

            if (!total || !step) { return null; }

            const Card = (
                <div className="bg-white rounded-2xl shadow-2xl p-5 border-2 border-blue-500">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-black flex-shrink-0">{step.badge}</span>
                        <h4 className="font-black text-slate-800 text-base leading-tight">{step.title}</h4>
                    </div>
                    <p className="text-[13px] text-slate-600 font-bold leading-relaxed mb-4">{step.body}</p>
                    <div className="flex items-center justify-between gap-2">
                        <span className="text-[11px] font-black text-slate-400 tracking-widest">{idx + 1} / {total}</span>
                        <div className="flex gap-2">
                            <button type="button" onClick={finish} className="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition">건너뛰기</button>
                            {idx > 0 && <button type="button" onClick={() => setIdx(idx - 1)} className="px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">이전</button>}
                            <button type="button" onClick={() => isLast ? finish() : setIdx(idx + 1)} className="px-4 py-2 rounded-xl text-xs font-black bg-blue-600 text-white hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">{isLast ? '완료' : '다음 →'}</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <>
                    {rect ? (<div className="tour-hole" style={{ top: rect.top, left: rect.left, width: rect.width, height: rect.height, opacity: ready ? 1 : 0 }} />)
                          : (<div className="tour-dim" onClick={finish} />)}
                    {tipPos
                        ? <div className="tour-tip" style={{ top: tipPos.top, left: tipPos.left }}>{Card}</div>
                        : <div className="tour-tip-center">{Card}</div>}
                </>
            );
        };

        const StaffGuideModal = ({ onClose, onStartTour }) => {
            const [step, setStep] = useState(0);
            const [dontShow, setDontShow] = useState(true);
            const isLast = step === GUIDE_STEPS.length - 1;
            const s = GUIDE_STEPS[step];
            const tone = {
                blue:   { bg: 'bg-blue-50', text: 'text-blue-600', btn: 'bg-blue-600 hover:bg-blue-700', ring: 'shadow-blue-200', bar: 'bg-blue-600' },
                teal:   { bg: 'bg-teal-50', text: 'text-teal-600', btn: 'bg-teal-600 hover:bg-teal-700', ring: 'shadow-teal-200', bar: 'bg-teal-600' },
                purple: { bg: 'bg-purple-50', text: 'text-purple-600', btn: 'bg-purple-600 hover:bg-purple-700', ring: 'shadow-purple-200', bar: 'bg-purple-600' },
                orange: { bg: 'bg-orange-50', text: 'text-orange-600', btn: 'bg-orange-500 hover:bg-orange-600', ring: 'shadow-orange-200', bar: 'bg-orange-500' }
            }[s.color];

            const finish = () => { if (dontShow) { try { localStorage.setItem(GUIDE_KEY, '1'); } catch(e) {} } onClose(); };
            const finishAndTour = () => { if (dontShow) { try { localStorage.setItem(GUIDE_KEY, '1'); } catch(e) {} } onClose(); if (onStartTour) setTimeout(onStartTour, 260); };

            return (
                <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-[600] animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg relative overflow-hidden">
                        <button type="button" onClick={finish} className="absolute top-4 right-4 text-slate-300 hover:text-slate-600 z-10 p-1" title="닫기"><Icons.X /></button>
                        <div className="h-1.5 w-full bg-slate-100"><div className={`h-full ${tone.bar} transition-all duration-300`} style={{ width: `${((step + 1) / GUIDE_STEPS.length) * 100}%` }}></div></div>
                        <div className="p-7 md:p-9">
                            <div key={step} className="guide-slide">
                                <div className={`w-16 h-16 ${tone.bg} rounded-2xl flex items-center justify-center text-3xl mb-5 shadow-inner`}>{s.icon}</div>
                                <p className={`text-[11px] font-black ${tone.text} tracking-widest uppercase mb-2`}>STEP {step + 1} / {GUIDE_STEPS.length}</p>
                                <h3 className="text-xl md:text-2xl font-black text-slate-800 mb-3 leading-snug">{s.title}</h3>
                                <p className="text-sm text-slate-500 font-bold mb-5 leading-relaxed">{s.desc}</p>
                                <ul className={`${tone.bg} rounded-2xl p-4 space-y-2.5 border border-slate-100`}>
                                    {s.points.map((p, i) => (
                                        <li key={i} className="flex items-start gap-2.5 text-[13px] text-slate-700 font-bold leading-relaxed">
                                            <span className={`${tone.text} mt-0.5 flex-shrink-0`}>✔</span><span>{p}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="flex justify-center gap-1.5 my-6">
                                {GUIDE_STEPS.map((_, i) => (<button key={i} type="button" onClick={() => setStep(i)} className={'h-2 rounded-full transition-all ' + (i === step ? 'w-6 ' + tone.bar : 'w-2 bg-slate-200 hover:bg-slate-300')} />))}
                            </div>
                            <div className="flex items-center gap-2">
                                {step > 0 && (<button type="button" onClick={() => setStep(step - 1)} className="px-5 py-3.5 rounded-2xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">이전</button>)}
                                <button type="button" onClick={() => isLast ? finish() : setStep(step + 1)} className={`flex-1 ${tone.btn} text-white py-3.5 rounded-2xl font-black text-sm transition shadow-lg ${tone.ring} active:scale-95`}>
                                    {isLast ? '바로 시작하기' : '다음 단계 →'}
                                </button>
                            </div>
                            {isLast && (
                                <button type="button" onClick={finishAndTour} className="w-full mt-2 py-3.5 rounded-2xl font-black text-sm bg-slate-800 text-white hover:bg-slate-700 transition shadow-lg active:scale-95 flex items-center justify-center gap-2">
                                    🔦 화면 보며 따라하기 (5단계 투어)
                                </button>
                            )}
                            <label className="flex items-center justify-center gap-2 mt-4 cursor-pointer select-none">
                                <input type="checkbox" checked={dontShow} onChange={e => setDontShow(e.target.checked)} className="w-4 h-4" />
                                <span className="text-[11px] font-bold text-slate-400">다시 보지 않기 (상단 [사용법] 버튼으로 다시 열 수 있어요)</span>
                            </label>
                        </div>
                    </div>
                </div>
            );
        };

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Error:", error, errorInfo); }
            render() { if (this.state.hasError) return <div className="p-10 text-center"><h2 className="text-red-600 font-bold">오류가 발생했습니다</h2><p className="text-sm">{this.state.error?.message}</p><button onClick={()=>window.location.reload()} className="bg-slate-800 text-white px-4 py-2 rounded mt-4">새로고침</button></div>; return this.props.children; }
        }

        // ------------------ 주요 서브 컴포넌트 ------------------
        const Login = ({ onLogin }) => {
            const [id, setId] = useState(''); const [pw, setPw] = useState(''); const [error, setError] = useState(''); const [loading, setLoading] = useState(false);
            const handleLogin = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                const email = id === 'ygnurim' ? 'admin@ygnurim.com' : (id.includes('@') ? id : `${id}@ygnurim.com`);
                try {
                    await auth.signInWithEmailAndPassword(email, pw);
                    const userDoc = await db.collection('users').doc(email).get();
                    if (userDoc.exists) { const userData = userDoc.data(); onLogin(userData.role === 'admin' ? { ...userData, role: 'admin', name: '관리자', email } : { ...userData, email }); }
                    else onLogin({ role: 'staff', name: id, email });
                } catch (err) { setError('로그인 실패: 정보를 확인해주세요.'); } finally { setLoading(false); }
            };
            return (<div className="flex h-screen items-center justify-center bg-slate-100 p-4"><div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl"><div className="text-center mb-8"><img src="logo.png" alt="사단법인 장애인의 양지누림" className="h-16 mx-auto mb-4 object-contain" onError={(e) => { e.target.onerror = null; e.target.style.display='none'; }} /><p className="text-slate-500 font-bold mb-1">연차 관리 시스템</p><span className="text-[10px] bg-blue-50 text-blue-500 px-2 py-1 rounded font-bold uppercase">Official v{SYSTEM_VERSION}</span></div><form onSubmit={handleLogin} className="space-y-6"><div><label className="block text-sm font-bold text-slate-700 mb-2">아이디 (이메일)</label><input type="text" value={id} onChange={(e)=>setId(e.target.value)} className="w-full px-4 py-3 border rounded-xl" placeholder="yg+뒷자리 (직원) / ygnurim (관리자)" required /></div><div><label className="block text-sm font-bold text-slate-700 mb-2">비밀번호</label><input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} className="w-full px-4 py-3 border rounded-xl" required /></div>{error && <p className="text-red-500 text-xs text-center">{error}</p>}<button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition disabled:opacity-50">{loading ? '로그인...' : '로그인 하기'}</button></form></div></div>);
        };

        const StaffDetailModal = ({ staff, onClose }) => {
            if (!staff) return null;
            const Row = ({ label, value, danger }) => (<div className={`flex justify-between p-3 rounded-xl ${danger ? 'bg-red-50 border border-red-100' : 'bg-slate-50'}`}><span className={`text-xs font-bold ${danger ? 'text-red-500' : 'text-slate-500'}`}>{label}</span><span className={`text-sm font-bold ${danger ? 'text-red-600' : 'text-slate-800'}`}>{value}</span></div>);
            return (<div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm relative"><button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button><div className="text-center mb-6"><div className="w-20 h-20 bg-blue-50 rounded-full mx-auto flex items-center justify-center mb-3"><span className="text-3xl font-black text-blue-600">{(staff.name || '?')[0]}</span></div><h3 className="text-2xl font-bold text-slate-800">{staff.name}</h3><p className="text-sm text-slate-500 font-medium">{staff.resignDate ? '퇴사자 정보' : '상세 정보'}</p></div><div className="space-y-4"><Row label="생년월일" value={safeDate(staff.birth) || '-'} /><Row label="휴대폰" value={staff.phone || '-'} /><Row label="입사일" value={safeDate(staff.joinDate) || '-'} /><div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">근무시간</span><span className="text-sm font-bold text-blue-600">{staff.workHours || 8}시간</span></div><div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">고정 휴무일</span><span className="text-sm font-bold text-red-500">{(staff.offDays || [0]).map(d => WEEK_LABELS[d]).join(', ')}요일</span></div>{staff.resignDate && <Row label="퇴사일" value={safeDate(staff.resignDate)} danger />}</div><button type="button" onClick={onClose} className="w-full mt-6 bg-slate-800 text-white py-3 rounded-xl text-sm font-bold hover:bg-slate-700 transition">닫기</button></div></div>);
        };

        const EditStaffModal = ({ staff, onClose, showAlert }) => {
            const [formData, setFormData] = useState({ ...staff }); const [msg, setMsg] = useState('');
            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            const handleOffDayChange = (val) => {
                let cur = formData.offDays || [0];
                if (cur.includes(val)) { cur = cur.filter(d => d !== val); if (!cur.length) cur = [val]; } else cur = [...cur, val];
                setFormData(prev => ({ ...prev, offDays: cur }));
            };
            const handleSave = async (e) => {
                e.preventDefault(); setMsg('저장 중...');
                try {
                    const updates = { ...formData };
                    updates.joinDate = safeDateRecent(formData.joinDate); updates.birth = safeDate(formData.birth);
                    if (!updates.offDays || !updates.offDays.length) updates.offDays = [0];
                    if (updates.joinDate !== staff.joinDate) {
                        const info = calculateAnnualLeave(updates.joinDate);
                        updates.annualLeaveTotal = info.total; updates.annualLeavePeriod = info.period;
                        updates.annualLeaveUsed = sumUsedHours(staff.leaveHistory, info.startDate, info.endDate);
                    }
                    if (formData.resignDate && formData.resignDate.trim() !== "") { updates.resignDate = safeDateRecent(formData.resignDate); updates.status = 'resigned'; }
                    await db.collection('users').doc(staff.id).update(updates);
                    setMsg('✅ 수정 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 1000);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };
            return (<div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm relative"><button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">직원 정보 수정</h3><form onSubmit={handleSave} className="space-y-4"><div><label className="block text-xs font-bold text-slate-500 mb-1">이름</label><input type="text" name="name" value={formData.name || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" required /></div><div className="grid grid-cols-2 gap-2"><div><label className="block text-xs font-bold text-slate-500 mb-1">일일 근무시간</label><input type="text" name="workHours" value={formData.workHours || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" /></div><div><label className="block text-xs font-bold text-slate-500 mb-1">휴대폰번호</label><input type="text" name="phone" value={formData.phone || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" /></div></div><div><label className="block text-xs font-bold text-slate-500 mb-2">고정 휴무일 (다중 선택 가능)</label><div className="flex gap-2 flex-wrap justify-between">{WEEK_LABELS.map((label, value) => (<label key={value} className={`flex-1 text-center py-2 rounded-lg border text-sm cursor-pointer transition select-none ${(formData.offDays || [0]).includes(value) ? 'bg-red-50 border-red-200 text-red-600 font-bold shadow-inner' : 'bg-white text-slate-400 hover:bg-slate-50'}`}><input type="checkbox" className="hidden" checked={(formData.offDays || [0]).includes(value)} onChange={() => handleOffDayChange(value)} />{label}</label>))}</div></div><div><label className="block text-xs font-bold text-slate-500 mb-1">입사일</label><input type="date" name="joinDate" value={safeDateRecent(formData.joinDate) || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" required /></div><div><label className="block text-xs font-bold text-slate-500 mb-1">생년월일</label><input type="text" name="birth" value={formData.birth || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" placeholder="YYYY-MM-DD" /></div><div><label className="block text-xs font-bold text-red-500 mb-1">퇴사일 (선택)</label><input type="date" name="resignDate" value={safeDateRecent(formData.resignDate) || ''} onChange={handleChange} className="w-full border border-red-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-red-200" /></div><button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 mt-2">수정 내용 저장</button>{msg && <p className="text-xs text-center font-bold text-blue-600">{msg}</p>}</form></div></div>);
        };

        const MonthlyReportModal = ({ staffList, onClose, showAlert }) => {
            const [isExporting, setIsExporting] = useState(false);
            const [targetMonth, setTargetMonth] = useState(toLocalYMD(new Date()).substring(0, 7));

            const reportData = useMemo(() => staffList.map(staff => {
                const dailyHours = safeParseFloat(staff.workHours) || 8;
                const monthlyLeaves = (staff.leaveHistory || []).filter(h => h.date && h.date.startsWith(targetMonth)).sort((a, b) => a.date.localeCompare(b.date));
                const usedHours = monthlyLeaves.reduce((sum, h) => sum + safeParseFloat(h.days), 0);
                const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                const detailText = monthlyLeaves.map(h => `${h.date.substring(8,10)}일(${fmt(h.days)}h)`).join(', ');
                return { ...staff, usedHours, usedDays, detailText, hasLeave: monthlyLeaves.length > 0 };
            }), [staffList, targetMonth]);

            const visibleRows = useMemo(() => reportData.filter(d => d.hasLeave), [reportData]);
            const totalMonthHours = useMemo(() => reportData.reduce((sum, s) => sum + s.usedHours, 0), [reportData]);

            const handleDownload = () => {
                const wsData = [ [`양지누림 ${targetMonth} 월간 연차 사용 현황`], [`조회 기준: ${targetMonth} / 출력 일자: ${new Date().toLocaleDateString()}`], [], ['이름', '입사일', '일일 근무', '해당월 사용(일)', '해당월 사용(시간)', '사용 내역 상세(일자 및 시간)'] ];
                reportData.forEach(s => wsData.push([ s.name, safeDate(s.joinDate), `${s.workHours || 8}시간`, s.usedDays, s.usedHours, s.detailText || '-' ]));
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 12 }, { wch: 15 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 45 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "월간사용내역");
                XLSX.writeFile(wb, `양지누림_월간연차보고서_${targetMonth.replace('-', '')}.xlsx`);
            };

            const exportToPremiumExcel = () => {
                setIsExporting(true);
                try {
                    const html = document.getElementById("premium-excel-table").outerHTML;
                    const template = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>table { border-collapse: collapse; width: 100%; font-family: 'Malgun Gothic', sans-serif; } th, td { border: 1px solid #d1d5db; text-align: center; vertical-align: middle; padding: 8px; font-size: 11pt; } th { background-color: #f3f4f6; font-weight: bold; } .title { font-size: 16pt; font-weight: bold; background-color: #3b82f6; color: white; padding: 15px; } .negative { color: #dc2626; font-weight: bold; } .positive { color: #16a34a; font-weight: bold; } .logo-row td { border: none; padding-top: 20px; text-align: right; }</style></head><body>${html}</body></html>`;
                    const blob = new Blob([template], { type: 'application/vnd.ms-excel;charset=utf-8' });
                    const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
                    link.download = `양지누림_전체연차현황_${toLocalYMD(new Date())}.xls`;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                } catch (err) { showAlert("엑셀 추출 중 오류가 발생했습니다."); } finally { setIsExporting(false); }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[300] animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]"><button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b pb-4"><div><h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.FileText /> 연차 리포트 센터</h3></div><div className="flex items-center gap-3"><button onClick={exportToPremiumExcel} disabled={isExporting} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-blue-700 transition shadow-lg shadow-blue-200 disabled:opacity-50"><span className="text-lg">📊</span> {isExporting ? "추출 중..." : "전체 보고서"}</button><div className="h-8 w-px bg-slate-200 mx-2"></div><input type="month" value={targetMonth} onChange={e => setTargetMonth(e.target.value)} className="border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:border-blue-500" /><button onClick={handleDownload} className="bg-teal-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-teal-700 transition shadow-sm"><Icons.Download /> 월간 조회</button></div></div>
                    <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl bg-slate-50 custom-scrollbar relative"><table className="w-full text-sm text-left whitespace-nowrap mt-6"><thead className="bg-white text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center">입사일</th><th className="p-3 text-center text-blue-600">해당월 사용(일)</th><th className="p-3 text-center text-red-500">해당월 사용(시간)</th><th className="p-3 w-full">사용 내역 상세</th></tr></thead><tbody className="divide-y divide-slate-200 bg-white">{visibleRows.map(s => (<tr key={s.id} className="hover:bg-slate-50"><td className="p-3 font-bold text-slate-800">{s.name}</td><td className="p-3 text-center text-slate-500">{safeDate(s.joinDate)}</td><td className="p-3 text-center font-bold text-blue-600">{s.usedDays}일</td><td className="p-3 text-center font-bold text-red-500">{s.usedHours}h</td><td className="p-3 text-xs text-slate-600">{s.detailText}</td></tr>))}{visibleRows.length === 0 && (<tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">해당 월에 연차를 사용한 직원이 없습니다.</td></tr>)}</tbody></table></div>
                    <div className="mt-4 flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200"><span className="text-sm font-bold text-slate-500">해당월 총 사용 시간 합계:</span><span className="text-lg font-black text-red-500">{fmt(totalMonthHours)}h</span></div>
                    <table id="premium-excel-table" style={{ display: 'none' }}><thead><tr><th colSpan="7" className="title" style={{ backgroundColor: '#1e3a8a', color: 'white', fontSize: '20px', padding: '15px' }}>사단법인 장애인의 양지누림 전체 임직원 연차 현황</th></tr><tr><th colSpan="7" style={{ textAlign: 'right', padding: '5px', backgroundColor: 'white', color: '#6b7280', fontSize: '12px' }}>출력일자: {new Date().toLocaleDateString()}</th></tr><tr><th style={{ backgroundColor: '#f3f4f6', width: '60px' }}>No</th><th style={{ backgroundColor: '#f3f4f6', width: '100px' }}>이름</th><th style={{ backgroundColor: '#f3f4f6', width: '120px' }}>입사일</th><th style={{ backgroundColor: '#f3f4f6', width: '200px' }}>연차 산정 기간</th><th style={{ backgroundColor: '#eff6ff', color: '#1d4ed8', width: '100px' }}>총 발생 (일)</th><th style={{ backgroundColor: '#fef2f2', color: '#b91c1c', width: '100px' }}>사용 연차 (일)</th><th style={{ backgroundColor: '#f0fdf4', color: '#15803d', width: '100px' }}>잔 연차 (일)</th></tr></thead>
                        <tbody>{staffList.filter(s => s.status !== 'resigned').map((staff, index) => {
                            const leaveInfo = calculateAnnualLeave(staff.joinDate);
                            const dailyHours = safeParseFloat(staff.workHours) || 8;
                            const totalDays = leaveInfo.total || 0;
                            const usedHours = sumUsedHours(staff.leaveHistory, leaveInfo.startDate, leaveInfo.endDate);
                            const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                            const remainingDays = Math.round((totalDays - usedDays) * 10) / 10;
                            return (<tr key={staff.id}><td>{index + 1}</td><td style={{ fontWeight: 'bold' }}>{staff.name}</td><td>{safeDate(staff.joinDate)}</td><td style={{ fontSize: '12px', color: '#6b7280' }}>{leaveInfo.period}</td><td style={{ fontWeight: 'bold', color: '#1d4ed8' }}>{totalDays}</td><td style={{ fontWeight: 'bold', color: '#b91c1c' }}>{usedDays}</td><td className={remainingDays < 0 ? 'negative' : 'positive'} style={remainingDays < 0 ? { color: '#dc2626', fontWeight: 'bold' } : { color: '#16a34a', fontWeight: 'bold' }}>{remainingDays}</td></tr>);
                        })}</tbody>
                    </table>
                </div></div>
            );
        };

        // ================= [v6.7.0 핵심 수정] 다중 엑셀 정밀 대조 엔진 =================
        // 변경점 : 대조 대상 = '현재 재직 중인 직원'만. 엑셀에 섞여 들어온 퇴사자 행은
        //          오차 목록에 올리지 않고 조용히 제외(skippedResigned)하여 오탐을 없앱니다.
        const AdvancedAuditModal = ({ staffList, onClose, showAlert, onOpenModal, defaultPromoFilter = false }) => {
            const today = new Date();
            const defaultMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const [step, setStep] = useState(1);
            const [mappings, setMappings] = useState([]);
            const [results, setResults] = useState(null);
            const [skippedCount, setSkippedCount] = useState(0);
            const [diag, setDiag] = useState(null); // [v6.8.1] 대조 진단 정보
            const [isProcessing, setIsProcessing] = useState(false);
            const [isPromoFilterEnabled, setIsPromoFilterEnabled] = useState(defaultPromoFilter);
            const [filterPromoMonth, setFilterPromoMonth] = useState(defaultMonth);

            // 재직자 / 퇴사자를 명확히 분리
            // ===== [v6.9.0] 재직/퇴사 판정 및 대조 대상 구성 =====
            // isResigned : status가 'resigned' 이거나, 퇴사일이 입력되어 있으면 퇴사자로 봅니다.
            const isResigned = (s) => s.status === 'resigned' || !!(s.resignDate && String(s.resignDate).trim());
            const activeStaffs = useMemo(() => staffList.filter(s => !isResigned(s)), [staffList]);
            const resignedStaffs = useMemo(() => staffList.filter(isResigned), [staffList]);

            // 퇴사자 판별용 인덱스 — 이름뿐 아니라 '이름+생년월일' 조합도 함께 봅니다.
            // (동명이인 중 한 명만 퇴사한 경우, 재직자까지 통째로 제외되는 사고를 막기 위함)
            const resignedIndex = useMemo(() => {
                const byName = new Map();   // 이름 → 퇴사자 수
                const byKey = new Set();    // 이름|생년월일
                resignedStaffs.forEach(s => {
                    const n = cleanName(s.name); if (!n) return;
                    byName.set(n, (byName.get(n) || 0) + 1);
                    const b = normalizeString(safeDate(s.birth));
                    if (b) byKey.add(n + '|' + b);
                });
                return { byName, byKey };
            }, [resignedStaffs]);

            // 재직자 이름 → 인원수 (동명이인 판별용)
            const activeNameCount = useMemo(() => {
                const m = new Map();
                activeStaffs.forEach(s => { const n = cleanName(s.name); if (n) m.set(n, (m.get(n) || 0) + 1); });
                return m;
            }, [activeStaffs]);

            const handleFileSelect = (e) => {
                const selected = Array.from(e.target.files); if (!selected.length) return;
                const newMappings = selected.map(file => {
                    let guessedMonth = '';
                    const match = file.name.match(/(\d{2,4})[년\-\._\s]+(\d{1,2})[월\-\._\s]/);
                    if (match) { let y = match[1]; if (y.length === 2) y = '20' + y; guessedMonth = `${y}-${match[2].padStart(2, '0')}`; }
                    return { file, month: guessedMonth, id: Math.random().toString() };
                });
                setMappings(prev => [...prev, ...newMappings]); setStep(2); e.target.value = '';
            };

            const handleRemoveFile = (id) => { const updated = mappings.filter(m => m.id !== id); setMappings(updated); if (!updated.length) setStep(1); };
            const handleMonthChange = (id, val) => setMappings(mappings.map(m => m.id === id ? { ...m, month: val } : m));

            const runAudit = async () => {
                if (mappings.some(m => !m.month)) { showAlert("모든 파일의 '대조할 월'을 지정해주세요."); return; }
                setIsProcessing(true);
                try {
                    let targetStaffList = activeStaffs;
                    if (isPromoFilterEnabled && filterPromoMonth) {
                        const [pY, pM] = filterPromoMonth.split('-').map(Number);
                        targetStaffList = activeStaffs.filter(s => getPromotionStatus(s, pY, pM) !== null);
                        if (!targetStaffList.length) { showAlert(`${filterPromoMonth} 기준 대상자가 없습니다.`); setIsProcessing(false); return; }
                    }

                    const excelDataMap = {}; const unmatchedExcelData = []; let skipped = 0;
                    const autoFixedFiles = []; const failedFiles = []; const ambiguousRows = [];
                    // 우선순위 순서 (앞쪽일수록 강함) — '근무시간' 같은 열에 오인식되지 않도록 구체적 키워드를 앞에 둡니다
                    const NEEDS = {
                        name: ['근로지원인', '성명', '이름'],
                        hour: ['휴가사용시간', '연차사용시간', '사용시간', '휴가시간', '연차시간', '사용연차', '휴가', '연차', '시간'],
                        info: ['생년월일', '휴대폰', '연락처', '전화']
                    };

                    for (const mapItem of mappings) {
                        const buffer = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(new Uint8Array(ev.target.result));
                            reader.onerror = reject; reader.readAsArrayBuffer(mapItem.file);
                        });
                        const wb = XLSX.read(buffer, { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        const { cols, startRow } = findColumns(jsonData, NEEDS, 10);
                        const nameCol = cols.name !== undefined ? cols.name : 1;
                        let hourCol = cols.hour !== undefined ? cols.hour : -1;
                        const infoCol = cols.info !== undefined ? cols.info : -1;

                        // [v6.8.1 안전망] 헤더로 찾은 시간 컬럼에 유효한 숫자가 하나도 없으면,
                        // 데이터를 직접 훑어 '양수 합계가 가장 큰 숫자 컬럼'을 시간 컬럼으로 자동 채택합니다.
                        const colSum = (c) => {
                            if (c < 0) return 0;
                            let sum = 0;
                            for (let i = startRow; i < jsonData.length; i++) {
                                const row = jsonData[i]; if (!row) continue;
                                const v = safeParseFloat(row[c]); if (v > 0) sum += v;
                            }
                            return sum;
                        };
                        if (colSum(hourCol) <= 0) {
                            let bestCol = -1, bestSum = 0, maxLen = 0;
                            for (let i = startRow; i < jsonData.length; i++) { if (jsonData[i]) maxLen = Math.max(maxLen, jsonData[i].length); }
                            for (let c = 0; c < maxLen; c++) {
                                if (c === nameCol || c === infoCol) continue;
                                const sum = colSum(c);
                                if (sum > bestSum) { bestSum = sum; bestCol = c; }
                            }
                            if (bestCol !== -1) { hourCol = bestCol; autoFixedFiles.push(mapItem.file.name); }
                        }
                        if (hourCol < 0) { failedFiles.push(mapItem.file.name); continue; }

                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const rawName = String(row[nameCol] || '').trim();
                            const hours = safeParseFloat(row[hourCol]);
                            if (!rawName || hours <= 0) continue;

                            const exName = cleanName(rawName);
                            // [v6.8.2] 헤더/합계/소계 같은 '사람이 아닌 행'은 이름으로 취급하지 않습니다
                            if (isNotPersonName(exName)) continue;

                            const infoStr = infoCol !== -1 ? normalizeString(row[infoCol]) : '';
                            const exBirth = normalizeString(safeDate(infoStr));

                            // ===== [v6.9.0 핵심] 재직자 한정 대조 =====
                            // 1) 먼저 '재직 중인 직원' 안에서만 정확히 일치하는 사람을 찾습니다.
                            const sameName = activeStaffs.filter(s => cleanName(s.name) === exName);
                            let targetStaffId = null;

                            if (sameName.length === 1) {
                                // 양쪽 모두 생년월일을 가지고 있는데 서로 다르면 동일인이 아닙니다.
                                // (같은 이름의 퇴사자 데이터가 재직자에게 잘못 붙는 것을 막습니다)
                                const only = sameName[0];
                                const onlyBirth = normalizeString(safeDate(only.birth));
                                if (onlyBirth && exBirth && onlyBirth !== exBirth) {
                                    if (resignedIndex.byKey.has(exName + '|' + exBirth)) { skipped++; continue; }
                                    unmatchedExcelData.push({ name: rawName, month: mapItem.month, hours });
                                    continue;
                                }
                                targetStaffId = only.id;
                            } else if (sameName.length > 1) {
                                // 동명이인 → 생년월일 / 연락처로 특정합니다
                                const found = sameName.find(s => {
                                    const sBirth = normalizeString(safeDate(s.birth));
                                    const sPhone = normalizeString(s.phone);
                                    return (sBirth && exBirth && sBirth === exBirth)
                                        || (sPhone && infoStr && (sPhone.includes(infoStr) || infoStr.includes(sPhone)));
                                });
                                if (found) targetStaffId = found.id;
                                else { ambiguousRows.push({ name: rawName, month: mapItem.month, hours }); continue; }
                            }

                            // 2) 재직자 중에 없다면 — 퇴사자인지 확인하고, 맞으면 조용히 제외합니다.
                            if (!targetStaffId) {
                                const isResignedPerson = exBirth
                                    ? resignedIndex.byKey.has(exName + '|' + exBirth) || (resignedIndex.byName.has(exName) && !activeNameCount.has(exName))
                                    : resignedIndex.byName.has(exName) && !activeNameCount.has(exName);
                                if (isResignedPerson) { skipped++; continue; }
                                // 3) 재직자도 퇴사자도 아니면 진짜 미등록 인원입니다.
                                unmatchedExcelData.push({ name: rawName, month: mapItem.month, hours });
                                continue;
                            }

                            const key = `${targetStaffId}_${mapItem.month}`;
                            excelDataMap[key] = (excelDataMap[key] || 0) + hours;
                        }
                    }

                    const auditMonths = new Set(mappings.map(m => m.month));
                    const auditRes = [];
                    targetStaffList.forEach(staff => {
                        const dbMonths = {};
                        (staff.leaveHistory || []).forEach(l => { if (l.date) { const ym = l.date.substring(0, 7); dbMonths[ym] = (dbMonths[ym] || 0) + safeParseFloat(l.days); } });
                        const allMonths = new Set([...Object.keys(dbMonths), ...auditMonths]);
                        allMonths.forEach(ym => {
                            if (!auditMonths.has(ym)) return;
                            const exH = excelDataMap[`${staff.id}_${ym}`] || 0;
                            const dbH = dbMonths[ym] || 0;
                            if (exH !== dbH) auditRes.push({ id: `${staff.id}_${ym}`, staffId: staff.id, name: staff.name, month: ym, excelHours: exH, dbHours: dbH, diff: Math.round(Math.abs(exH - dbH) * 100) / 100, type: exH > dbH ? 'missing_in_db' : 'over_in_db' });
                        });
                    });

                    // 촉진 필터가 꺼져 있을 때만 '미등록' 인원을 알림 (퇴사자는 이미 위에서 제외됨)
                    if (!isPromoFilterEnabled) {
                        unmatchedExcelData.forEach((u, idx) => {
                            if (!auditMonths.has(u.month)) return;
                            auditRes.push({ id: `unknown_${idx}_${u.month}`, staffId: null, name: u.name + " (명부 미등록)", month: u.month, excelHours: u.hours, dbHours: '-', diff: u.hours, type: 'missing_in_db' });
                        });
                    }

                    auditRes.sort((a, b) => a.month.localeCompare(b.month) || a.name.localeCompare(b.name));
                    const totalExcelHours = Object.values(excelDataMap).reduce((a, b) => a + b, 0)
                        + unmatchedExcelData.reduce((a, u) => a + u.hours, 0);
                    setDiag({ autoFixed: autoFixedFiles, failed: failedFiles, totalExcelHours, ambiguous: ambiguousRows });
                    setResults(auditRes); setSkippedCount(skipped); setStep(3);
                } catch (e) { showAlert("대조 중 오류 발생: " + e.message); }
                setIsProcessing(false);
            };

            const handleDownloadResults = () => {
                if (!results || !results.length) { showAlert("다운로드할 오차 내역이 없습니다."); return; }
                const wsData = [ [`양지누림 월별 연차 대조(Audit) 결과`], [`출력 일자: ${new Date().toLocaleDateString()} / 재직자 한정 대조 (퇴사자 ${skippedCount}건 제외)`], [], ['이름', '발생 월', '엑셀 사용시간', '시스템(DB) 내역', '오차 시간', '상태'] ];
                results.forEach(r => wsData.push([r.name, r.month, `${r.excelHours}h`, `${r.dbHours}h`, `${r.diff}h`, r.type === 'missing_in_db' ? '엑셀에만 있음 (DB 누락)' : 'DB에만 있음 (과다)']));
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 18 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 25 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "오차리포트");
                XLSX.writeFile(wb, `양지누림_사전대조_오차리포트_${toLocalYMD(new Date()).replace(/-/g, '')}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-[400] animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]"><button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                    <div className="mb-6 border-b pb-4"><h3 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Icons.CheckCircle /> 다중 엑셀 정밀 대조 엔진</h3><p className="text-sm text-slate-500 font-bold mt-2">수십 개의 엑셀을 한 번에 올려 월별 누락을 핀포인트로 찾아내고 즉시 보완합니다.</p><p className="text-[11px] text-blue-600 font-bold mt-1.5 bg-blue-50 inline-block px-2 py-1 rounded border border-blue-100">🛡️ v6.7.0 : 직원 명부상 <b>현재 재직 중인 직원</b>만 대조합니다. (퇴사자 자동 제외)</p></div>
                    {isProcessing && (<div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center rounded-3xl backdrop-blur-sm"><div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div><p className="font-bold text-indigo-700">모든 엑셀 데이터를 월별로 병합하여 분석 중입니다...</p></div>)}
                    {!results && !isProcessing && (
                        <div className="mb-4 bg-orange-50 p-4 rounded-xl border border-orange-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div><label className="flex items-center gap-2 cursor-pointer font-black text-orange-800"><input type="checkbox" checked={isPromoFilterEnabled} onChange={e => setIsPromoFilterEnabled(e.target.checked)} className="w-4 h-4 accent-orange-600" />특정 월 촉진 대상자만 필터링하여 대조</label><p className="text-xs text-orange-600 mt-1 font-bold pl-6">체크 해제 시, 현재 재직 중인 '전체 직원'을 대상으로 대조합니다.</p></div>
                            {isPromoFilterEnabled && (<input type="month" value={filterPromoMonth} onChange={e => setFilterPromoMonth(e.target.value)} className="border-2 border-orange-300 rounded-lg px-3 py-1.5 text-sm font-bold outline-none focus:border-orange-500 bg-white text-orange-800" />)}
                        </div>
                    )}
                    {step === 1 && (<div className="flex flex-col items-center justify-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300"><div className="bg-indigo-100 text-indigo-500 w-16 h-16 rounded-full flex items-center justify-center mb-4"><Icons.Upload /></div><p className="font-bold text-slate-700 text-lg mb-2">대조할 여러 달의 엑셀 파일을 모두 선택해주세요</p><p className="text-sm text-slate-500 mb-6">파일을 여러 개 드래그하거나 클릭하여 한 번에 업로드할 수 있습니다.</p><input type="file" id="multi-audit-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="multi-audit-upload" className="cursor-pointer bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">엑셀 파일 여러 개 선택하기</label></div>)}
                    {step === 2 && (
                        <div className="flex flex-col flex-1 overflow-hidden"><div className="bg-indigo-50 p-4 rounded-xl mb-4 border border-indigo-100 flex justify-between items-center"><div><p className="font-bold text-indigo-800">총 {mappings.length}개의 파일이 준비되었습니다.</p><p className="text-xs text-indigo-600 mt-1">시스템이 유추한 월이 맞는지 확인해주세요. (틀렸다면 직접 수정 가능)</p></div><div className="flex gap-2"><input type="file" id="add-more-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="add-more-upload" className="cursor-pointer bg-white text-indigo-600 border border-indigo-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition">+ 파일 추가</label><button onClick={runAudit} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-indigo-700 transition shadow-md">월별 정밀 대조 시작</button></div></div>
                            <div className="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                                {mappings.map((m) => (<div key={m.id} className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 hover:border-indigo-300 transition shadow-sm"><div className="flex items-center gap-3 overflow-hidden"><div className="bg-slate-100 p-2 rounded-lg text-slate-500"><Icons.FileText /></div><span className="font-bold text-slate-700 truncate max-w-[200px] md:max-w-[400px] text-sm">{m.file.name}</span></div><div className="flex items-center gap-3"><input type="month" value={m.month} onChange={(e) => handleMonthChange(m.id, e.target.value)} className={`border rounded-lg px-3 py-1.5 text-sm font-bold outline-none transition ${!m.month ? 'border-red-400 bg-red-50 text-red-600' : 'border-indigo-200 bg-indigo-50/30 text-indigo-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100'}`} required /><button onClick={() => handleRemoveFile(m.id)} className="text-slate-400 hover:text-red-500 p-1 rounded-md hover:bg-red-50 transition"><Icons.Trash /></button></div></div>))}
                            </div>
                        </div>
                    )}
                    {step === 3 && (

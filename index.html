                                                <select value={customYear} onChange={e => setCustomYear(parseInt(e.target.value))} className="border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 bg-white font-bold text-purple-700">
                                                    {yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}
                                                </select>
                                                <input type="text" placeholder="예: 4.1, 5.21" value={customDateInput} onChange={e => setCustomDateInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter') { e.preventDefault(); handleAddCustomDate(); } }} className="flex-1 border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200" />
                                                <button type="button" onClick={handleAddCustomDate} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 transition">추가</button>
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {customDates.map(d => (
                                                    <span key={d.date} className="bg-white border border-purple-200 text-purple-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm">{d.date} <span className="text-[10px] bg-purple-100 px-1 rounded">{d.type}</span><button type="button" onClick={() => setCustomDates(customDates.filter(cd => cd.date !== d.date))} className="text-purple-400 hover:text-purple-600 p-0.5 rounded-full hover:bg-purple-50">✕</button></span>
                                                ))}
                                            </div>
                                            <p className="text-xs text-purple-500 font-bold mt-3 text-center bg-white py-1 rounded border border-purple-100">총 {customDates.length}일 등록 예정</p>
                                        </div>
                                    )}

                                    <div><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100" placeholder="신청 사유 입력 (선택)" /></div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">내 연차 등록하기</button>
                                </form>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.History /> 나의 휴가 내역</h3>
                                <div className="flex-1 overflow-y-auto max-h-[350px] custom-scrollbar pr-2 space-y-2">
                                    {leaveStats.displayHistory.length > 0 ? (
                                        leaveStats.displayHistory.map(rec => (
                                            <div key={rec.id} className="flex items-center justify-between p-3 rounded-xl border bg-slate-50 border-slate-100 hover:border-blue-200 transition group">
                                                <div className="flex items-center gap-3">
                                                    <div className="bg-white p-2 rounded-lg shadow-sm border text-blue-600"><Icons.Calendar /></div>
                                                    <div>
                                                        <p className="font-bold text-slate-700 text-sm">{rec.date}</p>
                                                        <p className="text-[11px] text-slate-500 mt-0.5">{rec.type} <span className="mx-1">|</span> {rec.reason || '사유 없음'}</p>
                                                    </div>
                                                </div>
                                                <button type="button" onClick={() => handleDeleteLeave(rec.id)} className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="내역 삭제"><Icons.Trash /></button>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-center py-10 text-slate-400 text-sm">등록된 연차 내역이 없습니다.</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staffList, setStaffList] = useState([]);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [editingLeaveData, setEditingLeaveData] = useState(null);
            const [viewingStaffDetail, setViewingStaffDetail] = useState(null);
            const [showUpdateModal, setShowUpdateModal] = useState(false);
            
            const [adminName, setAdminName] = useState(localStorage.getItem('ygnurim_admin_name') || '');
            const [forceUpdateRequired, setForceUpdateRequired] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]); 

            const [alertData, setAlertData] = useState(null); 
            const [confirmData, setConfirmData] = useState(null);

            const showAlert = (msg) => setAlertData({ msg });
            const showConfirm = (msg, onConfirm) => setConfirmData({ msg, onConfirm });

            const addToast = (msg, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            };

            const isInitialLoad = useRef(true);
            const prevStaffList = useRef([]);

            useEffect(() => {
                if (!user) return;

                const checkVersionFromUrl = async () => {
                    try {
                        const response = await fetch(`https://eesk98517-dot.github.io/ygnurim-hr-system/?t=${new Date().getTime()}`, { 
                            cache: 'no-store',
                            headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                        });
                        const text = await response.text();
                        const match = text.match(/SYSTEM_VERSION\s*=\s*["']([\d.]+)["']/);
                        if (match && match[1]) {
                            if (compareVersions(match[1], SYSTEM_VERSION) > 0) {
                                setForceUpdateRequired(true);
                            }
                        }
                    } catch (err) { console.log('URL Version sync check failed:', err); }
                };

                checkVersionFromUrl();
                const versionInterval = setInterval(checkVersionFromUrl, 15000);

                let unsubUsers = () => {};

                if (user.role === 'admin') {
                    const lastVersion = localStorage.getItem('ygnurim_version');
                    if (lastVersion !== SYSTEM_VERSION) {
                        setShowUpdateModal(true);
                    }

                    unsubUsers = db.collection('users').onSnapshot((snapshot) => {
                        const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(u => u.role === 'staff');
                        
                        if (!isInitialLoad.current && adminName) {
                            list.forEach(newStaff => {
                                const oldStaff = prevStaffList.current.find(s => s.id === newStaff.id);
                                if (oldStaff) {
                                    const newLeaves = (newStaff.leaveHistory || []).filter(nh => !(oldStaff.leaveHistory || []).some(oh => oh.id === nh.id));
                                    newLeaves.forEach(leave => {
                                        if (leave.addedBy && leave.addedBy !== adminName) {
                                            addToast(`[실시간] ${leave.addedBy}님이 ${newStaff.name} 직원의 연차를 등록/수정했습니다.`, 'success');
                                        }
                                    });
                                }
                            });
                        }
                        
                        prevStaffList.current = list;
                        isInitialLoad.current = false;
                        setStaffList(list);
                    });
                }

                return () => { 
                    clearInterval(versionInterval); 
                    unsubUsers(); 
                };
            }, [user, adminName]);

            const handleUpdateConfirm = () => {
                localStorage.setItem('ygnurim_version', SYSTEM_VERSION);
                setShowUpdateModal(false);
            };

            const handleAdminNameSave = (name) => {
                localStorage.setItem('ygnurim_admin_name', name);
                setAdminName(name);
            };

            const handleTabClick = (tab) => { setActiveTab(tab); setIsMobileMenuOpen(false); };
            const handleLogout = async () => { try { await auth.signOut(); } catch(e) {} setUser(null); };
            const handleEditLeave = (staffId, index, data) => { setEditingLeaveData({ ...data, staffId, index }); setShowLeaveModal(true); };
            const closeLeaveModal = () => { setShowLeaveModal(false); setEditingLeaveData(null); };

            if (!user) return <Login onLogin={setUser} />;
            
            if (user.role === 'staff') {
                return (
                    <>
                        {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                        {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                        <StaffPortal user={user} onLogout={handleLogout} showAlert={showAlert} showConfirm={showConfirm} />
                    </>
                );
            }

            if (user.role === 'admin' && !adminName) {
                return <AdminNameModal onSave={handleAdminNameSave} />;
            }

            const activeStaffList = staffList.filter(s => s.status !== 'resigned');
            const todayStr = toLocalYMD(new Date());
            const todayLeaveCount = activeStaffList.filter(s => s.leaveHistory?.some(r => r.date === todayStr)).length || 0;
            
            let totalGenCurrentYear = 0;
            let totalUsedCurrentYear = 0;

            activeStaffList.forEach(staff => {
                const leaveInfo = calculateAnnualLeave(staff.joinDate);
                if (leaveInfo.notJoined) return;
                const dailyHours = safeParseFloat(staff.workHours) || 8;
                const totalHours = (leaveInfo.total || 0) * dailyHours;
                const currentUsed = (staff.leaveHistory || []).reduce((acc, h) => {
                    if (h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate) return acc + (safeParseFloat(h.days) || 0);
                    return acc;
                }, 0);
                totalGenCurrentYear += totalHours;
                totalUsedCurrentYear += currentUsed;
            });

            const currentYearRate = totalGenCurrentYear > 0 ? Math.round((totalUsedCurrentYear / totalGenCurrentYear) * 100) : 0;
            const currentYear = new Date().getFullYear();
            const years = [currentYear - 3, currentYear - 2, currentYear - 1, currentYear];
            
            const yearlyStats = years.map(year => {
                let yGen = 0; let yUsed = 0;
                staffList.forEach(staff => {
                    const info = calculateLeaveForYear(staff.joinDate, year);
                    if (info.notJoined) return; 
                    const daily = safeParseFloat(staff.workHours) || 8;
                    yGen += (info.total * daily);
                    yUsed += (staff.leaveHistory || []).reduce((acc, h) => {
                        if (h.date >= info.startDate && h.date <= info.endDate) return acc + (safeParseFloat(h.days) || 0);
                        return acc;
                    }, 0);
                });
                return { year, rate: yGen > 0 ? Math.round((yUsed / yGen) * 100) : 0 };
            });

            const DASHBOARD_STATS = [
                { label: "총 임직원", value: activeStaffList.length, unit: "명", color: "bg-blue-50 text-blue-600", icon: <Icons.Users /> },
                { label: "금일 휴가자", value: todayLeaveCount, unit: "명", color: "bg-orange-50 text-orange-600", icon: <Icons.Briefcase /> },
                { label: "금년 연차 소진율", value: currentYearRate, unit: "%", color: "bg-purple-50 text-purple-600", icon: <Icons.CheckCircle /> },
            ];

            return (
                <div className="flex h-screen bg-[#F1F5F9] text-slate-800 font-sans overflow-hidden">
                    <ErrorBoundary>
                        {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                        {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}

                        <div className="fixed top-6 right-6 z-[400] flex flex-col gap-3">
                            {toasts.map(t => (
                                <div key={t.id} className="bg-slate-800 text-white p-4 rounded-xl shadow-2xl flex items-center gap-3 animate-slide-in-right border border-slate-700">
                                    <div className="text-green-400"><Icons.CheckCircle /></div>
                                    <span className="font-bold text-sm">{t.msg}</span>
                                </div>
                            ))}
                        </div>

                        {forceUpdateRequired && <ForceUpdateModal />}
                        {!forceUpdateRequired && showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                        {isMobileMenuOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)} />}

                        <aside className={`fixed md:static inset-y-0 left-0 w-64 bg-[#1E293B] text-white flex flex-col z-50 shadow-xl transform transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                            <div className="p-6 border-b border-slate-700/50 flex flex-col items-start gap-4">
                                <div className="flex justify-between items-center w-full">
                                    <div className="bg-white p-2 rounded-lg w-full flex justify-center">
                                       <img src="logo.png" alt="양지누림 로고" className="h-8 object-contain" onError={(e) => { e.target.onerror = null; e.target.src = "https://placehold.co/120x30/ffffff/64748b?text=로고"; }} />
                                    </div>
                                    <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-slate-400 hover:text-white ml-2"><Icons.X /></button>
                                </div>
                                <div>
                                    <p className="text-xs text-blue-300 font-bold flex items-center gap-1"><Icons.User /> {adminName}님 접속 중</p>
                                </div>
                            </div>
                            <nav className="flex-1 p-4 flex flex-col gap-2 overflow-y-auto no-scrollbar">
                                <button onClick={() => handleTabClick('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.Grid /> 대시보드</button>
                                <button onClick={() => handleTabClick('leave')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'leave' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.Calendar /> 연차 관리</button>
                                <button onClick={() => handleTabClick('past_leave')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'past_leave' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.History /> 과년도 연차관리</button>
                                <button onClick={() => handleTabClick('promotion')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'promotion' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.Megaphone /> 미사용 연차 촉진</button>
                                <button onClick={() => handleTabClick('resigned')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'resigned' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.UserMinus /> 퇴사자 관리</button>
                                <button onClick={() => handleTabClick('staff')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === 'staff' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}><Icons.Users /> 직원 명부</button>
                            </nav>
                            <div className="p-4 bg-[#0F172A]">
                                <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-white text-xs font-bold py-2"><Icons.LogOut /> 로그아웃</button>
                                <p className="text-[10px] text-slate-500 text-center mt-4">Ver {SYSTEM_VERSION}<br/>© 2026 YangjiNurim</p>
                            </div>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 relative w-full overflow-x-hidden">
                            <header className="flex justify-between items-center mb-6 md:mb-8">
                                <div className="flex items-center gap-3">
                                    <button className="md:hidden p-2 bg-white rounded-lg shadow-sm border border-slate-100 text-slate-600" onClick={() => setIsMobileMenuOpen(true)}>
                                        <Icons.Menu />
                                    </button>
                                    <h2 className="text-xl md:text-2xl font-bold text-slate-800">관리자 시스템</h2>
                                </div>
                                <div className="text-xs md:text-sm font-bold text-slate-500 bg-white px-3 py-1.5 md:bg-transparent md:p-0 rounded-lg shadow-sm md:shadow-none border md:border-none border-slate-100">
                                    {new Date().toLocaleDateString()}
                                </div>
                            </header>
                            
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {DASHBOARD_STATS.map((s,i) => (
                                            <div key={i} className="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center hover:shadow-md transition">
                                                <div><p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">{s.label}</p><span className="text-2xl font-black text-slate-800">{s.value}</span><span className="text-sm font-bold text-slate-400 ml-1">{s.unit}</span></div>
                                                <div className={`p-3 rounded-xl ${s.color} bg-opacity-50`}>{s.icon}</div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6 flex flex-col">
                                            <h3 className="font-bold text-slate-700 flex items-center gap-2 mb-6 text-sm md:text-base"><Icons.Grid /> 연도별 연차 소진율 추이</h3>
                                            <div className="flex-1 flex items-end justify-around gap-2 md:gap-4 h-64 pb-2 border-b border-slate-100">
                                                {yearlyStats.map((stat) => (
                                                    <div key={stat.year} className="flex flex-col items-center group w-full h-full justify-end">
                                                        <div className="relative w-full max-w-[40px] md:max-w-[60px] h-full bg-slate-100 rounded-t-lg overflow-hidden">
                                                            <div 
                                                                className="absolute bottom-0 w-full bg-blue-500 rounded-t-lg shadow-lg group-hover:bg-blue-600 bar-transition min-h-[1px]" 
                                                                style={{ height: `${stat.rate}%` }}
                                                            >
                                                                <span className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] md:text-xs py-1 px-1.5 md:px-2 rounded opacity-0 group-hover:opacity-100 transition shadow-lg font-bold z-10">{stat.rate}%</span>
                                                            </div>
                                                        </div>
                                                        <span className="mt-3 text-[10px] md:text-sm font-bold text-slate-500">{stat.year}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6">
                                                <h3 className="font-bold text-slate-700 flex items-center gap-2 mb-4 text-sm md:text-base"><span className="w-2 h-6 bg-orange-400 rounded-sm"></span> 금일 부재 현황</h3>
                                                <div className="space-y-3 max-h-48 overflow-y-auto no-scrollbar">
                                                    {activeStaffList.filter(s => s.leaveHistory?.some(r => r.date === todayStr)).length > 0 ? (
                                                        activeStaffList.filter(s => s.leaveHistory?.some(r => r.date === todayStr)).map(s => (
                                                            <div key={s.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                                                                <div className="flex items-center gap-3"><div className="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white border flex items-center justify-center text-xs md:text-sm font-bold text-slate-600 shadow-sm">{s.name[0]}</div><div><p className="text-xs md:text-sm font-bold text-slate-800">{s.name}</p><p className="text-[10px] md:text-xs text-slate-500 font-medium mt-0.5">휴가 중</p></div></div><span className="px-2 py-1 md:px-3 md:py-1 rounded-lg text-[10px] md:text-xs font-bold bg-orange-100 text-orange-700">휴가</span>
                                                            </div>
                                                        ))
                                                    ) : (<p className="text-slate-400 text-xs md:text-sm text-center py-8">금일 휴가자가 없습니다.</p>)}
                                                </div>
                                            </div>
                                            <div className="bg-blue-600 rounded-2xl p-6 text-white shadow-lg shadow-blue-200 hidden md:block">
                                                <h3 className="font-bold text-lg mb-1">빠른 연차 등록</h3>
                                                <p className="text-blue-100 text-sm mb-4">관리자가 직원의 연차를 대리 등록합니다.</p>
                                                <button onClick={() => { setEditingLeaveData(null); setShowLeaveModal(true); }} className="w-full bg-white text-blue-700 py-3 rounded-xl text-sm font-bold hover:bg-blue-50 transition">+ 연차 등록하기</button>
                                            </div>
                                        </div>
                                    </div>

                                    <CalendarView staffList={activeStaffList} />
                                    
                                </div>
                            )}

                            {activeTab === 'leave' && <LeaveManagementTab staffList={activeStaffList} adminName={adminName} onOpenModal={(staffId) => { setEditingLeaveData(typeof staffId === 'string' ? { staffId } : null); setShowLeaveModal(true); }} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showAlert={showAlert} showConfirm={showConfirm} />}
                            {activeTab === 'past_leave' && <LeaveManagementTab staffList={activeStaffList} adminName={adminName} onOpenModal={(staffId) => { setEditingLeaveData(typeof staffId === 'string' ? { staffId } : null); setShowLeaveModal(true); }} onEditClick={handleEditLeave} isPastMode={true} onNameClick={setViewingStaffDetail} showAlert={showAlert} showConfirm={showConfirm} />}
                            {activeTab === 'promotion' && <PromotionTab staffList={activeStaffList} showAlert={showAlert} />}
                            {activeTab === 'resigned' && <ResignedStaffTab staffList={staffList} onOpenModal={() => showAlert("퇴사자는 신규 연차 등록이 불가능합니다.")} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showAlert={showAlert} showConfirm={showConfirm} />}
                            {activeTab === 'staff' && <StaffTab staffList={staffList} showAlert={showAlert} showConfirm={showConfirm} />}
                        </main>
                        {showLeaveModal && <LeaveActionModal staffList={activeStaffList} adminName={adminName} onClose={closeLeaveModal} initialData={editingLeaveData} showAlert={showAlert} />}
                        {viewingStaffDetail && <StaffDetailModal staff={viewingStaffDetail} onClose={() => setViewingStaffDetail(null)} />}
                    </ErrorBoundary>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

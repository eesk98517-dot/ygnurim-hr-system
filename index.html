                        <div className="flex flex-col flex-1 overflow-hidden"><div className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200"><div><span className="font-black text-slate-800 text-lg">오차 검출: <span className="text-red-600">{results.length}</span>건</span><p className="text-xs font-bold text-slate-500 mt-1">재직자 {activeStaffs.length}명 기준 대조 완료{skippedCount > 0 && <span className="text-orange-600"> · 퇴사자 {skippedCount}건 자동 제외됨</span>}{diag && <span className="text-indigo-600"> · 엑셀에서 읽은 총 {fmt(diag.totalExcelHours)}h</span>}</p></div><div className="flex gap-2"><button onClick={handleDownloadResults} className="bg-green-50 text-green-700 border border-green-200 px-4 py-2 rounded-xl font-bold text-sm hover:bg-green-100 transition shadow-sm flex items-center gap-2"><Icons.Download /> 결과 엑셀</button><button onClick={() => { setStep(1); setMappings([]); setResults(null); setSkippedCount(0); setDiag(null); }} className="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-700 transition shadow-sm">초기화</button></div></div>
                            {diag && (diag.failed.length > 0 || diag.autoFixed.length > 0 || diag.totalExcelHours <= 0 || (diag.ambiguous && diag.ambiguous.length > 0)) && (
                                <div className={`mb-3 p-3 rounded-xl border text-xs font-bold ${diag.totalExcelHours <= 0 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                                    {diag.totalExcelHours <= 0 && (<p className="mb-1">⚠️ 엑셀에서 읽어들인 사용시간 합계가 0입니다. 시간이 적힌 열을 찾지 못했을 수 있습니다.</p>)}
                                    {diag.autoFixed.length > 0 && (<p className="mb-1">🔧 헤더 인식 실패로 숫자 열을 자동 탐색했습니다: {diag.autoFixed.join(', ')}</p>)}
                                    {diag.failed.length > 0 && (<p>❌ 시간 열을 찾지 못해 건너뛴 파일: {diag.failed.join(', ')}</p>)}
                                    {diag.ambiguous && diag.ambiguous.length > 0 && (<p className="mb-1">👥 동명이인이라 특정하지 못한 인원: {diag.ambiguous.map(a => a.name).join(', ')} — 직원 명부에 생년월일을 입력하면 자동 구분됩니다.</p>)}
                                    <p className="mt-1 font-medium opacity-80">엑셀 첫 행의 열 제목에 '휴가' 또는 '사용시간' 이 포함되어 있는지 확인해주세요.</p>
                                </div>
                            )}
                            <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar relative">
                                {results.length > 0 ? (
                                    <table className="w-full text-sm text-left whitespace-nowrap"><thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center">발생 월</th><th className="p-3 text-center text-slate-500 border-l border-slate-200">엑셀 기록</th><th className="p-3 text-center text-slate-500">DB(시스템)</th><th className="p-3 text-center text-red-500">오차 시간</th><th className="p-3 text-center w-32">즉시 보완</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {results.map((r) => (<tr key={r.id} className="hover:bg-red-50/30 transition"><td className="p-3 font-bold text-slate-800">{r.name}</td><td className="p-3 text-center font-bold text-indigo-600">{r.month}</td><td className="p-3 text-center font-bold text-slate-600 border-l border-slate-100">{r.excelHours}h</td><td className="p-3 text-center font-bold text-slate-600">{r.dbHours}h</td><td className="p-3 text-center"><span className="bg-red-50 text-red-600 px-2 py-1 rounded font-black border border-red-100">{r.diff}h 차이</span><div className="text-[10px] text-red-400 mt-1">{r.type === 'missing_in_db' ? 'DB 누락됨' : 'DB 데이터 초과'}</div></td><td className="p-3 text-center"><button onClick={() => { if (r.staffId) onOpenModal(r.staffId); else showAlert("직원 명부에 등록되지 않은 인원입니다.\n[직원 명부] 탭에서 먼저 등록해주세요."); }} className={`text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center justify-center gap-1 w-full active:scale-95 ${r.staffId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-400 cursor-not-allowed'}`}><Icons.Plus /> 연차 등록</button></td></tr>))}
                                        </tbody>
                                    </table>
                                ) : (<div className="flex flex-col items-center justify-center h-full py-20 text-slate-400"><div className="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-4 border border-green-100 shadow-sm"><Icons.CheckCircle /></div><p className="font-bold text-lg text-slate-700">모든 데이터가 완벽하게 일치합니다!</p><p className="text-sm mt-1">업로드하신 엑셀 파일과 DB 내역에 오차가 없습니다.</p></div>)}
                            </div>
                        </div>
                    )}
                </div></div>
            );
        };

        // [공통화] 캘린더 헤더 네비게이션
        const CalendarNav = ({ year, month, setCurrentDate, compact }) => {
            const yearOptions = useMemo(() => { const b = new Date().getFullYear(); return Array.from({ length: 15 }, (_, i) => b - 10 + i); }, []);
            return (
                <div className="flex items-center gap-1 md:gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-100 shadow-sm">
                    <button type="button" onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronLeft /></button>
                    <select value={year} onChange={e => setCurrentDate(new Date(parseInt(e.target.value), month, 1))} className="bg-white border border-slate-200 rounded-md px-1 md:px-2 py-1 text-xs md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                    <select value={month} onChange={e => setCurrentDate(new Date(year, parseInt(e.target.value), 1))} className="bg-white border border-slate-200 rounded-md px-1 md:px-2 py-1 text-xs md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">{Array.from({ length: 12 }, (_, i) => i).map(m => <option key={m} value={m}>{m + 1}월</option>)}</select>
                    <button type="button" onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronRight /></button>
                    <button type="button" onClick={() => setCurrentDate(new Date())} className={`font-bold text-blue-600 bg-white border border-blue-100 px-2 md:px-3 py-1.5 rounded-lg ml-1 md:ml-2 hover:bg-blue-50 transition shadow-sm ${compact ? 'text-xs' : 'text-[10px] md:text-xs'}`}>오늘</button>
                </div>
            );
        };

        const CalendarView = ({ staffList, onEditClick }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;

            const leaveMap = useMemo(() => {
                const map = {};
                staffList.forEach(staff => {
                    (staff.leaveHistory || []).forEach(leave => {
                        if (leave.date && leave.date.startsWith(prefix)) {
                            (map[leave.date] = map[leave.date] || []).push({ ...leave, name: staff.name, staffId: staff.id });
                        }
                    });
                });
                return map;
            }, [staffList, prefix]);

            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());

            return (
                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6 animate-fade-in overflow-hidden flex flex-col h-full min-h-[400px]">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm md:text-base"><Icons.Calendar /> 전사 휴가 캘린더</h3>
                        <CalendarNav year={year} month={month} setCurrentDate={setCurrentDate} />
                    </div>
                    <div className="w-full overflow-x-auto no-scrollbar flex-1">
                        <div className="min-w-[500px] border border-slate-200 rounded-lg overflow-hidden bg-slate-200 gap-px grid grid-cols-7 h-full">
                            {WEEK_LABELS.map((d, i) => (<div key={d} className={`bg-slate-50 py-2 text-center text-xs font-bold tracking-widest ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-600'}`}>{d}</div>))}
                            {weeks.flat().map((d, idx) => {
                                const dateStr = d ? `${prefix}-${String(d).padStart(2, '0')}` : '';
                                const leaves = d ? (leaveMap[dateStr] || []) : [];
                                const isToday = dateStr === todayStr;
                                return (
                                    <div key={idx} className={`bg-white h-[80px] md:h-full min-h-[90px] p-1.5 flex flex-col overflow-hidden transition-colors ${d?'hover:bg-slate-50/50':'opacity-30 pointer-events-none'}`}>
                                        <div className={`text-[10px] md:text-xs font-bold p-1 flex justify-center items-center w-6 h-6 rounded-full mx-auto md:mx-0 ${isToday?'bg-blue-600 text-white shadow-md':idx%7===0?'text-red-500':idx%7===6?'text-blue-500':'text-slate-700'}`}>{d || ''}</div>
                                        <div className="flex-1 overflow-y-auto pr-0.5 space-y-1 mt-1 custom-scrollbar">
                                            {leaves.map((l, i) => (<div key={i} onClick={(e) => { e.stopPropagation(); onEditClick && onEditClick(l.staffId, 0, l); }} className={`cursor-pointer hover:opacity-80 text-[10px] md:text-[11px] px-1.5 py-0.5 rounded-md truncate font-bold shadow-sm ${l.type.includes('반차') || l.type.includes('시간')?'bg-orange-50 text-orange-700 border border-orange-200':'bg-blue-50 text-blue-700 border border-blue-200'}`} title={`${l.name} (${l.type}) - 클릭하여 수정`}>{l.name} <span className="font-normal opacity-75 ml-0.5 text-[9px] md:text-[10px] tracking-tighter">({l.type})</span></div>))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const PersonalCalendarModal = ({ staff, onClose, onOpenModal, onEditClick }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;

            const leaveMap = useMemo(() => {
                const map = {};
                (staff?.leaveHistory || []).forEach(leave => {
                    if (leave.date && leave.date.startsWith(prefix)) (map[leave.date] = map[leave.date] || []).push(leave);
                });
                return map;
            }, [staff, prefix]);

            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());
            if (!staff) return null;

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[250] animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-4 md:p-6 rounded-3xl shadow-2xl w-full max-w-4xl relative border border-slate-200"><button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2"><Icons.X /></button>
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4 border-slate-100">
                        <div className="flex items-center gap-3"><div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-black shadow-inner">{(staff.name || '?')[0]}</div><div><h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">{staff.name} <span className="text-sm font-bold text-slate-500">개인 연차 캘린더</span></h3><p className="text-[11px] text-slate-400 font-medium">입사일: {safeDate(staff.joinDate)} (일 {staff.workHours || 8}h 근무)</p></div>{onOpenModal && (<button type="button" onClick={() => { onClose(); onOpenModal(staff.id); }} className="ml-2 bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-1 active:scale-95"><Icons.Plus /> 연차 등록</button>)}</div>
                        <CalendarNav year={year} month={month} setCurrentDate={setCurrentDate} compact />
                    </div>
                    <div className="w-full overflow-hidden border border-slate-200 rounded-xl bg-slate-200 gap-px grid grid-cols-7 shadow-sm">
                        {WEEK_LABELS.map((d, i) => (<div key={d} className={`bg-slate-50 py-2 text-center text-xs font-bold ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-600'}`}>{d}</div>))}
                        {weeks.flat().map((d, idx) => {
                            const dateStr = d ? `${prefix}-${String(d).padStart(2, '0')}` : '';
                            const leaves = d ? (leaveMap[dateStr] || []) : [];
                            const isToday = dateStr === todayStr;
                            return (
                                <div key={idx} className={`bg-white h-[85px] md:h-[95px] p-1.5 flex flex-col overflow-hidden transition-colors ${d?'hover:bg-slate-50':'opacity-50 pointer-events-none'}`}>
                                    <div className={`text-[10px] md:text-xs font-bold p-1 flex justify-center items-center w-6 h-6 rounded-full ${isToday?'bg-blue-600 text-white shadow-md':idx%7===0?'text-red-500':idx%7===6?'text-blue-500':'text-slate-700'}`}>{d || ''}</div>
                                    <div className="flex-1 overflow-y-auto space-y-1 mt-1 custom-scrollbar">
                                        {leaves.map((l, i) => (<div key={i} onClick={(e) => { e.stopPropagation(); onEditClick && onEditClick(staff.id, 0, l); }} className={`cursor-pointer hover:opacity-80 text-[10px] md:text-[11px] px-1.5 py-1 rounded-md leading-tight font-bold shadow-sm border ${l.type.includes('반차') || l.type.includes('시간') ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`} title={`${l.reason || l.type} - 클릭하여 수정`}>{l.type}</div>))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div></div>
            );
        };

        const LeaveActionModal = ({ onClose, staffList, adminName, initialData = null, showAlert }) => {
            const isEdit = !!(initialData && initialData.id);
            const [selectedStaffId, setSelectedStaffId] = useState(initialData?.staffId || '');
            const [staffSearch, setStaffSearch] = useState('');
            const [isStaffDropdownOpen, setIsStaffDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            const [dateMode, setDateMode] = useState('single');
            const [leaveDate, setLeaveDate] = useState(initialData?.date || toLocalYMD(new Date()));
            const [endDate, setEndDate] = useState(initialData?.date || toLocalYMD(new Date()));
            const [customDates, setCustomDates] = useState([]);
            const [customDateInput, setCustomDateInput] = useState('');
            const [customYear, setCustomYear] = useState(new Date().getFullYear());

            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1');
            const [leaveHourValue, setLeaveHourValue] = useState('');
            const [reason, setReason] = useState(initialData?.reason || '');
            const [msg, setMsg] = useState('');

            useEffect(() => {
                const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsStaffDropdownOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => { if (initialData && staffList.length) { const s = staffList.find(x => x.id === initialData.staffId); if (s) setStaffSearch(s.name); } }, [initialData, staffList]);
            useEffect(() => { if (dateMode === 'multi') { setInputType('day'); setLeaveDayType('1'); } }, [dateMode]);
            useEffect(() => {
                if (initialData && isEdit) {
                    const days = safeParseFloat(initialData.days);
                    if (days === 1 || days === 0.5) { setInputType('day'); setLeaveDayType(String(days)); }
                    else { setInputType('hour'); setLeaveHourValue(String(days)); }
                }
            }, [initialData, isEdit]);

            const filteredStaffList = useMemo(() => [...staffList].sort((a,b) => a.name.localeCompare(b.name)).filter(s => s.name.toLowerCase().includes(staffSearch.toLowerCase())), [staffList, staffSearch]);
            const selectedStaff = useMemo(() => staffList.find(s => s.id === selectedStaffId), [staffList, selectedStaffId]);

            const calcDeductHours = (staff) => {
                const dailyHours = safeParseFloat(staff?.workHours) || 8;
                return inputType === 'day' ? (leaveDayType === '1' ? dailyHours : dailyHours / 2) : safeParseFloat(leaveHourValue);
            };
            const typeText = (hours, daily) => inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${hours}시간`;

            const handleAddCustomDate = () => {
                if (!customDateInput.trim()) return;
                if (!selectedStaffId) { setMsg('❌ 먼저 상단에서 직원을 선택해주세요.'); return; }
                const deductHours = calcDeductHours(selectedStaff);
                if (deductHours <= 0) { setMsg('❌ 시간을 올바르게 입력하세요.'); return; }
                const tText = typeText(deductHours);
                const parsed = parseCustomDates(customDateInput, customYear).filter(d => !customDates.some(cd => cd.date === d));
                if (parsed.length) {
                    setCustomDates([...customDates, ...parsed.map(d => ({ date: d, type: tText, deductHours }))].sort((a,b) => a.date.localeCompare(b.date)));
                    setCustomDateInput(''); setMsg('');
                } else setMsg('❌ 날짜 형식을 확인해주세요 (예: 4.1, 2026.5.21)');
            };

            const validDates = useMemo(() => {
                if (dateMode === 'single') return [leaveDate];
                if (dateMode === 'custom') return customDates.map(c => c.date);
                return listWorkingDates(leaveDate, endDate, selectedStaff?.offDays);
            }, [leaveDate, endDate, customDates, dateMode, selectedStaff]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedStaffId || !selectedStaff) { setMsg('❌ 직원을 검색하여 선택해주세요.'); return; }
                const deductHours = calcDeductHours(selectedStaff);
                if (inputType === 'hour' && deductHours <= 0) { setMsg('❌ 시간을 입력하세요.'); return; }
                if ((dateMode === 'multi' || dateMode === 'custom') && !validDates.length) { setMsg('❌ 선택된 날짜가 없습니다. (휴무일일 수 있습니다)'); return; }
                setMsg('처리 중...');
                try {
                    const newHistory = [...(selectedStaff.leaveHistory || [])];
                    const tText = typeText(deductHours);
                    if (isEdit) {
                        const idx = newHistory.findIndex(h => h.id === initialData.id);
                        if (idx !== -1) newHistory[idx] = { ...newHistory[idx], date: safeDate(leaveDate), days: deductHours, type: tText, reason, addedBy: adminName };
                    } else if (dateMode === 'custom') {
                        customDates.forEach((item, idx) => newHistory.push({ id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, date: safeDate(item.date), days: item.deductHours, type: item.type, reason, addedBy: adminName, createdAt: new Date().toISOString() }));
                    } else {
                        validDates.forEach((d, idx) => newHistory.push({ id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, date: safeDate(d), days: deductHours, type: tText, reason, addedBy: adminName, createdAt: new Date().toISOString() }));
                    }
                    await recalcAndSave(selectedStaffId, selectedStaff.joinDate, newHistory);
                    setMsg('✅ 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 1000);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            const currentYearNum = new Date().getFullYear();
            const yearOptions = [currentYearNum + 1, currentYearNum, currentYearNum - 1, currentYearNum - 2, currentYearNum - 3, currentYearNum - 4];

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[500] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto pt-20"><div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative my-auto"><button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">{isEdit ? '연차 수정' : '연차 등록'}</h3><form onSubmit={handleSubmit} className="space-y-4">
                    <div className="relative" ref={dropdownRef}><label className="block text-xs font-bold text-slate-500 mb-1">직원 검색 및 선택</label><input type="text" className="w-full border rounded-xl p-3 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder={isEdit ? "" : "직원 이름 검색..."} value={staffSearch} onChange={(e) => { setStaffSearch(e.target.value); setIsStaffDropdownOpen(true); setSelectedStaffId(''); }} onFocus={() => { if(!isEdit) setIsStaffDropdownOpen(true); }} disabled={isEdit} required />
                        {isStaffDropdownOpen && !isEdit && (<div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">{filteredStaffList.length > 0 ? filteredStaffList.map(s => (<div key={s.id} className="p-3 text-sm hover:bg-blue-50 cursor-pointer border-b last:border-b-0 border-slate-50" onClick={() => { setSelectedStaffId(s.id); setStaffSearch(s.name); setIsStaffDropdownOpen(false); }}><span className="font-bold text-slate-800">{s.name}</span> <span className="text-slate-500 text-xs">(일 {s.workHours || 8}h)</span></div>)) : <div className="p-3 text-sm text-slate-400 text-center">검색 결과가 없습니다.</div>}</div>)}
                    </div>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><label className="block text-xs font-bold text-slate-700 mb-2">등록 단위 선택</label><div className={`flex gap-2 mb-2 ${dateMode === 'multi' ? 'opacity-50 pointer-events-none' : ''}`}><label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="day" checked={inputType === 'day'} onChange={() => setInputType('day')} className="hidden"/>일 단위</label><label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="hour" checked={inputType === 'hour'} onChange={() => setInputType('hour')} className="hidden"/>시간 단위</label></div>
                        {inputType === 'day' ? (<div className="flex gap-2"><label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '1' ? 'bg-blue-50 border-blue-200 text-blue-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="1" checked={leaveDayType === '1'} onChange={() => setLeaveDayType('1')} className="hidden"/>연차 (1일)</label><label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '0.5' ? 'bg-orange-50 border-orange-200 text-orange-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="0.5" checked={leaveDayType === '0.5'} onChange={() => setLeaveDayType('0.5')} className="hidden"/>반차 (0.5일)</label></div>) : (<div className="flex items-center gap-2"><input type="number" value={leaveHourValue} onChange={e => setLeaveHourValue(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center focus:ring-2 focus:ring-blue-100 bg-white" placeholder="시간 입력 (예: 2)" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>)}
                    </div>
                    {!isEdit && (<div><label className="block text-xs font-bold text-slate-700 mb-2">날짜 입력 방식</label><div className="flex bg-slate-100 p-1 rounded-xl mb-3">{[['single','단일 날짜'],['multi','기간 설정'],['custom','지정일 선택']].map(([k, label]) => (<button key={k} type="button" onClick={() => setDateMode(k)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === k ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>))}</div></div>)}
                    {dateMode === 'single' && (<div><label className="block text-xs font-bold text-slate-500 mb-1">날짜 선택</label><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" required /></div>)}
                    {dateMode === 'multi' && (<div className="bg-blue-50 p-4 rounded-xl border border-blue-100"><label className="block text-xs font-bold text-blue-600 mb-1">기간 선택 (직원 휴무일 자동 제외 / 연차 1일 단위 전용)</label><div className="flex items-center gap-2"><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required /><span className="text-slate-400 font-bold">~</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required /></div><p className="text-[11px] text-blue-500 font-bold mt-2 text-center bg-white py-1 rounded border border-blue-100">등록 예정일 {validDates.length}일</p></div>)}
                    {dateMode === 'custom' && (
                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100"><label className="block text-xs font-bold text-purple-600 mb-1">지정일 추가 (위에서 선택한 단위로 개별 저장됩니다)</label><div className="flex items-center gap-2 mb-3"><select value={customYear} onChange={e => setCustomYear(parseInt(e.target.value))} className="border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 bg-white font-bold text-purple-700">{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select><input type="text" placeholder="예: 4.1, 5.21" value={customDateInput} onChange={e => setCustomDateInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter') { e.preventDefault(); handleAddCustomDate(); } }} className="flex-1 border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200" /><button type="button" onClick={handleAddCustomDate} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 transition">추가</button></div>
                            <div className="flex flex-wrap gap-2">{customDates.map(d => (<span key={d.date} className="bg-white border border-purple-200 text-purple-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm">{d.date} <span className="text-[10px] bg-purple-100 px-1 rounded">{d.type}</span><button type="button" onClick={() => setCustomDates(customDates.filter(cd => cd.date !== d.date))} className="text-purple-400 hover:text-purple-600 p-0.5 rounded-full hover:bg-purple-50">✕</button></span>))}{customDates.length === 0 && <span className="text-xs text-purple-400 font-medium">추가된 날짜가 없습니다.</span>}</div>
                            <p className="text-xs text-purple-500 font-bold mt-3 text-center bg-white py-1 rounded border border-purple-100">총 {customDates.length}일 등록 예정</p>
                        </div>
                    )}
                    <div><label className="block text-xs font-bold text-slate-500 mb-1">사유</label><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="사유 입력" /></div><button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">{isEdit ? '수정 내용 저장' : '연차 등록하기'}</button>{msg && <p className="text-xs text-center font-bold text-red-500">{msg}</p>}
                </form></div></div>
            );
        };

        // [공통화] 정렬 아이콘
        const SortIcon = ({ sortConfig, columnKey }) => {
            if (sortConfig.key !== columnKey) return <span className="text-slate-300 ml-1">⇅</span>;
            return <span className="text-blue-600 ml-1">{sortConfig.direction === 'asc' ? <Icons.SortAsc /> : <Icons.SortDesc />}</span>;
        };

        const LeaveManagementTab = ({ staffList, allStaffList, adminName, onOpenModal, onEditClick, isPastMode = false, isResignedTab = false, onNameClick, showConfirm, showAlert }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear() - 1);
            const [showNegativeOnly, setShowNegativeOnly] = useState(false);
            const [showCheckOnly, setShowCheckOnly] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [calendarStaff, setCalendarStaff] = useState(null);
            const [showMonthlyModal, setShowMonthlyModal] = useState(false);
            const [showAdvancedAuditModal, setShowAdvancedAuditModal] = useState(false);

            const handleResetFilters = () => { setSearchTerm(''); setShowNegativeOnly(false); setShowCheckOnly(false); setSortConfig({ key: 'name', direction: 'asc' }); if (isPastMode) setSelectedYear(new Date().getFullYear() - 1); };

            const handleResetAllLeaveHistory = () => {
                showConfirm('모든 직원의 연차 사용 내역을 완전히 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.', async () => {
                    try {
                        const batch = db.batch();
                        staffList.forEach(s => batch.update(db.collection('users').doc(s.id), { leaveHistory: [], annualLeaveUsed: 0 }));
                        await batch.commit(); showAlert('전체 연차 내역이 초기화되었습니다.');
                    } catch (e) { showAlert('오류: ' + e.message); }
                });
            };

            const filteredList = useMemo(() => {
                const data = staffList.map(staff => {
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const leaveInfo = isPastMode ? calculateLeaveForYear(staff.joinDate, selectedYear) : calculateAnnualLeave(staff.joinDate);
                    const activeHistory = (staff.leaveHistory || [])
                        .filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate)
                        .sort((a, b) => b.date.localeCompare(a.date));
                    const usedHours = activeHistory.reduce((acc, cur) => acc + safeParseFloat(cur.days), 0);
                    const totalDays = leaveInfo.total || 0;
                    const totalHours = totalDays * dailyHours;
                    const remainingHours = totalHours - usedHours;

                    const dateCounts = {};
                    activeHistory.forEach(h => { if (h.date) dateCounts[h.date] = (dateCounts[h.date] || 0) + 1; });
                    const needsCheck = activeHistory.some(h => dateCounts[h.date] > 1);

                    return {
                        ...staff, dailyHours, leaveInfo, totalDays, totalHours, usedHours, remainingHours,
                        usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0,
                        remainingDays: dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0,
                        displayHistory: activeHistory.map(h => ({ ...h, isWarn: dateCounts[h.date] > 1 })),
                        notJoined: leaveInfo.notJoined, needsCheck
                    };
                }).filter(d => {
                    if (!isResignedTab && d.notJoined) return false;
                    if (searchTerm && !(d.name && d.name.includes(searchTerm))) return false;
                    if (showNegativeOnly && d.remainingHours >= 0) return false;
                    if (showCheckOnly && !d.needsCheck) return false;
                    return true;
                });

                if (sortConfig.key) {
                    const keyMap = { total: 'totalHours', used: 'usedHours', remaining: 'remainingHours' };
                    const k = keyMap[sortConfig.key] || sortConfig.key;
                    data.sort((a, b) => {
                        const av = a[k], bv = b[k];
                        if (av < bv) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (av > bv) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return data;
            }, [staffList, selectedYear, isPastMode, searchTerm, showNegativeOnly, showCheckOnly, isResignedTab, sortConfig]);

            const handleSort = (key) => setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));

            const handleDeleteLeave = (data, leaveId) => {
                showConfirm('이 휴가 내역을 삭제하시겠습니까?', async () => {
                    try { await recalcAndSave(data.id, data.joinDate, (data.leaveHistory || []).filter(h => h.id !== leaveId)); }
                    catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            return (
                <div className="space-y-6 relative">
                    {calendarStaff && <PersonalCalendarModal staff={calendarStaff} onClose={() => setCalendarStaff(null)} onOpenModal={onOpenModal} onEditClick={onEditClick} />}
                    {showMonthlyModal && <MonthlyReportModal staffList={staffList} onClose={() => setShowMonthlyModal(false)} showAlert={showAlert} />}
                    {showAdvancedAuditModal && <AdvancedAuditModal staffList={allStaffList || staffList} onClose={() => setShowAdvancedAuditModal(false)} showAlert={showAlert} onOpenModal={onOpenModal} defaultPromoFilter={false} />}

                    <div className="sticky top-0 z-30 bg-[#F1F5F9] pb-4 pt-2 -mt-2">
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                                <div><h3 className="font-bold text-lg text-slate-800">{isPastMode ? '과년도' : '연차 관리'}</h3><p className="text-xs text-slate-500 font-bold">시간 단위(Hour) 관리 · 총 <span className="text-blue-600">{filteredList.length}</span>명</p></div>
                                {isPastMode && (<select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))} className="bg-white border rounded-lg px-3 py-1.5 outline-none">{[...Array(5)].map((_, i) => { const y = new Date().getFullYear() - i; return <option key={y} value={y}>{y}년</option>; })}</select>)}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 md:gap-3 w-full md:w-auto">
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-orange-50 px-3 py-2 rounded-xl border border-orange-100 hover:bg-orange-100 transition" title="같은 날짜에 2개 이상의 연차가 등록된 직원을 찾습니다"><input type="checkbox" checked={showCheckOnly} onChange={(e) => setShowCheckOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-orange-600 whitespace-nowrap flex items-center gap-1"><Icons.Alert /> 중복 확인</span></label>
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border hover:bg-slate-100 transition"><input type="checkbox" checked={showNegativeOnly} onChange={(e) => setShowNegativeOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-red-500 whitespace-nowrap">초과자만</span></label>
                                <div className="flex w-full md:w-auto items-center gap-1"><input type="text" placeholder="이름 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-32 px-4 py-2 border rounded-xl text-sm outline-none mt-2 md:mt-0" /><button onClick={handleResetFilters} className="p-2.5 mt-2 md:mt-0 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition border border-slate-200" title="필터/검색 초기화"><Icons.Refresh /></button></div>
                                <div className="w-full md:w-auto gap-2 mt-2 md:mt-0 hidden md:flex">
                                    {!isResignedTab && <button onClick={handleResetAllLeaveHistory} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-red-100 transition" title="모든 직원의 연차 내역을 삭제합니다">전체 연차 초기화</button>}
                                    <button onClick={() => setShowMonthlyModal(true)} className="flex-1 md:flex-none bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-teal-700 transition shadow-sm" title="과거 특정 월을 선택하여 연차 현황을 조회 및 다운로드합니다."><Icons.FileText /> 월간 보고서</button>
                                    <button onClick={() => setShowAdvancedAuditModal(true)} className="flex-1 md:flex-none bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-indigo-700 transition shadow-sm" title="다중 엑셀 파일과 시스템(DB)을 대조하여 누락된 연차를 찾습니다 (재직자 한정)"><Icons.CheckCircle /> 다중 엑셀 정밀 대조</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap md:whitespace-normal">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('name')}><div className="flex items-center">이름 <SortIcon sortConfig={sortConfig} columnKey="name" /></div></th>
                                    <th className="p-4 text-center text-blue-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('total')}><div className="flex items-center justify-center">총 연차 <SortIcon sortConfig={sortConfig} columnKey="total" /></div></th>
                                    <th className="p-4 text-center text-red-500 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('used')}><div className="flex items-center justify-center">사용 <SortIcon sortConfig={sortConfig} columnKey="used" /></div></th>
                                    <th className="p-4 text-center text-green-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('remaining')}><div className="flex items-center justify-center">잔여 <SortIcon sortConfig={sortConfig} columnKey="remaining" /></div></th>
                                    <th className="p-4 w-44">기간</th><th className="p-4 min-w-[200px]">내역</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredList.map((data) => {
                                    const isDateError = !data.joinDate || data.joinDate.length < 8;
                                    return (
                                        <tr key={data.id} className="hover:bg-slate-50 transition">
                                            <td className="p-4">
                                                <div className="flex items-center gap-2">
                                                    <div className="font-bold text-slate-800 cursor-pointer hover:underline hover:text-blue-600" onClick={() => onNameClick && onNameClick(data)}>{data.name}</div>
                                                    <button onClick={() => setCalendarStaff(data)} className="text-blue-500 bg-blue-50 p-1.5 rounded-lg hover:bg-blue-100 hover:shadow-sm transition" title={`${data.name}의 개인 연차 캘린더 보기`}><Icons.Calendar /></button>
                                                </div>
                                                {data.workHours && <div className="text-xs text-slate-500 mt-1">일 {data.workHours}h</div>}
                                                {data.needsCheck && <div className="text-xs text-orange-600 font-bold mt-1 flex items-center gap-1 animate-pulse"><Icons.Alert /> 중복 입력 확인필요</div>}
                                            </td>
                                            <td className="p-4 text-center font-bold text-blue-600">{isDateError ? <span className="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">입사일 확인</span> : <>{fmt(data.totalHours)}h <span className="text-xs font-normal text-slate-400">({data.totalDays}일)</span></>}</td>
                                            <td className="p-4 text-center font-bold text-red-500">{fmt(data.usedHours)}h <span className="text-xs font-normal text-slate-400">({data.usedDays}일)</span></td>
                                            <td className={`p-4 text-center font-black text-lg ${data.remainingHours < 0 ? 'text-red-600 animate-pulse' : 'text-green-600'}`}>{fmt(data.remainingHours)}h <span className="text-xs font-normal text-slate-400">({data.remainingDays}일)</span></td>
                                            <td className="p-4 text-xs text-slate-400">{data.leaveInfo.period}</td>
                                            <td className="p-4">{data.displayHistory.length > 0 ? (
                                                <div className="max-h-32 overflow-y-auto space-y-1 custom-scrollbar pr-2">
                                                    {data.displayHistory.map((rec, i) => (
                                                        <div key={rec.id || i} className={`flex items-center justify-between text-xs p-2 rounded-lg border md:group hover:border-blue-200 transition ${rec.isWarn ? 'bg-orange-50 border-orange-200 shadow-inner' : 'bg-slate-50'}`}>
                                                            <div className="flex items-center gap-2">
                                                                <span className={`font-bold ${rec.isWarn ? 'text-orange-700' : ''}`}>{rec.date}</span><span className={`px-1.5 rounded text-[10px] font-bold ${rec.days >= data.dailyHours ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}`}>{fmt(rec.days)}h ({rec.type})</span>{rec.isWarn && <span className="text-orange-500" title="이 날짜에 연차가 2번 이상 중복 입력되었습니다!"><Icons.Alert /></span>}
                                                            </div>
                                                            <div className="flex gap-1 ml-2 flex-shrink-0 opacity-100"><button type="button" onClick={() => onEditClick(data.id, 0, rec)} className="text-blue-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-blue-50 transition"><Icons.Edit /></button><button type="button" onClick={() => handleDeleteLeave(data, rec.id)} className="text-red-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-red-50 transition"><Icons.Trash /></button></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : <span className="text-slate-300 text-xs">-</span>}</td>
                                        </tr>
                                    );
                                })}
                                {filteredList.length === 0 && <tr><td colSpan="6" className="p-12 text-center text-slate-400">데이터가 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {!isResignedTab && (
                        <div className="fixed bottom-6 right-6 md:bottom-10 md:right-10 flex flex-col gap-3 z-40">
                            <button onClick={() => setShowMonthlyModal(true)} className="md:hidden bg-teal-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(13,148,136,0.4)] hover:bg-teal-700 active:scale-95 transition-all" title="보고서 다운로드"><Icons.FileText /></button>
                            <button onClick={() => setShowAdvancedAuditModal(true)} className="md:hidden bg-indigo-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(79,70,229,0.4)] hover:bg-indigo-700 active:scale-95 transition-all" title="다중 엑셀 대조 검증"><Icons.CheckCircle /></button>
                            <button onClick={() => onOpenModal()} className="bg-blue-600 text-white w-14 h-14 md:w-auto md:px-6 md:py-4 md:h-auto rounded-full flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(37,99,235,0.4)] hover:bg-blue-700 active:scale-95 md:hover:-translate-y-1 transition-all" title="연차 등록"><Icons.Plus /><span className="font-bold text-sm whitespace-nowrap hidden md:inline">연차 등록</span></button>
                        </div>
                    )}
                </div>
            );
        };

        // 직원 명부 엑셀 헤더 정의 (직원/퇴사자 공용)
        // 우선순위 순서 (앞쪽일수록 강함)
        const STAFF_NEEDS = {
            name: ['근로지원인', '성명', '이름'],
            birth: ['생년월일', '생일'],
            phone: ['휴대폰', '연락처', '전화'],
            join: ['입사일', '입사'],
            work: ['일일근무시간', '근무시간', '근무', '시간'],
            resign: ['퇴사일', '퇴사']
        };

        const StaffTab = ({ staffList, showConfirm, showAlert }) => {
            const fileInputRef = useRef(null);
            const [uploadMsg, setUploadMsg] = useState('');
            const [editingStaff, setEditingStaff] = useState(null);
            const [viewingStaff, setViewingStaff] = useState(null);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [showUnregisteredOnly, setShowUnregisteredOnly] = useState(false);
            const [showResignedToo, setShowResignedToo] = useState(false); // [v6.11.0] 퇴사자 포함 보기

            const activeStaffList = useMemo(() => staffList.filter(s => s.status !== 'resigned'), [staffList]);

            const processedStaffList = useMemo(() => {
                let data = showResignedToo ? staffList : activeStaffList;
                if (searchTerm) { const t = searchTerm.toLowerCase(); data = data.filter(s => (s.name && s.name.toLowerCase().includes(t)) || (s.phone && s.phone.includes(t))); }
                if (showUnregisteredOnly) data = data.filter(s => s.authStatus !== 'success');

                data = data.map(staff => {
                    const leaveInfo = calculateAnnualLeave(staff.joinDate);
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const totalDays = leaveInfo.total || 0;
                    const totalHours = totalDays * dailyHours;
                    const usedHours = staff.annualLeaveUsed || 0;
                    const remainingHours = totalHours - usedHours;
                    return { ...staff, dailyHours, totalDays, totalHours, usedHours, remainingHours, leaveInfo,
                        remainingDays: dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0,
                        usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0 };
                });

                if (sortConfig.key) {
                    const k = sortConfig.key === 'remaining' ? 'remainingHours' : sortConfig.key;
                    data.sort((a, b) => {
                        if (a[k] < b[k]) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (a[k] > b[k]) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return data;
            }, [activeStaffList, staffList, showResignedToo, searchTerm, sortConfig, showUnregisteredOnly]);

            const handleSort = (key) => setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        if (jsonData.length < 2) { setUploadMsg('❌ 데이터 없음'); return; }

                        const { cols, startRow } = findColumns(jsonData, STAFF_NEEDS, 5);
                        const c = { name: cols.name ?? 0, birth: cols.birth ?? 1, phone: cols.phone ?? 2, join: cols.join ?? 3, work: cols.work ?? 4 };

                        const excelStaffs = [];
                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const name = String(row[c.name] || '').trim();
                            if (name) excelStaffs.push({ name, normName: normalizeString(name), birthRaw: row[c.birth], phoneRaw: row[c.phone], joinRaw: row[c.join], workRaw: row[c.work] });
                        }

                        const batch = db.batch();
                        let newCount = 0, updateCount = 0, resignCount = 0, restoreCount = 0;
                        const matchedIdx = new Set();
                        const todayStr = toLocalYMD(new Date());

                        // [v6.11.0] 전체 명부(재직+퇴사)를 기준으로 매칭합니다.
                        //  - 엑셀에 이름이 있으면: 재직 유지 + (퇴사자였다면) 자동 재직 복구
                        //  - 엑셀에 이름이 없으면: (재직자였다면) 자동 퇴사 처리
                        //  - 아예 처음 보는 이름이면: 신규 계정 생성
                        staffList.forEach(dbStaff => {
                            const normDbName = normalizeString(dbStaff.name);
                            const idx = excelStaffs.findIndex((es, i) => !matchedIdx.has(i) && es.normName === normDbName);
                            const docRef = db.collection('users').doc(dbStaff.id);
                            const wasResigned = dbStaff.status === 'resigned' || !!(dbStaff.resignDate && String(dbStaff.resignDate).trim());
                            if (idx !== -1) {
                                matchedIdx.add(idx); const es = excelStaffs[idx];
                                const joinDate = safeDateRecent(es.joinRaw) || dbStaff.joinDate;
                                const leaveInfo = calculateAnnualLeave(joinDate);
                                const upd = { birth: safeDate(es.birthRaw) || dbStaff.birth || '', phone: es.phoneRaw || dbStaff.phone || '', workHours: es.workRaw || dbStaff.workHours || '', joinDate, annualLeaveTotal: leaveInfo.total || dbStaff.annualLeaveTotal || 0, annualLeavePeriod: leaveInfo.period || dbStaff.annualLeavePeriod || '-' };
                                if (wasResigned) { upd.status = 'active'; upd.resignDate = ''; restoreCount++; } // 명부에 다시 나타남 → 재직 복구
                                else updateCount++;
                                batch.update(docRef, upd);
                            } else if (!wasResigned) {
                                // 엑셀에 없고, 지금 재직 중인 사람만 퇴사 처리 (이미 퇴사자는 그대로 둠)
                                batch.update(docRef, { status: 'resigned', resignDate: todayStr }); resignCount++;
                            }
                        });

                        excelStaffs.forEach((es, idx) => {
                            if (matchedIdx.has(idx)) return;
                            const joinDate = safeDateRecent(es.joinRaw);
                            const leaveInfo = calculateAnnualLeave(joinDate);
                            const phoneStr = String(es.phoneRaw || '').replace(/[^0-9]/g, '').trim();
                            const last4 = phoneStr.length >= 4 ? phoneStr.slice(-4) : '0000';
                            const uniqueKey = `yg${last4}`;
                            const email = `${uniqueKey}_${Math.random().toString(36).substring(2, 6)}@ygnurim.com`;
                            batch.set(db.collection('users').doc(email), { name: es.name, birth: safeDate(es.birthRaw), phone: es.phoneRaw || '', workHours: es.workRaw || '', joinDate, employeeId: uniqueKey, role: 'staff', tempPw: '123456', annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-', status: 'active', resignDate: '', offDays: [0], leaveHistory: [], annualLeaveUsed: 0, authStatus: 'pending' });
                            newCount++;
                        });

                        await batch.commit();
                        setUploadMsg(`✅ 신규:${newCount}명 / 유지:${updateCount}명 / 복구:${restoreCount}명 / 퇴사:${resignCount}명`);
                        setTimeout(() => setUploadMsg(''), 6000); e.target.value = '';
                    } catch (err) { setUploadMsg('❌ 오류: ' + err.message); }
                };
            };

            const handleDeleteOne = (staff) => showConfirm(`정말 [${staff.name}] 직원의 정보를 완전히 삭제하시겠습니까?`, async () => { try { await db.collection('users').doc(staff.id).delete(); showAlert('삭제 완료되었습니다.'); } catch (err) { showAlert('삭제 실패: ' + err.message); } });

            // [v6.11.0] 재직 복구 — 퇴사 처리된 직원을 다시 재직 상태로 되돌립니다. (연차 이력은 그대로 유지)
            const handleReactivate = (staff) => showConfirm(`[${staff.name}] 직원을 다시 '재직 중' 상태로 복구하시겠습니까?\n\n· 연차·인사 정보는 그대로 유지됩니다.\n· 퇴사일 기록은 지워집니다.`, async () => {
                try {
                    await db.collection('users').doc(staff.id).update({ status: 'active', resignDate: '' });
                    showAlert(`✅ [${staff.name}] 재직 복구 완료!`);
                } catch (err) { showAlert('복구 실패: ' + err.message); }
            });
            const handleSelectAll = (e) => setSelectedIds(e.target.checked ? new Set(processedStaffList.map(s => s.id)) : new Set());
            const handleSelectOne = (id) => { const s = new Set(selectedIds); s.has(id) ? s.delete(id) : s.add(id); setSelectedIds(s); };
            const handleBulkDelete = () => {
                if (!selectedIds.size) return;
                showConfirm(`선택한 ${selectedIds.size}명의 직원을 일괄 삭제하시겠습니까?`, async () => {
                    try { const batch = db.batch(); selectedIds.forEach(id => batch.delete(db.collection('users').doc(id))); await batch.commit(); showAlert(`${selectedIds.size}명 삭제가 완료되었습니다.`); setSelectedIds(new Set()); }
                    catch (err) { showAlert('오류: ' + err.message); }
                });
            };
            const handleResetFilters = () => { setSearchTerm(''); setSelectedIds(new Set()); setShowUnregisteredOnly(false); };

            const handleResetAuth = () => {
                showConfirm("모든 직원의 계정 발급 상태를 '미발급'으로 되돌리시겠습니까?\n\n※ 연차 데이터와 기본 정보는 100% 안전하게 보존됩니다.\n휴대폰 번호를 다시 업로드하고 새로운 ID로 재발급 받기 위한 기능입니다.", async () => {
                    setUploadMsg('계정 상태 초기화 중...');
                    try {
                        const batch = db.batch(); let count = 0;
                        activeStaffList.forEach(staff => { if (staff.authStatus === 'success') { batch.update(db.collection('users').doc(staff.id), { authStatus: 'pending', employeeId: '', tempPw: '' }); count++; } });
                        await batch.commit();
                        setUploadMsg(`✅ ${count}명 계정 초기화 완료! 이제 엑셀을 다시 업로드해주세요.`); setTimeout(() => setUploadMsg(''), 5000);
                    } catch (err) { setUploadMsg(`❌ 오류: ${err.message}`); }
                });
            };

            const handleDownloadAccountInfo = () => {
                const wsData = [ ['양지누림 직원 계정 안내 정보'], [`출력 일자: ${new Date().toLocaleDateString()}`], [], ['이름', '연락처', '로그인 ID', '초기 비밀번호', '계정 상태'] ];
                processedStaffList.forEach(s => wsData.push([ s.name, s.phone || '미입력', s.employeeId ? `${s.employeeId}@ygnurim.com` : '미발급', s.tempPw || '미발급', s.authStatus === 'success' ? '발급완료' : '미발급' ]));
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 15 }, { wch: 20 }, { wch: 25 }, { wch: 15 }, { wch: 15 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "계정정보");
                XLSX.writeFile(wb, `양지누림_직원계정안내_${toLocalYMD(new Date()).replace(/-/g, '')}.xlsx`);
            };

            const getSecondaryApp = () => firebase.apps.find(a => a.name === 'Secondary') ? firebase.app('Secondary') : firebase.initializeApp(firebaseConfig, 'Secondary');

            const issueAccount = async (staff, secondaryApp, assignedEmails) => {
                const phoneStr = String(staff.phone || '').replace(/[^0-9]/g, '');
                const last4 = phoneStr.length >= 4 ? phoneStr.slice(-4) : '0000';
                const base = `yg${last4}`;
                let loginId = base, email = `${base}@ygnurim.com`, counter = 1;
                while (assignedEmails.has(email) && email !== staff.id) { loginId = `${base}_${counter}`; email = `${loginId}@ygnurim.com`; counter++; }
                assignedEmails.add(email);
                const tempPw = '123456';
                try { await secondaryApp.auth().createUserWithEmailAndPassword(email, tempPw); }
                catch (authErr) { if (authErr.code !== 'auth/email-already-in-use') throw authErr; }

                if (staff.id !== email) {
                    const newData = { ...staff, employeeId: loginId, email, tempPw, authStatus: 'success' };
                    delete newData.id;
                    const batch = db.batch();
                    batch.set(db.collection('users').doc(email), newData);
                    batch.delete(db.collection('users').doc(staff.id));
                    await batch.commit();
                } else await db.collection('users').doc(staff.id).update({ tempPw, employeeId: loginId, authStatus: 'success' });
                return loginId;
            };

            const handleCreateSingleAuth = async (staff) => {
                setUploadMsg(`[${staff.name}] 계정 연동 확인 중...`);
                try {
                    const loginId = await issueAccount(staff, getSecondaryApp(), new Set(staffList.filter(s => s.id !== staff.id).map(s => s.id)));
                    setUploadMsg(`✅ [${staff.name}] 발급 완료! (ID: ${loginId})`);
                } catch (err) { setUploadMsg(`❌ 오류: ${err.message}`); }
                setTimeout(() => setUploadMsg(''), 4000);
            };

            // [v6.10.0] 비밀번호 초기화 — 직원이 비밀번호 분실 시 초기값(123456)으로 복구
            // 원리: 클라이언트(브라우저)에는 남의 비밀번호를 바로 바꿀 권한이 없습니다.
            //       그래서 별도 보조 창구(Secondary App)로 해당 계정을 '삭제 후 → 초기 비번으로 재생성'합니다.
            //       연차·인사 데이터는 Firestore(users 문서)에 그대로 있으므로 유실되지 않으며,
            //       tempPw 를 다시 '123456' 으로 표시해 직원이 다음 로그인 때 비번을 새로 정하도록 유도합니다.
            const handleResetPassword = (staff) => {
                showConfirm(`[${staff.name}] 직원의 비밀번호를 초기 비밀번호(123456)로 되돌리시겠습니까?\n\n· 연차·인사 정보는 그대로 유지됩니다.\n· 직원은 다음 로그인 시 새 비밀번호를 다시 설정하게 됩니다.`, async () => {
                    setUploadMsg(`[${staff.name}] 비밀번호 초기화 중...`);
                    try {
                        const email = staff.id; // 계정 문서 ID = 로그인 이메일
                        const secondaryApp = getSecondaryApp();
                        // 1) 기존 Auth 계정 삭제 시도 (보조 창구로 로그인 후 삭제)
                        try {
                            const cred = await secondaryApp.auth().signInWithEmailAndPassword(email, '123456');
                            // 이미 초기 비번인 경우: 그대로 사용하면 됨
                            await secondaryApp.auth().signOut();
                            await db.collection('users').doc(email).update({ tempPw: '123456', authStatus: 'success' });
                            setUploadMsg(`✅ [${staff.name}] 이미 초기 비밀번호(123456) 상태입니다.`);
                            setTimeout(() => setUploadMsg(''), 5000);
                            return;
                        } catch (signInErr) {
                            // 초기 비번이 아니면 삭제 후 재생성 경로로 진행
                        }
                        // 2) 초기 비번이 아니라면: 계정을 지우고 새로 만들어 초기 비번을 강제 적용
                        //    (남의 현재 비번을 모른 채 삭제할 수는 없으므로, 재생성으로 안전하게 복구)
                        try {
                            await secondaryApp.auth().createUserWithEmailAndPassword(email, '123456');
                        } catch (createErr) {
                            if (createErr.code === 'auth/email-already-in-use') {
                                // 직원이 초기 비번(123456)을 이미 자기 비번으로 바꾼 상태.
                                // 구글 보안 정책상 '남의 현재 비번을 모르는 채' 브라우저에서 그 계정을 삭제·변경하는 것은 불가능합니다.
                                // → 관리자가 Firebase 콘솔에서 직접 처리하도록, 계정 아이디와 단계를 구체적으로 안내합니다.
                                throw new Error(
                                    `[${staff.name}] 직원은 초기 비밀번호를 이미 본인 것으로 변경한 상태라,\n` +
                                    `보안 정책상 이 화면(브라우저)에서는 초기화할 수 없습니다.\n\n` +
                                    `아래 순서로 Firebase 콘솔에서 처리해주세요.\n` +
                                    `① console.firebase.google.com 접속 → 우리 프로젝트 선택\n` +
                                    `② 왼쪽 메뉴 [Authentication] → [Users] 탭\n` +
                                    `③ 아래 계정을 찾아 오른쪽 ⋮(점 3개) → '사용자 삭제'\n` +
                                    `    계정 : ${email}\n` +
                                    `④ 삭제 후, 이 화면 [직원 명부]에서 해당 직원의 '개별 발급' 버튼을 다시 누르면\n` +
                                    `    초기 비밀번호(123456)로 계정이 재생성됩니다.\n\n` +
                                    `※ 연차·인사 정보는 삭제되지 않고 그대로 유지되니 안심하세요.`
                                );
                            }
                            throw createErr;
                        }
                        await secondaryApp.auth().signOut();
                        await db.collection('users').doc(email).update({ tempPw: '123456', authStatus: 'success' });
                        setUploadMsg(`✅ [${staff.name}] 초기 비밀번호(123456)로 초기화 완료!`);
                        setTimeout(() => setUploadMsg(''), 5000);
                    } catch (err) {
                        setUploadMsg('');
                        showAlert('❌ 초기화 실패: ' + err.message);
                    }
                });
            };

            const handleBatchCreateAuth = () => {
                showConfirm("현재 등록된 모든 직원의 계정을 'yg+휴대폰뒤4자리' (비밀번호: 123456) 형식으로 일괄 생성하시겠습니까?\n\n※ 중복된 전화번호는 자동으로 넘버링(yg1234_1)되어 생성됩니다.", async () => {
                    setUploadMsg('계정 생성 중입니다. 조금만 기다려주세요...');
                    try {
                        const secondaryApp = getSecondaryApp();
                        const assignedEmails = new Set(staffList.map(s => s.id));
                        let count = 0;
                        for (const staff of activeStaffList) {
                            if (staff.authStatus === 'success') continue;
                            try { await issueAccount(staff, secondaryApp, assignedEmails); count++; } catch (e) { console.error('Auth Error:', e); }
                            await new Promise(r => setTimeout(r, 500));
                        }
                        await secondaryApp.auth().signOut();
                        setUploadMsg(`✅ ${count}명 신규 계정 발급 완료!`); setTimeout(() => setUploadMsg(''), 5000);
                    } catch (err) { setUploadMsg(`❌ 오류: ${err.message}`); }
                });
            };

            return (
                <div className="space-y-6">
                    {editingStaff && <EditStaffModal staff={editingStaff} onClose={() => setEditingStaff(null)} showAlert={showAlert} />}
                    {viewingStaff && <StaffDetailModal staff={viewingStaff} onClose={() => setViewingStaff(null)} />}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto justify-between"><div><h3 className="font-bold text-lg text-slate-800">직원 명부 관리</h3><p className="text-xs text-slate-500">총 {processedStaffList.length}명 ({showResignedToo ? '퇴사자 포함' : '퇴사자 제외'})</p></div></div>
                        <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                            <div className="relative flex items-center w-full md:w-auto gap-1">
                                <div className="relative group flex-1 md:flex-none"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500"><Icons.Search /></div><input type="text" placeholder="이름 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-48 pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" /></div>
                                <button onClick={handleResetFilters} className="p-2.5 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition border border-slate-200" title="초기화"><Icons.Refresh /></button>
                            </div>
                            <label className="flex items-center justify-center gap-2 cursor-pointer bg-red-50 px-3 py-2 rounded-xl border border-red-100 hover:bg-red-100 transition shadow-sm"><input type="checkbox" checked={showUnregisteredOnly} onChange={(e) => setShowUnregisteredOnly(e.target.checked)} /><span className="text-xs font-bold text-red-600 whitespace-nowrap">미발급 직원만</span></label>
                            <label className="flex items-center justify-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-100 transition shadow-sm" title="퇴사 처리된 직원을 목록에 함께 표시하여 '재직 복구'할 수 있습니다."><input type="checkbox" checked={showResignedToo} onChange={(e) => setShowResignedToo(e.target.checked)} /><span className="text-xs font-bold text-slate-600 whitespace-nowrap">퇴사자 포함 보기</span></label>
                            {selectedIds.size > 0 && (<button onClick={handleBulkDelete} className="flex-1 md:flex-none bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-600 transition flex justify-center items-center gap-2 animate-fade-in shadow-lg shadow-red-200"><Icons.Trash /> 선택 삭제 ({selectedIds.size})</button>)}
                            {uploadMsg && <span className="w-full md:w-auto text-sm font-bold text-blue-600 animate-pulse text-center bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200">{uploadMsg}</span>}
                            <button onClick={handleBatchCreateAuth} className="flex-1 md:flex-none bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 transition flex justify-center items-center gap-2" title="선택된 항목과 무관하게 모든 직원에게 계정을 발급합니다"><Icons.Users /> 일괄 계정 발급</button>
                            <button onClick={handleResetAuth} className="flex-1 md:flex-none bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-800 transition flex justify-center items-center gap-2" title="모든 직원의 계정 상태를 미발급으로 초기화합니다."><Icons.Refresh /> 전체 발급 초기화</button>
                            <button onClick={handleDownloadAccountInfo} className="flex-1 md:flex-none bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-teal-700 transition flex justify-center items-center gap-2" title="직원들에게 안내할 수 있는 계정 정보 엑셀 파일을 다운로드합니다."><Icons.Download /> 계정 정보 다운</button>
                            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" /><button onClick={() => fileInputRef.current.click()} className="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-green-700 transition flex justify-center items-center gap-2"><Icons.Upload /> 엑셀 업로드</button>
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap md:whitespace-normal">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4 w-12 text-center"><input type="checkbox" checked={processedStaffList.length > 0 && selectedIds.size === processedStaffList.length} onChange={handleSelectAll} /></th>
                                    <th className="p-4 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('name')}><div className="flex items-center">이름 (상세보기) <SortIcon sortConfig={sortConfig} columnKey="name" /></div></th>
                                    <th className="p-4 text-center text-blue-600">발생(시간)</th><th className="p-4 text-center text-red-500">사용(시간)</th>
                                    <th className="p-4 text-center text-green-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('remaining')}><div className="flex items-center justify-center">잔여(시간) <SortIcon sortConfig={sortConfig} columnKey="remaining" /></div></th>
                                    <th className="p-4 text-center bg-slate-100">계정 상태</th><th className="p-4 text-center w-36">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {processedStaffList.map((staff) => {
                                    const isDateError = !staff.joinDate || staff.joinDate.length < 8;
                                    const isRes = staff.status === 'resigned' || !!(staff.resignDate && String(staff.resignDate).trim());
                                    return (
                                        <tr key={staff.id} className={`hover:bg-slate-50 transition ${selectedIds.has(staff.id) ? 'bg-blue-50/50' : ''} ${isRes ? 'bg-slate-50/60' : ''}`}>
                                            <td className="p-4 text-center"><input type="checkbox" checked={selectedIds.has(staff.id)} onChange={() => handleSelectOne(staff.id)} /></td>
                                            <td className="p-4 font-bold text-blue-600 cursor-pointer hover:underline" onClick={() => setViewingStaff(staff)}>{staff.name} {isRes ? <span className="text-[10px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded font-bold ml-1">퇴사</span> : <span className="text-slate-400 text-xs font-normal ml-1">click</span>}</td>
                                            <td className="p-4 text-center font-bold text-blue-600">{isDateError ? <span className="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">입사일 확인</span> : <>{fmt(staff.totalHours)}h <span className="text-xs font-normal text-slate-400">({staff.totalDays}일)</span></>}</td>
                                            <td className="p-4 text-center text-slate-400">{fmt(staff.usedHours)}h <span className="text-xs font-normal text-slate-400">({staff.usedDays}일)</span></td>
                                            <td className="p-4 text-center font-bold text-green-600">{fmt(staff.remainingHours)}h <span className="text-xs font-normal text-slate-400">({staff.remainingDays}일)</span></td>
                                            <td className="p-4 text-center bg-slate-50/30">
                                                {staff.authStatus === 'success' ? (<span className="bg-blue-50 text-blue-600 px-2 py-1.5 rounded-lg text-xs font-bold flex justify-center items-center gap-1 mx-auto w-max shadow-sm border border-blue-100"><Icons.CheckCircle /> 발급됨</span>) : (
                                                    <div className="flex flex-col items-center gap-1.5"><span className="bg-red-50 text-red-500 px-2 py-1 rounded text-[10px] font-bold animate-pulse border border-red-100 shadow-sm">미발급</span><button onClick={() => handleCreateSingleAuth(staff)} className="text-[11px] bg-slate-700 text-white px-2 py-1 rounded-md hover:bg-slate-800 transition w-full max-w-[70px] shadow-sm active:scale-95">개별 발급</button></div>
                                                )}
                                            </td>
                                            <td className="p-4 text-center"><div className="flex justify-center gap-2">{isRes && <button onClick={() => handleReactivate(staff)} title="재직 복구" className="p-2 bg-white border text-green-500 hover:bg-green-100 rounded-lg transition"><Icons.Refresh /></button>}<button onClick={() => setEditingStaff(staff)} title="정보 수정" className="p-2 bg-white border text-blue-500 hover:bg-blue-100 rounded-lg transition"><Icons.Edit /></button><button onClick={() => handleResetPassword(staff)} title="비밀번호 초기화 (123456)" className="p-2 bg-white border text-amber-500 hover:bg-amber-100 rounded-lg transition"><Icons.Key /></button><button onClick={() => handleDeleteOne(staff)} title="직원 삭제" className="p-2 bg-white border text-red-400 hover:bg-red-100 rounded-lg transition"><Icons.Trash /></button></div></td>
                                        </tr>
                                    );
                                })}
                                {processedStaffList.length === 0 && (<tr><td colSpan="7" className="p-12 text-center text-slate-400">데이터가 없습니다.</td></tr>)}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const ResignedStaffTab = ({ staffList, onOpenModal, onEditClick, onNameClick, showAlert, showConfirm }) => {
            const [isPastMode, setIsPastMode] = useState(false);
            const resignedFileInputRef = useRef(null);
            const resignedList = useMemo(() => staffList.filter(s => s.status === 'resigned' || (s.resignDate && String(s.resignDate).trim())), [staffList]);

            const handleResignedStaffUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        const { cols, startRow } = findColumns(jsonData, STAFF_NEEDS, 5);
                        const c = { name: cols.name ?? 0, birth: cols.birth ?? 1, phone: cols.phone ?? 2, join: cols.join ?? 3, work: cols.work ?? 4, resign: cols.resign ?? 5 };

                        const batch = db.batch(); let count = 0;
                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const name = String(row[c.name] || '').trim(); if (!name) continue;
                            const phoneRaw = row[c.phone] || '';
                            const joinDate = safeDateRecent(row[c.join]);
                            const leaveInfo = calculateAnnualLeave(joinDate);
                            const email = `${name}_${String(phoneRaw).trim().slice(-4)}@ygnurim.com`;
                            batch.set(db.collection('users').doc(email), { name, birth: safeDate(row[c.birth]), phone: phoneRaw, workHours: row[c.work] || '', joinDate, role: 'staff', tempPw: '123456', annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-', status: 'resigned', resignDate: safeDateRecent(row[c.resign]) || '', offDays: [0] }, { merge: true });
                            count++;
                        }
                        await batch.commit(); showAlert(`✅ 퇴사자 ${count}명 명부 등록 완료!`);
                    } catch (err) { showAlert('오류: ' + err.message); }
                };
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-orange-50 p-4 rounded-xl border border-orange-100 gap-4">
                        <div className="flex items-center gap-2 font-bold text-orange-800"><Icons.UserMinus /> 퇴사자 관리 모드</div>
                        <div className="flex flex-col md:flex-row items-stretch md:items-center gap-3 w-full md:w-auto">
                            <label className="flex items-center justify-center gap-2 cursor-pointer bg-white px-3 py-3 md:py-2 rounded-lg border border-orange-200 hover:bg-orange-100 transition"><input type="checkbox" checked={isPastMode} onChange={(e) => setIsPastMode(e.target.checked)} /><span className="text-sm font-bold text-orange-700">과년도 기록 보기</span></label>
                            <input type="file" ref={resignedFileInputRef} onChange={handleResignedStaffUpload} accept=".xlsx, .xls" className="hidden" />
                            <button onClick={() => resignedFileInputRef.current.click()} className="bg-orange-500 text-white px-4 py-3 md:py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-orange-600 transition shadow-lg shadow-orange-200"><Icons.Upload /> 퇴사자 명부 업로드</button>

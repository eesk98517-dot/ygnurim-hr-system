    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, Component } = React;
        const { createRoot } = ReactDOM;

        const SYSTEM_VERSION = "5.4.1";

        const firebaseConfig = {
            apiKey: "AIzaSyCs3xfpAkHbLMXLiIeSXT2Mj10T1avAb_w",
            authDomain: "ygnurim-attendance-management.firebaseapp.com",
            projectId: "ygnurim-attendance-management",
            storageBucket: "ygnurim-attendance-management.firebasestorage.app",
            messagingSenderId: "17124870776",
            appId: "1:17124870776:web:49839a4bfd982a65d4fb8d",
            measurementId: "G-EELTZ41FTR"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const safeParseFloat = (val) => { const num = parseFloat(val); return isNaN(num) ? 0 : num; };
        const fmt = (num) => { if (num === undefined || num === null || isNaN(num)) return '0'; return Number(Number(num).toFixed(2)); };
        const normalizeString = (str) => String(str || '').replace(/[\s\-\.\/]/g, '').trim();

        const compareVersions = (v1, v2) => {
            const p1 = String(v1).split('.').map(Number);
            const p2 = String(v2).split('.').map(Number);
            for (let i = 0; i < Math.max(p1.length, p2.length); i++) {
                const n1 = p1[i] || 0;
                const n2 = p2[i] || 0;
                if (n1 > n2) return 1;
                if (n1 < n2) return -1;
            }
            return 0;
        };

        const toLocalYMD = (date) => {
            if (!date || isNaN(date.getTime())) return '';
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const safeDate = (val) => {
            if (!val) return '';
            let str = String(val).trim().replace(/[\.\/]/g, '-');
            
            if (str.length === 6 && !isNaN(str) && !str.includes('-')) {
                let y = parseInt(str.substring(0,2));
                y = y > 50 ? 1900 + y : 2000 + y;
                return `${y}-${str.substring(2,4)}-${str.substring(4,6)}`;
            }
            if (str.length === 8 && !isNaN(str) && !str.includes('-')) {
                return `${str.substring(0,4)}-${str.substring(4,6)}-${str.substring(6,8)}`; 
            }

            const parts = str.split('-');
            if (parts.length === 3) {
                let y = parts[0]; 
                if (y.length === 2) y = parseInt(y) > 50 ? '19' + y : '20' + y;
                const m = parts[1].padStart(2, '0'); 
                const d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            if (/^\d{5,6}$/.test(str)) {
                const n = parseInt(str);
                if (n > 20000 && n < 60000) {
                    try {
                        const date = new Date((n - 25569) * 86400 * 1000);
                        date.setHours(date.getHours() + 9);
                        return toLocalYMD(date);
                    } catch(e) { return str; }
                }
            }
            return str;
        };

        const calculateLeaveForYear = (rawJoinDate, targetYear) => {
            const joinDateStr = safeDate(rawJoinDate);
            if (!joinDateStr || joinDateStr.length < 10) return { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };
            
            const [jYear, jMonth, jDay] = joinDateStr.split('-').map(Number);
            const joinDate = new Date(jYear, jMonth - 1, jDay);
            
            if (isNaN(joinDate.getTime())) return { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };
            if (jYear > targetYear) return { total: 0, period: '입사 전', notJoined: true };

            let startDate = new Date(targetYear, jMonth - 1, jDay);
            let endDate = new Date(targetYear + 1, jMonth - 1, jDay);
            endDate.setDate(endDate.getDate() - 1);

            let yearsWorked = targetYear - jYear;
            let totalLeave = (yearsWorked < 1) ? 11 : (15 + Math.floor((yearsWorked - 1) / 2));
            if (totalLeave > 25) totalLeave = 25;
            
            const sStr = toLocalYMD(startDate);
            const eStr = toLocalYMD(endDate);

            return { total: totalLeave, period: `${sStr} ~ ${eStr}`, startDate: sStr, endDate: eStr, notJoined: false, yearsWorked };
        };

        const calculateAnnualLeave = (rawJoinDate) => {
            const joinDateStr = safeDate(rawJoinDate);
            if(!joinDateStr || joinDateStr.length < 10) return { total: 0, period: '-' };
            const today = new Date();
            let baseYear = today.getFullYear();
            
            const [jYear, jMonth, jDay] = joinDateStr.split('-').map(Number);
            const currentAnniversary = new Date(baseYear, jMonth - 1, jDay);
            
            if (today < currentAnniversary) baseYear = baseYear - 1;
            return calculateLeaveForYear(joinDateStr, baseYear);
        };

        const getPromotionStatus = (staff, checkYear, checkMonth) => {
            if (!staff.joinDate) return null;
            const [jYear, jMonth, jDay] = safeDate(staff.joinDate).split('-').map(Number);
            if (isNaN(jYear)) return null;

            for (let baseYear = checkYear - 1; baseYear <= checkYear; baseYear++) {
                if (baseYear < jYear) continue;

                const leaveInfo = calculateLeaveForYear(staff.joinDate, baseYear);
                if (leaveInfo.notJoined) continue;

                const [eYear, eMonth, eDay] = leaveInfo.endDate.split('-').map(Number);
                const endDate = new Date(eYear, eMonth - 1, eDay);

                if (leaveInfo.yearsWorked < 1) {
                    const joinDate = new Date(jYear, jMonth - 1, jDay);
                    const oneYearDate = new Date(joinDate.getFullYear() + 1, joinDate.getMonth(), joinDate.getDate());
                    const notifyDate = new Date(oneYearDate);
                    notifyDate.setMonth(notifyDate.getMonth() - 3);

                    if (notifyDate.getFullYear() === checkYear && (notifyDate.getMonth() + 1) === checkMonth) {
                        return { type: '1년미만 1차', msg: '1년 도래 3개월 전 (촉진 필요)', color: 'bg-purple-100 text-purple-700', leaveInfo, baseYear };
                    }
                } else {
                    const notify1Date = new Date(endDate); notify1Date.setMonth(notify1Date.getMonth() - 6);
                    const notify2Date = new Date(endDate); notify2Date.setMonth(notify2Date.getMonth() - 2);

                    if (notify1Date.getFullYear() === checkYear && (notify1Date.getMonth() + 1) === checkMonth) {
                        return { type: '1차 촉진', msg: '만료 6개월 전', color: 'bg-blue-100 text-blue-700', leaveInfo, baseYear };
                    }
                    if (notify2Date.getFullYear() === checkYear && (notify2Date.getMonth() + 1) === checkMonth) {
                        return { type: '2차 촉진', msg: '만료 2개월 전', color: 'bg-red-100 text-red-700', leaveInfo, baseYear };
                    }
                }
            }
            return null;
        };

        const Icons = {

            User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,

            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

        const CustomAlertModal = ({ msg, onClose }) => (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[9999] animate-fade-in p-4 backdrop-blur-sm">
                <div className="bg-white p-6 rounded-2xl shadow-2xl min-w-[300px] max-w-sm text-center">
                    <div className="text-blue-500 mb-4 flex justify-center"><Icons.Info /></div>
                    <p className="text-slate-800 font-bold mb-6 whitespace-pre-wrap">{msg}</p>
                    <button onClick={onClose} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">확인</button>

        const CustomConfirmModal = ({ msg, onConfirm, onClose }) => (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[9999] animate-fade-in p-4 backdrop-blur-sm">

                    <div className="flex gap-3">

                    </div>

        const AdminNameModal = ({ onSave }) => {
            const [name, setName] = useState('');
            return (
                <div className="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-[300] animate-fade-in backdrop-blur-sm px-4">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md relative text-center border-4 border-blue-500">
                        <div className="text-blue-500 mb-4 flex justify-center scale-125"><Icons.User /></div>
                        <h3 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">관리자 식별</h3>
                        <p className="text-slate-500 font-bold mb-6 text-sm leading-relaxed">공용 관리자 계정을 사용 중입니다.<br/>작업 이력에 남길 성함을 입력해주세요.</p>
                        <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl font-bold text-center mb-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition" placeholder="예: 홍길동 대리" />
                        <button onClick={() => name.trim() && onSave(name.trim())} className={`w-full py-4 rounded-2xl font-black transition shadow-lg text-sm ${name.trim() ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-blue-200' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            설정 완료

        };

        const VersionAlertModal = ({ onClose }) => (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] animate-fade-in backdrop-blur-md px-4">
                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md relative border-4 border-blue-500">

                    <h3 className="text-xl md:text-2xl font-black text-slate-800 text-center mb-2 font-sans">양지누림 기능 고도화</h3>
                    <p className="text-center text-blue-600 font-bold mb-6">v{SYSTEM_VERSION} 업데이트 배포</p>
                    <div className="bg-slate-50 p-4 rounded-2xl mb-6 space-y-2 text-xs md:text-sm text-slate-600 border border-slate-100 font-medium">
                        <p className="text-blue-600 font-bold">🌟 <b>스마트 지정일 자동 배치 & 휴무일 설정 도입</b></p>
                        <p>✅ <b>휴무일 반영:</b> 통보서 지정 시 직원의 휴무일과 주말을 피하여 날짜가 선택됩니다.</p>
                        <p>✅ <b>랜덤 배치:</b> 지정일자가 연달아 붙지 않고, 기간 내에서 띄엄띄엄 무작위 추출됩니다.</p>

                    <button onClick={onClose} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-200 uppercase tracking-widest text-sm">확인했습니다</button>

        const ForceUpdateModal = () => (
            <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-[200] animate-fade-in backdrop-blur-md px-4">
                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md relative border-4 border-orange-500 text-center">
                    <div className="text-orange-500 mb-4 flex justify-center scale-150"><Icons.Refresh /></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 mb-2">새로운 업데이트 발견</h3>
                    <p className="text-slate-600 font-bold mb-6 text-sm">관리자가 시스템을 새 버전으로 업데이트했습니다.<br/>안정적인 데이터 처리를 위해 새로고침 해주세요.</p>
                    <button onClick={() => window.location.reload(true)} className="w-full bg-orange-500 text-white py-4 rounded-2xl font-black hover:bg-orange-600 transition shadow-lg shadow-orange-200 text-sm flex items-center justify-center gap-2">
                        <Icons.Refresh /> 지금 새로고침
                    </button>
                </div>
            </div>
        );

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-center"><h2 className="text-red-600 font-bold">오류가 발생했습니다</h2><p className="text-sm">{this.state.error?.message}</p><button onClick={()=>window.location.reload()} className="bg-slate-800 text-white px-4 py-2 rounded mt-4">새로고침</button></div>;
                }
                return this.props.children;
            }
        }

        const Login = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const handleLogin = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                let email = id === 'ygnurim' ? 'admin@ygnurim.com' : (id.includes('@') ? id : `${id}@ygnurim.com`);
                try {
                    await auth.signInWithEmailAndPassword(email, pw);
                    const userDoc = await db.collection('users').doc(email).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        onLogin(userData.role === 'admin' ? { ...userData, role: 'admin', name: '관리자', email } : { ...userData, email });
                    } else onLogin({ role: 'staff', name: id, email });
                } catch (err) { setError('로그인 실패: 정보를 확인해주세요.'); } finally { setLoading(false); }
            };
            return (
                <div className="flex h-screen items-center justify-center bg-slate-100 p-4">
                    <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">
                        <div className="text-center mb-8">
                            <img src="logo.png" alt="사단법인 장애인의 양지누림" className="h-16 mx-auto mb-4 object-contain" onError={(e) => { e.target.onerror = null; e.target.style.display='none'; }} />
                            <p className="text-slate-500 font-bold mb-1">연차 관리 시스템</p>
                            <span className="text-[10px] bg-blue-50 text-blue-500 px-2 py-1 rounded font-bold uppercase">Official v{SYSTEM_VERSION}</span>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div><label className="block text-sm font-bold text-slate-700 mb-2">아이디 (이메일)</label><input type="text" value={id} onChange={(e)=>setId(e.target.value)} className="w-full px-4 py-3 border rounded-xl" placeholder="yg+뒷자리 (직원) / ygnurim (관리자)" required /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-2">비밀번호</label><input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} className="w-full px-4 py-3 border rounded-xl" required /></div>
                            {error && <p className="text-red-500 text-xs text-center">{error}</p>}
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition disabled:opacity-50">{loading ? '로그인...' : '로그인 하기'}</button>
                        </form>
                    </div>
                </div>
            );
        };

        const StaffDetailModal = ({ staff, onClose }) => {
            if (!staff) return null;
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <div className="text-center mb-6">
                            <div className="w-20 h-20 bg-blue-50 rounded-full mx-auto flex items-center justify-center mb-3"><span className="text-3xl font-black text-blue-600">{(staff.name || '?')[0]}</span></div>
                            <h3 className="text-2xl font-bold text-slate-800">{staff.name}</h3><p className="text-sm text-slate-500 font-medium">{staff.resignDate ? '퇴사자 정보' : '상세 정보'}</p>
                        </div>
                        <div className="space-y-4">
                            <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">생년월일</span><span className="text-sm font-bold text-slate-800">{safeDate(staff.birth) || '-'}</span></div>
                            <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">휴대폰</span><span className="text-sm font-bold text-slate-800">{staff.phone || '-'}</span></div>
                            <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">입사일</span><span className="text-sm font-bold text-slate-800">{safeDate(staff.joinDate) || '-'}</span></div>
                            <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">근무시간</span><span className="text-sm font-bold text-blue-600">{staff.workHours || 8}시간</span></div>
                            <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span className="text-xs font-bold text-slate-500">고정 휴무일</span><span className="text-sm font-bold text-red-500">{(staff.offDays || [0]).map(d => ['일','월','화','수','목','금','토'][d]).join(', ')}요일</span></div>
                            {staff.resignDate && <div className="flex justify-between p-3 bg-red-50 rounded-xl border border-red-100"><span className="text-xs font-bold text-red-500">퇴사일</span><span className="text-sm font-bold text-red-600">{safeDate(staff.resignDate)}</span></div>}
                        </div>
                        <button type="button" onClick={onClose} className="w-full mt-6 bg-slate-800 text-white py-3 rounded-xl text-sm font-bold hover:bg-slate-700 transition">닫기</button>
                    </div>
                </div>
            );
        };

        const EditStaffModal = ({ staff, onClose, showAlert }) => {
            const [formData, setFormData] = useState({ ...staff });
            const [msg, setMsg] = useState('');

            const WEEK_DAYS = [
                { label: '일', value: 0 }, { label: '월', value: 1 }, { label: '화', value: 2 },
                { label: '수', value: 3 }, { label: '목', value: 4 }, { label: '금', value: 5 }, { label: '토', value: 6 }
            ];

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
            
            const handleOffDayChange = (val) => {
                let currentOffDays = formData.offDays || [0];
                if (currentOffDays.includes(val)) {
                    currentOffDays = currentOffDays.filter(d => d !== val);
                    if (currentOffDays.length === 0) currentOffDays = [val]; 
                } else {
                    currentOffDays = [...currentOffDays, val];
                }
                setFormData(prev => ({ ...prev, offDays: currentOffDays }));
            };

            const handleSave = async (e) => {
                e.preventDefault();
                setMsg('저장 중...');
                try {
                    let updates = { ...formData };
                    updates.joinDate = safeDate(formData.joinDate);
                    updates.birth = safeDate(formData.birth);
                    
                    if (!updates.offDays || updates.offDays.length === 0) {
                        updates.offDays = [0];
                    }

                    if (updates.joinDate !== staff.joinDate) {
                        const leaveInfo = calculateAnnualLeave(updates.joinDate);
                        updates.annualLeaveTotal = leaveInfo.total;
                        updates.annualLeavePeriod = leaveInfo.period;
                        
                        const totalUsedHours = (staff.leaveHistory || []).reduce((acc, curr) => {
                            if (curr.date >= leaveInfo.startDate && curr.date <= leaveInfo.endDate) return acc + (safeParseFloat(curr.days) || 0);
                            return acc;
                        }, 0);
                        updates.annualLeaveUsed = totalUsedHours;
                    }
                    if (formData.resignDate && formData.resignDate.trim() !== "") {
                        updates.resignDate = safeDate(formData.resignDate);
                        updates.status = 'resigned';
                    }
                    
                    await db.collection('users').doc(staff.id).update(updates);
                    setMsg('✅ 수정 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 1000);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">직원 정보 수정</h3>
                        <form onSubmit={handleSave} className="space-y-4">
                            <div><label className="block text-xs font-bold text-slate-500 mb-1">이름</label><input type="text" name="name" value={formData.name || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" required /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="block text-xs font-bold text-slate-500 mb-1">일일 근무시간</label><input type="text" name="workHours" value={formData.workHours || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" /></div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-1">휴대폰번호</label><input type="text" name="phone" value={formData.phone || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" /></div>
                            </div>
                            
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-2">고정 휴무일 (다중 선택 가능)</label>
                                <div className="flex gap-2 flex-wrap justify-between">
                                    {WEEK_DAYS.map(day => (
                                        <label key={day.value} className={`flex-1 text-center py-2 rounded-lg border text-sm cursor-pointer transition select-none ${(formData.offDays || [0]).includes(day.value) ? 'bg-red-50 border-red-200 text-red-600 font-bold shadow-inner' : 'bg-white text-slate-400 hover:bg-slate-50'}`}>
                                            <input type="checkbox" className="hidden" checked={(formData.offDays || [0]).includes(day.value)} onChange={() => handleOffDayChange(day.value)} />
                                            {day.label}
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div><label className="block text-xs font-bold text-slate-500 mb-1">입사일</label><input type="date" name="joinDate" value={safeDate(formData.joinDate) || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" required /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-1">생년월일</label><input type="text" name="birth" value={formData.birth || ''} onChange={handleChange} className="w-full border rounded-xl p-3 text-sm outline-none" placeholder="YYYY-MM-DD" /></div>
                            <div><label className="block text-xs font-bold text-red-500 mb-1">퇴사일 (선택)</label><input type="date" name="resignDate" value={safeDate(formData.resignDate) || ''} onChange={handleChange} className="w-full border border-red-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-red-200" /></div>
                            
                            <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 mt-2">수정 내용 저장</button>
                            {msg && <p className="text-xs text-center font-bold text-blue-600">{msg}</p>}
                        </form>
                    </div>
                </div>
            );
        };

        const MonthlyReportModal = ({ staffList, onClose }) => {
            const todayStr = toLocalYMD(new Date());
            const [targetMonth, setTargetMonth] = useState(todayStr.substring(0, 7)); // YYYY-MM

            const reportData = useMemo(() => {
                return staffList.map(staff => {
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const monthlyLeaves = (staff.leaveHistory || []).filter(h => h.date && h.date.startsWith(targetMonth));
                    const usedHours = monthlyLeaves.reduce((sum, h) => sum + (safeParseFloat(h.days) || 0), 0);
                    const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                    
                    monthlyLeaves.sort((a, b) => a.date.localeCompare(b.date));
                    const detailText = monthlyLeaves.map(h => `${h.date.substring(8,10)}일(${fmt(h.days)}h)`).join(', ');

                    return {
                        ...staff,
                        usedHours,
                        usedDays,
                        detailText,
                        hasLeave: monthlyLeaves.length > 0
                    };
                });
            }, [staffList, targetMonth]);

            const totalMonthHours = reportData.reduce((sum, s) => sum + s.usedHours, 0);

            const handleDownload = () => {
                const wsData = [
                    [`양지누림 ${targetMonth} 월간 연차 사용 현황`],
                    [`조회 기준: ${targetMonth} / 출력 일자: ${new Date().toLocaleDateString()}`],
                    [],
                    ['이름', '입사일', '일일 근무', '해당월 사용(일)', '해당월 사용(시간)', '사용 내역 상세(일자 및 시간)']
                ];

                reportData.forEach(s => {
                    wsData.push([
                        s.name,
                        safeDate(s.joinDate),
                        `${s.workHours || 8}시간`,
                        s.usedDays,
                        s.usedHours,
                        s.detailText || '-'
                    ]);
                });

                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 12 }, { wch: 15 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 45 }];
                if (!ws['!merges']) ws['!merges'] = [];
                ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } });

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "월간사용내역");
                XLSX.writeFile(wb, `양지누림_월간연차보고서_${targetMonth.replace('-', '')}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[300] animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]">
                        <button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b pb-4">
                            <div>
                                <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.FileText /> 월간 연차 사용내역 조회</h3>
                                <p className="text-sm text-slate-500 font-bold mt-1">특정 월을 선택하여 해당 월에 사용된 연차만 집계합니다.</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <input type="month" value={targetMonth} onChange={e => setTargetMonth(e.target.value)} className="border-2 border-blue-200 rounded-xl px-4 py-2 text-sm font-bold text-blue-700 outline-none focus:border-blue-500" />
                                <button onClick={handleDownload} className="bg-teal-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-teal-700 transition shadow-lg shadow-teal-200"><Icons.Download /> 엑셀 다운로드</button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl bg-slate-50 custom-scrollbar">
                            <table className="w-full text-sm text-left whitespace-nowrap">
                                <thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 z-10 shadow-sm">
                                    <tr>
                                        <th className="p-3">이름</th>
                                        <th className="p-3 text-center">입사일</th>
                                        <th className="p-3 text-center text-blue-600">해당월 사용(일)</th>
                                        <th className="p-3 text-center text-red-500">해당월 사용(시간)</th>
                                        <th className="p-3 w-full">사용 내역 상세</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200 bg-white">
                                    {reportData.filter(d => d.hasLeave).map(s => (
                                        <tr key={s.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-800">{s.name}</td>
                                            <td className="p-3 text-center text-slate-500">{safeDate(s.joinDate)}</td>
                                            <td className="p-3 text-center font-bold text-blue-600">{s.usedDays}일</td>
                                            <td className="p-3 text-center font-bold text-red-500">{s.usedHours}h</td>
                                            <td className="p-3 text-xs text-slate-600">{s.detailText}</td>
                                        </tr>
                                    ))}
                                    {reportData.filter(d => d.hasLeave).length === 0 && (
                                        <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">해당 월에 연차를 사용한 직원이 없습니다.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-4 flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span className="text-sm font-bold text-slate-500">해당월 총 사용 시간 합계:</span>
                            <span className="text-lg font-black text-red-500">{totalMonthHours}h</span>
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarView = ({ staffList }) => {
            const [currentDate, setCurrentDate] = useState(new Date());

            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const goToday = () => setCurrentDate(new Date());

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const startOfMonth = new Date(year, month, 1);
            const endOfMonth = new Date(year, month + 1, 0);
            const startDay = startOfMonth.getDay(); 
            const daysInMonth = endOfMonth.getDate();

            const leaveMap = useMemo(() => {
                const map = {};
                staffList.forEach(staff => {
                    (staff.leaveHistory || []).forEach(leave => {
                        if (leave.date && leave.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
                            if (!map[leave.date]) map[leave.date] = [];
                            map[leave.date].push({ name: staff.name, type: leave.type });
                        }
                    });
                });
                return map;
            }, [staffList, year, month]);

            const weeks = [];
            let currWeek = new Array(startDay).fill(null);
            for (let i = 1; i <= daysInMonth; i++) {
                currWeek.push(i);
                if (currWeek.length === 7) {
                    weeks.push(currWeek);
                    currWeek = [];
                }
            }
            if (currWeek.length > 0) {
                while (currWeek.length < 7) currWeek.push(null);
                weeks.push(currWeek);
            }

            const todayStr = toLocalYMD(new Date());

            return (
                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6 mt-6 animate-fade-in overflow-hidden flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm md:text-base"><Icons.Calendar /> 전사 휴가 캘린더</h3>
                        <div className="flex items-center gap-1 md:gap-2">
                            <button type="button" onClick={prevMonth} className="p-1 md:p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronLeft /></button>
                            <span className="font-black text-slate-800 w-20 md:w-24 text-center text-sm md:text-base">{year}년 {month + 1}월</span>
                            <button type="button" onClick={nextMonth} className="p-1 md:p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronRight /></button>
                            <button type="button" onClick={goToday} className="text-[10px] md:text-xs font-bold text-blue-600 bg-blue-50 px-2 md:px-3 py-1.5 rounded-lg ml-1 md:ml-2 hover:bg-blue-100 transition shadow-sm border border-blue-100">오늘</button>
                        </div>
                    </div>
                    <div className="w-full overflow-x-auto no-scrollbar">
                        <div className="min-w-[700px] border border-slate-200 rounded-lg overflow-hidden bg-slate-200 gap-px grid grid-cols-7">
                            {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
                                <div key={d} className={`bg-slate-50 py-2 text-center text-xs font-bold tracking-widest ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-600'}`}>{d}</div>
                            ))}
                            {weeks.flat().map((d, idx) => {
                                const dateStr = d ? `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` : '';
                                const leaves = d ? (leaveMap[dateStr] || []) : [];
                                const isToday = dateStr === todayStr;
                                return (
                                    <div key={idx} className={`bg-white h-[130px] p-1.5 flex flex-col overflow-hidden transition-colors ${d?'hover:bg-slate-50/50':'opacity-30 pointer-events-none'}`}>
                                        <div className={`text-[10px] md:text-xs font-bold p-1 flex justify-center items-center w-6 h-6 rounded-full mx-auto md:mx-0 ${isToday?'bg-blue-600 text-white shadow-md':idx%7===0?'text-red-500':idx%7===6?'text-blue-500':'text-slate-700'}`}>
                                            {d || ''}
                                        </div>
                                        <div className="flex-1 overflow-y-auto pr-0.5 space-y-1 mt-1 custom-scrollbar">
                                            {leaves.map((l, i) => (
                                                <div key={i} className={`text-[10px] md:text-[11px] px-1.5 py-0.5 rounded-md truncate font-bold shadow-sm ${l.type.includes('반차') || l.type.includes('시간')?'bg-orange-50 text-orange-700 border border-orange-200':'bg-blue-50 text-blue-700 border border-blue-200'}`} title={`${l.name} (${l.type})`}>
                                                    {l.name} <span className="font-normal opacity-75 ml-0.5 text-[9px] md:text-[10px] tracking-tighter">({l.type})</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const PersonalCalendarModal = ({ staff, onClose, onOpenModal }) => {
            const [currentDate, setCurrentDate] = useState(new Date());

            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const goToday = () => setCurrentDate(new Date());

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const startOfMonth = new Date(year, month, 1);
            const endOfMonth = new Date(year, month + 1, 0);
            const startDay = startOfMonth.getDay(); 
            const daysInMonth = endOfMonth.getDate();

            const leaveMap = useMemo(() => {
                const map = {};
                if (staff && staff.leaveHistory) {
                    staff.leaveHistory.forEach(leave => {
                        if (leave.date && leave.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
                            if (!map[leave.date]) map[leave.date] = [];
                            map[leave.date].push(leave);
                        }
                    });
                }
                return map;
            }, [staff, year, month]);

            const weeks = [];
            let currWeek = new Array(startDay).fill(null);
            for (let i = 1; i <= daysInMonth; i++) {
                currWeek.push(i);
                if (currWeek.length === 7) {
                    weeks.push(currWeek);
                    currWeek = [];
                }
            }
            if (currWeek.length > 0) {
                while (currWeek.length < 7) currWeek.push(null);
                weeks.push(currWeek);
            }

            const todayStr = toLocalYMD(new Date());

            if (!staff) return null;

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[250] animate-fade-in backdrop-blur-sm p-4">
                    <div className="bg-white p-4 md:p-6 rounded-3xl shadow-2xl w-full max-w-2xl relative border border-slate-200">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2"><Icons.X /></button>
                        
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4 border-slate-100">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-black shadow-inner">
                                    {(staff.name || '?')[0]}
                                </div>
                                <div>
                                    <h3 className="font-black text-slate-800 text-lg flex items-center gap-2">{staff.name} <span className="text-sm font-bold text-slate-500">개인 연차 캘린더</span></h3>
                                    <p className="text-[11px] text-slate-400 font-medium">입사일: {safeDate(staff.joinDate)} (일 {staff.workHours || 8}h 근무)</p>
                                </div>
                                {onOpenModal && (
                                    <button 
                                        type="button" 
                                        onClick={() => { onClose(); onOpenModal(staff.id); }} 
                                        className="ml-2 bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-1 active:scale-95"
                                        title={`${staff.name} 연차 바로 등록`}
                                    >
                                        <Icons.Plus /> 연차 등록
                                    </button>
                                )}
                            </div>
                            <div className="flex items-center gap-1 bg-slate-50 p-1.5 rounded-xl border border-slate-100 shadow-sm">
                                <button type="button" onClick={prevMonth} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronLeft /></button>
                                <span className="font-black text-slate-800 w-24 text-center text-sm">{year}년 {month + 1}월</span>
                                <button type="button" onClick={nextMonth} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronRight /></button>
                                <button type="button" onClick={goToday} className="text-xs font-bold text-blue-600 bg-white border border-blue-100 px-3 py-1.5 rounded-lg ml-2 hover:bg-blue-50 transition shadow-sm">오늘</button>
                            </div>
                        </div>

                        <div className="w-full overflow-hidden border border-slate-200 rounded-xl bg-slate-200 gap-px grid grid-cols-7 shadow-sm">
                            {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
                                <div key={d} className={`bg-slate-50 py-2 text-center text-xs font-bold ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-600'}`}>{d}</div>
                            ))}
                            {weeks.flat().map((d, idx) => {
                                const dateStr = d ? `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` : '';
                                const leaves = d ? (leaveMap[dateStr] || []) : [];
                                const isToday = dateStr === todayStr;
                                return (
                                    <div key={idx} className={`bg-white h-20 md:h-24 p-1.5 flex flex-col overflow-hidden transition-colors ${d?'hover:bg-slate-50':'opacity-50 pointer-events-none'}`}>
                                        <div className={`text-[10px] md:text-xs font-bold p-1 flex justify-center items-center w-6 h-6 rounded-full ${isToday?'bg-blue-600 text-white shadow-md':idx%7===0?'text-red-500':idx%7===6?'text-blue-500':'text-slate-700'}`}>
                                            {d || ''}
                                        </div>
                                        <div className="flex-1 overflow-y-auto space-y-1 mt-1 custom-scrollbar">
                                            {leaves.map((l, i) => (
                                                <div key={i} className={`text-[10px] md:text-[11px] px-1.5 py-1 rounded-md leading-tight font-bold shadow-sm border ${l.type.includes('반차') || l.type.includes('시간') ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`} title={l.reason || l.type}>
                                                    {l.type}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const LeaveActionModal = ({ onClose, staffList, adminName, initialData = null, showAlert }) => {
            const isEdit = !!(initialData && initialData.id); 
            const [selectedStaffId, setSelectedStaffId] = useState(initialData?.staffId || '');
            
            const [staffSearch, setStaffSearch] = useState('');
            const [isStaffDropdownOpen, setIsStaffDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            const [dateMode, setDateMode] = useState('single'); 
            const [leaveDate, setLeaveDate] = useState(initialData?.date || toLocalYMD(new Date()));
            const [endDate, setEndDate] = useState(initialData?.date || toLocalYMD(new Date()));
            
            const [customDates, setCustomDates] = useState([]); 
            const [customDateInput, setCustomDateInput] = useState('');
            const [customYear, setCustomYear] = useState(new Date().getFullYear());

            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1'); 
            const [leaveHourValue, setLeaveHourValue] = useState(''); 
            const [reason, setReason] = useState(initialData?.reason || '');
            const [msg, setMsg] = useState('');

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsStaffDropdownOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => {
                if (initialData && staffList.length > 0) {
                    const staff = staffList.find(s => s.id === initialData.staffId);
                    if (staff) setStaffSearch(`${staff.name}`);
                }
            }, [initialData, staffList]);

            useEffect(() => {
                if (dateMode === 'multi') {
                    setInputType('day');
                    setLeaveDayType('1');
                }
            }, [dateMode]);

            useEffect(() => {
                if (initialData && isEdit) {
                    const days = safeParseFloat(initialData.days);
                    if (days === 1 || days === 0.5) { setInputType('day'); setLeaveDayType(String(days)); }
                    else { setInputType('hour'); setLeaveHourValue(String(days)); }
                }
            }, [initialData, isEdit]);

            const filteredStaffList = useMemo(() => {
                return staffList
                    .sort((a,b) => a.name.localeCompare(b.name))
                    .filter(s => s.name.toLowerCase().includes(staffSearch.toLowerCase()));
            }, [staffList, staffSearch]);

            const handleAddCustomDate = () => {
                if (!customDateInput.trim()) return;
                if (!selectedStaffId) { setMsg('❌ 먼저 상단에서 직원을 선택해주세요.'); return; }
                
                const staff = staffList.find(s => s.id === selectedStaffId);
                const dailyHours = staff ? (safeParseFloat(staff.workHours) || 8) : 8; 
                let deductHours = 0;
                
                if (inputType === 'day') {
                    deductHours = (leaveDayType === '1') ? dailyHours : dailyHours / 2;
                } else {
                    deductHours = safeParseFloat(leaveHourValue);
                    if (deductHours <= 0) { setMsg('❌ 시간을 올바르게 입력하세요.'); return; }
                }
                const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;
                
                const parts = customDateInput.split(/[, ]+/);
                const newParsedDates = [];

                parts.forEach(p => {
                    const s = p.trim();
                    if (!s) return;
                    let parsedDate = '';
                    
                    const matchFull = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})$/);
                    const matchMonthDay = s.match(/^(\d{1,2})[\.\-\/](\d{1,2})$/);
                    
                    if (matchFull) {
                        parsedDate = `${matchFull[1]}-${matchFull[2].padStart(2, '0')}-${matchFull[3].padStart(2, '0')}`;
                    } else if (matchMonthDay) {
                        parsedDate = `${customYear}-${matchMonthDay[1].padStart(2, '0')}-${matchMonthDay[2].padStart(2, '0')}`;
                    } else if (s.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        parsedDate = s; 
                    }
                    
                    if (parsedDate) {
                        if (!customDates.some(cd => cd.date === parsedDate)) {
                            newParsedDates.push({ date: parsedDate, type: typeText, deductHours });
                        }
                    }
                });

                if (newParsedDates.length > 0) {
                    const merged = [...customDates, ...newParsedDates].sort((a,b) => a.date.localeCompare(b.date));
                    setCustomDates(merged);
                    setCustomDateInput('');
                    setMsg('');
                } else {
                    setMsg('❌ 날짜 형식을 확인해주세요 (예: 4.1, 2026.5.21)');
                }
            };

            const validDates = useMemo(() => {
                if (dateMode === 'single') return [leaveDate];
                if (dateMode === 'custom') return customDates; 
                
                let dates = [];
                let curr = new Date(leaveDate);
                let last = new Date(endDate);
                if (curr > last) return []; 
                
                // [v5.4.0] 휴무일 필터링 적용 (다중 날짜 선택 시)
                const staff = staffList.find(s => s.id === selectedStaffId);
                const offDays = staff && staff.offDays ? staff.offDays : [0]; 

                while(curr <= last) {
                    const day = curr.getDay();
                    if(!offDays.includes(day)) { 
                        dates.push(toLocalYMD(curr));
                    }
                    curr.setDate(curr.getDate() + 1);
                }
                return dates;
            }, [leaveDate, endDate, customDates, dateMode, selectedStaffId, staffList]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedStaffId) { setMsg('❌ 직원을 검색하여 선택해주세요.'); return; }
                const staff = staffList.find(s => s.id === selectedStaffId);
                if (!staff) { setMsg('❌ 올바른 직원을 선택해주세요.'); return; }

                const dailyHours = safeParseFloat(staff.workHours) || 8; 
                let deductHours = 0;

                if (inputType === 'day') {
                    deductHours = (leaveDayType === '1') ? dailyHours : dailyHours / 2;
                } else {
                    deductHours = safeParseFloat(leaveHourValue);
                    if (deductHours <= 0) { setMsg('❌ 시간을 입력하세요.'); return; }
                }

                if ((dateMode === 'multi' || dateMode === 'custom') && validDates.length === 0) {
                    setMsg('❌ 선택된 날짜가 없습니다. (휴무일일 수 있습니다)'); return;
                }

                setMsg('처리 중...');
                try {
                    let newHistory = [...(staff.leaveHistory || [])];
                    const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;
                    
                    if (isEdit) {
                        const targetIdx = newHistory.findIndex(h => h.id === initialData.id);
                        if (targetIdx !== -1) {
                            newHistory[targetIdx] = { ...newHistory[targetIdx], date: safeDate(leaveDate), days: deductHours, type: typeText, reason, addedBy: adminName };
                        }
                    } else {
                        if (dateMode === 'custom') {
                            validDates.forEach((item, idx) => {
                                newHistory.push({
                                    id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, 
                                    date: safeDate(item.date), 
                                    days: item.deductHours, 
                                    type: item.type, 
                                    reason,
                                    addedBy: adminName,
                                    createdAt: new Date().toISOString()
                                });
                            });
                        } else {
                            validDates.forEach((d, idx) => {
                                newHistory.push({
                                    id: Date.now().toString() + Math.floor(Math.random() * 1000) + idx, 
                                    date: safeDate(d), 
                                    days: deductHours, 
                                    type: typeText, 
                                    reason,
                                    addedBy: adminName,
                                    createdAt: new Date().toISOString()
                                });
                            });
                        }
                    }

                    const currentInfo = calculateAnnualLeave(staff.joinDate);
                    const totalUsedHours = newHistory.reduce((acc, curr) => {
                        if (curr.date >= currentInfo.startDate && curr.date <= currentInfo.endDate) return acc + (safeParseFloat(curr.days) || 0);
                        return acc;
                    }, 0);

                    await db.collection('users').doc(selectedStaffId).update({ 
                        annualLeaveUsed: totalUsedHours, 
                        annualLeaveTotal: currentInfo.total,
                        annualLeavePeriod: currentInfo.period,
                        leaveHistory: newHistory 
                    });
                    setMsg('✅ 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 1000);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            const currentYearNum = new Date().getFullYear();
            const yearOptions = [currentYearNum + 1, currentYearNum, currentYearNum - 1, currentYearNum - 2, currentYearNum - 3, currentYearNum - 4];

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[500] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto pt-20">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative my-auto">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 text-lg">{isEdit ? '연차 수정' : '연차 등록'}</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            
                            <div className="relative" ref={dropdownRef}>
                                <label className="block text-xs font-bold text-slate-500 mb-1">직원 검색 및 선택</label>
                                <input 
                                    type="text" 
                                    className="w-full border rounded-xl p-3 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-100 transition" 
                                    placeholder={isEdit ? "" : "직원 이름 검색..."}
                                    value={staffSearch} 
                                    onChange={(e) => {
                                        setStaffSearch(e.target.value);
                                        setIsStaffDropdownOpen(true);
                                        setSelectedStaffId('');
                                    }} 
                                    onFocus={() => { if(!isEdit) setIsStaffDropdownOpen(true); }}
                                    disabled={isEdit} 
                                    required 
                                />
                                {isStaffDropdownOpen && !isEdit && (
                                    <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                        {filteredStaffList.length > 0 ? (
                                            filteredStaffList.map(s => (
                                                <div 
                                                    key={s.id} 
                                                    className="p-3 text-sm hover:bg-blue-50 cursor-pointer border-b last:border-b-0 border-slate-50"
                                                    onClick={() => {
                                                        setSelectedStaffId(s.id);
                                                        setStaffSearch(`${s.name}`);
                                                        setIsStaffDropdownOpen(false);
                                                    }}
                                                >
                                                    <span className="font-bold text-slate-800">{s.name}</span> <span className="text-slate-500 text-xs">(일 {s.workHours || 8}h)</span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="p-3 text-sm text-slate-400 text-center">검색 결과가 없습니다.</div>
                                        )}
                                    </div>
                                )}
                            </div>
                            
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <label className="block text-xs font-bold text-slate-700 mb-2">등록 단위 선택</label>
                                <div className={`flex gap-2 mb-2 ${dateMode === 'multi' ? 'opacity-50 pointer-events-none' : ''}`}>
                                    <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="day" checked={inputType === 'day'} onChange={() => setInputType('day')} className="hidden"/>일 단위</label>
                                    <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="hour" checked={inputType === 'hour'} onChange={() => setInputType('hour')} className="hidden"/>시간 단위</label>
                                </div>
                                {inputType === 'day' ? (
                                    <div className="flex gap-2">
                                        <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '1' ? 'bg-blue-50 border-blue-200 text-blue-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="1" checked={leaveDayType === '1'} onChange={() => setLeaveDayType('1')} className="hidden"/>연차 (1일)</label>
                                        <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '0.5' ? 'bg-orange-50 border-orange-200 text-orange-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="0.5" checked={leaveDayType === '0.5'} onChange={() => setLeaveDayType('0.5')} className="hidden"/>반차 (0.5일)</label>
                                    </div>
                                ) : (
                                    <div className="flex items-center gap-2"><input type="number" value={leaveHourValue} onChange={e => setLeaveHourValue(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center focus:ring-2 focus:ring-blue-100 bg-white" placeholder="시간 입력 (예: 2)" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>
                                )}
                            </div>

                            {!isEdit && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-2">날짜 입력 방식</label>
                                    <div className="flex bg-slate-100 p-1 rounded-xl mb-3">
                                        <button type="button" onClick={() => setDateMode('single')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'single' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>단일 날짜</button>
                                        <button type="button" onClick={() => setDateMode('multi')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'multi' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>기간 설정</button>
                                        <button type="button" onClick={() => setDateMode('custom')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'custom' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>지정일 선택</button>
                                    </div>
                                </div>
                            )}

                            {dateMode === 'single' && (
                                <div><label className="block text-xs font-bold text-slate-500 mb-1">날짜 선택</label><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" required /></div>
                            )}
                            
                            {dateMode === 'multi' && (
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <label className="block text-xs font-bold text-blue-600 mb-1">기간 선택 (직원 휴무일 자동 제외 / 연차 1일 단위 전용)</label>
                                    <div className="flex items-center gap-2">
                                        <input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required />
                                        <span className="text-slate-400 font-bold">~</span>
                                        <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required />
                                    </div>
                                </div>
                            )}

                            {dateMode === 'custom' && (
                                <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                    <label className="block text-xs font-bold text-purple-600 mb-1">지정일 추가 (위에서 선택한 단위로 개별 저장됩니다)</label>
                                    <div className="flex items-center gap-2 mb-3">
                                        <select value={customYear} onChange={e => setCustomYear(parseInt(e.target.value))} className="border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 bg-white font-bold text-purple-700">
                                            {yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}
                                        </select>
                                        <input type="text" placeholder="예: 4.1, 5.21" value={customDateInput} onChange={e => setCustomDateInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter') { e.preventDefault(); handleAddCustomDate(); } }} className="flex-1 border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200" />
                                        <button type="button" onClick={handleAddCustomDate} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 transition">추가</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {customDates.map(d => (
                                            <span key={d.date} className="bg-white border border-purple-200 text-purple-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm">
                                                {d.date} <span className="text-[10px] bg-purple-100 px-1 rounded">{d.type}</span>
                                                <button type="button" onClick={() => setCustomDates(customDates.filter(cd => cd.date !== d.date))} className="text-purple-400 hover:text-purple-600 p-0.5 rounded-full hover:bg-purple-50">
                                                    ✕
                                                </button>
                                            </span>
                                        ))}
                                        {customDates.length === 0 && <span className="text-xs text-purple-400 font-medium">추가된 날짜가 없습니다.</span>}
                                    </div>
                                    <p className="text-xs text-purple-500 font-bold mt-3 text-center bg-white py-1 rounded border border-purple-100">총 {customDates.length}일 등록 예정</p>
                                </div>
                            )}

                            <div><label className="block text-xs font-bold text-slate-500 mb-1">사유</label><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="사유 입력" /></div>
                            
                            <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">{isEdit ? '수정 내용 저장' : '연차 등록하기'}</button>
                            {msg && <p className="text-xs text-center font-bold text-red-500">{msg}</p>}
                        </form>
                    </div>
                </div>
            );
        };

        const PromotionTab = ({ staffList, showAlert }) => {
            const today = new Date();
            const [startMonth, setStartMonth] = useState(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            const [endMonth, setEndMonth] = useState(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

            const promotionList = useMemo(() => {
                const list = [];
                const [sY, sM] = startMonth.split('-').map(Number);
                const [eY, eM] = endMonth.split('-').map(Number);
                if (isNaN(sY) || isNaN(eY)) return list;

                const startVal = sY * 12 + sM;
                const endVal = eY * 12 + eM;

                staffList.forEach(staff => {
                    let foundStatus = null;
                    let targetDate = '';
                    
                    for (let val = startVal; val <= endVal; val++) {
                        const y = Math.floor((val - 1) / 12);
                        const m = ((val - 1) % 12) + 1;
                        const status = getPromotionStatus(staff, y, m);
                        if (status) {
                            foundStatus = status;
                            targetDate = `${y}년 ${m}월`;
                            break; 
                        }
                    }

                    if (foundStatus) {
                        const leaveInfo = foundStatus.leaveInfo;
                        const dailyHours = safeParseFloat(staff.workHours) || 8;
                        const totalDays = leaveInfo.total || 0;
                        const totalHours = totalDays * dailyHours;
                        
                        const activeHistory = (staff.leaveHistory || []).filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                        const usedHours = activeHistory.reduce((acc, cur) => acc + (safeParseFloat(cur.days) || 0), 0);
                        
                        const remainingHours = totalHours - usedHours;
                        const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                        const remainingDays = dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0;
                        
                        const promoPlanKey = 'promoPlan_' + foundStatus.baseYear;
                        
                        list.push({ 
                            ...staff, 
                            promoStatus: foundStatus, 
                            targetDate, 
                            leaveInfo, 
                            totalDays, 
                            usedDays, 
                            remainingDays,
                            promoPlanKey,
                            isPlanSubmitted: staff[promoPlanKey] || false
                        });
                    }
                });
                return list;
            }, [staffList, startMonth, endMonth]);

            const handleTogglePlan = async (staffId, promoPlanKey, currentVal) => {
                try {
                    await db.collection('users').doc(staffId).update({
                        [promoPlanKey]: !currentVal
                    });
                } catch(e) { showAlert("상태 업데이트 오류: " + e.message); }
            };

            const handleDownloadSignOK = () => {
                const targets = promotionList.filter(p => p.promoStatus.type.includes('1차'));
                if (targets.length === 0) { showAlert("해당 기간에 1차 촉진 대상자가 없습니다."); return; }
                const day = today.getDate();
                const excelData = targets.map(p => {
                    const [tYear, tMonth] = p.targetDate.replace('년 ', '-').replace('월', '').split('-').map(Number);
                    return {
                        "이메일 또는 휴대폰번호(필수)": p.phone || "", "이름(필수)": p.name || "", "남길말(선택)": "",
                        "연차 사용대상기간(양지누림)": p.leaveInfo.period || "", "발생연차(양지누림)": p.totalDays || 0,
                        "사용연차(양지누림)": p.usedDays, "미사용(양지누림)": p.remainingDays,
                        "연차유급휴가 발생일(양지누림)": p.leaveInfo.startDate, "성명(양지누림)": p.name || "",
                        "소속(양지누림)": "", "직위(양지누림)": "",
                        "연도(양지누림)-1": tYear, "월(양지누림)-1": tMonth, "일(양지누림)-1": day, 
                        "연도(양지누림)": tYear, "월(양지누림)": tMonth, "일(양지누림)": 20
                    };
                });
                const ws = XLSX.utils.json_to_sheet(excelData); const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "싸인오케이_대량발송");
                XLSX.writeFile(wb, `1차촉진_통보대상_${startMonth}_to_${endMonth}.xlsx`);
            };

            const getNotifyDate = (leaveInfo) => {
                if (!leaveInfo || !leaveInfo.endDate || leaveInfo.endDate === '') return new Date();
                const endDate = new Date(leaveInfo.endDate);
                if (leaveInfo.yearsWorked < 1) {
                    endDate.setMonth(endDate.getMonth() - 1);
                } else {
                    endDate.setMonth(endDate.getMonth() - 2);
                }
                return endDate;
            };

            // [v5.4.0] 지정일자(날짜) 스마트 랜덤 계산 엔진 (휴무일 완벽 배제)
            const generateDesignatedDates = (notifyDate, remainingDays, offDays = [0]) => {
                const dates = [];
                let current = new Date(notifyDate);
                current.setDate(current.getDate() + 7); // 통보일로부터 최소 7일 뒤부터 배정

                const validDatesPool = [];
                // 약 90일(3달) 정도의 여유 기간 안에서 유효한 근무일 풀(Pool) 생성
                for (let i = 0; i < 90; i++) {
                    const testDate = new Date(current);
                    testDate.setDate(testDate.getDate() + i);
                    
                    // 직원의 고정 휴무일(offDays)에 포함되지 않은 날만 풀에 담기
                    if (!offDays.includes(testDate.getDay())) {
                        validDatesPool.push(testDate);
                    }
                }

                // 배열 무작위 섞기 (Fisher-Yates Shuffle) - 날짜가 연달아 나오지 않게 랜덤화
                for (let i = validDatesPool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [validDatesPool[i], validDatesPool[j]] = [validDatesPool[j], validDatesPool[i]];
                }

                let daysToAssign = remainingDays;
                let selectedDates = [];

                // 필요한 만큼 랜덤 풀에서 뽑기
                for (let i = 0; i < validDatesPool.length && daysToAssign > 0; i++) {
                    const useAmount = daysToAssign >= 1 ? 1 : 0.5; // 남은게 0.5일이면 0.5만 배정
                    selectedDates.push({ dateObj: validDatesPool[i], days: useAmount });
                    daysToAssign -= useAmount;
                }

                // 뽑힌 랜덤 날짜들을 보기 좋게 오름차순(시간순) 정렬
                selectedDates.sort((a, b) => a.dateObj - b.dateObj);

                selectedDates.forEach(item => {
                    dates.push({
                        month: item.dateObj.getMonth() + 1,
                        date: item.dateObj.getDate(),
                        days: item.days
                    });
                });

                // 표 5줄 포맷 유지를 위해 빈칸 채우기
                while(dates.length < 5) {
                    dates.push({ month: '', date: '', days: '' });
                }
                return dates;
            };

            const handleDownloadNoticePdfZip = async () => {
                const unsubmittedList = promotionList.filter(p => !p.isPlanSubmitted && p.remainingDays > 0);
                if (unsubmittedList.length === 0) {
                    showAlert("계획서 미제출자(잔여 연차가 있는 직원)가 없습니다.");
                    return;
                }

                if (!window.html2pdf || !window.JSZip) {
                    showAlert("필요한 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
                    return;
                }

                setIsGeneratingPdf(true);

                try {
                    const zip = new JSZip();
                    const folderName = `사용시기지정통보서_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}`;
                    const folder = zip.folder(folderName);

                    for (const staff of unsubmittedList) {
                        const elementId = `pdf-content-${staff.id}`;
                        const element = document.getElementById(elementId);
                        
                        if (!element) continue;

                        const opt = {
                            margin: 15,
                            filename: `통보서_${staff.name}.pdf`,
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, useCORS: true },
                            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                        };

                        const pdfBlob = await window.html2pdf().from(element).set(opt).output('blob');
                        folder.file(`연차사용시기지정통보서_${staff.name}.pdf`, pdfBlob);
                    }

                    const content = await zip.generateAsync({ type: "blob" });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `양지누림_통보서_일괄다운로드_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}.zip`;
                    link.click();
                    
                } catch (err) {
                    console.error(err);
                    showAlert("ZIP 생성 중 오류가 발생했습니다.");
                } finally {
                    setIsGeneratingPdf(false);
                }
            };

            return (
                <div className="space-y-6 animate-fade-in relative">
                    {isGeneratingPdf && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[500] flex flex-col items-center justify-center text-white backdrop-blur-sm">
                            <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <h2 className="text-2xl font-bold">통보서 압축 파일(ZIP) 생성 중...</h2>

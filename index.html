<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양지누림 연차 관리 시스템 (Final Ver 9.6)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        input[type="checkbox"] { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: #2563eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        th { user-select: none; }
        .bar-transition { transition: height 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root">
        <div class="flex h-screen items-center justify-center flex-col gap-4 text-slate-400">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="font-bold">시스템 데이터 동기화 중...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, Component } = React;
        const { createRoot } = ReactDOM;

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCs3xfpAkHbLMXLiIeSXT2Mj10T1avAb_w",
            authDomain: "ygnurim-attendance-management.firebaseapp.com",
            projectId: "ygnurim-attendance-management",
            storageBucket: "ygnurim-attendance-management.firebasestorage.app",
            messagingSenderId: "17124870776",
            appId: "1:17124870776:web:49839a4bfd982a65d4fb8d",
            measurementId: "G-EELTZ41FTR"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Helper Functions ---
        const getLocalDateString = (d) => {
            if (!d || isNaN(d.getTime())) return '';
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const safeParseFloat = (val) => { const num = parseFloat(val); return isNaN(num) ? 0 : num; };
        const fmt = (num) => { if (num === undefined || num === null || isNaN(num)) return '0'; return Number(Number(num).toFixed(2)); };
        const normalizeString = (str) => String(str || '').replace(/[\s\-\.\/]/g, '').trim();

        const safeDate = (val) => {
            if (!val) return '';
            let str = String(val).trim().replace(/[\.\/]/g, '-');
            const parts = str.split('-');
            if (parts.length === 3) {
                const y = parts[0]; const m = parts[1].padStart(2, '0'); const d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            if (/^\d{5,6}$/.test(str)) {
                const n = parseInt(str);
                if (n > 20000 && n < 60000) {
                    try { const date = new Date((n - 25569) * 86400 * 1000); return getLocalDateString(date); } catch(e) { return str; }
                }
            }
            if (str.length === 8 && !isNaN(str)) { return `${str.substring(0,4)}-${str.substring(4,6)}-${str.substring(6,8)}`; }
            return str;
        };

        const calculateLeaveForYear = (joinDateStr, targetYear) => {
            if (!joinDateStr || joinDateStr.length < 10) return { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };
            const joinDate = new Date(joinDateStr);
            if (isNaN(joinDate.getTime())) return { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };
            if (joinDate.getFullYear() > targetYear) return { total: 0, period: '입사 전', notJoined: true };
            let startDate = new Date(targetYear, joinDate.getMonth(), joinDate.getDate());
            let endDate = new Date(targetYear + 1, joinDate.getMonth(), joinDate.getDate());
            endDate.setDate(endDate.getDate() - 1);
            let yearsWorked = targetYear - joinDate.getFullYear();
            let totalLeave = (yearsWorked < 1) ? 11 : (15 + Math.floor((yearsWorked - 1) / 2));
            if (totalLeave > 25) totalLeave = 25;
            const sStr = getLocalDateString(startDate);
            const eStr = getLocalDateString(endDate);
            return { total: totalLeave, period: `${sStr} ~ ${eStr}`, startDate: sStr, endDate: eStr, notJoined: false, yearsWorked };
        };

        const calculateAnnualLeave = (joinDateStr) => {
            if(!joinDateStr) return { total: 0, period: '-' };
            const today = new Date();
            let baseYear = today.getFullYear();
            const joinDate = new Date(joinDateStr);
            if (isNaN(joinDate.getTime())) return { total: 0, period: '-' };
            const currentAnniversary = new Date(baseYear, joinDate.getMonth(), joinDate.getDate());
            if (today < currentAnniversary) baseYear = baseYear - 1;
            return calculateLeaveForYear(joinDateStr, baseYear);
        };

        const getPromotionStatus = (staff) => {
            if (!staff.joinDate) return null;
            const leaveInfo = calculateAnnualLeave(staff.joinDate);
            if (leaveInfo.notJoined) return null;
            const today = new Date();
            const currentMonth = today.getMonth() + 1; 
            const currentYear = today.getFullYear();
            const endDate = new Date(leaveInfo.endDate);
            if (leaveInfo.yearsWorked < 1) {
                const joinDate = new Date(staff.joinDate);
                const oneYearDate = new Date(joinDate.getFullYear() + 1, joinDate.getMonth(), joinDate.getDate());
                const notifyDate = new Date(oneYearDate);
                notifyDate.setMonth(notifyDate.getMonth() - 3);
                if (currentYear === notifyDate.getFullYear() && currentMonth === (notifyDate.getMonth() + 1)) {
                    return { type: '1년미만 1차', msg: '1년 도래 3개월 전 (촉진 필요)', color: 'bg-purple-100 text-purple-700' };
                }
            } else {
                const notify1Date = new Date(endDate); notify1Date.setMonth(notify1Date.getMonth() - 6);
                const notify2Date = new Date(endDate); notify2Date.setMonth(notify2Date.getMonth() - 2);
                if (currentYear === notify1Date.getFullYear() && currentMonth === (notify1Date.getMonth() + 1)) return { type: '1차 촉진', msg: '만료 6개월 전', color: 'bg-blue-100 text-blue-700' };
                if (currentYear === notify2Date.getFullYear() && currentMonth === (notify2Date.getMonth() + 1)) return { type: '2차 촉진', msg: '만료 2개월 전', color: 'bg-red-100 text-red-700' };
            }
            return null;
        };

        const Icons = {
            Grid: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Users: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Briefcase: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Upload: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Edit: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            SortAsc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>,
            SortDesc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>,
            History: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            UserMinus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
            Megaphone: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11l8-5v12l-8-5H3v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>,
            FileText: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Alert: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            Rotate: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
        };

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-center"><h2 className="text-red-600 font-bold">오류 발생</h2><p>{this.state.error?.message}</p><button onClick={()=>window.location.reload()} className="bg-slate-800 text-white px-4 py-2 rounded mt-4">새로고침</button></div>;
                }
                return this.props.children;
            }
        }

        // --- Components ---
        const Login = ({ onLogin }) => {
            const [id, setId] = useState('');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const handleLogin = async (e) => {
                e.preventDefault(); setError('');
                let email = id === 'ygnurim' ? 'admin@ygnurim.com' : (id.includes('@') ? id : `${id}@ygnurim.com`);
                try {
                    await auth.signInWithEmailAndPassword(email, pw);
                    const userDoc = await db.collection('users').doc(email).get();
                    if (userDoc.exists) onLogin({ ...userDoc.data(), email });
                    else onLogin({ role: 'staff', name: id, email });
                } catch (err) { setError('정보를 확인해주세요.'); }
            };
            return (
                <div className="flex h-screen items-center justify-center bg-slate-100">
                    <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl text-center">
                        <h1 className="text-3xl font-black text-blue-600 mb-8">양지누림</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" value={id} onChange={e=>setId(e.target.value)} placeholder="아이디" className="w-full px-4 py-3 border rounded-xl" />
                            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호" className="w-full px-4 py-3 border rounded-xl" />
                            {error && <p className="text-red-500 text-xs">{error}</p>}
                            <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">로그인</button>
                        </form>
                    </div>
                </div>
            );
        };

        const StaffDetailModal = ({ staff, onClose }) => {
            if (!staff) return null;
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400"><Icons.X /></button>
                        <div className="text-center space-y-4">
                            <div className="w-20 h-20 bg-blue-50 rounded-full mx-auto flex items-center justify-center text-3xl font-black text-blue-600">{staff.name[0]}</div>
                            <h3 className="text-2xl font-bold">{staff.name}</h3>
                            <div className="space-y-2 text-sm">
                                <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span>생년월일</span><b>{staff.birth || '-'}</b></div>
                                <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span>휴대폰</span><b>{staff.phone || '-'}</b></div>
                                <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span>입사일</span><b>{staff.joinDate || '-'}</b></div>
                                <div className="flex justify-between p-3 bg-slate-50 rounded-xl"><span>근무시간</span><b>{staff.workHours || 8}h</b></div>
                            </div>
                            <button onClick={onClose} className="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">닫기</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LeaveActionModal = ({ onClose, staffList, initialData = null }) => {
            const isEdit = !!initialData;
            const [selectedStaffId, setSelectedStaffId] = useState(initialData?.staffId || '');
            const [leaveDate, setLeaveDate] = useState(initialData?.date || getLocalDateString(new Date()));
            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1');
            const [leaveHourValue, setLeaveHourValue] = useState('');
            const [reason, setReason] = useState(initialData?.reason || '');
            const [msg, setMsg] = useState('');

            useEffect(() => {
                if (initialData) {
                    const days = safeParseFloat(initialData.days);
                    if (days === 1 || days === 0.5) { setInputType('day'); setLeaveDayType(String(days)); }
                    else { setInputType('hour'); setLeaveHourValue(String(days)); }
                }
            }, [initialData]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedStaffId) return;
                const staff = staffList.find(s => s.id === selectedStaffId);
                const dailyHours = safeParseFloat(staff.workHours) || 8;
                let val = inputType === 'day' ? (leaveDayType === '1' ? dailyHours : dailyHours / 2) : safeParseFloat(leaveHourValue);
                
                try {
                    let history = [...(staff.leaveHistory || [])];
                    if (isEdit) {
                        const idx = history.findIndex(h => h.id === initialData.id);
                        if (idx !== -1) history[idx] = { ...history[idx], date: safeDate(leaveDate), days: val, reason };
                    } else {
                        history.push({ id: Date.now().toString(), date: safeDate(leaveDate), days: val, type: inputType==='day'?(leaveDayType==='1'?'연차':'반차'):`${val}h`, reason, createdAt: new Date().toISOString() });
                    }
                    const info = calculateAnnualLeave(staff.joinDate);
                    const totalUsed = history.reduce((acc, h) => (h.date >= info.startDate && h.date <= info.endDate) ? acc + safeParseFloat(h.days) : acc, 0);
                    await db.collection('users').doc(selectedStaffId).update({ annualLeaveUsed: totalUsed, leaveHistory: history });
                    onClose();
                } catch (err) { setMsg(err.message); }
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm relative">
                        <button onClick={onClose} className="absolute top-4 right-4"><Icons.X /></button>
                        <h3 className="font-bold text-lg mb-4">{isEdit ? '수정' : '등록'}</h3>
                        <form onSubmit={handleSubmit} className="space-y-4 text-sm">
                            <select className="w-full border rounded-xl p-3" value={selectedStaffId} onChange={e=>setSelectedStaffId(e.target.value)} disabled={isEdit}>
                                <option value="">직원 선택</option>
                                {staffList.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                            </select>
                            <input type="date" className="w-full border rounded-xl p-3" value={leaveDate} onChange={e=>setLeaveDate(e.target.value)} />
                            <div className="flex gap-2">
                                <button type="button" onClick={()=>setInputType('day')} className={`flex-1 p-2 rounded-xl border ${inputType==='day'?'bg-blue-600 text-white':'bg-white'}`}>일 단위</button>
                                <button type="button" onClick={()=>setInputType('hour')} className={`flex-1 p-2 rounded-xl border ${inputType==='hour'?'bg-blue-600 text-white':'bg-white'}`}>시간 단위</button>
                            </div>
                            {inputType === 'day' ? (
                                <div className="flex gap-2">
                                    <button type="button" onClick={()=>setLeaveDayType('1')} className={`flex-1 p-2 rounded-xl border ${leaveDayType==='1'?'border-blue-600 text-blue-600':''}`}>연차</button>
                                    <button type="button" onClick={()=>setLeaveDayType('0.5')} className={`flex-1 p-2 rounded-xl border ${leaveDayType==='0.5'?'border-blue-600 text-blue-600':''}`}>반차</button>
                                </div>
                            ) : <input type="number" className="w-full border rounded-xl p-3" placeholder="시간" value={leaveHourValue} onChange={e=>setLeaveHourValue(e.target.value)} />}
                            <input type="text" className="w-full border rounded-xl p-3" placeholder="사유" value={reason} onChange={e=>setReason(e.target.value)} />
                            <button className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">완료</button>
                        </form>
                    </div>
                </div>
            );
        };

        const LeaveManagementTab = ({ staffList, onOpenModal, onEditClick, isPastMode = false, isResignedTab = false, onNameClick }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear() - 1);
            const [showNegativeOnly, setShowNegativeOnly] = useState(false);
            const [showCheckOnly, setShowCheckOnly] = useState(false);
            const fileInputRef = useRef(null);

            const filteredList = useMemo(() => {
                let data = staffList.map(staff => {
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const info = isPastMode ? calculateLeaveForYear(staff.joinDate, selectedYear) : calculateAnnualLeave(staff.joinDate);
                    const activeHistory = (staff.leaveHistory || []).filter(h => h.date >= info.startDate && h.date <= info.endDate);
                    const usedHours = activeHistory.reduce((acc, cur) => acc + (safeParseFloat(cur.days) || 0), 0);
                    const totalHours = (info.total || 0) * dailyHours;
                    const joinMonth = new Date(staff.joinDate).getMonth() + 1;
                    const needsCheck = activeHistory.some(h => (new Date(h.date).getMonth() + 1) === joinMonth);
                    return { ...staff, info, totalHours, usedHours, remainingHours: totalHours-usedHours, displayHistory: activeHistory.sort((a,b)=>new Date(b.date)-new Date(a.date)), needsCheck, notJoined: info.notJoined };
                });
                return data.filter(d => (!isResignedTab && d.notJoined ? false : true) && d.name.includes(searchTerm) && (showNegativeOnly ? d.remainingHours < 0 : true) && (showCheckOnly ? d.needsCheck : true));
            }, [staffList, selectedYear, isPastMode, searchTerm, showNegativeOnly, showCheckOnly, isResignedTab]);

            // --- [핵심 수정] 엑셀 업로드 로직 (B, C, F열 매칭) ---
            const handleLeaveFileUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                Promise.all(files.map(file => {
                    return new Promise((resolve) => {
                        const match = file.name.match(/(\d{4})[\.\-](\d{1,2})/);
                        if (!match) { resolve(null); return; }
                        const uploadDate = `${match[1]}-${match[2].padStart(2, '0')}-01`;
                        const uploadType = `${match[1]}.${match[2]} 일괄등록`;
                        const reader = new FileReader();
                        reader.readAsArrayBuffer(file);
                        reader.onload = (evt) => {
                            const data = new Uint8Array(evt.target.result);
                            const wb = XLSX.read(data, { type: 'array' });
                            const ws = wb.Sheets[wb.SheetNames[0]];
                            const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                            resolve({ jsonData, uploadDate, uploadType });
                        };
                    });
                })).then(async (results) => {
                    const batch = db.batch();
                    let updateCount = 0;
                    results.forEach(res => {
                        if (!res) return;
                        const { jsonData, uploadDate, uploadType } = res;
                        // 3행(index 2)부터 읽기
                        for (let i = 2; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || !row[1]) continue;
                            const name = String(row[1]).trim();     // B열: 이름
                            const birth = safeDate(row[2]);         // C열: 생년월일
                            const leaveVal = safeParseFloat(row[5]); // F열: 휴가 시간

                            const target = staffList.find(s => 
                                (normalizeString(s.name) === normalizeString(name) && normalizeString(s.birth) === normalizeString(birth)) ||
                                (staffList.filter(x => normalizeString(x.name) === normalizeString(name)).length === 1 && normalizeString(s.name) === normalizeString(name))
                            );

                            if (target) {
                                let history = [...(target.leaveHistory || [])];
                                const existIdx = history.findIndex(h => h.date === uploadDate && h.type === uploadType);
                                if (existIdx > -1) history[existIdx].days = leaveVal;
                                else if (leaveVal > 0) history.push({ id: Date.now().toString() + Math.random(), date: uploadDate, days: leaveVal, type: uploadType, reason: '엑셀일괄', createdAt: new Date().toISOString() });
                                
                                const lInfo = calculateAnnualLeave(target.joinDate);
                                const totalUsed = history.reduce((acc, h) => (h.date >= lInfo.startDate && h.date <= lInfo.endDate) ? acc + safeParseFloat(h.days) : acc, 0);
                                batch.update(db.collection('users').doc(target.id), { leaveHistory: history, annualLeaveUsed: totalUsed });
                                updateCount++;
                            }
                        }
                    });
                    if (updateCount > 0) { await batch.commit(); alert(`✅ ${updateCount}건 완료!`); }
                    else alert("매칭되는 데이터가 없습니다.");
                    if (fileInputRef.current) fileInputRef.current.value = '';
                });
            };

            const handleDeleteLeave = async (staff, leaveId) => {
                if (!confirm('삭제하시겠습니까?')) return;
                const newHistory = staff.leaveHistory.filter(h => h.id !== leaveId);
                const info = calculateAnnualLeave(staff.joinDate);
                const totalUsed = newHistory.reduce((acc, h) => (h.date >= info.startDate && h.date <= info.endDate) ? acc + safeParseFloat(h.days) : acc, 0);
                await db.collection('users').doc(staff.id).update({ leaveHistory: newHistory, annualLeaveUsed: totalUsed });
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border flex flex-wrap justify-between items-center gap-4">
                        <div className="flex items-center gap-4">
                            <div><h3 className="font-bold text-lg">{isPastMode ? '과년도' : '연차 관리'}</h3><p className="text-xs text-slate-500">시간 단위 관리</p></div>
                            {isPastMode && (<select value={selectedYear} onChange={e=>setSelectedYear(parseInt(e.target.value))} className="border rounded-lg p-1.5">{[0,1,2,3,4].map(i=><option key={i} value={new Date().getFullYear()-i}>{new Date().getFullYear()-i}년</option>)}</select>)}
                        </div>
                        <div className="flex items-center gap-3">
                            <label className="flex items-center gap-2 cursor-pointer bg-orange-50 px-3 py-2 rounded-xl border border-orange-100"><input type="checkbox" checked={showCheckOnly} onChange={e=>setShowCheckOnly(e.target.checked)} /><span className="text-sm font-bold text-orange-600">중복 확인</span></label>
                            <label className="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border"><input type="checkbox" checked={showNegativeOnly} onChange={e=>setShowNegativeOnly(e.target.checked)} /><span className="text-sm font-bold text-red-500">초과자</span></label>
                            <input type="text" placeholder="검색" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="border rounded-xl px-4 py-2 text-sm w-32" />
                            <input type="file" ref={fileInputRef} onChange={handleLeaveFileUpload} accept=".xlsx, .xls" className="hidden" />
                            <button onClick={()=>fileInputRef.current.click()} className="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-green-100 flex items-center gap-2"><Icons.Upload /> 일괄</button>
                            <button onClick={onOpenModal} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-blue-100 flex items-center gap-2"><Icons.Plus /> 등록</button>
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b">
                                <tr><th className="p-4">이름</th><th className="p-4 text-center text-blue-600">총 연차</th><th className="p-4 text-center text-red-500">사용</th><th className="p-4 text-center text-green-600">잔여</th><th className="p-4">기간</th><th className="p-4">내역</th></tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredList.map(data => (
                                    <tr key={data.id} className="hover:bg-slate-50 transition">
                                        <td className="p-4"><div className="font-bold cursor-pointer hover:text-blue-600" onClick={()=>onNameClick(data)}>{data.name}</div>{data.needsCheck && <span className="text-[10px] text-orange-600 font-bold">확인필요</span>}</td>
                                        <td className="p-4 text-center">{fmt(data.totalHours)}h</td>
                                        <td className="p-4 text-center">{fmt(data.usedHours)}h</td>
                                        <td className={`p-4 text-center font-black text-lg ${data.remainingHours < 0 ? 'text-red-600' : 'text-green-600'}`}>{fmt(data.remainingHours)}h</td>
                                        <td className="p-4 text-xs text-slate-400">{data.info.period}</td>
                                        <td className="p-4">
                                            <div className="max-h-24 overflow-y-auto space-y-1">
                                                {data.displayHistory.map(rec => (
                                                    <div key={rec.id} className="flex items-center justify-between text-[10px] p-1.5 bg-slate-50 border rounded-lg group">
                                                        <span>{rec.date} ({rec.days}h)</span>
                                                        <div className="opacity-0 group-hover:opacity-100 transition flex gap-1">
                                                            <button onClick={()=>onEditClick(data.id, 0, rec)} className="text-blue-500"><Icons.Edit /></button>
                                                            <button onClick={()=>handleDeleteLeave(data, rec.id)} className="text-red-400"><Icons.Trash /></button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const PromotionTab = ({ staffList }) => {
            const list = useMemo(() => staffList.map(s => ({ ...s, status: getPromotionStatus(s), info: calculateAnnualLeave(s.joinDate) })).filter(x => x.status), [staffList]);
            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
                        <div><h3 className="font-bold text-lg">연차 촉진 대상자</h3><p className="text-xs text-slate-500">근로기준법 기준 통보 대상</p></div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <table className="w-full text-sm text-left"><thead className="bg-slate-50 text-slate-500 font-bold border-b"><tr><th className="p-4">이름</th><th className="p-4">촉진 단계</th><th className="p-4">안내 사항</th></tr></thead>
                        <tbody className="divide-y">{list.map(s => (
                            <tr key={s.id} className="hover:bg-slate-50"><td className="p-4 font-bold">{s.name}</td><td className="p-4"><span className={`px-3 py-1 rounded-full text-xs font-bold ${s.status.color}`}>{s.status.type}</span></td><td className="p-4 font-bold text-slate-600">{s.status.msg}</td></tr>
                        ))}</tbody></table>
                    </div>
                </div>
            );
        };

        const StaffTab = ({ staffList }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const fileInputRef = useRef(null);
            const list = useMemo(() => staffList.filter(s => s.status !== 'resigned' && s.name.includes(searchTerm)), [staffList, searchTerm]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const batch = db.batch();
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row[0]) continue;
                        const name = row[0];
                        const email = `${name}_${String(row[2]||'').slice(-4)}@ygnurim.com`;
                        batch.set(db.collection('users').doc(email), { name, birth: safeDate(row[1]), phone: row[2]||'', joinDate: safeDate(row[3]), workHours: row[4]||8, role:'staff', status:'active' }, { merge: true });
                    }
                    await batch.commit(); alert('완료!');
                };
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
                        <h3 className="font-bold text-lg text-slate-800">직원 명부 ({list.length}명)</h3>
                        <div className="flex gap-2">
                            <input type="text" placeholder="이름 검색" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="border rounded-xl px-4 py-2 text-sm" />
                            <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                            <button onClick={()=>fileInputRef.current.click()} className="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-green-100 flex items-center gap-2"><Icons.Upload /> 명부 업로드</button>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {list.map(s => (
                            <div key={s.id} className="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between group hover:shadow-md transition">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-blue-50 text-blue-600 font-black flex items-center justify-center rounded-full text-lg">{s.name[0]}</div>
                                    <div><p className="font-bold text-slate-800">{s.name}</p><p className="text-xs text-slate-500">{s.joinDate} 입사</p></div>
                                </div>
                                <button onClick={async ()=>{if(confirm('삭제하시겠습니까?')) await db.collection('users').doc(s.id).delete();}} className="text-red-400 opacity-0 group-hover:opacity-100 transition"><Icons.Trash /></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staffList, setStaffList] = useState([]);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [editData, setEditData] = useState(null);
            const [viewStaff, setViewStaff] = useState(null);

            useEffect(() => {
                if (user?.role === 'admin') {
                    return db.collection('users').onSnapshot(ss => {
                        setStaffList(ss.docs.map(d => ({ ...d.data(), id: d.id })).filter(u => u.role === 'staff'));
                    });
                }
            }, [user]);

            const activeStaff = staffList.filter(s => s.status !== 'resigned');
            const todayStr = getLocalDateString(new Date());
            const todayLeaves = activeStaff.filter(s => s.leaveHistory?.some(h => h.date === todayStr)).length;

            if (!user) return <Login onLogin={setUser} />;

            return (
                <div className="flex h-screen bg-[#F1F5F9] text-slate-800 font-sans overflow-hidden">
                    <aside className="w-64 bg-[#1E293B] text-white flex flex-col z-10 shadow-xl">
                        <div className="p-6 border-b border-slate-700/50"><h1 className="text-xl font-black">양지누림</h1><p className="text-xs text-slate-400 mt-1">{user.name} 관리자님</p></div>
                        <nav className="flex-1 p-4 flex flex-col gap-2">
                            {[
                                { id: 'dashboard', icon: <Icons.Grid />, label: '대시보드' },
                                { id: 'leave', icon: <Icons.Calendar />, label: '연차 관리' },
                                { id: 'past_leave', icon: <Icons.History />, label: '과년도 관리' },
                                { id: 'promotion', icon: <Icons.Megaphone />, label: '연차 촉진' },
                                { id: 'staff', icon: <Icons.Users />, label: '직원 명부' },
                                { id: 'resigned', icon: <Icons.UserMinus />, label: '퇴사자 관리' }
                            ].map(menu => (
                                <button key={menu.id} onClick={() => setActiveTab(menu.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${activeTab === menu.id ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>{menu.icon} {menu.label}</button>
                            ))}
                        </nav>
                        <div className="p-4 bg-[#0F172A]">
                            <button onClick={() => setUser(null)} className="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-white text-xs font-bold py-2"><Icons.LogOut /> 로그아웃</button>
                            <p className="text-[10px] text-slate-500 text-center mt-4">Ver 9.6 (Full Version)<br/>© 2026 YangjiNurim</p>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto p-8">
                        <header className="flex justify-between items-center mb-8"><h2 className="text-2xl font-bold">시스템 관리</h2><div className="text-sm font-bold text-slate-500">{todayStr}</div></header>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center">
                                        <div><p className="text-xs font-bold text-slate-400 mb-1">총 임직원</p><span className="text-2xl font-black">{activeStaff.length}명</span></div>
                                        <div className="p-3 rounded-xl bg-blue-50 text-blue-600"><Icons.Users /></div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center">
                                        <div><p className="text-xs font-bold text-slate-400 mb-1">금일 휴가</p><span className="text-2xl font-black">{todayLeaves}명</span></div>
                                        <div className="p-3 rounded-xl bg-orange-50 text-orange-600"><Icons.Briefcase /></div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center">
                                        <div><p className="text-xs font-bold text-slate-400 mb-1">촉진 대상</p><span className="text-2xl font-black">{activeStaff.filter(s=>getPromotionStatus(s)).length}명</span></div>
                                        <div className="p-3 rounded-xl bg-purple-50 text-purple-600"><Icons.Megaphone /></div>
                                    </div>
                                </div>
                                <div className="bg-blue-600 rounded-3xl p-8 text-white shadow-xl shadow-blue-200 flex justify-between items-center">
                                    <div><h3 className="text-2xl font-black mb-2">간편 연차 등록</h3><p className="text-blue-100">관리자가 직원의 휴가를 직접 등록합니다.</p></div>
                                    <button onClick={()=>setShowLeaveModal(true)} className="bg-white text-blue-600 px-8 py-4 rounded-2xl font-black hover:bg-blue-50 transition shadow-lg">+ 연차 등록</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'leave' && <LeaveManagementTab staffList={activeStaff} onOpenModal={()=>setShowLeaveModal(true)} onEditClick={(id, idx, data)=>{setEditData({...data, staffId:id}); setShowLeaveModal(true);}} onNameClick={setViewStaff} />}
                        {activeTab === 'past_leave' && <LeaveManagementTab staffList={activeStaff} onOpenModal={()=>setShowLeaveModal(true)} onEditClick={(id, idx, data)=>{setEditData({...data, staffId:id}); setShowLeaveModal(true);}} isPastMode={true} onNameClick={setViewStaff} />}
                        {activeTab === 'promotion' && <PromotionTab staffList={activeStaff} />}
                        {activeTab === 'staff' && <StaffTab staffList={staffList} />}
                        {activeTab === 'resigned' && <LeaveManagementTab staffList={staffList.filter(s=>s.status==='resigned')} onOpenModal={()=>alert('퇴사자 수정 불가')} isResignedTab={true} onNameClick={setViewStaff} />}
                    </main>

                    {showLeaveModal && <LeaveActionModal staffList={activeStaff} onClose={()=>{setShowLeaveModal(false); setEditData(null);}} initialData={editData} />}
                    {viewStaff && <StaffDetailModal staff={viewStaff} onClose={()=>setViewStaff(null)} />}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

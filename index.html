                            <p className="mt-2 text-blue-200">대상자가 많을 경우 다소 시간이 소요될 수 있습니다.</p>
                        </div>
                    )}

                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h3 className="font-bold text-lg text-slate-800 mb-1 flex items-center gap-2"><Icons.Megaphone /> 미사용 연차 촉진 관리</h3>
                            <p className="text-xs md:text-sm text-slate-500">촉진 대상자 검색, 계획서 제출 여부 체크 및 통보서를 출력합니다.</p>
                        </div>
                        <div className="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
                            <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-100 w-full md:w-auto">
                                <input type="month" value={startMonth} onChange={e => setStartMonth(e.target.value)} className="bg-white border rounded-lg px-2 py-1 text-sm font-bold text-slate-700 outline-none w-full md:w-32" />
                                <span className="text-slate-400 font-bold">~</span>
                                <input type="month" value={endMonth} onChange={e => setEndMonth(e.target.value)} className="bg-white border rounded-lg px-2 py-1 text-sm font-bold text-slate-700 outline-none w-full md:w-32" />
                            </div>
                            
                            <div className="flex gap-2 w-full md:w-auto">
                                <button type="button" onClick={handleDownloadSignOK} className="flex-1 md:flex-none bg-green-600 text-white px-4 py-3 md:py-2.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-green-700 transition shadow-sm" title="1차 촉진 대상자용 싸인오케이 엑셀 다운로드">
                                    <Icons.FileText /> 싸인오케이(1차)
                                </button>
                                <button type="button" onClick={handleDownloadNoticePdfZip} className="flex-1 md:flex-none bg-red-500 text-white px-4 py-3 md:py-2.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-red-600 transition shadow-sm" title="미제출자 통보서를 개별 PDF로 만들어 ZIP으로 압축 다운로드합니다.">
                                    <span className="text-lg">🗂️</span> 통보서 압축(ZIP)
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4">이름</th>
                                    <th className="p-4">입사일</th>
                                    <th className="p-4">연차 산정 기간</th>
                                    <th className="p-4 text-center">조회된 촉진 시기</th>
                                    <th className="p-4 text-center">촉진 단계</th>
                                    <th className="p-4 text-center bg-blue-50/50">계획서 제출 완료</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {promotionList.map((staff) => (
                                    <tr key={staff.id} className={`hover:bg-slate-50 transition ${staff.isPlanSubmitted ? 'opacity-50' : ''}`}>
                                        <td className="p-4 font-bold text-slate-800">{staff.name}</td>
                                        <td className="p-4 text-slate-500">{safeDate(staff.joinDate)}</td>
                                        <td className="p-4 text-xs text-slate-400">{staff.leaveInfo.period}</td>
                                        <td className="p-4 text-center font-bold text-blue-600">{staff.targetDate}</td>
                                        <td className="p-4 text-center"><span className={`px-3 py-1 rounded-full text-xs font-bold ${staff.promoStatus.color}`}>{staff.promoStatus.type}</span></td>
                                        <td className="p-4 text-center bg-blue-50/20">
                                            <label className="flex items-center justify-center gap-2 cursor-pointer">
                                                <input 
                                                    type="checkbox" 
                                                    checked={staff.isPlanSubmitted}
                                                    onChange={() => handleTogglePlan(staff.id, staff.promoPlanKey, staff.isPlanSubmitted)}
                                                    className="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                                />
                                                <span className={`text-xs font-bold ${staff.isPlanSubmitted ? 'text-green-600' : 'text-red-500'}`}>
                                                    {staff.isPlanSubmitted ? '제출됨' : '미제출'}
                                                </span>
                                            </label>
                                        </td>
                                    </tr>
                                ))}
                                {promotionList.length === 0 && <tr><td colSpan="6" className="p-12 text-center text-slate-400">선택된 기간에 대상자가 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div style={{ position: 'absolute', top: '-9999px', left: '-9999px' }}>
                        {promotionList.filter(p => !p.isPlanSubmitted && p.remainingDays > 0).map((staff) => {
                            const notifyDate = getNotifyDate(staff.leaveInfo);
                            const yearStr = notifyDate.getFullYear();
                            const monthStr = notifyDate.getMonth() + 1;
                            const dayStr = notifyDate.getDate();
                            const currentYear = new Date().getFullYear();
                            
                            // [v5.4.1] 직원의 휴무일 정보를 가져와서 랜덤 지정일 알고리즘 호출
                            const offDaysArray = staff.offDays && staff.offDays.length > 0 ? staff.offDays : [0]; // 기본 일요일(0)
                            const designatedDates = generateDesignatedDates(notifyDate, staff.remainingDays, offDaysArray);

                            return (
                                <div key={staff.id} id={`pdf-content-${staff.id}`} className="bg-white text-black text-left font-sans flex flex-col" style={{ width: '180mm', minHeight: '260mm', padding: '10px', boxSizing: 'border-box' }}>
                                    <h1 className="text-2xl font-black text-center mb-4 tracking-widest">연차 유급휴가 사용시기 지정 통보서</h1>
                                    <p className="text-center text-sm font-bold mb-8">&lt; 근로기준법 제61조(연차유급휴가의 사용촉진) 관련 &gt;</p>
                                    
                                    <h3 className="text-base font-bold mb-2">1. 대상 근로자</h3>
                                    <table className="w-full text-center border-collapse border border-black mb-8 text-sm">
                                        <tbody>
                                            <tr>
                                                <th className="border border-black p-2 bg-gray-100 w-1/4">성명</th>
                                                <td className="border border-black p-2 w-1/4 font-bold">{staff.name}</td>
                                                <th className="border border-black p-2 bg-gray-100 w-1/4">입사일</th>
                                                <td className="border border-black p-2 w-1/4">{safeDate(staff.joinDate)}</td>
                                            </tr>
                                            <tr>
                                                <th className="border border-black p-2 bg-gray-100">소속</th>
                                                {/* [v5.4.1] 소속 자동 입력 */}
                                                <td className="border border-black p-2 font-bold">(사)장애인의양지누림</td>
                                                <th className="border border-black p-2 bg-gray-100">직위</th>
                                                {/* [v5.4.1] 직위 자동 입력 */}
                                                <td className="border border-black p-2 font-bold">근로지원인</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    
                                    <h3 className="text-base font-bold mb-2 leading-relaxed">
                                        2. {currentYear}. 현재까지 사용하지 않은 연차 유급휴가 <span className="underline font-black text-red-600 px-1">{staff.remainingDays}</span>일에 대하여 아래와 같이 사용시기를 지정하여 통보합니다.
                                    </h3>
                                    
                                    <p className="text-sm font-bold mt-6 mb-2 text-center">&lt; 미사용 연차 유급휴가 사용시기 지정 &gt;</p>
                                    <table className="w-full text-center border-collapse border-2 border-black mb-8 text-sm">
                                        <thead>
                                            <tr>
                                                <th className="border border-black p-2 bg-gray-100">해당월</th>
                                                <th className="border border-black p-2 bg-gray-100">지정일자</th>
                                                <th className="border border-black p-2 bg-gray-100">사용일수</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {designatedDates.map((item, i) => (
                                                <tr key={i}>
                                                    <td className={`border border-black p-2 h-8 align-middle ${item.month ? 'font-bold' : 'text-gray-300'}`}>{item.month ? `${item.month}월` : '월'}</td>
                                                    <td className={`border border-black p-2 align-middle ${item.date ? 'font-bold' : 'text-gray-300'}`}>{item.date ? `${item.date}일` : '일'}</td>
                                                    <td className={`border border-black p-2 align-middle ${item.days ? 'font-bold text-blue-600' : 'text-gray-300'}`}>{item.days ? `${item.days}일` : '일'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>

                                    <div className="mt-auto pt-6 flex flex-col items-center w-full">
                                        <p className="text-base font-bold mb-8">{yearStr}년 {monthStr}월 {dayStr}일</p>
                                        
                                        <div className="flex justify-center items-center gap-4 w-full">
                                            <span className="text-base font-bold">통보자:</span>
                                            {/* [v5.4.1] 하단 로고 배치 확인 */}
                                            <img src="logo.png" alt="양지누림 로고" className="h-10 object-contain" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                                            <span className="text-base font-bold border-b border-black w-24 text-right">(서명)</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                </div>
            );
        };

        const LeaveManagementTab = ({ staffList, adminName, onOpenModal, onEditClick, isPastMode = false, isResignedTab = false, onNameClick, showConfirm, showAlert }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear() - 1); 
            const [showNegativeOnly, setShowNegativeOnly] = useState(false); 
            const [showCheckOnly, setShowCheckOnly] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' }); 
            const [calendarStaff, setCalendarStaff] = useState(null);
            const [showMonthlyModal, setShowMonthlyModal] = useState(false);
            const fileInputRef = useRef(null);

            const handleResetFilters = () => {
                setSearchTerm('');
                setShowNegativeOnly(false);
                setShowCheckOnly(false);
                setSortConfig({ key: 'name', direction: 'asc' });
                if(isPastMode) setSelectedYear(new Date().getFullYear() - 1);
            };

            const handleResetAllLeaveHistory = () => {
                showConfirm('모든 직원의 연차 사용 내역을 완전히 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.', async () => {
                    try {
                        const batch = db.batch();
                        staffList.forEach(s => {
                            batch.update(db.collection('users').doc(s.id), {
                                leaveHistory: [],
                                annualLeaveUsed: 0
                            });
                        });
                        await batch.commit();
                        showAlert('전체 연차 내역이 초기화되었습니다.');
                    } catch(e) {
                        showAlert('오류: ' + e.message);
                    }
                });
            };

            const filteredList = useMemo(() => {
                let data = staffList.map(staff => {
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    let leaveInfo, usedHours = 0, activeHistory = [];

                    if (isPastMode) {
                        leaveInfo = calculateLeaveForYear(staff.joinDate, selectedYear);
                    } else {
                        leaveInfo = calculateAnnualLeave(staff.joinDate);
                    }

                    const allHistory = (staff.leaveHistory || []).sort((a,b) => new Date(b.date) - new Date(a.date));
                    
                    if (isPastMode) {
                        activeHistory = allHistory.filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                    } else {
                        activeHistory = allHistory.filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                    }

                    usedHours = activeHistory.reduce((acc, cur) => acc + (safeParseFloat(cur.days) || 0), 0);

                    const totalDays = leaveInfo.total || 0;
                    const totalHours = totalDays * dailyHours;
                    const remainingHours = totalHours - usedHours;
                    const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                    const remainingDays = dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0;
                    
                    const joinDateObj = new Date(safeDate(staff.joinDate)); 
                    const joinMonth = joinDateObj.getMonth() + 1;
                    const needsCheck = activeHistory.some(h => {
                        const hMonth = new Date(h.date).getMonth() + 1;
                        return hMonth === joinMonth;
                    });

                    const displayHistory = activeHistory.map(h => ({
                        ...h,
                        isWarn: (new Date(h.date).getMonth() + 1) === joinMonth
                    }));

                    return { ...staff, dailyHours, leaveInfo, totalDays, totalHours, usedHours, remainingHours, usedDays, remainingDays, displayHistory, notJoined: leaveInfo.notJoined, resignDate: staff.resignDate, needsCheck };
                });

                let result = data.filter(d => {
                    if (!isResignedTab && d.notJoined) return false;
                    const matchName = d.name && d.name.includes(searchTerm);
                    const matchNegative = showNegativeOnly ? d.remainingHours < 0 : true;
                    const matchCheck = showCheckOnly ? d.needsCheck : true;
                    return matchName && matchNegative && matchCheck;
                });

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        if (sortConfig.key === 'total') { aVal = a.totalHours; bVal = b.totalHours; }
                        if (sortConfig.key === 'used') { aVal = a.usedHours; bVal = b.usedHours; }
                        if (sortConfig.key === 'remaining') { aVal = a.remainingHours; bVal = b.remainingHours; }
                        
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return result;
            }, [staffList, selectedYear, isPastMode, searchTerm, showNegativeOnly, showCheckOnly, isResignedTab, sortConfig]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const getSortIcon = (key) => {
                if (sortConfig.key !== key) return <span className="text-slate-300 ml-1">⇅</span>;
                return sortConfig.direction === 'asc' ? <span className="text-blue-600 ml-1"><Icons.SortAsc /></span> : <span className="text-blue-600 ml-1"><Icons.SortDesc /></span>;
            };

            const handleDeleteLeave = (data, leaveId) => {
                showConfirm('이 휴가 내역을 삭제하시겠습니까?', async () => {
                    try {
                        const newHistory = (data.leaveHistory || []).filter(h => h.id !== leaveId);
                        const currentInfo = calculateAnnualLeave(data.joinDate);
                        const totalUsedHours = newHistory.reduce((acc, curr) => {
                            if (curr.date >= currentInfo.startDate && curr.date <= currentInfo.endDate) return acc + (safeParseFloat(curr.days) || 0);
                            return acc;
                        }, 0);
                        
                        await db.collection('users').doc(data.id).update({ 
                            annualLeaveUsed: totalUsedHours, 
                            annualLeaveTotal: currentInfo.total,
                            annualLeavePeriod: currentInfo.period,
                            leaveHistory: newHistory 
                        });
                    } catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            const handleLeaveFileUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                const processFile = (file) => {
                    return new Promise((resolve, reject) => {
                        const match = file.name.match(/(\d{4})[\.\-](\d{1,2})/);
                        if (!match) { resolve(null); return; } 
                        const year = match[1]; const month = match[2].padStart(2, '0');
                        const uploadDate = `${year}-${month}-01`; const uploadType = `${year}.${month} 일괄등록`;
                        const reader = new FileReader();
                        reader.readAsArrayBuffer(file);
                        reader.onload = (evt) => {
                            try {
                                const data = new Uint8Array(evt.target.result);
                                const wb = XLSX.read(data, { type: 'array' });
                                const ws = wb.Sheets[wb.SheetNames[0]];
                                const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                                resolve({ jsonData, uploadDate, uploadType });
                            } catch (err) { reject(err); }
                        };
                        reader.onerror = reject;
                    });
                };

                Promise.all(files.map(processFile)).then(async (results) => {
                    const batch = db.batch();
                    const updates = {};
                    let updateCount = 0;

                    results.forEach(res => {
                        if (!res) return;
                        const { jsonData, uploadDate, uploadType } = res;
                        for (let i = 2; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length === 0) continue;
                            const name = row[1]; const birthRaw = row[2]; const leaveHours = safeParseFloat(row[5]);
                            if (name) {
                                const normName = normalizeString(name);
                                const excelCol2 = normalizeString(row[2]);
                                
                                let targetStaff = staffList.find(s => {
                                    const dbName = normalizeString(s.name);
                                    if (dbName !== normName) return false;

                                    const dbBirth = normalizeString(s.birth);
                                    const dbBirthSafe = normalizeString(safeDate(s.birth)); 
                                    const excelCol2Safe = normalizeString(safeDate(excelCol2));
                                    const dbPhone = normalizeString(s.phone);
                                    
                                    if (dbBirth === excelCol2 || (dbBirthSafe && dbBirthSafe === excelCol2Safe)) return true;
                                    if (excelCol2 && dbPhone && (dbPhone.includes(excelCol2) || excelCol2.includes(dbPhone))) return true;
                                    return false;
                                });

                                if (!targetStaff) {
                                    const matchingNames = staffList.filter(s => normalizeString(s.name) === normName);
                                    if (matchingNames.length === 1) targetStaff = matchingNames[0]; 
                                }

                                if (targetStaff && leaveHours >= 0) {
                                    if (!updates[targetStaff.id]) { updates[targetStaff.id] = { newHistory: [...(targetStaff.leaveHistory || [])], staff: targetStaff }; }
                                    const history = updates[targetStaff.id].newHistory;
                                    const existingIdx = history.findIndex(h => h.date === uploadDate && h.type === uploadType);
                                    if (existingIdx !== -1) { history[existingIdx] = { ...history[existingIdx], days: leaveHours }; } 
                                    else if (leaveHours > 0) { history.push({ id: Date.now().toString() + Math.random(), date: uploadDate, days: leaveHours, type: uploadType, reason: '엑셀 일괄', addedBy: adminName, createdAt: new Date().toISOString() }); }
                                    updateCount++;
                                }
                            }
                        }
                    });

                    Object.keys(updates).forEach(uid => {
                        const { newHistory, staff } = updates[uid];
                        const currentInfo = calculateAnnualLeave(staff.joinDate);
                        const totalUsedHours = newHistory.reduce((acc, curr) => {
                            if (curr.date >= currentInfo.startDate && curr.date <= currentInfo.endDate) return acc + (safeParseFloat(curr.days) || 0);
                            return acc;
                        }, 0);
                        const ref = db.collection('users').doc(uid);
                        batch.update(ref, { 
                            annualLeaveUsed: totalUsedHours, 
                            annualLeaveTotal: currentInfo.total,
                            annualLeavePeriod: currentInfo.period,
                            leaveHistory: newHistory 
                        });
                    });
                    await batch.commit();
                    showAlert(`✅ 총 ${updateCount}건 처리 완료!`);
                }).catch(err => showAlert("오류: " + err.message));
            };

            return (
                <div className="space-y-6 relative">
                    <div className="sticky top-0 z-30 bg-[#F1F5F9] pb-4 pt-2 -mt-2">
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                                <div><h3 className="font-bold text-lg text-slate-800">{isPastMode ? '과년도' : '연차 관리'}</h3><p className="text-xs text-slate-500 font-bold">시간 단위(Hour) 관리 · 총 <span className="text-blue-600">{filteredList.length}</span>명</p></div>
                                {isPastMode && (<select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))} className="bg-white border rounded-lg px-3 py-1.5 outline-none">{[...Array(5)].map((_, i) => { const y = new Date().getFullYear() - i; return <option key={y} value={y}>{y}년</option> })}</select>)}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 md:gap-3 w-full md:w-auto">
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-orange-50 px-3 py-2 rounded-xl border border-orange-100 hover:bg-orange-100 transition"><input type="checkbox" checked={showCheckOnly} onChange={(e) => setShowCheckOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-orange-600 whitespace-nowrap flex items-center gap-1"><Icons.Alert /> 중복 확인</span></label>
                                <label className="flex-1 md:flex-none flex items-center justify-center gap-2 cursor-pointer bg-slate-50 px-3 py-2 rounded-xl border hover:bg-slate-100 transition"><input type="checkbox" checked={showNegativeOnly} onChange={(e) => setShowNegativeOnly(e.target.checked)} /><span className="text-[11px] md:text-sm font-bold text-red-500 whitespace-nowrap">초과자만</span></label>
                                <div className="flex w-full md:w-auto items-center gap-1">
                                    <input type="text" placeholder="이름 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-32 px-4 py-2 border rounded-xl text-sm outline-none mt-2 md:mt-0" />
                                    <button onClick={handleResetFilters} className="p-2.5 mt-2 md:mt-0 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition border border-slate-200" title="필터/검색 초기화"><Icons.Refresh /></button>
                                </div>
                                <input type="file" ref={fileInputRef} onChange={handleLeaveFileUpload} accept=".xlsx, .xls" multiple className="hidden" />
                                <div className="flex w-full md:w-auto gap-2 mt-2 md:mt-0 hidden md:flex">
                                    {!isResignedTab && <button onClick={handleResetAllLeaveHistory} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-red-100 transition" title="모든 직원의 연차 내역을 삭제합니다">전체 연차 초기화</button>}
                                    <button onClick={() => setShowMonthlyModal(true)} className="flex-1 md:flex-none bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-teal-700 transition shadow-sm" title="과거 특정 월을 선택하여 연차 현황을 조회 및 다운로드합니다."><Icons.FileText /> 월간 보고서</button>
                                    <button onClick={() => fileInputRef.current.click()} className="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-green-700 transition"><Icons.Upload /> 일괄</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap md:whitespace-normal">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('name')}><div className="flex items-center">이름 {getSortIcon('name')}</div></th>
                                    <th className="p-4 text-center text-blue-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('total')}><div className="flex items-center justify-center">총 연차 {getSortIcon('total')}</div></th>
                                    <th className="p-4 text-center text-red-500 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('used')}><div className="flex items-center justify-center">사용 {getSortIcon('used')}</div></th>
                                    <th className="p-4 text-center text-green-600 cursor-pointer hover:bg-slate-100 transition" onClick={() => handleSort('remaining')}><div className="flex items-center justify-center">잔여 {getSortIcon('remaining')}</div></th>
                                    <th className="p-4 w-44">기간</th><th className="p-4 min-w-[200px]">내역</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredList.map((data) => {
                                    const isDateError = !data.joinDate || data.joinDate.length < 8;
                                    return (
                                        <tr key={data.id} className="hover:bg-slate-50 transition">
                                            <td className="p-4">
                                                <div className="flex items-center gap-2">
                                                    <div className="font-bold text-slate-800 cursor-pointer hover:underline hover:text-blue-600" onClick={() => onNameClick && onNameClick(data)}>{data.name}</div>
                                                    <button onClick={() => setCalendarStaff(data)} className="text-blue-500 bg-blue-50 p-1.5 rounded-lg hover:bg-blue-100 hover:shadow-sm transition" title={`${data.name}의 개인 연차 캘린더 보기`}><Icons.Calendar /></button>
                                                </div>
                                                {data.workHours && <div className="text-xs text-slate-500 mt-1">일 {data.workHours}h</div>}
                                                {data.needsCheck && <div className="text-xs text-orange-600 font-bold mt-1 flex items-center gap-1 animate-pulse"><Icons.Alert /> 날짜 확인 필요</div>}
                                            </td>
                                            <td className="p-4 text-center font-bold text-blue-600">
                                                {isDateError ? <span className="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">입사일 확인</span> : <>{fmt(data.totalHours)}h <span className="text-xs font-normal text-slate-400">({data.totalDays}일)</span></>}
                                            </td>
                                            <td className="p-4 text-center font-bold text-red-500">{fmt(data.usedHours)}h <span className="text-xs font-normal text-slate-400">({data.usedDays}일)</span></td>
                                            <td className={`p-4 text-center font-black text-lg ${data.remainingHours < 0 ? 'text-red-600 animate-pulse' : 'text-green-600'}`}>{fmt(data.remainingHours)}h <span className="text-xs font-normal text-slate-400">({data.remainingDays}일)</span></td>
                                            <td className="p-4 text-xs text-slate-400">{data.leaveInfo.period}</td>
                                            <td className="p-4">{data.displayHistory.length > 0 ? (
                                                <div className="max-h-32 overflow-y-auto space-y-1 scrollbar-thin pr-2">
                                                    {data.displayHistory.map((rec, i) => (
                                                        <div key={rec.id || i} className={`flex items-center justify-between text-xs p-2 rounded-lg border md:group hover:border-blue-200 transition ${rec.isWarn ? 'bg-orange-50 border-orange-200' : 'bg-slate-50'}`}>
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold">{rec.date}</span>
                                                                <span className={`px-1.5 rounded text-[10px] font-bold ${rec.days >= data.dailyHours ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600'}`}>{fmt(rec.days)}h ({rec.type})</span>
                                                                {rec.isWarn && <span className="text-orange-500"><Icons.Alert /></span>}
                                                            </div>
                                                            <div className="flex gap-1 ml-2 flex-shrink-0 opacity-100">
                                                                <button type="button" onClick={() => onEditClick(data.id, 0, rec)} className="text-blue-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-blue-50 transition"><Icons.Edit /></button>
                                                                <button type="button" onClick={() => handleDeleteLeave(data, rec.id)} className="text-red-500 p-1.5 bg-white rounded-md shadow-sm border hover:bg-red-50 transition"><Icons.Trash /></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : <span className="text-slate-300 text-xs">-</span>}</td>
                                        </tr>
                                    );
                                })}
                                {filteredList.length === 0 && <tr><td colSpan="6" className="p-12 text-center text-slate-400">데이터가 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {!isResignedTab && (
                        <div className="fixed bottom-6 right-6 md:bottom-10 md:right-10 flex flex-col gap-3 z-40">
                            <button onClick={() => setShowMonthlyModal(true)} className="md:hidden bg-teal-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(13,148,136,0.4)] hover:bg-teal-700 active:scale-95 transition-all" title="보고서 다운로드"><Icons.FileText /></button>
                            <button onClick={() => fileInputRef.current.click()} className="md:hidden bg-green-600 text-white w-12 h-12 rounded-full flex justify-center items-center shadow-[0_4px_10px_rgba(22,163,74,0.4)] hover:bg-green-700 active:scale-95 transition-all" title="일괄 업로드"><Icons.Upload /></button>
                            <button onClick={() => onOpenModal()} className="bg-blue-600 text-white w-14 h-14 md:w-auto md:px-6 md:py-4 md:h-auto rounded-full flex items-center justify-center gap-2 shadow-[0_10px_20px_rgba(37,99,235,0.4)] hover:bg-blue-700 active:scale-95 md:hover:-translate-y-1 transition-all" title="연차 등록"><Icons.Plus /><span className="font-bold text-sm whitespace-nowrap hidden md:inline">연차 등록</span></button>
                        </div>
                    )}

                    {calendarStaff && <PersonalCalendarModal staff={calendarStaff} onClose={() => setCalendarStaff(null)} onOpenModal={onOpenModal} />}
                    {showMonthlyModal && <MonthlyReportModal staffList={staffList} onClose={() => setShowMonthlyModal(false)} />}
                </div>
            );
        };

        const StaffTab = ({ staffList, showConfirm, showAlert }) => {
            const fileInputRef = useRef(null);
            const [uploadMsg, setUploadMsg] = useState('');
            const [editingStaff, setEditingStaff] = useState(null);
            const [viewingStaff, setViewingStaff] = useState(null);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            
            const activeStaffList = useMemo(() => staffList.filter(s => s.status !== 'resigned'), [staffList]);

            const processedStaffList = useMemo(() => {
                let data = [...activeStaffList];
                if (searchTerm) {
                    const lowerTerm = searchTerm.toLowerCase();
                    data = data.filter(s => (s.name && s.name.toLowerCase().includes(lowerTerm)) || (s.phone && s.phone.includes(lowerTerm)));
                }
                
                data = data.map(staff => {
                    const leaveInfo = calculateAnnualLeave(staff.joinDate);
                    const dailyHours = safeParseFloat(staff.workHours) || 8;
                    const totalDays = leaveInfo.total || 0;
                    const totalHours = totalDays * dailyHours;
                    const usedHours = staff.annualLeaveUsed || 0;
                    const remainingHours = totalHours - usedHours;
                    const remainingDays = dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0;
                    const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                    
                    return { ...staff, dailyHours, totalDays, totalHours, usedHours, remainingHours, remainingDays, usedDays, leaveInfo };
                });

                if (sortConfig.key) {
                    data.sort((a, b) => {
                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        if (sortConfig.key === 'remaining') { aVal = a.remainingHours; bVal = b.remainingHours; }
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return data;
            }, [activeStaffList, searchTerm, sortConfig]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };
            const getSortIcon = (key) => {
                if (sortConfig.key !== key) return <span className="text-slate-300 ml-1">⇅</span>;
                return sortConfig.direction === 'asc' ? <span className="text-blue-600 ml-1"><Icons.SortAsc /></span> : <span className="text-blue-600 ml-1"><Icons.SortDesc /></span>;
            };
            
            const handleFileUpload = (e, isResignedUpload = false) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        if (jsonData.length < 2) { setUploadMsg('❌ 데이터 없음'); return; }
                        const batch = db.batch();
                        let count = 0;
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length === 0) continue;
                            const name = row[0]; 
                            if (name) {
                                const birthRaw = row[1]; const phoneRaw = row[2]; const joinRaw = row[3]; const workRaw = row[4];
                                const joinDate = safeDate(joinRaw); const birthDate = safeDate(birthRaw);
                                const leaveInfo = calculateAnnualLeave(joinDate);
                                
                                const phoneStr = String(phoneRaw || '').replace(/[^0-9]/g, '').trim();
                                const last4 = phoneStr.length >= 4 ? phoneStr.slice(-4) : '0000';
                                const uniqueKey = `yg${last4}`;
                                const email = `${uniqueKey}@ygnurim.com`;
                                
                                const docRef = db.collection('users').doc(email);
                                batch.set(docRef, {
                                    name, birth: birthDate, phone: phoneRaw || '', workHours: workRaw || '', 
                                    joinDate, employeeId: uniqueKey, role: 'staff', tempPw: '123456', 
                                    annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-',
                                    status: isResignedUpload ? 'resigned' : 'active', resignDate: isResignedUpload ? (safeDate(resignDate) || '') : '',
                                    offDays: [0] 
                                }, { merge: true });
                                count++;
                            }
                        }
                        await batch.commit();
                        setUploadMsg(`✅ ${count}명 처리 완료!`);
                        setTimeout(() => setUploadMsg(''), 3000);
                    } catch (err) { setUploadMsg('❌ 오류: ' + err.message); }
                };
            };

            const handleDeleteOne = (staff) => {
                showConfirm(`정말 [${staff.name}] 직원의 정보를 완전히 삭제하시겠습니까?`, async () => {
                    try { await db.collection('users').doc(staff.id).delete(); showAlert('삭제 완료되었습니다.'); } catch (err) { showAlert('삭제 실패: ' + err.message); }
                });
            };
            const handleSelectAll = (e) => {
                if (e.target.checked) { const allIds = new Set(processedStaffList.map(s => s.id)); setSelectedIds(allIds); } else setSelectedIds(new Set());
            };
            const handleSelectOne = (id) => {
                const newSet = new Set(selectedIds);
                if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
                setSelectedIds(newSet);
            };
            const handleBulkDelete = () => {
                if (selectedIds.size === 0) return;
                showConfirm(`선택한 ${selectedIds.size}명의 직원을 일괄 삭제하시겠습니까?`, async () => {
                    try {
                        const batch = db.batch();
                        selectedIds.forEach(id => { batch.delete(db.collection('users').doc(id)); });
                        await batch.commit();
                        showAlert(`${selectedIds.size}명 삭제가 완료되었습니다.`);
                        setSelectedIds(new Set());
                    } catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            const handleResetFilters = () => {
                setSearchTerm('');
                setSelectedIds(new Set());
            };

            const handleBatchCreateAuth = () => {
                showConfirm("현재 등록된 모든 직원의 계정을 'yg+휴대폰뒤4자리' (비밀번호: 123456) 형식으로 일괄 생성하시겠습니까?\n\n※ 기존 연차 내역은 완벽히 보존됩니다.", async () => {
                    setUploadMsg('계정 생성 중입니다. 잠시만 기다려주세요...');
                    try {
                        let secondaryApp;
                        if (!firebase.apps.find(app => app.name === 'Secondary')) {
                            secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary');
                        } else {
                            secondaryApp = firebase.app('Secondary');
                        }
                        
                        const batch = db.batch();
                        let count = 0;

                        for (const staff of activeStaffList) {
                            const phoneStr = String(staff.phone || '').replace(/[^0-9]/g, '');
                            if (phoneStr.length < 4) continue;
                            
                            const last4 = phoneStr.slice(-4);
                            const loginId = `yg${last4}`; 
                            const email = `${loginId}@ygnurim.com`;
                            const tempPw = '123456';

                            try {
                                await secondaryApp.auth().createUserWithEmailAndPassword(email, tempPw);
                            } catch (authErr) {
                                if (authErr.code === 'auth/email-already-in-use') {
                                    console.log('Account already exists, skipping:', email);
                                } else {
                                    console.error('Auth Error:', authErr);
                                }
                            }

                            if (staff.id !== email) {
                                const newRef = db.collection('users').doc(email);
                                const oldRef = db.collection('users').doc(staff.id);
                                
                                const newData = { ...staff, employeeId: loginId, email: email, tempPw: tempPw };
                                delete newData.id; 
                                batch.set(newRef, newData);
                                batch.delete(oldRef); 
                            } else {
                                const ref = db.collection('users').doc(staff.id);
                                batch.update(ref, { tempPw: tempPw, employeeId: loginId });
                            }
                            count++;
                        }

                        await batch.commit();
                        await secondaryApp.auth().signOut(); 
                        
                        setUploadMsg(`✅ ${count}명 신규 계정(yg) 발급 완료!`);
                        setTimeout(() => setUploadMsg(''), 4000);
                    } catch (err) {
                        setUploadMsg(`❌ 오류: ${err.message}`);
                    }
                });
            };

            return (
                <div className="space-y-6">
                    {editingStaff && <EditStaffModal staff={editingStaff} onClose={() => setEditingStaff(null)} showAlert={showAlert} />}
                    {viewingStaff && <StaffDetailModal staff={viewingStaff} onClose={() => setViewingStaff(null)} />}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto justify-between">
                            <div><h3 className="font-bold text-lg text-slate-800">직원 명부 관리</h3><p className="text-xs text-slate-500">총 {processedStaffList.length}명 (퇴사자 제외)</p></div>
                        </div>
                        <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                            <div className="relative flex items-center w-full md:w-auto gap-1">
                                <div className="relative group flex-1 md:flex-none">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500"><Icons.Search /></div>
                                    <input type="text" placeholder="이름 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full md:w-64 pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition" />
                                </div>
                                <button onClick={handleResetFilters} className="p-2.5 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 transition border border-slate-200" title="초기화"><Icons.Refresh /></button>
                            </div>
                            {selectedIds.size > 0 && (<button onClick={handleBulkDelete} className="flex-1 md:flex-none bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-600 transition flex justify-center items-center gap-2 animate-fade-in shadow-lg shadow-red-200"><Icons.Trash /> 선택 삭제 ({selectedIds.size})</button>)}
                            {uploadMsg && <span className="w-full md:w-auto text-sm font-bold text-blue-600 animate-pulse text-center">{uploadMsg}</span>}
                            
                            <button onClick={handleBatchCreateAuth} className="flex-1 md:flex-none bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 transition flex justify-center items-center gap-2" title="선택된 항목과 무관하게 모든 직원에게 계정을 발급합니다">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> 
                                일괄 계정 발급
                            </button>

                            <input type="file" ref={fileInputRef} onChange={(e) => handleFileUpload(e, false)} accept=".xlsx, .xls, .csv" className="hidden" />
                            <button onClick={() => fileInputRef.current.click()} className="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-green-700 transition flex justify-center items-center gap-2"><Icons.Upload /> 엑셀 업로드</button>
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-x-auto whitespace-nowrap md:whitespace-normal">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                <tr>
                                    <th className="p-4 w-12 text-center"><input type="checkbox" checked={processedStaffList.length > 0 && selectedIds.size === processedStaffList.length} onChange={handleSelectAll} /></th>
                                    <th className="p-4 sortable" onClick={() => handleSort('name')}><div className="flex items-center">이름 (상세보기) {getSortIcon('name')}</div></th>
                                    <th className="p-4 text-center text-blue-600">발생(시간)</th>
                                    <th className="p-4 text-center text-red-500">사용(시간)</th>
                                    <th className="p-4 text-center text-green-600 sortable" onClick={() => handleSort('remaining')}><div className="flex items-center justify-center">잔여(시간) {getSortIcon('remaining')}</div></th>
                                    <th className="p-4 text-center w-24 bg-slate-100">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {processedStaffList.map((staff, idx) => {
                                    const isDateError = !staff.joinDate || staff.joinDate.length < 8;
                                    return (
                                        <tr key={idx} className={`hover:bg-slate-50 transition ${selectedIds.has(staff.id) ? 'bg-blue-50/50' : ''}`}>
                                            <td className="p-4 text-center"><input type="checkbox" checked={selectedIds.has(staff.id)} onChange={() => handleSelectOne(staff.id)} /></td>
                                            <td className="p-4 font-bold text-blue-600 cursor-pointer hover:underline" onClick={() => setViewingStaff(staff)}>
                                                {staff.name} <span className="text-slate-400 text-xs font-normal ml-1">click</span>
                                            </td>
                                            <td className="p-4 text-center font-bold text-blue-600">
                                                {isDateError ? <span className="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">입사일 확인</span> : <>{fmt(staff.totalHours)}h <span className="text-xs font-normal text-slate-400">({staff.totalDays}일)</span></>}
                                            </td>
                                            <td className="p-4 text-center text-slate-400">{fmt(staff.usedHours)}h <span className="text-xs font-normal text-slate-400">({staff.usedDays}일)</span></td>
                                            <td className="p-4 text-center font-bold text-green-600">{fmt(staff.remainingHours)}h <span className="text-xs font-normal text-slate-400">({staff.remainingDays}일)</span></td>
                                            <td className="p-4 text-center bg-slate-50/50"><div className="flex justify-center gap-2"><button onClick={() => setEditingStaff(staff)} className="p-2 bg-white border text-blue-500 hover:bg-blue-100 rounded-lg transition"><Icons.Edit /></button><button onClick={() => handleDeleteOne(staff)} className="p-2 bg-white border text-red-400 hover:bg-red-100 rounded-lg transition"><Icons.Trash /></button></div></td>
                                        </tr>
                                    );
                                })}
                                {processedStaffList.length === 0 && (<tr><td colSpan="6" className="p-12 text-center text-slate-400">데이터가 없습니다.</td></tr>)}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const ResignedStaffTab = ({ staffList, onOpenModal, onEditClick, onNameClick, showAlert, showConfirm }) => {
            const [isPastMode, setIsPastMode] = useState(false);
            const resignedFileInputRef = useRef(null);
            
            const resignedList = useMemo(() => staffList.filter(s => s.status === 'resigned' || (s.resignDate && s.resignDate.trim().length > 0)), [staffList]);

            const handleResignedStaffUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        const batch = db.batch();
                        let count = 0;
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length === 0) continue;
                            const name = row[0];
                            if (name) {
                                const birthRaw = row[1]; const phoneRaw = row[2]; const joinRaw = row[3]; const workRaw = row[4]; const resignRaw = row[5];
                                const joinDate = safeDate(joinRaw); const birthDate = safeDate(birthRaw); const resignDate = safeDate(resignRaw);
                                const leaveInfo = calculateAnnualLeave(joinDate);
                                const email = `${name}_${String(phoneRaw||'').trim().slice(-4)}@ygnurim.com`;
                                const docRef = db.collection('users').doc(email);
                                batch.set(docRef, {
                                    name, birth: birthDate, phone: phoneRaw || '', workHours: workRaw || '', 
                                    joinDate, role: 'staff', tempPw: '123456', 
                                    annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-',
                                    status: 'resigned', resignDate: resignDate || '',
                                    offDays: [0] // [v5.4.0] 퇴사자 명부 업로드 시 기본 휴무일 일요일(0) 자동 부여
                                }, { merge: true });
                                count++;
                            }
                        }
                        await batch.commit();
                        showAlert(`✅ 퇴사자 ${count}명 명부 등록 완료!`);
                    } catch (err) { showAlert('오류: ' + err.message); }
                };
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-orange-50 p-4 rounded-xl border border-orange-100 gap-4">
                        <div className="flex items-center gap-2 font-bold text-orange-800"><Icons.UserMinus /> 퇴사자 관리 모드</div>
                        <div className="flex flex-col md:flex-row items-stretch md:items-center gap-3 w-full md:w-auto">
                            <label className="flex items-center justify-center gap-2 cursor-pointer bg-white px-3 py-3 md:py-2 rounded-lg border border-orange-200 hover:bg-orange-100 transition"><input type="checkbox" checked={isPastMode} onChange={(e) => setIsPastMode(e.target.checked)} /><span className="text-sm font-bold text-orange-700">과년도 기록 보기</span></label>
                            <input type="file" ref={resignedFileInputRef} onChange={handleResignedStaffUpload} accept=".xlsx, .xls" className="hidden" />
                            <button onClick={() => resignedFileInputRef.current.click()} className="bg-orange-500 text-white px-4 py-3 md:py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-orange-600 transition shadow-lg shadow-orange-200"><Icons.Upload /> 퇴사자 명부 업로드</button>
                        </div>
                    </div>
                    <LeaveManagementTab 
                        staffList={resignedList} 
                        onOpenModal={() => showAlert("퇴사자는 신규 연차 등록이 불가능합니다.")} 
                        onEditClick={onEditClick} 
                        isPastMode={isPastMode} 
                        isResignedTab={true}
                        onNameClick={onNameClick}
                        adminName="System"
                        showConfirm={showConfirm}
                        showAlert={showAlert}
                    />
                </div>
            );
        };

        const StaffPortal = ({ user, onLogout, showAlert, showConfirm }) => {
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);

            const [dateMode, setDateMode] = useState('single'); 
            const [leaveDate, setLeaveDate] = useState(toLocalYMD(new Date()));
            const [endDate, setEndDate] = useState(toLocalYMD(new Date()));
            const [customDates, setCustomDates] = useState([]);
            const [customDateInput, setCustomDateInput] = useState('');
            const [customYear, setCustomYear] = useState(new Date().getFullYear());
            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1'); 
            const [leaveHourValue, setLeaveHourValue] = useState(''); 
            const [reason, setReason] = useState('');

            useEffect(() => {
                const unsub = db.collection('users').doc(user.email).onSnapshot(doc => {
                    if (doc.exists) {
                        setUserData({ id: doc.id, ...doc.data() });
                    }
                    setLoading(false);
                });
                return () => unsub();
            }, [user.email]);

            const leaveStats = useMemo(() => {
                if (!userData || !userData.joinDate) return null;
                const leaveInfo = calculateAnnualLeave(userData.joinDate);
                const dailyHours = safeParseFloat(userData.workHours) || 8;
                const totalDays = leaveInfo.total || 0;
                const totalHours = totalDays * dailyHours;
                
                const activeHistory = (userData.leaveHistory || []).filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                const usedHours = activeHistory.reduce((acc, cur) => acc + safeParseFloat(cur.days), 0);
                const remainingHours = totalHours - usedHours;
                
                return {
                    ...leaveInfo,
                    totalDays,
                    dailyHours, totalHours, usedHours, remainingHours,
                    usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0,
                    remainingDays: dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0,
                    displayHistory: activeHistory.sort((a,b) => new Date(b.date) - new Date(a.date))
                };
            }, [userData]);

            useEffect(() => {
                if (dateMode === 'multi') { setInputType('day'); setLeaveDayType('1'); }
            }, [dateMode]);

            const validDates = useMemo(() => {
                if (dateMode === 'single') return [leaveDate];
                if (dateMode === 'custom') return customDates.map(c => c.date); 
                let dates = [];
                let curr = new Date(leaveDate); let last = new Date(endDate);
                if (curr > last) return []; 

                // [v5.4.0] 직원 포털 휴가 신청 시 본인의 휴무일 자동 제외
                const offDays = userData && userData.offDays ? userData.offDays : [0]; 

                while(curr <= last) {
                    const day = curr.getDay();
                    if(!offDays.includes(day)) {
                        dates.push(toLocalYMD(curr));
                    }
                    curr.setDate(curr.getDate() + 1);
                }
                return dates;
            }, [leaveDate, endDate, customDates, dateMode, userData]);

            const handleAddCustomDate = () => {
                if (!customDateInput.trim()) return;
                const dailyHours = safeParseFloat(userData?.workHours) || 8;
                let deductHours = inputType === 'day' ? (leaveDayType === '1' ? dailyHours : dailyHours / 2) : safeParseFloat(leaveHourValue);
                if (deductHours <= 0) { showAlert('❌ 시간을 확인하세요.'); return; }
                const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;

                const parts = customDateInput.split(/[, ]+/);
                const newParsedDates = [];

                parts.forEach(p => {
                    const s = p.trim(); if (!s) return;
                    let parsedDate = '';
                    const matchFull = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})$/);
                    const matchMonthDay = s.match(/^(\d{1,2})[\.\-\/](\d{1,2})$/);

                    if (matchFull) {
                        parsedDate = `${matchFull[1]}-${matchFull[2].padStart(2, '0')}-${matchFull[3].padStart(2, '0')}`;
                    } else if (matchMonthDay) {
                        parsedDate = `${customYear}-${matchMonthDay[1].padStart(2, '0')}-${matchMonthDay[2].padStart(2, '0')}`;
                    } else if (s.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        parsedDate = s;
                    }

                    if (parsedDate && !customDates.some(cd => cd.date === parsedDate)) {
                        newParsedDates.push({ date: parsedDate, type: typeText, deductHours });
                    }
                });

                if (newParsedDates.length > 0) {
                    setCustomDates([...customDates, ...newParsedDates].sort((a,b) => a.date.localeCompare(b.date)));
                    setCustomDateInput('');
                } else showAlert('❌ 올바른 날짜 형식을 입력하세요 (예: 4.1, 2026.5.21)');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!userData) return;
                const dailyHours = leaveStats.dailyHours;
                let deductHours = inputType === 'day' ? (leaveDayType === '1' ? dailyHours : dailyHours / 2) : safeParseFloat(leaveHourValue);
                if (dateMode !== 'custom' && deductHours <= 0) { showAlert('❌ 시간을 입력하세요.'); return; }
                if (validDates.length === 0) { showAlert('❌ 선택된 날짜가 없습니다. (휴무일과 겹치는지 확인해주세요)'); return; }

                try {
                    let newHistory = [...(userData.leaveHistory || [])];
                    const typeText = inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${deductHours}시간`;
                    
                    if (dateMode === 'custom') {
                        customDates.forEach((item, idx) => {
                            newHistory.push({ id: Date.now().toString() + idx, date: safeDate(item.date), days: item.deductHours, type: item.type, reason, addedBy: '본인(직원)', createdAt: new Date().toISOString() });
                        });
                    } else {
                        validDates.forEach((d, idx) => {
                            newHistory.push({ id: Date.now().toString() + idx, date: safeDate(d), days: deductHours, type: typeText, reason, addedBy: '본인(직원)', createdAt: new Date().toISOString() });
                        });
                    }

                    const totalUsedHours = newHistory.reduce((acc, curr) => (curr.date >= leaveStats.startDate && curr.date <= leaveStats.endDate) ? acc + safeParseFloat(curr.days) : acc, 0);
                    
                    await db.collection('users').doc(userData.id).update({ 
                        annualLeaveUsed: totalUsedHours, 
                        annualLeaveTotal: leaveStats.totalDays,
                        annualLeavePeriod: leaveStats.period,
                        leaveHistory: newHistory 
                    });
                    
                    showAlert('✅ 연차 등록 완료!'); 
                    setCustomDates([]); setReason('');
                } catch (err) { showAlert('❌ 오류: ' + err.message); }
            };

            const handleDeleteLeave = (leaveId) => {
                showConfirm('정말 연차 내역을 삭제하시겠습니까?', async () => {
                    try {
                        const newHistory = (userData.leaveHistory || []).filter(h => h.id !== leaveId);
                        const totalUsedHours = newHistory.reduce((acc, curr) => (curr.date >= leaveStats.startDate && curr.date <= leaveStats.endDate) ? acc + safeParseFloat(curr.days) : acc, 0);
                        
                        await db.collection('users').doc(userData.id).update({ 
                            annualLeaveUsed: totalUsedHours, 
                            annualLeaveTotal: leaveStats.totalDays,
                            annualLeavePeriod: leaveStats.period,
                            leaveHistory: newHistory 
                        });
                    } catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            const currentYearNum = new Date().getFullYear();
            const yearOptions = [currentYearNum + 1, currentYearNum, currentYearNum - 1, currentYearNum - 2, currentYearNum - 3, currentYearNum - 4];

            if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!userData || !userData.joinDate) return (
                <div className="flex h-screen items-center justify-center bg-slate-50 flex-col gap-4">
                    <p className="text-slate-600 font-bold">인사 정보가 등록되지 않았습니다. 관리자에게 문의하세요.</p>
                    <button type="button" onClick={onLogout} className="bg-slate-800 text-white px-6 py-2 rounded-xl text-sm">로그아웃</button>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#F1F5F9] font-sans relative">
                    <nav className="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-30">
                        <div className="flex items-center gap-3">
                            <img src="logo.png" alt="양지누림 로고" className="h-8 object-contain hidden md:block" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                            <h1 className="text-2xl font-black text-blue-600 tracking-tighter md:hidden">양지누림</h1>
                            <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase hidden sm:block">Employee Portal</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block"><p className="text-sm font-bold text-slate-800">{userData.name} 님</p><p className="text-[10px] text-slate-500 uppercase">{safeDate(userData.joinDate)} 입사</p></div>
                            <button type="button" onClick={onLogout} className="p-2 text-slate-400 hover:text-red-500 transition bg-slate-50 rounded-full"><Icons.LogOut /></button>
                        </div>
                    </nav>

                    <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-6 animate-fade-in">
                        <h2 className="text-lg font-black text-slate-800 flex items-center gap-2"><Icons.User /> 나의 연차 현황 <span className="text-xs font-normal text-slate-400">({leaveStats.period})</span></h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-blue-500">
                                <div><p className="text-xs font-bold text-slate-400 mb-1">총 발생 연차</p><span className="text-2xl font-black text-slate-800">{leaveStats.totalDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-red-500">
                                <div><p className="text-xs font-bold text-slate-400 mb-1">사용 연차</p><span className="text-2xl font-black text-red-500">{leaveStats.usedDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-green-500">
                                <div><p className="text-xs font-bold text-slate-400 mb-1">잔여 연차</p><span className="text-2xl font-black text-green-600">{leaveStats.remainingDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Plus /> 휴가 신청하기</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        <label className="block text-xs font-bold text-slate-700 mb-2">등록 단위 선택</label>
                                        <div className={`flex gap-2 mb-2 ${dateMode === 'multi' ? 'opacity-50 pointer-events-none' : ''}`}>
                                            <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="day" checked={inputType === 'day'} onChange={() => setInputType('day')} className="hidden"/>일 단위</label>
                                            <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="hour" checked={inputType === 'hour'} onChange={() => setInputType('hour')} className="hidden"/>시간 단위</label>
                                        </div>
                                        {inputType === 'day' ? (
                                            <div className="flex gap-2">
                                                <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '1' ? 'bg-blue-50 border-blue-200 text-blue-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="1" checked={leaveDayType === '1'} onChange={() => setLeaveDayType('1')} className="hidden"/>연차 (1일)</label>
                                                <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '0.5' ? 'bg-orange-50 border-orange-200 text-orange-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="0.5" checked={leaveDayType === '0.5'} onChange={() => setLeaveDayType('0.5')} className="hidden"/>반차 (0.5일)</label>
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2"><input type="number" value={leaveHourValue} onChange={e => setLeaveHourValue(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center bg-white" placeholder="시간 입력" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>
                                        )}
                                    </div>

                                    <div>
                                        <div className="flex bg-slate-100 p-1 rounded-xl mb-3">
                                            <button type="button" onClick={() => setDateMode('single')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'single' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>단일 날짜</button>
                                            <button type="button" onClick={() => setDateMode('multi')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'multi' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>기간 설정</button>
                                            <button type="button" onClick={() => setDateMode('custom')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === 'custom' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>지정일 선택</button>
                                        </div>
                                    </div>

                                    {dateMode === 'single' && (
                                        <div><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100" required /></div>
                                    )}
                                    
                                    {dateMode === 'multi' && (
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                            <label className="block text-xs font-bold text-blue-600 mb-1">기간 선택 (직원 휴무일 자동 제외 / 연차 1일 단위 전용)</label>
                                            <div className="flex items-center gap-2">
                                                <input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required />
                                                <span className="text-slate-400 font-bold">~</span>
                                                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required />
                                            </div>
                                        </div>
                                    )}

                                    {dateMode === 'custom' && (
                                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                            <div className="flex items-center gap-2 mb-3">

                                        <thead className="bg-slate-50 text-slate-500 font-bold sticky top-0 border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center text-red-500">현재 (잘못됨)</th><th className="p-3 text-center">→</th><th className="p-3 text-center text-green-600">수정 후</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {birthIssues.map(it => (<tr key={it.id} className="hover:bg-slate-50"><td className="p-3 font-bold text-slate-800">{it.name}</td><td className="p-3 text-center font-bold text-red-500">{it.before}</td><td className="p-3 text-center text-slate-300">→</td><td className="p-3 text-center font-bold text-green-600">{it.after}</td></tr>))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        {birthIssues && birthIssues.length === 0 && (<p className="mt-3 text-sm font-bold text-green-600 bg-green-50 px-4 py-3 rounded-xl border border-green-100">✅ 미래 날짜로 저장된 생년월일이 없습니다.</p>)}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col hover:border-blue-300 transition">
                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-4"><Icons.Download /></div>
                            <h4 className="font-bold text-slate-800 mb-2">DB 백업 (내보내기)</h4>
                            <p className="text-xs text-slate-500 mb-6 flex-1 leading-relaxed">현재 시스템에 등록된 전체 데이터(직원 명부, 계정 정보, 연차 내역 등)를 하나의 파일(.json)로 생성하여 PC에 다운로드합니다.<br/><br/><span className="font-bold text-blue-600">※ 최소 매월 1회 정기 백업을 적극 권장합니다.</span></p>
                            <button onClick={handleBackup} disabled={isProcessing} className="bg-blue-600 text-white w-full py-3.5 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex justify-center items-center gap-2"><Icons.Database /> 시스템 DB 백업</button>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col hover:border-orange-300 transition">
                            <div className="w-12 h-12 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center mb-4"><Icons.Upload /></div>
                            <h4 className="font-bold text-slate-800 mb-2">DB 복원 (가져오기)</h4>
                            <p className="text-xs text-slate-500 mb-6 flex-1 leading-relaxed">기존에 다운로드했던 백업 파일(.json)을 업로드하여 시스템을 과거 상태로 완벽하게 되돌립니다.<br/><br/><span className="text-red-500 font-bold">⚠️ 주의: 현재 화면의 데이터는 모두 삭제되고 백업 시점의 과거 데이터로 덮어씌워집니다.</span></p>
                            <input type="file" accept=".json" ref={fileRef} onChange={handleRestore} className="hidden" />
                            <button onClick={() => fileRef.current.click()} disabled={isProcessing} className="bg-orange-500 text-white w-full py-3.5 rounded-xl font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-200 flex justify-center items-center gap-2"><Icons.Refresh /> 백업 파일로 복원</button>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-700 flex flex-col hover:border-slate-500 transition">
                            <div className="w-12 h-12 bg-slate-700 text-white rounded-xl flex items-center justify-center mb-4"><Icons.Code /></div>
                            <h4 className="font-bold text-white mb-2">소스코드 원본 백업</h4>
                            <p className="text-xs text-slate-300 mb-6 flex-1 leading-relaxed">서버(GitHub)를 거치지 않고 현재 내 브라우저에서 실행 중인 무결점 상태의 시스템 소스코드 원본(`index.html`)을 내 PC로 직접 내려받습니다.<br/><br/>서버나 인터넷 환경에 문제가 생겼을 때 이 파일만 열면 시스템이 구동됩니다.</p>
                            <button onClick={handleCodeBackup} disabled={isProcessing} className="bg-slate-600 text-white w-full py-3.5 rounded-xl font-bold hover:bg-slate-500 transition shadow-lg flex justify-center items-center gap-2 border border-slate-500"><Icons.Download /> 소스코드(HTML) 백업</button>
                        </div>
                    </div>
                </div>
            );
        };

        const StaffPortal = ({ user, onLogout, showAlert }) => {
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showGuide, setShowGuide] = useState(false); // [v6.7.0] 사용 가이드
            const [showTour, setShowTour] = useState(false);   // [v6.8.0] 오버레이 투어
            const [showHelpMenu, setShowHelpMenu] = useState(false);
            const helpRef = useRef(null);
            const [dateMode, setDateMode] = useState('single');
            const [leaveDate, setLeaveDate] = useState(toLocalYMD(new Date()));
            const [endDate, setEndDate] = useState(toLocalYMD(new Date()));
            const [customDates, setCustomDates] = useState([]);
            const [customDateInput, setCustomDateInput] = useState('');
            const [customYear, setCustomYear] = useState(new Date().getFullYear());
            const [inputType, setInputType] = useState('day');
            const [leaveDayType, setLeaveDayType] = useState('1');
            const [leaveHourValue, setLeaveHourValue] = useState('');
            const [reason, setReason] = useState('');

            useEffect(() => {
                const unsub = db.collection('users').doc(user.email).onSnapshot(doc => {
                    if (doc.exists) setUserData({ id: doc.id, ...doc.data() });
                    setLoading(false);
                });
                return () => unsub();
            }, [user.email]);

            // [v6.7.0] 최초 접속 시 가이드 1회 자동 노출
            useEffect(() => {
                if (loading) return;
                let seen = null;
                try { seen = localStorage.getItem(GUIDE_KEY); } catch (e) {}
                if (!seen) { const t = setTimeout(() => setShowGuide(true), 600); return () => clearTimeout(t); }
            }, [loading]);

            // [v6.8.0] 도움말 드롭다운 바깥 클릭 시 닫기
            useEffect(() => {
                const h = (e) => { if (helpRef.current && !helpRef.current.contains(e.target)) setShowHelpMenu(false); };
                document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, []);

            const leaveStats = useMemo(() => {
                if (!userData || !userData.joinDate) return null;
                const leaveInfo = calculateAnnualLeave(userData.joinDate);
                const dailyHours = safeParseFloat(userData.workHours) || 8;
                const totalDays = leaveInfo.total || 0;
                const totalHours = totalDays * dailyHours;
                const activeHistory = (userData.leaveHistory || []).filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                const usedHours = activeHistory.reduce((acc, cur) => acc + safeParseFloat(cur.days), 0);
                const remainingHours = totalHours - usedHours;
                return { ...leaveInfo, totalDays, dailyHours, totalHours, usedHours, remainingHours,
                    usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0,
                    remainingDays: dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0,
                    displayHistory: [...activeHistory].sort((a, b) => b.date.localeCompare(a.date)) };
            }, [userData]);

            useEffect(() => { if (dateMode === 'multi') { setInputType('day'); setLeaveDayType('1'); } }, [dateMode]);

            const validDates = useMemo(() => {
                if (dateMode === 'single') return [leaveDate];
                if (dateMode === 'custom') return customDates.map(c => c.date);
                return listWorkingDates(leaveDate, endDate, userData?.offDays);
            }, [leaveDate, endDate, customDates, dateMode, userData]);

            const calcDeductHours = () => {
                const dailyHours = safeParseFloat(userData?.workHours) || 8;
                return inputType === 'day' ? (leaveDayType === '1' ? dailyHours : dailyHours / 2) : safeParseFloat(leaveHourValue);
            };
            const typeTextOf = (hours) => inputType === 'day' ? (leaveDayType === '1' ? '연차' : '반차') : `${hours}시간`;

            const handleAddCustomDate = () => {
                if (!customDateInput.trim()) return;
                const deductHours = calcDeductHours();
                if (deductHours <= 0) { showAlert('❌ 시간을 확인하세요.'); return; }
                const tText = typeTextOf(deductHours);
                const parsed = parseCustomDates(customDateInput, customYear).filter(d => !customDates.some(cd => cd.date === d));
                if (parsed.length) { setCustomDates([...customDates, ...parsed.map(d => ({ date: d, type: tText, deductHours }))].sort((a, b) => a.date.localeCompare(b.date))); setCustomDateInput(''); }
                else showAlert('❌ 올바른 날짜 형식을 입력하세요 (예: 4.1, 2026.5.21)');
            };

            const handleSubmit = async (e) => {
                e.preventDefault(); if (!userData) return;
                const deductHours = calcDeductHours();
                if (dateMode !== 'custom' && deductHours <= 0) { showAlert('❌ 시간을 입력하세요.'); return; }
                if (!validDates.length) { showAlert('❌ 선택된 날짜가 없습니다. (휴무일과 겹치는지 확인해주세요)'); return; }
                try {
                    const newHistory = [...(userData.leaveHistory || [])];
                    const tText = typeTextOf(deductHours);
                    if (dateMode === 'custom') customDates.forEach((item, idx) => newHistory.push({ id: Date.now().toString() + idx, date: safeDate(item.date), days: item.deductHours, type: item.type, reason, addedBy: '본인(직원)', createdAt: new Date().toISOString() }));
                    else validDates.forEach((d, idx) => newHistory.push({ id: Date.now().toString() + idx, date: safeDate(d), days: deductHours, type: tText, reason, addedBy: '본인(직원)', createdAt: new Date().toISOString() }));
                    await recalcAndSave(userData.id, userData.joinDate, newHistory);
                    showAlert('✅ 연차 등록 완료!'); setCustomDates([]); setReason('');
                } catch (err) { showAlert('❌ 오류: ' + err.message); }
            };

            const currentYearNum = new Date().getFullYear();
            const yearOptions = [currentYearNum + 1, currentYearNum, currentYearNum - 1, currentYearNum - 2, currentYearNum - 3, currentYearNum - 4];

            if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!userData || !userData.joinDate) return (<div className="flex h-screen items-center justify-center bg-slate-50 flex-col gap-4"><p className="text-slate-600 font-bold">인사 정보가 등록되지 않았습니다. 관리자에게 문의하세요.</p><button type="button" onClick={onLogout} className="bg-slate-800 text-white px-6 py-2 rounded-xl text-sm">로그아웃</button></div>);

            return (
                <div className="min-h-screen bg-[#F1F5F9] font-sans relative">
                    {showGuide && <StaffGuideModal onClose={() => setShowGuide(false)} onStartTour={() => setShowTour(true)} />}
                    {showTour && <StaffTourOverlay onClose={() => setShowTour(false)} />}
                    <nav className="bg-white shadow-sm px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-30">
                        <div className="flex items-center gap-3"><img src="logo.png" alt="양지누림 로고" className="h-8 object-contain hidden md:block" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /><h1 className="text-2xl font-black text-blue-600 tracking-tighter md:hidden">양지누림</h1><span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase hidden sm:block">Employee Portal</span></div>
                        <div className="flex items-center gap-2 md:gap-4">
                            <div className="text-right hidden sm:block"><p className="text-sm font-bold text-slate-800">{userData.name} 님</p><p className="text-[10px] text-slate-500 uppercase">{safeDate(userData.joinDate)} 입사</p></div>
                            <div className="relative" ref={helpRef}>
                                <button type="button" onClick={() => setShowHelpMenu(v => !v)} className="flex items-center gap-1.5 px-3 py-2 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition font-bold text-xs border border-blue-100 active:scale-95" title="시스템 사용법 다시 보기"><Icons.Help /><span className="hidden sm:inline">사용법</span></button>
                                {showHelpMenu && (
                                    <div className="absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-40 animate-fade-in">
                                        <button type="button" onClick={() => { setShowHelpMenu(false); setShowGuide(true); }} className="w-full text-left px-4 py-3.5 hover:bg-blue-50 transition border-b border-slate-100">
                                            <p className="font-black text-sm text-slate-800">📖 전체 안내 보기</p>
                                            <p className="text-[11px] text-slate-500 font-bold mt-0.5">시스템 개요를 4단계로 설명</p>
                                        </button>
                                        <button type="button" onClick={() => { setShowHelpMenu(false); setShowTour(true); }} className="w-full text-left px-4 py-3.5 hover:bg-blue-50 transition">
                                            <p className="font-black text-sm text-slate-800">🔦 화면 보며 따라하기</p>
                                            <p className="text-[11px] text-slate-500 font-bold mt-0.5">실제 버튼 위치를 짚어드립니다</p>
                                        </button>
                                    </div>
                                )}
                            </div>
                            <button type="button" onClick={onLogout} className="p-2 text-slate-400 hover:text-red-500 transition bg-slate-50 rounded-full" title="로그아웃"><Icons.LogOut /></button>
                        </div>
                    </nav>
                    <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-6 animate-fade-in">
                        <h2 className="text-lg font-black text-slate-800 flex items-center gap-2"><Icons.User /> 나의 연차 현황 <span className="text-xs font-normal text-slate-400">({leaveStats.period})</span></h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4" data-tour="stats">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-blue-500"><div><p className="text-xs font-bold text-slate-400 mb-1">총 발생 연차</p><span className="text-2xl font-black text-slate-800">{leaveStats.totalDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div></div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-red-500"><div><p className="text-xs font-bold text-slate-400 mb-1">사용 연차</p><span className="text-2xl font-black text-red-500">{leaveStats.usedDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div></div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-green-500"><div><p className="text-xs font-bold text-slate-400 mb-1">잔여 연차</p><span className="text-2xl font-black text-green-600">{leaveStats.remainingDays}</span><span className="text-sm font-bold text-slate-400 ml-1">일</span></div></div>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Plus /> 휴가 신청하기</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100" data-tour="unit">
                                        <label className="block text-xs font-bold text-slate-700 mb-2">등록 단위 선택</label>
                                        <div className={`flex gap-2 mb-2 ${dateMode === 'multi' ? 'opacity-50 pointer-events-none' : ''}`}>
                                            <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="day" checked={inputType === 'day'} onChange={() => setInputType('day')} className="hidden"/>일 단위</label>
                                            <label className="flex-1 border bg-white rounded-xl p-2 text-sm text-center cursor-pointer transition hover:bg-slate-100"><input type="radio" name="itype" value="hour" checked={inputType === 'hour'} onChange={() => setInputType('hour')} className="hidden"/>시간 단위</label>
                                        </div>
                                        {inputType === 'day' ? (
                                            <div className="flex gap-2">
                                                <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '1' ? 'bg-blue-50 border-blue-200 text-blue-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="1" checked={leaveDayType === '1'} onChange={() => setLeaveDayType('1')} className="hidden"/>연차 (1일)</label>
                                                <label className={`flex-1 border rounded-xl p-3 text-sm text-center cursor-pointer transition ${leaveDayType === '0.5' ? 'bg-orange-50 border-orange-200 text-orange-600 font-bold' : 'bg-white hover:bg-slate-100'}`}><input type="radio" name="dtype" value="0.5" checked={leaveDayType === '0.5'} onChange={() => setLeaveDayType('0.5')} className="hidden"/>반차 (0.5일)</label>
                                            </div>
                                        ) : (<div className="flex items-center gap-2"><input type="number" value={leaveHourValue} onChange={e => setLeaveHourValue(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center bg-white" placeholder="시간 입력" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>)}
                                    </div>
                                    <div>
                                        <div className="flex bg-slate-100 p-1 rounded-xl mb-3" data-tour="datemode">
                                            {[['single','단일 날짜'],['multi','기간 설정'],['custom','지정일 선택']].map(([k, label]) => (
                                                <button key={k} type="button" onClick={() => setDateMode(k)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${dateMode === k ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
                                            ))}
                                        </div>
                                    </div>
                                    {dateMode === 'single' && (<div><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100" required /></div>)}
                                    {dateMode === 'multi' && (
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100"><div className="flex items-center gap-2"><input type="date" value={leaveDate} onChange={e => setLeaveDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required /><span className="text-slate-400 font-bold">~</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="flex-1 border border-blue-200 rounded-lg p-2 text-sm outline-none" required /></div><p className="text-[11px] text-blue-500 font-bold mt-2 text-center bg-white py-1 rounded border border-blue-100">나의 휴무일 제외 · 등록 예정일 {validDates.length}일</p></div>
                                    )}
                                    {dateMode === 'custom' && (
                                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                            <div className="flex items-center gap-2 mb-3"><select value={customYear} onChange={e => setCustomYear(parseInt(e.target.value))} className="border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200 bg-white font-bold text-purple-700">{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select><input type="text" placeholder="예: 4.1, 5.21" value={customDateInput} onChange={e => setCustomDateInput(e.target.value)} onKeyDown={e => { if(e.key==='Enter') { e.preventDefault(); handleAddCustomDate(); } }} className="flex-1 border border-purple-200 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-purple-200" /><button type="button" onClick={handleAddCustomDate} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-purple-700 transition">추가</button></div>
                                            <div className="flex flex-wrap gap-2">{customDates.map(d => (<span key={d.date} className="bg-white border border-purple-200 text-purple-700 px-2 py-1 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm">{d.date} <span className="text-[10px] bg-purple-100 px-1 rounded">{d.type}</span><button type="button" onClick={() => setCustomDates(customDates.filter(cd => cd.date !== d.date))} className="text-purple-400 hover:text-purple-600 p-0.5 rounded-full hover:bg-purple-50">✕</button></span>))}</div>
                                            <p className="text-xs text-purple-500 font-bold mt-3 text-center bg-white py-1 rounded border border-purple-100">총 {customDates.length}일 등록 예정</p>
                                        </div>
                                    )}
                                    <div><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100" placeholder="신청 사유 입력 (선택)" /></div>
                                    <button type="submit" data-tour="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">내 연차 등록하기</button>
                                </form>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full" data-tour="history">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-800 flex items-center gap-2"><Icons.History /> 나의 휴가 내역</h3><span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold">※ 수정/취소는 관리자 문의</span></div>
                                <div className="flex-1 overflow-y-auto max-h-[350px] custom-scrollbar pr-2 space-y-2">
                                    {leaveStats.displayHistory.length > 0 ? leaveStats.displayHistory.map(rec => (
                                        <div key={rec.id} className="flex items-center justify-between p-3 rounded-xl border bg-slate-50 border-slate-100 transition"><div className="flex items-center gap-3"><div className="bg-white p-2 rounded-lg shadow-sm border text-blue-600"><Icons.Calendar /></div><div><p className="font-bold text-slate-700 text-sm">{rec.date}</p><p className="text-[11px] text-slate-500 mt-0.5">{rec.type} <span className="mx-1">|</span> {rec.reason || '사유 없음'}</p></div></div></div>
                                    )) : <div className="text-center py-10 text-slate-400 text-sm">등록된 연차 내역이 없습니다.</div>}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staffList, setStaffList] = useState([]);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [editingLeaveData, setEditingLeaveData] = useState(null);
            const [viewingStaffDetail, setViewingStaffDetail] = useState(null);
            const [showUpdateModal, setShowUpdateModal] = useState(false);
            const [adminName, setAdminName] = useState(localStorage.getItem('ygnurim_admin_name') || '');
            const [forceUpdateRequired, setForceUpdateRequired] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [alertData, setAlertData] = useState(null);
            const [confirmData, setConfirmData] = useState(null);

            const showAlert = useCallback((msg) => setAlertData({ msg }), []);
            const showConfirm = useCallback((msg, onConfirm) => setConfirmData({ msg, onConfirm }), []);
            const addToast = useCallback((msg, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            }, []);

            const isInitialLoad = useRef(true);
            const prevStaffList = useRef([]);

            useEffect(() => {
                if (!user) return;
                const checkVersionFromUrl = async () => {
                    try {
                        const response = await fetch(`https://eesk98517-dot.github.io/ygnurim-hr-system/?t=${Date.now()}`, { cache: 'no-store', headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' } });
                        const text = await response.text();
                        const match = text.match(/SYSTEM_VERSION\s*=\s*["']([^"']+)["']/);
                        if (match && match[1] && compareVersions(match[1], SYSTEM_VERSION) > 0) setForceUpdateRequired(true);
                    } catch (err) {}
                };
                checkVersionFromUrl();
                const versionInterval = setInterval(checkVersionFromUrl, 15000);
                if (localStorage.getItem('ygnurim_version') !== SYSTEM_VERSION) setShowUpdateModal(true);

                let unsubUsers = () => {};
                if (user.role === 'admin') {
                    unsubUsers = db.collection('users').onSnapshot((snapshot) => {
                        const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(u => u.role === 'staff');
                        if (!isInitialLoad.current && adminName) {
                            list.forEach(newStaff => {
                                const oldStaff = prevStaffList.current.find(s => s.id === newStaff.id);
                                if (!oldStaff) return;
                                const oldIds = new Set((oldStaff.leaveHistory || []).map(h => h.id));
                                (newStaff.leaveHistory || []).forEach(leave => {
                                    if (!oldIds.has(leave.id) && leave.addedBy && leave.addedBy !== adminName) addToast(`[실시간] ${leave.addedBy}님이 ${newStaff.name} 직원의 연차를 등록/수정했습니다.`, 'success');
                                });
                            });
                        }
                        prevStaffList.current = list;
                        isInitialLoad.current = false;
                        setStaffList(list);
                    });
                }
                return () => { clearInterval(versionInterval); unsubUsers(); };
            }, [user, adminName, addToast]);

            const handleUpdateConfirm = () => { localStorage.setItem('ygnurim_version', SYSTEM_VERSION); setShowUpdateModal(false); };
            const handleAdminNameSave = (name) => { localStorage.setItem('ygnurim_admin_name', name); setAdminName(name); };
            const handleTabClick = (tab) => { setActiveTab(tab); setIsMobileMenuOpen(false); };
            const handleLogout = async () => { try { await auth.signOut(); } catch(e) {} setUser(null); };
            const handleEditLeave = useCallback((staffId, index, data) => { setEditingLeaveData({ ...data, staffId, index }); setShowLeaveModal(true); }, []);
            const closeLeaveModal = () => { setShowLeaveModal(false); setEditingLeaveData(null); };
            const handleOpenModal = useCallback((staffId = null) => { setEditingLeaveData(staffId ? { staffId } : null); setShowLeaveModal(true); }, []);

            const activeStaffs = useMemo(() => staffList.filter(s => s.status !== 'resigned'), [staffList]);

            const dashStats = useMemo(() => {
                const todayStr = toLocalYMD(new Date());
                return {
                    totalStaff: activeStaffs.length,
                    todayLeaves: activeStaffs.filter(s => (s.leaveHistory || []).some(h => h.date === todayStr)).length,
                    warningStaff: activeStaffs.filter(s => {
                        const li = calculateAnnualLeave(s.joinDate);
                        const dh = safeParseFloat(s.workHours) || 8;
                        return ((li.total || 0) * dh) - sumUsedHours(s.leaveHistory, li.startDate, li.endDate) < 0;
                    }).length
                };
            }, [activeStaffs]);

            const monthlyStats = useMemo(() => {
                if (activeTab !== 'dashboard') return [];
                const yearPrefix = `${new Date().getFullYear()}-`;
                const stats = Array.from({ length: 12 }, (_, i) => ({ month: String(i + 1).padStart(2, '0'), hours: 0 }));
                activeStaffs.forEach(staff => {
                    (staff.leaveHistory || []).forEach(leave => {
                        if (leave.date && leave.date.startsWith(yearPrefix)) {
                            const idx = parseInt(leave.date.substring(5, 7), 10) - 1;
                            if (stats[idx]) stats[idx].hours += safeParseFloat(leave.days);
                        }
                    });
                });
                return stats;
            }, [activeStaffs, activeTab]);
            const maxHours = useMemo(() => Math.max(...monthlyStats.map(s => s.hours), 1), [monthlyStats]);

            if (!user) return <Login onLogin={setUser} />;

            if (user.role === 'staff') {
                return (
                    <>
                        {forceUpdateRequired && <ForceUpdateModal />}
                        {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                        {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                        {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                        <StaffPortal user={user} onLogout={handleLogout} showAlert={showAlert} showConfirm={showConfirm} />
                    </>
                );
            }

            const NAV_ITEMS = [
                { id: 'dashboard', icon: <Icons.Grid />, label: '대시보드', title: '종합 대시보드' },
                { id: 'leave', icon: <Icons.Calendar />, label: '연차 관리', title: '연차 등록 및 관리' },
                { id: 'past', icon: <Icons.History />, label: '과년도 관리', title: '과년도 연차 기록' },
                { id: 'staff', icon: <Icons.Users />, label: '직원 명부', title: '전체 직원 명부' },
                { id: 'promotion', icon: <Icons.Megaphone />, label: '연차 촉진', title: '미사용 연차 사용 촉진' },
                { id: 'resigned', icon: <Icons.UserMinus />, label: '퇴사자 관리', title: '퇴사자 정보 관리' },
                { id: 'settings', icon: <Icons.Database />, label: '데이터 관리', title: '시스템 데이터 관리' }
            ];
            const currentTitle = (NAV_ITEMS.find(n => n.id === activeTab) || {}).title || '';

            return (
                <div className="flex h-screen bg-[#F1F5F9] font-sans overflow-hidden text-slate-800">
                    {forceUpdateRequired && <ForceUpdateModal />}
                    {!adminName && <AdminNameModal onSave={handleAdminNameSave} />}
                    {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                    {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                    {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                    {viewingStaffDetail && <StaffDetailModal staff={viewingStaffDetail} onClose={() => setViewingStaffDetail(null)} />}

                    <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (<div key={t.id} className={`pointer-events-auto px-4 py-3 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 animate-slide-in-right border ${t.type === 'success' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}><Icons.Info /> {t.msg}</div>))}
                    </div>

                    <div className={`fixed inset-0 bg-slate-900/50 z-40 md:hidden transition-opacity ${isMobileMenuOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsMobileMenuOpen(false)}></div>
                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50 transform transition-transform duration-300 md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
                        <div className="p-6 text-center border-b border-slate-800">
                            <img src="logo.png" alt="양지누림" className="h-10 mx-auto mb-3 object-contain invert brightness-0" onError={(e) => { e.target.onerror = null; e.target.style.display='none'; }} />
                            <h2 className="text-xl font-black tracking-tight">양지누림 HR</h2>
                            <p className="text-xs text-slate-400 mt-1 uppercase tracking-widest">Admin Portal</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {NAV_ITEMS.map(item => (
                                <button key={item.id} onClick={() => handleTabClick(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition text-sm ${activeTab === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>{item.icon} {item.label}</button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="bg-slate-800 rounded-xl p-3 mb-3 flex items-center justify-between border border-slate-700">
                                <div className="flex items-center gap-2"><div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-blue-400"><Icons.User /></div><div className="text-left truncate max-w-[120px]"><p className="text-xs font-bold text-white truncate">{adminName}</p><p className="text-[10px] text-slate-400">관리자 계정</p></div></div>
                                <button onClick={() => setAdminName('')} className="p-1.5 text-slate-400 hover:text-white transition"><Icons.Edit /></button>
                            </div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-red-400 transition font-bold text-sm"><Icons.LogOut /> 로그아웃</button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        <header className="bg-white px-4 md:px-8 py-4 shadow-sm flex justify-between items-center z-30 sticky top-0">
                            <div className="flex items-center gap-4"><button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><Icons.Menu /></button><h1 className="text-xl font-black text-slate-800">{currentTitle}</h1></div>
                            <div className="flex items-center gap-2"><span className="text-[10px] md:text-xs font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded hidden sm:inline-block">v{SYSTEM_VERSION}</span></div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-[#F1F5F9] custom-scrollbar">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500"><Icons.Users /></div><div><p className="text-sm font-bold text-slate-500">재직중인 직원</p><p className="text-2xl font-black text-slate-800">{dashStats.totalStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-teal-300 transition" onClick={() => setActiveTab('leave')}><div className="w-14 h-14 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-500"><Icons.Calendar /></div><div><p className="text-sm font-bold text-slate-500">금일 휴가자</p><p className="text-2xl font-black text-slate-800">{dashStats.todayLeaves}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-red-300 transition" onClick={() => setActiveTab('leave')}><div className="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-red-500"><Icons.Alert /></div><div><p className="text-sm font-bold text-slate-500">연차 초과자</p><p className="text-2xl font-black text-red-500">{dashStats.warningStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                    </div>

                                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 animate-fade-in">
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm md:text-base"><Icons.Grid /> 전사 월별 연차 소진율 추이 ({new Date().getFullYear()}년)</h3>
                                            <span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold">막대에 마우스를 올리면 상세 시간이 표시됩니다.</span>
                                        </div>
                                        <div className="flex items-end justify-between gap-2 md:gap-4 h-48 md:h-64 mt-4 pt-8 border-b border-slate-200 pb-2 px-2">
                                            {monthlyStats.map(st => (
                                                <div key={st.month} className="flex-1 flex flex-col items-center group h-full justify-end relative">
                                                    <div className="w-full max-w-[40px] relative h-full flex flex-col justify-end bg-slate-50/50 hover:bg-slate-100 rounded-t-lg transition-colors overflow-visible">
                                                        <div className="w-full bg-blue-500 rounded-t-md shadow-sm group-hover:bg-blue-600 transition-all duration-1000 min-h-[4px]" style={{ height: `${Math.max((st.hours / maxHours) * 100, 2)}%` }}></div>
                                                        <div className="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] md:text-xs px-2 py-1 rounded shadow-lg whitespace-nowrap transition-opacity z-10 font-bold pointer-events-none">{fmt(st.hours)}h</div>
                                                    </div>
                                                    <div className="text-xs font-bold text-slate-500 mt-3">{st.month}월</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-8">
                                        <CalendarView staffList={activeStaffs} onEditClick={handleEditLeave} />
                                    </div>
                                </div>
                            )}

                            {activeTab === 'leave' && <LeaveManagementTab staffList={activeStaffs} allStaffList={staffList} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'past' && <LeaveManagementTab staffList={activeStaffs} allStaffList={staffList} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} isPastMode={true} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'staff' && <StaffTab staffList={staffList} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'promotion' && <PromotionTab staffList={activeStaffs} allStaffList={staffList} showAlert={showAlert} onOpenModal={handleOpenModal} />}
                            {activeTab === 'resigned' && <ResignedStaffTab staffList={staffList} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'settings' && <SettingsTab showAlert={showAlert} showConfirm={showConfirm} />}
                        </main>

                        {showLeaveModal && <LeaveActionModal onClose={closeLeaveModal} staffList={staffList} adminName={adminName} initialData={editingLeaveData} showAlert={showAlert} />}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>

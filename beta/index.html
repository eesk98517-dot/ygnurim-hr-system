                    const snapshot = await db.collection('users').get();
                    const limit = new Date().getFullYear() - MIN_WORK_AGE;
                    const found = [];
                    snapshot.docs.forEach(doc => {
                        const d = doc.data();
                        if (d.role !== 'staff') return;
                        const cur = safeDate(d.birth);
                        if (!cur || cur.length < 10) return;
                        const y = parseInt(cur.substring(0, 4), 10);
                        if (isNaN(y) || y <= limit) return;              // 정상 범위
                        const fixedY = y - 100;                           // 2041 → 1941
                        if (fixedY < 1900) return;
                        found.push({ id: doc.id, name: d.name || '(이름없음)', before: cur, after: `${fixedY}${cur.substring(4)}` });
                    });
                    found.sort((a, b) => a.name.localeCompare(b.name));
                    setBirthIssues(found);
                    if (!found.length) showAlert("✅ 점검 완료: 생년월일이 미래로 저장된 직원이 없습니다.");
                } catch (e) { showAlert("❌ 점검 실패: " + e.message); }
                setIsProcessing(false);
            };

            const applyBirthFix = () => {
                if (!birthIssues || !birthIssues.length) return;
                showConfirm(`${birthIssues.length}명의 생년월일을 100년 앞당겨 수정합니다.\n\n예) 2041-03-15 → 1941-03-15\n\n진행하시겠습니까?`, async () => {
                    setIsProcessing(true);
                    try {
                        let batch = db.batch(); let cnt = 0;
                        for (const it of birthIssues) {
                            batch.update(db.collection('users').doc(it.id), { birth: it.after });
                            cnt++;
                            if (cnt % 400 === 0) { await batch.commit(); batch = db.batch(); }
                        }
                        if (cnt % 400 !== 0) await batch.commit();
                        showAlert(`✅ ${birthIssues.length}명의 생년월일을 수정했습니다.`);
                        setBirthIssues(null);
                    } catch (e) { showAlert("❌ 수정 실패: " + e.message); }
                    setIsProcessing(false);
                });
            };

            const handleBackup = async () => {
                setIsProcessing(true);
                try {
                    const snapshot = await db.collection('users').get();
                    const data = snapshot.docs.map(doc => ({ _id: doc.id, ...doc.data() }));
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `ygnurim_db_backup_${toLocalYMD(new Date()).replace(/-/g, '')}.json`;
                    a.click();
                    showAlert("✅ 데이터베이스 백업 파일이 다운로드되었습니다.");
                } catch (e) { showAlert("❌ 백업 실패: " + e.message); }
                setIsProcessing(false);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0]; if (!file) return;
                showConfirm("⚠️ [경고] 복원을 진행하면 시스템의 현재 데이터가 모두 삭제되고, 업로드하신 백업 파일의 과거 데이터로 완전히 덮어씌워집니다.\n\n정말 복원을 진행하시겠습니까?", () => {
                    setIsProcessing(true);
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        try {
                            const data = JSON.parse(evt.target.result);
                            if (!Array.isArray(data)) throw new Error("유효한 백업 파일(.json)이 아닙니다.");
                            let batch = db.batch(), count = 0, total = 0;
                            for (const user of data) {
                                const id = user._id; if (!id) continue;
                                const docData = { ...user }; delete docData._id;
                                batch.set(db.collection('users').doc(id), docData);
                                count++; total++;
                                if (count === 400) { await batch.commit(); batch = db.batch(); count = 0; }
                            }
                            if (count > 0) await batch.commit();
                            showAlert(`✅ 총 ${total}개의 데이터 세트가 성공적으로 복원되었습니다. 적용을 위해 페이지를 새로고침합니다.`);
                            setTimeout(() => window.location.reload(), 2000);
                        } catch (err) { showAlert("❌ 복원 실패: " + err.message); }
                        setIsProcessing(false);
                    };
                    reader.readAsText(file);
                });
                e.target.value = '';
            };

            const handleCodeBackup = () => {
                try {

                                {birthIssues && birthIssues.length > 0 && (<button onClick={applyBirthFix} disabled={isProcessing} className="flex-1 md:flex-none bg-blue-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex justify-center items-center gap-2 text-sm"><Icons.CheckCircle /> {birthIssues.length}명 일괄 수정</button>)}

        // ------------------ [v6.12.0] 직원 본인 휴가 상세/수정 모달 ------------------
        const StaffLeaveDetailModal = ({ rec, dailyHours, onClose, onSave, onDelete }) => {
            const hasTimes = !!(rec.startTime && rec.endTime);

            const [editMode, setEditMode] = useState(hasTimes ? 'time' : 'manual');
            const [date, setDate] = useState(rec.date);

            const [breakEnd, setBreakEnd] = useState(rec.breakEnd || '00:00');
            const [manualHours, setManualHours] = useState(String(safeParseFloat(rec.days) || ''));
            const [reason, setReason] = useState(rec.reason || '');
            const [msg, setMsg] = useState('');

            const calc = useMemo(() => calcLeaveHours(startTime, endTime, breakStart, breakEnd), [startTime, endTime, breakStart, breakEnd]);
            const dh = dailyHours || 8;
            const previewHours = editMode === 'time' ? calc.hours : safeParseFloat(manualHours);
            const ratio = dh > 0 ? Math.min(1, previewHours / dh) : 0;

            const handleSave = () => {
                if (!date) { setMsg('❌ 날짜를 선택하세요.'); return; }
                let payload;
                if (editMode === 'time') {
                    if (calc.error) { setMsg('❌ ' + calc.error); return; }
                    payload = { id: rec.id, date, days: calc.hours, type: hourLabel(calc.hours), reason,
                        startTime, endTime, breakStart, breakEnd };
                } else {
                    const h = safeParseFloat(manualHours);
                    if (h <= 0) { setMsg('❌ 시간을 올바르게 입력하세요.'); return; }
                    payload = { id: rec.id, date, days: h, type: hourLabel(h), reason,
                        startTime: '', endTime: '', breakStart: '', breakEnd: '' };
                }
                onSave(payload);
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[400] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto">
                    <div className="bg-white p-6 md:p-7 rounded-3xl shadow-2xl w-full max-w-md relative my-auto">
                        <button type="button" onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                        <h3 className="text-lg font-black text-slate-800 mb-1 flex items-center gap-2"><Icons.Calendar /> 휴가 상세 · 수정</h3>
                        <p className="text-xs text-slate-500 font-bold mb-5">시간을 조정하면 차감 시간이 자동으로 다시 계산됩니다.</p>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1.5">날짜</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" />
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                {[['time', '시작·종료로 계산'], ['manual', '시간 직접 입력']].map(([k, label]) => (
                                    <button key={k} type="button" onClick={() => setEditMode(k)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${editMode === k ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
                                ))}
                            </div>
                            {editMode === 'time' ? (
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-3">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 시작</label><TimeSelect value={startTime} onChange={setStartTime} accent="blue" /></div>
                                        <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 종료</label><TimeSelect value={endTime} onChange={setEndTime} accent="blue" /></div>
                                        <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 시작 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakStart} onChange={setBreakStart} accent="orange" /></div>
                                        <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 종료 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakEnd} onChange={setBreakEnd} accent="orange" /></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><label className="block text-xs font-bold text-slate-700 mb-2">차감 시간 직접 입력</label><div className="flex items-center gap-2"><input type="number" value={manualHours} onChange={e => setManualHours(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center bg-white" placeholder="예: 4" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div></div>
                            )}
                            <div className={`p-3 rounded-xl border text-center font-bold ${editMode === 'time' && calc.error ? 'bg-red-50 border-red-200 text-red-600' : ratio >= 1 ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-orange-50 border-orange-200 text-orange-700'}`}>
                                {editMode === 'time' && calc.error ? <span className="text-xs">{calc.error}</span> : (
                                    <div>
                                        <div>실제 차감 시간 <span className="text-lg font-black">{fmt(previewHours)}시간</span> <span className="text-xs font-normal opacity-70">(하루 {dh}h 중 {Math.round(ratio * 100)}%)</span></div>
                                        {editMode === 'time' && <div className="text-[10px] font-normal opacity-70 mt-0.5">근무 {fmt(calc.workMin / 60)}h {breakStart === breakEnd ? '· 휴게 없음' : calc.overlapMin > 0 ? `− 휴게 겹침 ${fmt(calc.overlapMin / 60)}h` : '· 휴게 겹침 없음'}</div>}
                                    </div>
                                )}
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-600 mb-1.5">사유 (선택)</label>
                                <input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" placeholder="사유 입력" />
                            </div>
                        </div>
                        {msg && <p className="text-red-500 text-xs font-bold text-center mt-4">{msg}</p>}
                        <div className="flex gap-3 mt-6">
                            <button type="button" onClick={() => onDelete(rec)} className="px-4 bg-red-50 text-red-500 py-3 rounded-xl font-bold hover:bg-red-100 transition text-sm flex items-center justify-center gap-1.5 border border-red-100"><Icons.Trash /> 삭제</button>
                            <button type="button" onClick={handleSave} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 text-sm flex items-center justify-center gap-2"><Icons.Save /> 저장하기</button>
                        </div>
                    </div>
                </div>
            );
        };

        // [v6.12.0] 직원 본인 달력형 휴가 내역
        const StaffLeaveCalendar = ({ history, dailyHours, onSelect, onBulkDelete }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectMode, setSelectMode] = useState(false);
            const [checkedIds, setCheckedIds] = useState([]);
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            const dh = dailyHours || 8;

            const leaveMap = useMemo(() => {
                const map = {};
                (history || []).forEach(leave => {
                    if (leave.date && leave.date.startsWith(prefix)) (map[leave.date] = map[leave.date] || []).push(leave);
                });
                return map;
            }, [history, prefix]);

            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());

            const toggleCheck = (id) => setCheckedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            const exitSelectMode = () => { setSelectMode(false); setCheckedIds([]); };
            const handleBlockClick = (l) => { if (selectMode) toggleCheck(l.id); else onSelect && onSelect(l); };
            const handleBulk = () => {
                if (!checkedIds.length) return;
                const recs = (history || []).filter(h => checkedIds.includes(h.id));
                onBulkDelete && onBulkDelete(recs, exitSelectMode);
            };

            return (
                <div className="flex-1 flex flex-col">
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronLeft /></button>
                        <div className="flex items-center gap-2">
                            <span className="font-black text-slate-800 text-sm">{year}년 {month + 1}월</span>
                            <button type="button" onClick={() => setCurrentDate(new Date())} className="text-[10px] font-bold text-blue-600 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-md hover:bg-blue-100 transition">이번 달</button>
                        </div>
                        <button type="button" onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-[11px] font-bold text-slate-400">{selectMode ? '삭제할 휴가를 눌러 선택하세요' : '휴가 블록을 누르면 상세·수정'}</span>
                        {selectMode
                            ? <button type="button" onClick={exitSelectMode} className="text-[11px] font-bold py-1 px-3 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition">선택 취소</button>
                            : <button type="button" onClick={() => setSelectMode(true)} className="text-[11px] font-bold py-1 px-3 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition flex items-center gap-1"><Icons.Trash /> 여러 개 삭제</button>}
                    </div>
                    <div className="w-full overflow-hidden border border-slate-200 rounded-xl bg-slate-200 gap-px grid grid-cols-7 shadow-sm">
                        {WEEK_LABELS.map((d, i) => (<div key={d} className={`bg-slate-50 py-1.5 text-center text-[11px] font-bold ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-slate-600'}`}>{d}</div>))}
                        {weeks.flat().map((d, idx) => {
                            const dateStr = d ? `${prefix}-${String(d).padStart(2, '0')}` : '';
                            const leaves = d ? (leaveMap[dateStr] || []) : [];
                            const isToday = dateStr === todayStr;
                            return (
                                <div key={idx} className={`bg-white h-[74px] md:h-[84px] p-1 flex flex-col overflow-hidden transition-colors ${d ? '' : 'opacity-30 pointer-events-none'}`}>
                                    <div className={`text-[10px] md:text-[11px] font-bold flex justify-center items-center w-5 h-5 rounded-full mx-auto ${isToday ? 'bg-blue-600 text-white shadow-md' : idx % 7 === 0 ? 'text-red-500' : idx % 7 === 6 ? 'text-blue-500' : 'text-slate-600'}`}>{d || ''}</div>
                                    <div className="flex-1 overflow-y-auto space-y-0.5 mt-0.5 custom-scrollbar">
                                        {leaves.map((l, i) => {
                                            const h = safeParseFloat(l.days);
                                            const isFull = dh > 0 && h >= dh;
                                            const checked = selectMode && checkedIds.includes(l.id);
                                            const future = isFutureLeave(l.date); // [v6.17.0] 오늘 이후 = 예정
                                            return (
                                                <div key={i} onClick={() => handleBlockClick(l)} title={`${l.type}${l.reason ? ' · ' + l.reason : ''}${future ? ' · 아직 오지 않은 예정 연차' : ''}${selectMode ? ' · 눌러서 선택' : ' · 클릭하여 상세/수정'}`}
                                                    className={`cursor-pointer hover:opacity-80 text-[9px] md:text-[10px] px-1 py-0.5 rounded text-center truncate font-bold shadow-sm text-white relative ${isFull ? 'bg-blue-500' : 'bg-orange-500'} ${future ? 'ring-1 ring-dashed ring-slate-800/40 opacity-90' : ''} ${checked ? 'ring-2 ring-slate-800' : ''}`}>
                                                    {selectMode && <span className="absolute left-0.5 top-1/2 -translate-y-1/2">{checked ? '☑' : '☐'}</span>}
                                                    {future && <span className="absolute -top-0.5 -right-0.5 bg-white text-slate-700 text-[7px] md:text-[8px] font-black px-0.5 rounded-sm shadow border border-slate-300 leading-tight">예정</span>}
                                                    {fmt(h)}h
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {selectMode && (
                        <div className="mt-3 flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                            <span className="text-xs font-bold text-slate-600">선택됨 <span className="text-blue-600">{checkedIds.length}</span>건</span>
                            <button type="button" onClick={handleBulk} disabled={!checkedIds.length} className={`text-xs font-bold py-2 px-4 rounded-lg transition flex items-center gap-1.5 ${checkedIds.length ? 'bg-red-500 text-white hover:bg-red-600 shadow-sm' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}><Icons.Trash /> 선택 삭제</button>
                        </div>
                    )}
                </div>
            );
        };

        const StaffPortal = ({ user, onLogout, showAlert, showConfirm }) => {
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showGuide, setShowGuide] = useState(false);
            const [showTour, setShowTour] = useState(false);
            const [showHelpMenu, setShowHelpMenu] = useState(false);
            const helpRef = useRef(null);

            const [selectedDates, setSelectedDates] = useState([]);
            const [startTime, setStartTime] = useState('00:00');
            const [endTime, setEndTime] = useState('00:00');
            const [breakStart, setBreakStart] = useState('00:00');
            const [breakEnd, setBreakEnd] = useState('00:00');
            const [forceTimeInput, setForceTimeInput] = useState(false);

            const [reason, setReason] = useState('');
            const [detailRec, setDetailRec] = useState(null);
            const [cart, setCart] = useState([]);

            useEffect(() => {
                const unsub = db.collection('users').doc(user.email).onSnapshot(doc => {
                    if (doc.exists) setUserData({ id: doc.id, ...doc.data() });
                    setLoading(false);
                });
                return () => unsub();
            }, [user.email]);

            useEffect(() => {
                if (loading) return;
                let seen = null;
                try { seen = localStorage.getItem(GUIDE_KEY); } catch (e) {}
                if (!seen) { const t = setTimeout(() => setShowGuide(true), 600); return () => clearTimeout(t); }
            }, [loading]);

            useEffect(() => {
                const h = (e) => { if (helpRef.current && !helpRef.current.contains(e.target)) setShowHelpMenu(false); };
                document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, []);

            const dailyHours = safeParseFloat(userData?.workHours) || 8;

            const leaveStats = useMemo(() => {
                if (!userData || !userData.joinDate) return null;
                const leaveInfo = calculateAnnualLeave(userData.joinDate);
                const totalDays = leaveInfo.total || 0;
                const totalHours = totalDays * dailyHours;
                const activeHistory = (userData.leaveHistory || []).filter(h => h.date >= leaveInfo.startDate && h.date <= leaveInfo.endDate);
                const usedHours = activeHistory.reduce((acc, cur) => acc + safeParseFloat(cur.days), 0);
                const remainingHours = totalHours - usedHours;
                // [v6.17.0] '예정'(오늘 이후 날짜) 분리 집계 — 차감은 usedHours에 이미 포함되며, 여기선 표시용으로만 나눕니다.
                const futureHours = activeHistory.filter(h => isFutureLeave(h.date)).reduce((acc, cur) => acc + safeParseFloat(cur.days), 0);
                return { ...leaveInfo, totalDays, dailyHours, totalHours, usedHours, remainingHours, futureHours,
                    usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0,
                    remainingDays: dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0,
                    futureDays: dailyHours > 0 ? Math.round((futureHours / dailyHours) * 10) / 10 : 0,
                    displayHistory: [...activeHistory].sort((a, b) => b.date.localeCompare(a.date)) };
            }, [userData, dailyHours]);

            const calc = useMemo(() => calcLeaveHours(startTime, endTime, breakStart, breakEnd), [startTime, endTime, breakStart, breakEnd]);
            // [v6.17.0] 직원 월별 마감: 혹시 남아있는 과거(당월 1일 이전) 날짜는 등록 대상에서 제외
            const validDates = useMemo(() => [...selectedDates].filter(d => !isPastLockedForStaff(d)).sort(), [selectedDates]);

            const isConsecutiveRange = useMemo(() => {
                if (validDates.length < 2) return false;
                const span = listWorkingDates(validDates[0], validDates[validDates.length - 1], userData?.offDays);
                if (span.length !== validDates.length) return false;
                return span.every((d, i) => d === validDates[i]);
            }, [validDates, userData]);

            const useTimeInput = !isConsecutiveRange || forceTimeInput;
            const fullDayHours = dailyHours;
            const deductHours = useTimeInput ? calc.hours : fullDayHours;
            const ratio = dailyHours > 0 ? Math.min(1, deductHours / dailyHours) : 0;
            const blockingError = useTimeInput ? calc.error : '';

            const takenDates = useMemo(() => {
                const s = new Set();
                (userData?.leaveHistory || []).forEach(h => { if (h.date) s.add(h.date); });
                return s;
            }, [userData]);
            const cartDates = useMemo(() => {
                const s = new Set();
                cart.forEach(item => item.dates.forEach(d => s.add(d)));
                return s;
            }, [cart]);
            const dupDates = useMemo(() => validDates.filter(d => takenDates.has(d) || cartDates.has(d)), [validDates, takenDates, cartDates]);
            const cartTotalDays = useMemo(() => cart.reduce((sum, it) => sum + it.dates.length, 0), [cart]);
            const calendarTaken = useMemo(() => new Set([...takenDates, ...cartDates]), [takenDates, cartDates]);

            const addToCart = () => {
                if (useTimeInput && blockingError) { showAlert('❌ ' + blockingError); return; }
                if (deductHours <= 0) { showAlert('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (!validDates.length) { showAlert('❌ 날짜를 먼저 선택해주세요.'); return; }
                if (dupDates.length) { showAlert(`❌ 다음 날짜는 이미 등록됐거나 담겨 있습니다:\n${dupDates.join(', ')}\n\n담기 전에 날짜 선택에서 빼주세요.`); return; }
                const item = {
                    key: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                    dates: [...validDates],
                    deductHours, useTimeInput,
                    startTime, endTime, breakStart, breakEnd,
                    reason
                };
                setCart(prev => [...prev, item]);
                setSelectedDates([]); setForceTimeInput(false); setReason('');
            };

            const removeFromCart = (key) => setCart(prev => prev.filter(it => it.key !== key));

            const doRegisterCart = async () => {
                try {
                    const newHistory = [...(userData.leaveHistory || [])];
                    cart.forEach((item, ci) => {
                        const tText = hourLabel(item.deductHours);
                        item.dates.forEach((d, idx) => {
                            const rec = {
                                id: Date.now().toString() + ci + '_' + idx,
                                date: safeDate(d),
                                days: item.deductHours,
                                type: tText,
                                reason: item.reason,
                                addedBy: '본인(직원)',
                                createdAt: new Date().toISOString()
                            };
                            if (item.useTimeInput) { rec.startTime = item.startTime; rec.endTime = item.endTime; rec.breakStart = item.breakStart; rec.breakEnd = item.breakEnd; }
                            else { rec.startTime = ''; rec.endTime = ''; rec.breakStart = ''; rec.breakEnd = ''; rec.fullDay = true; }
                            newHistory.push(rec);
                        });
                    });
                    await recalcAndSave(userData.id, userData.joinDate, newHistory);
                    showAlert('✅ 휴가 등록 완료! (총 ' + cartTotalDays + '일 · ' + cart.length + '건)');
                    setCart([]); setReason(''); setSelectedDates([]); setForceTimeInput(false);
                } catch (err) { showAlert('❌ 오류: ' + err.message); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault(); if (!userData) return;
                if (cart.length) {
                    if (validDates.length && !dupDates.length && !(useTimeInput && blockingError) && deductHours > 0) {
                        showConfirm(`장바구니에 담긴 ${cart.length}건과 별도로, 지금 입력한 날짜(${validDates.length}일)는 아직 담지 않았습니다.\n\n담긴 ${cart.length}건만 등록할까요?\n(현재 입력분도 넣으려면 취소 후 [담기]를 누르세요)`, doRegisterCart);
                        return;
                    }
                    doRegisterCart();
                    return;
                }
                if (useTimeInput && blockingError) { showAlert('❌ ' + blockingError); return; }
                if (deductHours <= 0) { showAlert('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (!validDates.length) { showAlert('❌ 선택된 날짜가 없습니다. 달력에서 날짜를 선택해주세요. (휴무일은 자동 제외됩니다)'); return; }
                if (dupDates.length) {
                    showConfirm(`선택한 날짜 중 ${dupDates.length}일은 이미 휴가가 등록되어 있습니다.\n\n· ${dupDates.join(', ')}\n\n그래도 추가로 등록하시겠습니까? (같은 날에 여러 건이 쌓입니다)`, doRegisterSingle);
                    return;
                }
                doRegisterSingle();
            };

            const doRegisterSingle = async () => {
                try {
                    const newHistory = [...(userData.leaveHistory || [])];
                    const tText = hourLabel(deductHours);
                    validDates.forEach((d, idx) => {
                        const rec = {
                            id: Date.now().toString() + idx,
                            date: safeDate(d),
                            days: deductHours,
                            type: tText,
                            reason,
                            addedBy: '본인(직원)',
                            createdAt: new Date().toISOString()
                        };
                        if (useTimeInput) { rec.startTime = startTime; rec.endTime = endTime; rec.breakStart = breakStart; rec.breakEnd = breakEnd; }
                        else { rec.startTime = ''; rec.endTime = ''; rec.breakStart = ''; rec.breakEnd = ''; rec.fullDay = true; }
                        newHistory.push(rec);
                    });
                    await recalcAndSave(userData.id, userData.joinDate, newHistory);
                    showAlert('✅ 휴가 등록 완료! (' + validDates.length + '일 · 각 ' + fmt(deductHours) + '시간)');
                    setReason(''); setSelectedDates([]); setForceTimeInput(false);
                } catch (err) { showAlert('❌ 오류: ' + err.message); }
            };

            // [v6.17.0] 월별 마감 안내 문구
            const LOCK_MSG = '지난달 이전 내역은 마감되어 수정·삭제할 수 없습니다.\n관리자에게 요청해주세요.';

            const handleDeleteOwnLeave = (rec) => {
                // [v6.17.0] 당월 1일 이전(과거월) 내역은 직원이 삭제 불가 — 관리자만 가능
                if (isPastLockedForStaff(rec.date)) { showAlert('🔒 ' + LOCK_MSG); return; }
                showConfirm(`${rec.date} (${rec.type}) 휴가 내역을 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.`, async () => {
                    try {
                        const newHistory = (userData.leaveHistory || []).filter(h => h.id !== rec.id);
                        await recalcAndSave(userData.id, userData.joinDate, newHistory);
                        setDetailRec(null);
                        showAlert('🗑️ 삭제 완료! 잔여 연차가 복구되었습니다.');
                    } catch (err) { showAlert('❌ 오류: ' + err.message); }
                });
            };

            const handleBulkDeleteOwnLeave = (recs, onDone) => {
                if (!recs || !recs.length) return;
                // [v6.17.0] 과거월 잠긴 건이 섞여 있으면 삭제 차단
                const lockedOnes = recs.filter(r => isPastLockedForStaff(r.date));
                if (lockedOnes.length) { showAlert(`🔒 선택 항목 중 ${lockedOnes.length}건이 지난달 이전(마감)입니다.\n${LOCK_MSG}`); return; }
                const preview = recs.slice(0, 8).map(r => `${r.date} (${r.type})`).join('\n');
                const more = recs.length > 8 ? `\n… 외 ${recs.length - 8}건` : '';
                showConfirm(`선택한 ${recs.length}건의 휴가를 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.\n\n${preview}${more}`, async () => {
                    try {
                        const ids = new Set(recs.map(r => r.id));
                        const newHistory = (userData.leaveHistory || []).filter(h => !ids.has(h.id));
                        await recalcAndSave(userData.id, userData.joinDate, newHistory);
                        if (onDone) onDone();
                        showAlert(`🗑️ ${recs.length}건 삭제 완료! 잔여 연차가 복구되었습니다.`);
                    } catch (err) { showAlert('❌ 오류: ' + err.message); }
                });
            };

            const handleSaveEditOwnLeave = async (updated) => {
                // [v6.17.0] 원본 날짜 또는 바꾸려는 날짜가 과거월이면 직원 수정 불가
                const orig = (userData.leaveHistory || []).find(h => h.id === updated.id);
                if ((orig && isPastLockedForStaff(orig.date)) || isPastLockedForStaff(updated.date)) { showAlert('🔒 ' + LOCK_MSG); return; }
                try {
                    const newHistory = (userData.leaveHistory || []).map(h => h.id === updated.id
                        ? { ...h, date: safeDate(updated.date), days: updated.days, type: updated.type, reason: updated.reason,
                            startTime: updated.startTime, endTime: updated.endTime, breakStart: updated.breakStart, breakEnd: updated.breakEnd,
                            addedBy: '본인(직원)', updatedAt: new Date().toISOString() }
                        : h);
                    await recalcAndSave(userData.id, userData.joinDate, newHistory);
                    setDetailRec(null);
                    showAlert('✅ 수정 완료!');
                } catch (err) { showAlert('❌ 오류: ' + err.message); }
            };

            if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!userData || !userData.joinDate) return (<div className="flex h-screen items-center justify-center bg-slate-50 flex-col gap-4"><p className="text-slate-600 font-bold">인사 정보가 등록되지 않았습니다. 관리자에게 문의하세요.</p><button type="button" onClick={onLogout} className="bg-slate-800 text-white px-6 py-2 rounded-xl text-sm">로그아웃</button></div>);

            return (
                <div className="min
                    <div className="min-h-screen bg-[#F1F5F9] font-sans relative">
                    {showGuide && <StaffGuideModal onClose={() => setShowGuide(false)} onStartTour={() => setShowTour(true)} />}
                    {showTour && <StaffTourOverlay onClose={() => setShowTour(false)} />}
                    {detailRec && <StaffLeaveDetailModal rec={detailRec} dailyHours={dailyHours} onClose={() => setDetailRec(null)} onSave={handleSaveEditOwnLeave} onDelete={handleDeleteOwnLeave} />}
                    <nav className="bg-white shadow-sm px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-30">
                        <div className="flex items-center gap-3"><img src="logo.png" alt="양지누림 로고" className="h-8 object-contain hidden md:block" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} /><h1 className="text-2xl font-black text-blue-600 tracking-tighter md:hidden">양지누림</h1><span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase hidden sm:block">Employee Portal</span></div>
                        <div className="flex items-center gap-2 md:gap-4">
                            <div className="text-right hidden sm:block"><p className="text-sm font-bold text-slate-800">{userData.name} 님</p><p className="text-[10px] text-slate-500 uppercase">{safeDate(userData.joinDate)} 입사</p></div>
                            <div className="relative" ref={helpRef}>
                                <button type="button" onClick={() => setShowHelpMenu(v => !v)} className="flex items-center gap-1.5 px-3 py-2 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition font-bold text-xs border border-blue-100 active:scale-95" title="시스템 사용법 다시 보기"><Icons.Help /><span className="hidden sm:inline">사용법</span></button>
                                {showHelpMenu && (
                                    <div className="absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-40 animate-fade-in">
                                        <button type="button" onClick={() => { setShowHelpMenu(false); setShowGuide(true); }} className="w-full text-left px-4 py-3.5 hover:bg-blue-50 transition border-b border-slate-100">
                                            <p className="font-black text-sm text-slate-800">📖 전체 안내 보기</p>
                                            <p className="text-[11px] text-slate-500 font-bold mt-0.5">시스템 개요를 단계별로 설명</p>
                                        </button>
                                        <button type="button" onClick={() => { setShowHelpMenu(false); setShowTour(true); }} className="w-full text-left px-4 py-3.5 hover:bg-blue-50 transition">
                                            <p className="font-black text-sm text-slate-800">🔦 화면 보며 따라하기</p>
                                            <p className="text-[11px] text-slate-500 font-bold mt-0.5">실제 버튼 위치를 짚어드립니다</p>
                                        </button>
                                    </div>
                                )}
                            </div>
                            <button type="button" onClick={onLogout} className="p-2 text-slate-400 hover:text-red-500 transition bg-slate-50 rounded-full" title="로그아웃"><Icons.LogOut /></button>
                        </div>
                    </nav>
                    <div className="max-w-5xl mx-auto p-3 sm:p-4 md:p-8 space-y-5 md:space-y-6 animate-fade-in">
                        <h2 className="text-lg font-black text-slate-800 flex items-center gap-2"><Icons.User /> 나의 연차 현황 <span className="text-xs font-bold text-slate-500">({leaveStats.period})</span></h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4" data-tour="stats">
                            <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-blue-500"><div><p className="text-xs font-bold text-slate-600 mb-1">총 발생 연차</p><span className="text-xl md:text-2xl font-black text-slate-800">{fmt(leaveStats.totalHours)}</span><span className="text-sm font-bold text-slate-500 ml-1">시간</span><span className="text-[11px] font-bold text-slate-500 ml-1">({leaveStats.totalDays}일)</span></div></div>
                            <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-red-500"><div><p className="text-xs font-bold text-slate-600 mb-1">사용 연차</p><span className="text-xl md:text-2xl font-black text-red-500">{fmt(leaveStats.usedHours)}</span><span className="text-sm font-bold text-slate-500 ml-1">시간</span><span className="text-[11px] font-bold text-slate-500 ml-1">({leaveStats.usedDays}일)</span>{leaveStats.futureHours > 0 && <p className="text-[10px] font-bold text-slate-400 mt-1">이 중 미래 예정 <span className="text-orange-500">{fmt(leaveStats.futureHours)}시간</span> ({leaveStats.futureDays}일) 포함</p>}</div></div>
                            <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center border-l-4 border-l-green-500"><div><p className="text-xs font-bold text-slate-600 mb-1">잔여 연차</p><span className="text-xl md:text-2xl font-black text-green-600">{fmt(leaveStats.remainingHours)}</span><span className="text-sm font-bold text-slate-500 ml-1">시간</span><span className="text-[11px] font-bold text-slate-500 ml-1">({leaveStats.remainingDays}일)</span></div></div>
                        </div>
                        {/* [v6.17.0] 월별 마감 안내 — 직원은 당월 1일부터만 등록/수정 가능 */}
                        <div className="bg-blue-50 border border-blue-100 rounded-xl px-4 py-2.5 flex items-start gap-2 text-[11px] md:text-xs font-bold text-blue-700">
                            <span className="text-sm leading-none mt-0.5">🔒</span>
                            <span>이번 달 <b>{new Date().getMonth() + 1}월 1일</b>부터의 연차만 직접 등록·수정할 수 있어요. 지난달 이전 내역 변경이 필요하면 관리자에게 요청해주세요. <span className="font-normal text-blue-500">(달력의 미래 날짜 연차는 지금 바로 잔여에서 차감되며 <span className="text-orange-500 font-bold">'예정'</span>으로 표시됩니다)</span></span>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                            <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Plus /> 휴가 신청하기</h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-2" data-tour="datemode">① 날짜 선택 <span className="font-normal text-slate-400">(달력에서 원하는 날을 눌러 여러 날 선택 가능)</span></label>
                                        <div data-tour="calendar">
                                            <MiniCalendar value={selectedDates} onChange={setSelectedDates} offDays={userData.offDays} takenDates={calendarTaken} lockPast={true} />
                                        </div>
                                        <div className="flex items-center justify-center gap-1.5 mt-1.5 text-[10px] font-bold text-slate-400"><span className="w-1.5 h-1.5 rounded-full bg-orange-400 inline-block"></span> 이미 휴가가 등록된 날</div>
                                        <p className="text-[11px] text-slate-500 font-bold mt-2 text-center bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                            {selectedDates.length ? `선택한 ${validDates.length}일에 각각 ${!blockingError ? fmt(deductHours) + '시간씩' : ''} 등록됩니다` : '달력에서 날짜를 눌러주세요'}
                                        </p>
                                        {dupDates.length > 0 && <p className="text-[11px] text-orange-600 font-bold mt-1.5 text-center bg-orange-50 py-1.5 rounded-lg border border-orange-200">⚠️ 선택한 날짜 중 {dupDates.length}일은 이미 등록됐거나 목록에 담겨 있어요.</p>}
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100" data-tour="time">
                                        <div className="flex items-center justify-between mb-2">
                                            <label className="block text-xs font-bold text-slate-700">② 시간 입력 <span className="font-normal text-slate-400">(시간 단위 자동 계산)</span></label>
                                            {isConsecutiveRange && (
                                                <label className="flex items-center gap-1.5 cursor-pointer select-none">
                                                    <input type="checkbox" checked={forceTimeInput} onChange={e => setForceTimeInput(e.target.checked)} className="w-3.5 h-3.5" />
                                                    <span className="text-[11px] font-bold text-slate-500">시간으로 입력</span>
                                                </label>
                                            )}
                                        </div>
                                        {!useTimeInput ? (
                                            <div className="p-3 rounded-lg border border-blue-200 bg-blue-50 text-center">
                                                <p className="text-sm font-black text-blue-700">📅 연속 기간 · 온종일 휴가</p>
                                                <p className="text-[11px] font-bold text-blue-500 mt-1">연달아 선택한 {validDates.length}일은 하루 전체({fmt(fullDayHours)}시간)씩 차감됩니다. 부분 시간으로 쓰려면 위 [시간으로 입력]을 켜세요.</p>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="grid grid-cols-2 gap-2 md:gap-3">
                                                    <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 시작</label><TimeSelect value={startTime} onChange={setStartTime} accent="blue" /></div>
                                                    <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 종료</label><TimeSelect value={endTime} onChange={setEndTime} accent="blue" /></div>
                                                    <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 시작 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakStart} onChange={setBreakStart} accent="orange" /></div>
                                                    <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 종료 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakEnd} onChange={setBreakEnd} accent="orange" /></div>
                                                </div>
                                                <div className={`mt-3 p-2.5 rounded-lg border text-center font-bold ${calc.error ? 'bg-red-50 border-red-200 text-red-600' : ratio >= 1 ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-orange-50 border-orange-200 text-orange-700'}`}>
                                                    {calc.error ? <span className="text-xs">{calc.error}</span> : (
                                                        <div>
                                                            <div className="text-sm">실제 차감 <span className="text-lg font-black">{fmt(deductHours)}시간</span> <span className="text-[11px] font-normal opacity-70">(하루 {dailyHours}h 중 {Math.round(ratio * 100)}%)</span></div>
                                                            <div className="text-[10px] font-normal opacity-70 mt-0.5">근무 {fmt(calc.workMin / 60)}h {breakStart === breakEnd ? '· 휴게 없음' : calc.overlapMin > 0 ? `− 휴게 겹침 ${fmt(calc.overlapMin / 60)}h` : '· 휴게 겹침 없음'}</div>
                                                        </div>
                                                    )}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <div><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100" placeholder="신청 사유 입력 (선택)" /></div>

                                    <button type="button" onClick={addToCart} className="w-full bg-slate-100 text-slate-700 py-3 rounded-xl text-sm font-bold hover:bg-slate-200 transition active:scale-95 flex items-center justify-center gap-2 border border-slate-200"><Icons.Plus /> 목록에 담기 {validDates.length > 0 && !blockingError ? `(${validDates.length}일 · 각 ${fmt(deductHours)}h)` : ''}</button>

                                    {cart.length > 0 && (
                                        <div className="bg-blue-50/60 border border-blue-100 rounded-xl p-3 space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-black text-blue-700">담은 휴가 {cart.length}건 · 총 {cartTotalDays}일</span>
                                                <button type="button" onClick={() => setCart([])} className="text-[11px] font-bold text-slate-400 hover:text-red-500 transition">전체 비우기</button>
                                            </div>
                                            <div className="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar">
                                                {cart.map(item => {
                                                    const label = item.useTimeInput ? `${item.startTime}~${item.endTime}${item.breakStart !== item.breakEnd ? ` (휴게 ${item.breakStart}~${item.breakEnd})` : ''}` : '온종일';
                                                    return (
                                                        <div key={item.key} className="bg-white border border-blue-100 rounded-lg p-2 flex items-start justify-between gap-2">
                                                            <div className="min-w-0">
                                                                <p className="text-[11px] font-bold text-slate-700 truncate">{item.dates.join(', ')}</p>
                                                                <p className="text-[10px] text-slate-500 mt-0.5 truncate">각 {fmt(item.deductHours)}h · {label}{item.reason ? ` · ${item.reason}` : ''}</p>
                                                            </div>
                                                            <button type="button" onClick={() => removeFromCart(item.key)} className="p-1.5 bg-white border text-red-400 hover:bg-red-50 rounded-md transition flex-shrink-0"><Icons.Trash /></button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <button type="submit" data-tour="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">
                                        {cart.length > 0 ? `담은 ${cart.length}건 전체 등록하기 (총 ${cartTotalDays}일)` : `내 휴가 등록하기 ${validDates.length > 0 && !blockingError ? `(${validDates.length}일 · 각 ${fmt(deductHours)}h)` : ''}`}
                                    </button>
                                </form>
                            </div>
                            <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full" data-tour="history">
                                <div className="flex justify-between items-center mb-3"><h3 className="font-bold text-slate-800 flex items-center gap-2"><Icons.Calendar /> 나의 휴가 내역</h3></div>
                                <StaffLeaveCalendar history={leaveStats.displayHistory} dailyHours={dailyHours} onSelect={setDetailRec} onBulkDelete={handleBulkDeleteOwnLeave} />
                                <div className="flex items-center gap-4 mt-3 text-[11px] font-bold text-slate-500 justify-center flex-wrap">
                                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-blue-500 inline-block"></span>하루 전체(100%)</span>
                                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-orange-500 inline-block"></span>일부 사용</span>
                                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded ring-1 ring-dashed ring-slate-800/50 bg-white inline-block"></span>예정(미래)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staffList, setStaffList] = useState([]);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [editingLeaveData, setEditingLeaveData] = useState(null);
            const [viewingStaffDetail, setViewingStaffDetail] = useState(null);
            const [showUpdateModal, setShowUpdateModal] = useState(false);
            const [adminName, setAdminName] = useState(localStorage.getItem('ygnurim_admin_name') || '');
            const [forceUpdateRequired, setForceUpdateRequired] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [alertData, setAlertData] = useState(null);
            const [confirmData, setConfirmData] = useState(null);
            const [pwChangeDone, setPwChangeDone] = useState(false); // [v6.10.0] 초기 비번 변경 완료 플래그

            // ★[v6.19.0] 데이터 로딩 상태 신호등
            //   dataLoaded : 관리자 직원 목록의 '첫 응답'이 실제로 도착했는지 여부.
            //                false 인 동안엔 로딩 화면을 보여주고, true 가 되면 본 화면을 그립니다.
            //   loadError  : 구독이 실패(네트워크/권한 등)했을 때의 안내 메시지. 있으면 [다시 시도] UI 노출.
            const [dataLoaded, setDataLoaded] = useState(false);
            const [loadError, setLoadError] = useState('');
            const [retryTick, setRetryTick] = useState(0); // 수동 [다시 시도] 버튼용 카운터

            const showAlert = useCallback((msg) => setAlertData({ msg }), []);
            const showConfirm = useCallback((msg, onConfirm) => setConfirmData({ msg, onConfirm }), []);
            const addToast = useCallback((msg, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
            }, []);

            const isInitialLoad = useRef(true);
            const prevStaffList = useRef([]);

            // ────────────────────────────────────────────────────────────────
            // [v6.19.0] 버전 자동 체크 (데이터 구독과 분리) — user 로그인 시 1회 + 주기 실행
            // ────────────────────────────────────────────────────────────────
            useEffect(() => {
                if (!user) return;
                const checkVersionFromUrl = async () => {
                    try {
                        const response = await fetch(`https://eesk98517-dot.github.io/ygnurim-hr-system/?t=${Date.now()}`, { cache: 'no-store', headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' } });
                        const text = await response.text();
                        const match = text.match(/SYSTEM_VERSION\s*=\s*["']([^"']+)["']/);
                        if (match && match[1] && compareVersions(match[1], SYSTEM_VERSION) > 0) setForceUpdateRequired(true);
                    } catch (err) {}
                };
                checkVersionFromUrl();
                const versionInterval = setInterval(checkVersionFromUrl, 15000);
                if (localStorage.getItem('ygnurim_version') !== SYSTEM_VERSION) setShowUpdateModal(true);
                return () => clearInterval(versionInterval);
            }, [user]);

            // ────────────────────────────────────────────────────────────────
            // [v6.19.0 ★핵심] 관리자 직원 목록 실시간 구독 — 로딩 안정화 / 재시도 / 에러 처리
            //   · onSnapshot 두 번째 인자로 '에러 콜백'을 넘겨, 통신 실패 시 화면이 멈추지 않고
            //     안내 문구를 띄우도록 합니다(기존엔 에러 콜백이 없어 첫 응답이 안 오면 무한 로딩).
            //   · 자동 재시도 : 실패하면 일정 시간 뒤 스스로 다시 구독을 시도합니다(최대 5회, 점증 간격).
            //   · 수동 재시도 : loadError 화면의 [다시 시도] 버튼이 retryTick을 올려 이 훅을 재실행합니다.
            //   · '진짜로 데이터가 0명'인 상태와 '아직 로딩 중'을 dataLoaded로 명확히 구분합니다.
            //   ※ 데이터 병합·토스트 로직은 종전과 동일합니다.
            // ────────────────────────────────────────────────────────────────
            useEffect(() => {
                if (!user || user.role !== 'admin') { setDataLoaded(true); return; }

                let unsub = () => {};
                let retryTimer = null;
                let cancelled = false;
                let attempt = 0;
                const MAX_ATTEMPTS = 5;

                const subscribe = () => {
                    if (cancelled) return;
                    // 새 구독을 걸기 전, 이전 구독이 남아있다면 정리
                    try { unsub(); } catch (e) {}
                    unsub = db.collection('users').onSnapshot(
                        // ── 성공 콜백 ──
                        (snapshot) => {
                            if (cancelled) return;
                            attempt = 0;            // 성공했으니 재시도 카운터 리셋
                            setLoadError('');       // 이전 에러 안내 제거
                            const list = snapshot.docs.map(d => ({ ...d.data(), id: d.id })).filter(u => u.role === 'staff');
                            // ── 실시간 등록 토스트 (기존 로직 그대로) ──
                            if (!isInitialLoad.current && adminName) {
                                list.forEach(newStaff => {
                                    const oldStaff = prevStaffList.current.find(s => s.id === newStaff.id);
                                    if (!oldStaff) return;
                                    const oldIds = new Set((oldStaff.leaveHistory || []).map(h => h.id));
                                    (newStaff.leaveHistory || []).forEach(leave => {
                                        if (!oldIds.has(leave.id) && leave.addedBy && leave.addedBy !== adminName) addToast(`[실시간] ${leave.addedBy}님이 ${newStaff.name} 직원의 연차를 등록/수정했습니다.`, 'success');
                                    });
                                });
                            }
                            prevStaffList.current = list;
                            isInitialLoad.current = false;
                            setStaffList(list);
                            setDataLoaded(true);    // 첫 응답 도착 → 본 화면 렌더 허용
                        },
                        // ── 에러 콜백 (v6.19.0 신설) ──
                        (error) => {
                            if (cancelled) return;
                            console.error('onSnapshot error:', error);
                            attempt += 1;
                            if (attempt <= MAX_ATTEMPTS) {
                                // 점증 간격(2s,3s,4s,5s,6s)으로 자동 재시도
                                const delay = 1000 * (attempt + 1);
                                setLoadError(`데이터를 불러오는 중 통신 문제가 발생했습니다. 자동으로 다시 시도합니다… (${attempt}/${MAX_ATTEMPTS})`);
                                retryTimer = setTimeout(() => { if (!cancelled) subscribe(); }, delay);
                            } else {
                                // 자동 재시도 소진 → 수동 [다시 시도] 안내
                                setLoadError('데이터를 계속 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 [다시 시도]를 눌러주세요.');
                            }
                        }
                    );
                };

                // 최초 구독 시작 전 로딩 상태로 초기화
                setDataLoaded(false);
                setLoadError('');
                subscribe();

                // ── 세이프가드 타이머 : 8초 안에 첫 응답이 없으면 안내만 표시(구독은 계속 유지) ──
                const safeguard = setTimeout(() => {
                    if (!cancelled && !dataLoaded) {
                        setLoadError(prev => prev || '데이터 응답이 지연되고 있습니다. 네트워크 상태를 확인하는 중입니다…');
                    }
                }, 8000);

                return () => {
                    cancelled = true;
                    if (retryTimer) clearTimeout(retryTimer);
                    clearTimeout(safeguard);
                    try { unsub(); } catch (e) {}
                };
            // retryTick : [다시 시도] 버튼이 올리면 이 훅이 통째로 재실행됩니다.
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [user, adminName, addToast, retryTick]);

            const handleManualRetry = () => { setLoadError(''); setDataLoaded(false); setRetryTick(t => t + 1); };

            const handleUpdateConfirm = () => { localStorage.setItem('ygnurim_version', SYSTEM_VERSION); setShowUpdateModal(false); };
            const handleAdminNameSave = (name) => { localStorage.setItem('ygnurim_admin_name', name); setAdminName(name); };
            const handleTabClick = (tab) => { setActiveTab(tab); setIsMobileMenuOpen(false); };
            const handleLogout = async () => { try { await auth.signOut(); } catch(e) {} setUser(null); };
            // 기존 내역 '수정' 진입 (행의 연필 버튼 등) — initialData에 id가 실려 수정 모드로 열립니다.
            const handleEditLeave = useCallback((staffId, index, data) => { setEditingLeaveData({ ...data, staffId, index }); setShowLeaveModal(true); }, []);
            const closeLeaveModal = () => { setShowLeaveModal(false); setEditingLeaveData(null); };
            // ★[v6.15.0] 연차 등록 모달 오픈 핸들러 — 두 번째 인자 prefillHours 추가.
            //   · 일반 [연차 등록] FAB/버튼 : handleOpenModal(staffId)         → prefillHours 없음(null)
            //   · 엑셀 대조창 [연차 등록]   : handleOpenModal(staffId, r.diff) → 오차 시간을 그대로 전달
            //   전달된 값은 editingLeaveData.prefillHours 에 저장했다가, 아래 <LeaveActionModal>의
            //   prefillHours prop 으로 넘겨 '시간 직접 입력' 모드 + 인풋 자동 채움에 사용합니다.
            const handleOpenModal = useCallback((staffId = null, prefillHours = null) => {
                setEditingLeaveData(staffId ? { staffId, prefillHours } : null);
                setShowLeaveModal(true);
            }, []);

            const activeStaffs = useMemo(() => staffList.filter(s => s.status !== 'resigned'), [staffList]);

            const dashStats = useMemo(() => {
                const todayStr = toLocalYMD(new Date());
                return {
                    totalStaff: activeStaffs.length,
                    todayLeaves: activeStaffs.filter(s => (s.leaveHistory || []).some(h => h.date === todayStr)).length,
                    warningStaff: activeStaffs.filter(s => {
                        const li = calculateAnnualLeave(s.joinDate);
                        const dh = safeParseFloat(s.workHours) || 8;
                        return ((li.total || 0) * dh) - sumUsedHours(s.leaveHistory, li.startDate, li.endDate) < 0;
                    }).length
                };
            }, [activeStaffs]);

            const monthlyStats = useMemo(() => {
                if (activeTab !== 'dashboard') return [];
                const yearPrefix = `${new Date().getFullYear()}-`;
                const stats = Array.from({ length: 12 }, (_, i) => ({ month: String(i + 1).padStart(2, '0'), hours: 0 }));
                activeStaffs.forEach(staff => {
                    (staff.leaveHistory || []).forEach(leave => {
                        if (leave.date && leave.date.startsWith(yearPrefix)) {
                            const idx = parseInt(leave.date.substring(5, 7), 10) - 1;
                            if (stats[idx]) stats[idx].hours += safeParseFloat(leave.days);
                        }
                    });
                });
                return stats;
            }, [activeStaffs, activeTab]);
            const maxHours = useMemo(() => Math.max(...monthlyStats.map(s => s.hours), 1), [monthlyStats]);

            if (!user) return <Login onLogin={setUser} />;

            if (user.role === 'staff') {
                // [v6.10.0] 초기 비밀번호(123456)로 로그인한 직원은 변경 전까지 포털 진입 차단
                const mustChangePw = !pwChangeDone && String(user.tempPw || '') === '123456';
                return (
                    <>
                        {forceUpdateRequired && <ForceUpdateModal />}
                        {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                        {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                        {mustChangePw ? (
                            <ForcePwChangeModal user={user} onLogout={handleLogout} onDone={() => setPwChangeDone(true)} />
                        ) : (
                            <>
                                {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                                <StaffPortal user={user} onLogout={handleLogout} showAlert={showAlert} showConfirm={showConfirm} />
                            </>
                        )}
                    </>
                );
            }

            // ────────────────────────────────────────────────────────────────
            // [v6.19.0] 관리자: 첫 데이터가 아직 도착하지 않았을 때의 로딩/에러 화면
            //   · dataLoaded=false 인 동안 이 화면을 보여줍니다.
            //   · loadError 가 있으면 안내 + [다시 시도] 버튼을 함께 노출합니다.
            //   · 무한 로딩 대신, 사용자가 상황을 알고 직접 재시도할 수 있게 합니다.
            // ────────────────────────────────────────────────────────────────
            if (!dataLoaded) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#F1F5F9] p-6">
                        <div className="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-10 w-full max-w-md text-center">
                            {loadError && !loadError.includes('자동으로 다시') && !loadError.includes('지연') ? (
                                // 자동 재시도 소진 등 '멈춤' 상태 → 경고 아이콘 + 다시 시도 버튼
                                <>
                                    <div className="w-16 h-16 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-5 scale-110"><Icons.Alert /></div>
                                    <h2 className="text-lg font-black text-slate-800 mb-2">데이터를 불러오지 못했습니다</h2>
                                    <p className="text-sm text-slate-500 font-bold leading-relaxed mb-6 whitespace-pre-wrap">{loadError}</p>
                                    <button onClick={handleManualRetry} className="w-full bg-blue-600 text-white py-3.5 rounded-2xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2"><Icons.Refresh /> 다시 시도</button>
                                    <button onClick={() => window.location.reload()} className="w-full mt-2 text-slate-400 hover:text-slate-600 py-2 rounded-xl font-bold text-xs transition">그래도 안 되면 페이지 새로고침</button>
                                </>
                            ) : (
                                // 정상 로딩 중 / 자동 재시도 중 → 스피너 + 상태 안내
                                <>
                                    <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-5"></div>
                                    <h2 className="text-lg font-black text-slate-800 mb-2">시스템 데이터 로딩 중…</h2>
                                    <p className="text-sm text-slate-500 font-bold leading-relaxed">{loadError || '직원 명부와 연차 정보를 안전하게 불러오고 있습니다. 잠시만 기다려주세요.'}</p>
                                    {loadError && (
                                        <button onClick={handleManualRetry} className="mt-6 text-blue-600 hover:text-blue-700 font-bold text-xs underline underline-offset-2">계속 지연되면 여기를 눌러 다시 시도</button>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                );
            }

            const NAV_ITEMS = [
                { id: 'dashboard', icon: <Icons.Grid />, label: '대시보드', title: '종합 대시보드' },
                { id: 'leave', icon: <Icons.Calendar />, label: '연차 관리', title: '연차 등록 및 관리' },
                { id: 'past', icon: <Icons.History />, label: '과년도 관리', title: '과년도 연차 기록' },
                { id: 'staff', icon: <Icons.Users />, label: '직원 명부', title: '전체 직원 명부' },
                { id: 'promotion', icon: <Icons.Megaphone />, label: '연차 촉진', title: '미사용 연차 사용 촉진' },
                { id: 'resigned', icon: <Icons.UserMinus />, label: '퇴사자 관리', title: '퇴사자 정보 관리' },
                { id: 'settings', icon: <Icons.Database />, label: '데이터 관리', title: '시스템 데이터 관리' }
            ];
            const currentTitle = (NAV_ITEMS.find(n => n.id === activeTab) || {}).title || '';

            return (
                <div className="flex h-screen bg-[#F1F5F9] font-sans overflow-hidden text-slate-800">
                    {forceUpdateRequired && <ForceUpdateModal />}
                    {!adminName && <AdminNameModal onSave={handleAdminNameSave} />}
                    {showUpdateModal && <VersionAlertModal onClose={handleUpdateConfirm} />}
                    {alertData && <CustomAlertModal msg={alertData.msg} onClose={() => setAlertData(null)} />}
                    {confirmData && <CustomConfirmModal msg={confirmData.msg} onConfirm={confirmData.onConfirm} onClose={() => setConfirmData(null)} />}
                    {viewingStaffDetail && <StaffDetailModal staff={viewingStaffDetail} onClose={() => setViewingStaffDetail(null)} />}

                    {/* [v6.19.0] 로딩 이후에도 통신이 잠깐 끊기면 우상단에 살짝 안내(비차단) */}
                    {loadError && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9998] pointer-events-none">
                            <div className="pointer-events-auto bg-amber-50 text-amber-800 border border-amber-200 px-4 py-2 rounded-xl shadow-lg font-bold text-xs flex items-center gap-2 animate-fade-in">
                                <Icons.Alert /> {loadError}
                                <button onClick={handleManualRetry} className="ml-1 underline underline-offset-2 hover:text-amber-900">다시 시도</button>
                            </div>
                        </div>
                    )}

                    <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (<div key={t.id} className={`pointer-events-auto px-4 py-3 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 animate-slide-in-right border ${t.type === 'success' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}><Icons.Info /> {t.msg}</div>))}
                    </div>

                    <div className={`fixed inset-0 bg-slate-900/50 z-40 md:hidden transition-opacity ${isMobileMenuOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsMobileMenuOpen(false)}></div>
                    <div className={`fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50 transform transition-transform duration-300 md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
                        <div className="p-6 text-center border-b border-slate-800">
                            <img src="logo.png" alt="양지누림" className="h-10 mx-auto mb-3 object-contain invert brightness-0" onError={(e) => { e.target.onerror = null; e.target.style.display='none'; }} />
                            <h2 className="text-xl font-black tracking-tight">양지누림 HR</h2>
                            <p className="text-xs text-slate-400 mt-1 uppercase tracking-widest">Admin Portal</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {NAV_ITEMS.map(item => (
                                <button key={item.id} onClick={() => handleTabClick(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition text-sm ${activeTab === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>{item.icon} {item.label}</button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="bg-slate-800 rounded-xl p-3 mb-3 flex items-center justify-between border border-slate-700">
                                <div className="flex items-center gap-2"><div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-blue-400"><Icons.User /></div><div className="text-left truncate max-w-[120px]"><p className="text-xs font-bold text-white truncate">{adminName}</p><p className="text-[10px] text-slate-400">관리자 계정</p></div></div>
                                <button onClick={() => setAdminName('')} className="p-1.5 text-slate-400 hover:text-white transition"><Icons.Edit /></button>
                            </div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-red-400 transition font-bold text-sm"><Icons.LogOut /> 로그아웃</button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        <header className="bg-white px-4 md:px-8 py-4 shadow-sm flex justify-between items-center z-30 sticky top-0">
                            <div className="flex items-center gap-4"><button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><Icons.Menu /></button><h1 className="text-xl font-black text-slate-800">{currentTitle}</h1></div>
                            <div className="flex items-center gap-2"><span className="text-[10px] md:text-xs font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded hidden sm:inline-block">v{SYSTEM_VERSION}</span></div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-[#F1F5F9] custom-scrollbar">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500"><Icons.Users /></div><div><p className="text-sm font-bold text-slate-500">재직중인 직원</p><p className="text-2xl font-black text-slate-800">{dashStats.totalStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-teal-300 transition" onClick={() => setActiveTab('leave')}><div className="w-14 h-14 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-500"><Icons.Calendar /></div><div><p className="text-sm font-bold text-slate-500">금일 휴가자</p><p className="text-2xl font-black text-slate-800">{dashStats.todayLeaves}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-red-300 transition" onClick={() => setActiveTab('leave')}><div className="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-red-500"><Icons.Alert /></div><div><p className="text-sm font-bold text-slate-500">연차 초과자</p><p className="text-2xl font-black text-red-500">{dashStats.warningStaff}<span className="text-sm font-bold text-slate-400 ml-1">명</span></p></div></div>
                                    </div>

                                    <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 animate-fade-in">
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm md:text-base"><Icons.Grid /> 전사 월별 연차 소진율 추이 ({new Date().getFullYear()}년)</h3>
                                            <span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold">막대에 마우스를 올리면 상세 시간이 표시됩니다.</span>
                                        </div>
                                        <div className="flex items-end justify-between gap-2 md:gap-4 h-48 md:h-64 mt-4 pt-8 border-b border-slate-200 pb-2 px-2">
                                            {monthlyStats.map(st => (
                                                <div key={st.month} className="flex-1 flex flex-col items-center group h-full justify-end relative">
                                                    <div className="w-full max-w-[40px] relative h-full flex flex-col justify-end bg-slate-50/50 hover:bg-slate-100 rounded-t-lg transition-colors overflow-visible">
                                                        <div className="w-full bg-blue-500 rounded-t-md shadow-sm group-hover:bg-blue-600 transition-all duration-1000 min-h-[4px]" style={{ height: `${Math.max((st.hours / maxHours) * 100, 2)}%` }}></div>
                                                        <div className="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] md:text-xs px-2 py-1 rounded shadow-lg whitespace-nowrap transition-opacity z-10 font-bold pointer-events-none">{fmt(st.hours)}h</div>
                                                    </div>
                                                    <div className="text-xs font-bold text-slate-500 mt-3">{st.month}월</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-8">
                                        <CalendarView staffList={activeStaffs} onEditClick={handleEditLeave} showConfirm={showConfirm} showAlert={showAlert} />
                                    </div>
                                </div>
                            )}

                            {activeTab === 'leave' && <LeaveManagementTab staffList={activeStaffs} allStaffList={staffList} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'past' && <LeaveManagementTab staffList={activeStaffs} allStaffList={staffList} adminName={adminName} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} isPastMode={true} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'staff' && <StaffTab staffList={staffList} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'promotion' && <PromotionTab staffList={activeStaffs} allStaffList={staffList} showAlert={showAlert} onOpenModal={handleOpenModal} />}
                            {activeTab === 'resigned' && <ResignedStaffTab staffList={staffList} onOpenModal={handleOpenModal} onEditClick={handleEditLeave} onNameClick={setViewingStaffDetail} showConfirm={showConfirm} showAlert={showAlert} />}
                            {activeTab === 'settings' && <SettingsTab showAlert={showAlert} showConfirm={showConfirm} />}
                        </main>

                        {/* ★[v6.15.0] LeaveActionModal 렌더 — prefillHours(엑셀 대조 오차 시간)와 showConfirm을 함께 전달.
                            · initialData 에 담긴 prefillHours 를 뽑아 prop 으로 넘깁니다(없으면 null).
                            · showConfirm 은 장바구니/중복 확인 다이얼로그에 사용됩니다. */}
                        {showLeaveModal && <LeaveActionModal onClose={closeLeaveModal} staffList={staffList} adminName={adminName} initialData={editingLeaveData} prefillHours={editingLeaveData?.prefillHours ?? null} showAlert={showAlert} showConfirm={showConfirm} />}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    
    </script>
</body>
</html>

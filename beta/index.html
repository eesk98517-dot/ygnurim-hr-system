                    setMsg('처리 중...'); doSaveEdit(); return;
                }
                // (2) 장바구니에 담긴 항목이 있으면 그것을 등록
                if (cart.length) {
                    // 입력창에 아직 담지 않은 유효 날짜가 남아있으면 안내
                    if (validDates.length && !dupDates.length && deductHours > 0) {
                        showConfirm(`장바구니에 담긴 ${cart.length}건과 별도로, 지금 입력한 날짜(${validDates.length}일)는 아직 담지 않았습니다.\n\n담긴 ${cart.length}건만 등록할까요?\n(현재 입력분도 넣으려면 취소 후 [목록에 담기]를 누르세요)`, () => { setMsg('처리 중...'); doRegisterCart(); });
                        return;
                    }
                    setMsg('처리 중...'); doRegisterCart(); return;
                }
                // (3) 장바구니가 비어 있으면 현재 입력 한 건을 바로 등록
                if (deductHours <= 0) { setMsg('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (!validDates.length) { setMsg('❌ 달력에서 날짜를 선택해주세요.'); return; }
                if (dupDates.length) {
                    showConfirm(`선택한 날짜 중 ${dupDates.length}일은 이미 휴가가 등록되어 있습니다.\n\n· ${dupDates.join(', ')}\n\n그래도 추가로 등록하시겠습니까? (같은 날에 여러 건이 쌓입니다)`, () => { setMsg('처리 중...'); doRegisterSingle(); });
                    return;
                }
                setMsg('처리 중...'); doRegisterSingle();
            };
            return (
                // [v6.17.0] PC에서는 max-w-4xl 2단(좌: 달력 / 우: 직원 선택·시간·사유·목록), 모바일은 max-w-md 세로.
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[500] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto pt-20 md:pt-4"><div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md md:max-w-4xl relative my-auto"><button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-10"><Icons.X /></button>
                    <h3 className="font-bold text-slate-800 mb-1 flex items-center gap-2 text-lg">{isEdit ? '연차 수정' : '연차 등록'}</h3>
                    <p className="text-xs text-slate-500 font-bold mb-4">달력에서 날짜를 고르고 시간을 입력한 뒤 등록하세요.{!isEdit && ' 여러 건은 [목록에 담기]로 쌓아 한 번에 등록할 수 있습니다.'}</p>
                    {/* [v6.17.0] 2단 그리드: 모바일 1열, PC(md) 2열 */}
                    <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 md:gap-6">
                        {/* ═══════ 좌측 컬럼: ① 날짜 선택 (달력) ═══════ */}
                        <div className="space-y-4 mb-4 md:mb-0">
                            {/* ── [v6.15.0] ① 날짜 선택 : MiniCalendar (달력 클릭) ── */}
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-2">① 날짜 선택 <span className="font-normal text-slate-400">(달력에서 원하는 날을 눌러 여러 날 선택 가능)</span></label>
                                <MiniCalendar value={selectedDates} onChange={setSelectedDates} offDays={selectedStaff?.offDays} takenDates={calendarTaken} />
                                <div className="flex items-center justify-center gap-1.5 mt-1.5 text-[10px] font-bold text-slate-400"><span className="w-1.5 h-1.5 rounded-full bg-orange-400 inline-block"></span> 이미 휴가가 등록된 날</div>
                                <p className="text-[11px] text-slate-500 font-bold mt-2 text-center bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                    {validDates.length ? `선택한 ${validDates.length}일에 각각 ${!blockingError ? fmt(deductHours) + '시간씩' : ''} 등록됩니다` : '달력에서 날짜를 눌러주세요'}
                                </p>
                                {dupDates.length > 0 && <p className="text-[11px] text-orange-600 font-bold mt-1.5 text-center bg-orange-50 py-1.5 rounded-lg border border-orange-200">⚠️ 선택한 날짜 중 {dupDates.length}일은 이미 등록됐거나 목록에 담겨 있어요.</p>}
                            </div>
                        </div>
                        {/* ═══════ 우측 컬럼: 직원 선택 · 시간 · 사유 · 목록 · 등록 ═══════ */}
                        <div className="space-y-4 md:flex md:flex-col">
                            {/* ── 직원 검색·선택 (기존 UI 유지) ── */}
                            <div className="relative" ref={dropdownRef}><label className="block text-xs font-bold text-slate-500 mb-1">직원 검색 및 선택</label><input type="text" className="w-full border rounded-xl p-3 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder={isEdit ? "" : "직원 이름 검색..."} value={staffSearch} onChange={(e) => { setStaffSearch(e.target.value); setIsStaffDropdownOpen(true); setSelectedStaffId(''); }} onFocus={() => { if(!isEdit) setIsStaffDropdownOpen(true); }} disabled={isEdit} required />
                                {isStaffDropdownOpen && !isEdit && (<div className="absolute z-20 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">{filteredStaffList.length > 0 ? filteredStaffList.map(s => (<div key={s.id} className="p-3 text-sm hover:bg-blue-50 cursor-pointer border-b last:border-b-0 border-slate-50" onClick={() => { setSelectedStaffId(s.id); setStaffSearch(s.name); setIsStaffDropdownOpen(false); }}><span className="font-bold text-slate-800">{s.name}</span> <span className="text-slate-500 text-xs">(일 {s.workHours || 8}h)</span></div>)) : <div className="p-3 text-sm text-slate-400 text-center">검색 결과가 없습니다.</div>}</div>)}
                            </div>
                            {/* ── [v6.15.0] ② 시간 입력 : '직접 입력' / '시각으로 계산' ── */}
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <label className="block text-xs font-bold text-slate-700 mb-2">② 시간 입력 <span className="font-normal text-slate-400">(시간 단위)</span></label>
                                <div className="flex bg-slate-100 p-1 rounded-xl mb-3">
                                    {[['manual', '시간 직접 입력'], ['time', '시작·종료로 계산']].map(([k, label]) => (
                                        <button key={k} type="button" onClick={() => setInputMode(k)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${inputMode === k ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
                                    ))}
                                </div>
                                {inputMode === 'manual' ? (
                                    // ★ 엑셀 대조 Pre-fill 값(prefillHours)이 이 인풋칸에 자동으로 채워집니다.
                                    <div className="flex items-center gap-2"><input type="number" value={manualHours} onChange={e => setManualHours(e.target.value)} className="w-full border rounded-xl p-2.5 text-sm outline-none font-bold text-center bg-white focus:ring-2 focus:ring-blue-100" placeholder="차감 시간 입력 (예: 4)" min="0.1" step="0.1" /><span className="text-sm font-bold text-slate-600">시간</span></div>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="grid grid-cols-2 gap-2 md:gap-3">
                                            <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 시작</label><TimeSelect value={startTime} onChange={setStartTime} accent="blue" /></div>
                                            <div><label className="block text-[11px] font-bold text-slate-600 mb-1">연차 종료</label><TimeSelect value={endTime} onChange={setEndTime} accent="blue" /></div>
                                            <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 시작 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakStart} onChange={setBreakStart} accent="orange" /></div>
                                            <div><label className="block text-[11px] font-bold text-orange-600 mb-1">휴게 종료 <span className="font-normal text-slate-400">(없으면 0시 0분)</span></label><TimeSelect value={breakEnd} onChange={setBreakEnd} accent="orange" /></div>
                                        </div>
                                    </div>
                                )}
                                {/* 실시간 차감 시간 미리보기 */}
                                <div className={`mt-3 p-2.5 rounded-lg border text-center font-bold ${blockingError ? 'bg-red-50 border-red-200 text-red-600' : ratio >= 1 ? 'bg-blue-50 border-blue-200 text-blue-700' : 'bg-orange-50 border-orange-200 text-orange-700'}`}>
                                    {blockingError ? <span className="text-xs">{blockingError}</span> : (
                                        <div>
                                            <div className="text-sm">실제 차감 <span className="text-lg font-black">{fmt(deductHours)}시간</span> {selectedStaff && <span className="text-[11px] font-normal opacity-70">(하루 {dailyHours}h 중 {Math.round(ratio * 100)}%)</span>}</div>
                                            {inputMode === 'time' && <div className="text-[10px] font-normal opacity-70 mt-0.5">근무 {fmt(calc.workMin / 60)}h {breakStart === breakEnd ? '· 휴게 없음' : calc.overlapMin > 0 ? `− 휴게 겹침 ${fmt(calc.overlapMin / 60)}h` : '· 휴게 겹침 없음'}</div>}
                                        </div>
                                    )}
                                </div>
                            </div>
                            {/* ── 사유 ── */}
                            <div><label className="block text-xs font-bold text-slate-500 mb-1">사유 (선택)</label><input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-100 transition" placeholder="사유 입력" /></div>
                            {/* ── [v6.15.0] 목록에 담기 + 장바구니 (신규 등록 모드에서만 노출) ── */}
                            {!isEdit && (
                                <>
                                    <button type="button" onClick={addToCart} className="w-full bg-slate-100 text-slate-700 py-3 rounded-xl text-sm font-bold hover:bg-slate-200 transition active:scale-95 flex items-center justify-center gap-2 border border-slate-200"><Icons.Plus /> 목록에 담기 {validDates.length > 0 && !blockingError ? `(${validDates.length}일 · 각 ${fmt(deductHours)}h)` : ''}</button>
                                    {cart.length > 0 && (
                                        <div className="bg-blue-50/60 border border-blue-100 rounded-xl p-3 space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-black text-blue-700">담은 휴가 {cart.length}건 · 총 {cartTotalDays}일</span>
                                                <button type="button" onClick={() => setCart([])} className="text-[11px] font-bold text-slate-400 hover:text-red-500 transition">전체 비우기</button>
                                            </div>
                                            <div className="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar">
                                                {cart.map(item => {
                                                    const label = item.inputMode === 'time' ? `${item.startTime}~${item.endTime}${item.breakStart !== item.breakEnd ? ` (휴게 ${item.breakStart}~${item.breakEnd})` : ''}` : '직접 입력';
                                                    return (
                                                        <div key={item.key} className="bg-white border border-blue-100 rounded-lg p-2 flex items-start justify-between gap-2">
                                                            <div className="min-w-0">
                                                                <p className="text-[11px] font-bold text-slate-700 truncate">{item.dates.join(', ')}</p>
                                                                <p className="text-[10px] text-slate-500 mt-0.5 truncate">각 {fmt(item.deductHours)}h · {label}{item.reason ? ` · ${item.reason}` : ''}</p>
                                                            </div>
                                                            <button type="button" onClick={() => removeFromCart(item.key)} className="p-1.5 bg-white border text-red-400 hover:bg-red-50 rounded-md transition flex-shrink-0"><Icons.Trash /></button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                            {/* ── 최종 등록/수정 버튼 (PC에서는 우측 컬럼 하단에 고정되도록 mt-auto) ── */}
                            <div className="md:mt-auto md:pt-2">
                                <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">
                                    {isEdit
                                        ? '수정 내용 저장'
                                        : (cart.length > 0
                                            ? `담은 ${cart.length}건 전체 등록하기 (총 ${cartTotalDays}일)`
                                            : `연차 등록하기 ${validDates.length > 0 && !blockingError ? `(${validDates.length}일 · 각 ${fmt(deductHours)}h)` : ''}`)}
                                </button>
                                {msg && <p className="text-xs text-center font-bold text-red-500 mt-2">{msg}</p>}
                            </div>
                        </div>
                    </form>
                </div></div>
            );
        };
        // ============================================================================
        // [v6.23.0-beta1 신규] 과거 연차 승인 요청 모달 (PastLeaveRequestModal)
        //   · 직원이 이미 지나간 연차를 사후 등록하고 싶을 때 사용하는 '요청' 전용 모달입니다.
        //   · 선택 가능한 날짜는 '당월 1일 이전(과거)'이면서 '최대 2개월 전'까지로 제한합니다.
        //     예) 오늘이 2026-08-14 라면 선택 가능 범위는 2026-06-01 ~ 2026-07-31 입니다.
        //   · 시간 계산은 기존 calcLeaveHours / TimeSelect 를 그대로 재사용합니다 (정밀 시간 계산 로직 100% 동일).
        //   · 사유는 선택 사항입니다.
        //   · 여기서 만든 데이터는 즉시 leaveHistory에 들어가지 않고, 직원 문서의
        //     pendingRequests 배열에 '대기' 상태로 저장되어 관리자 승인을 거칩니다.
        // ============================================================================
        const PastLeaveRequestModal = ({ userData, onClose, showAlert, showConfirm }) => {
            useEscClose(onClose);
            const dailyHours = safeParseFloat(userData?.workHours) || 8;
            // 과거 신청 가능 범위: (당월 - 2개월)의 1일 ~ (당월 1일의 하루 전 = 전월 말일)
            const { minDateStr, maxDateStr } = useMemo(() => {
                const now = new Date();
                const minD = new Date(now.getFullYear(), now.getMonth() - 2, 1);
                const maxD = new Date(now.getFullYear(), now.getMonth(), 0); // 전월 말일
                return { minDateStr: toLocalYMD(minD), maxDateStr: toLocalYMD(maxD) };
            }, []);
            const [selectedDates, setSelectedDates] = useState([]);
            const [inputMode, setInputMode] = useState('time'); // 'time' | 'manual'
            const [startTime, setStartTime] = useState('00:00');
            const [endTime, setEndTime] = useState('00:00');
            const [breakStart, setBreakStart] = useState('00:00');
            const [breakEnd, setBreakEnd] = useState('00:00');
            const [manualHours, setManualHours] = useState('');
            const [reason, setReason] = useState(''); // [지시사항] 사유는 선택 사항
            const [msg, setMsg] = useState('');
            const [submitting, setSubmitting] = useState(false);
            const calc = useMemo(() => calcLeaveHours(startTime, endTime, breakStart, breakEnd), [startTime, endTime, breakStart, breakEnd]);
            const deductHours = inputMode === 'time' ? calc.hours : safeParseFloat(manualHours);
            const blockingError = inputMode === 'time' ? calc.error : (deductHours <= 0 ? '차감 시간을 입력하세요.' : '');
            const ratio = dailyHours > 0 ? Math.min(1, deductHours / dailyHours) : 0;
            const validDates = useMemo(() => [...selectedDates].sort(), [selectedDates]);
            // 이미 등록됐거나(leaveHistory) 이미 요청 중인(pendingRequests) 날짜는 중복 방지 대상
            const takenDates = useMemo(() => {
                const s = new Set();
                (userData?.leaveHistory || []).forEach(h => { if (h.date) s.add(h.date); });
                (userData?.pendingRequests || []).forEach(h => { if (h.date) s.add(h.date); });
                return s;
            }, [userData]);
            const dupDates = useMemo(() => validDates.filter(d => takenDates.has(d)), [validDates, takenDates]);
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validDates.length) { setMsg('❌ 날짜를 먼저 선택해주세요.'); return; }
                if (blockingError) { setMsg('❌ ' + blockingError); return; }
                if (deductHours <= 0) { setMsg('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (dupDates.length) { setMsg(`❌ 다음 날짜는 이미 등록됐거나 요청 중입니다: ${dupDates.join(', ')}`); return; }
                setSubmitting(true); setMsg('처리 중...');
                try {
                    const tText = hourLabel(deductHours);
                    const nowIso = new Date().toISOString();
                    const newRequests = [...(userData.pendingRequests || [])];
                    validDates.forEach((d, idx) => {
                        const rec = {
                            id: Date.now().toString() + idx + Math.random().toString(36).slice(2, 5),
                            date: safeDate(d), days: deductHours, type: tText, reason,
                            addedBy: '본인(직원)', createdAt: nowIso, requestedAt: nowIso, status: 'pending'
                        };
                        if (inputMode === 'time') { rec.startTime = startTime; rec.endTime = endTime; rec.breakStart = breakStart; rec.breakEnd = breakEnd; }
                        else { rec.startTime = ''; rec.endTime = ''; rec.breakStart = ''; rec.breakEnd = ''; }
                        newRequests.push(rec);
                    });
                    await db.collection('users').doc(userData.id).update({ pendingRequests: newRequests });
                    showAlert('✅ 과거 연차 승인 요청이 접수되었습니다.\n관리자 승인 후 연차 내역에 반영됩니다.');
                    onClose();
                } catch (err) { setSubmitting(false); setMsg('❌ 오류: ' + err.message); }
            };
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[520] animate-fade-in backdrop-blur-sm p-4 overflow-y-auto pt-10 md:pt-4">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative my-auto">
                        <button type="button" onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-10"><Icons.X /></button>
                        <h3 className="font-bold text-slate-800 mb-1 flex items-center gap-2 text-lg"><Icons.History /> 과거 연차 승인 요청</h3>
                        <p className="text-xs text-slate-500 font-bold mb-4">이미 지나간 연차를 사후 등록 요청합니다. 관리자가 승인해야 정식 반영됩니다.</p>
                        <div className="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5 mb-4 text-[11px] font-bold text-amber-700">
                            🗓️ 선택 가능 기간: <b>{minDateStr} ~ {maxDateStr}</b> (당월 1일 이전, 최대 2개월 전까지)
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-2">① 날짜 선택</label>
                                <MiniCalendar value={selectedDates} onChange={setSelectedDates} offDays={userData?.offDays} takenDates={takenDates} minDate={minDateStr} maxDate={maxDateStr} initialViewDate={maxDateStr} />
                                <p className="text-[11px] text-slate-500 font-bold mt-2 text-center bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                    {validDates.length ? `선택한 ${validDates.length}일에 각각 ${!blockingError ? fmt(deductHours) + '시간씩' : ''} 요청됩니다` : '달력에서 날짜를 눌러주세요'}
                                </p>
                                {dupDates.length > 0 && <p className="text-[11px] text-orange-600 font-bold mt-1.5 text-center bg-orange-50 py-1.5 rounded-lg border border-orange-200">⚠️ 선택한 날짜 중 {dupDates.length}일은 이미 등록됐거나 요청 중이에요.</p>}
                            </div>
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <label className="block text-xs font-bold text-slate-700 mb-2">② 시간 입력</label>
                                <div className="flex bg-slate-100 p-1 rounded-xl mb-3">
                                    {[['time', '시작·종료로 계산'], ['manual', '시간 직접 입력']].map(([k, label]) => (
                                        <button key={k} type="button" onClick={() => setInputMode(k)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${inputMode === k ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
                                    ))}
                                </div>
                                {inputMode === 'time' ? (
                                    <div className="grid grid-cols-2 gap-2 md:gap-3">

        const StaffTab = ({ staffList, showConfirm, showAlert }) => {

            const [selectedIds, setSelectedIds] = useState(new Set());
            const [searchTerm, setSearchTerm] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'asc' });
            const [showUnregisteredOnly, setShowUnregisteredOnly] = useState(false);

            const activeStaffList = useMemo(() => staffList.filter(s => s.status !== 'resigned'), [staffList]);
            const processedStaffList = useMemo(() => {

                if (searchTerm) { const t = searchTerm.toLowerCase(); data = data.filter(s => (s.name && s.name.toLowerCase().includes(t)) || (s.phone && s.phone.includes(t))); }
                if (showUnregisteredOnly) data = data.filter(s => s.authStatus !== 'success');
                data = data.map(staff => {

                    const totalDays = leaveInfo.total || 0;
                    const totalHours = totalDays * dailyHours;

                    const remainingHours = totalHours - usedHours;
                    return { ...staff, dailyHours, totalDays, totalHours, usedHours, remainingHours, leaveInfo,

                return data;
            }, [activeStaffList, staffList, showResignedToo, searchTerm, sortConfig, showUnregisteredOnly]);
            const handleSort = (key) => setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        if (jsonData.length < 2) { setUploadMsg('❌ 데이터 없음'); return; }
                        const { cols, startRow } = findColumns(jsonData, STAFF_NEEDS, 5);
                        const c = { name: cols.name ?? 0, birth: cols.birth ?? 1, phone: cols.phone ?? 2, join: cols.join ?? 3, work: cols.work ?? 4 };
                        const excelStaffs = [];
                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const name = String(row[c.name] || '').trim();
                            if (name) excelStaffs.push({ name, normName: normalizeString(name), birthRaw: row[c.birth], phoneRaw: row[c.phone], joinRaw: row[c.join], workRaw: row[c.work] });
                        }
                        const batch = db.batch();
                        let newCount = 0, updateCount = 0, resignCount = 0, restoreCount = 0;
                        const matchedIdx = new Set();
                        const todayStr = toLocalYMD(new Date());
                        staffList.forEach(dbStaff => {
                            const normDbName = normalizeString(dbStaff.name);
                            const idx = excelStaffs.findIndex((es, i) => !matchedIdx.has(i) && es.normName === normDbName);
                            const docRef = db.collection('users').doc(dbStaff.id);
                            const wasResigned = dbStaff.status === 'resigned' || !!(dbStaff.resignDate && String(dbStaff.resignDate).trim());
                            if (idx !== -1) {
                                matchedIdx.add(idx); const es = excelStaffs[idx];
                                const joinDate = safeDateRecent(es.joinRaw) || dbStaff.joinDate;
                                const leaveInfo = calculateAnnualLeave(joinDate);
                                const upd = { birth: safeDate(es.birthRaw) || dbStaff.birth || '', phone: es.phoneRaw || dbStaff.phone || '', workHours: es.workRaw || dbStaff.workHours || '', joinDate, annualLeaveTotal: leaveInfo.total || dbStaff.annualLeaveTotal || 0, annualLeavePeriod: leaveInfo.period || dbStaff.annualLeavePeriod || '-' };
                                if (wasResigned) { upd.status = 'active'; upd.resignDate = ''; restoreCount++; } // 명부에 다시 나타남 → 재직 복구
                                else updateCount++;
                                batch.update(docRef, upd);
                            } else if (!wasResigned) {
                                batch.update(docRef, { status: 'resigned', resignDate: todayStr }); resignCount++;
                            }
                        });
                        excelStaffs.forEach((es, idx) => {
                            if (matchedIdx.has(idx)) return;
                            const joinDate = safeDateRecent(es.joinRaw);
                            const leaveInfo = calculateAnnualLeave(joinDate);
                            const phoneStr = String(es.phoneRaw || '').replace(/[^0-9]/g, '').trim();
                            const last4 = phoneStr.length >= 4 ? phoneStr.slice(-4) : '0000';
                            const uniqueKey = `yg${last4}`;
                            const email = `${uniqueKey}_${Math.random().toString(36).substring(2, 6)}@ygnurim.com`;
                            batch.set(db.collection('users').doc(email), { name: es.name, birth: safeDate(es.birthRaw), phone: es.phoneRaw || '', workHours: es.workRaw || '', joinDate, employeeId: uniqueKey, role: 'staff', tempPw: '123456', annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-', status: 'active', resignDate: '', offDays: [0], leaveHistory: [], annualLeaveUsed: 0, authStatus: 'pending' });
                            newCount++;
                        });
                        await batch.commit();
                        setUploadMsg(`✅ 신규:${newCount}명 / 유지:${updateCount}명 / 복구:${restoreCount}명 / 퇴사:${resignCount}명`);
                        setTimeout(() => setUploadMsg(''), 6000); e.target.value = '';
                    } catch (err) { setUploadMsg('❌ 오류: ' + err.message); }
                };

            const handleDeleteOne = (staff) => showConfirm(`정말 [${staff.name}] 직원의 정보를 완전히 삭제하시겠습니까?`, async () => { try { await db.collection('users').doc(staff.id).delete(); showAlert('삭제 완료되었습니다.'); } catch (err) { showAlert('삭제 실패: ' + err.message); } });
            const handleReactivate = (staff) => showConfirm(`[${staff.name}] 직원을 다시 '재직 중' 상태로 복구하시겠습니까?\n\n· 연차·인사 정보는 그대로 유지됩니다.\n· 퇴사일 기록은 지워집니다.`, async () => {

                    try {
                        await db.collection('users').doc(staff.id).update({ authStatus: 'pending', employeeId: '', tempPw: '' });
                        showAlert(`✅ [${staff.name}] 계정 발급 상태를 '미발급'으로 초기화했습니다.\n\n이제 해당 직원 행의 [개별 발급] 버튼을 눌러 계정을 다시 발급할 수 있습니다.`);

                    setUploadMsg('계정 상태 초기화 중...');

                const ws = XLSX.utils.aoa_to_sheet(wsData);

            const issueAccount = async (staff, secondaryApp, assignedEmails) => {
                const phoneStr = String(staff.phone || '').replace(/[^0-9]/g, '');
                const last4 = phoneStr.length >= 4 ? phoneStr.slice(-4) : '0000';
                const base = `yg${last4}`;
                let loginId = base, email = `${base}@ygnurim.com`, counter = 1;
                while (assignedEmails.has(email) && email !== staff.id) { loginId = `${base}_${counter}`; email = `${loginId}@ygnurim.com`; counter++; }
                assignedEmails.add(email);
                const tempPw = '123456';
                try { await secondaryApp.auth().createUserWithEmailAndPassword(email, tempPw); }
                catch (authErr) { if (authErr.code !== 'auth/email-already-in-use') throw authErr; }
                if (staff.id !== email) {
                    const newData = { ...staff, employeeId: loginId, email, tempPw, authStatus: 'success' };
                    delete newData.id;
                    const batch = db.batch();
                    batch.set(db.collection('users').doc(email), newData);
                    batch.delete(db.collection('users').doc(staff.id));
                    await batch.commit();
                } else await db.collection('users').doc(staff.id).update({ tempPw, employeeId: loginId, authStatus: 'success' });
                return loginId;
            };
            const handleCreateSingleAuth = async (staff) => {
                setUploadMsg(`[${staff.name}] 계정 연동 확인 중...`);

                    setUploadMsg(`✅ [${staff.name}] 발급 완료! (ID: ${loginId})`);
                } catch (err) { setUploadMsg(`❌ 오류: ${err.message}`); }
                setTimeout(() => setUploadMsg(''), 4000);
            };
            // [v6.10.0] 비밀번호 초기화 — 직원이 비밀번호 분실 시 초기값(123456)으로 복구
            const handleResetPassword = (staff) => {
                showConfirm(`[${staff.name}] 직원의 비밀번호를 초기 비밀번호(123456)로 되돌리시겠습니까?\n\n· 연차·인사 정보는 그대로 유지됩니다.\n· 직원은 다음 로그인 시 새 비밀번호를 다시 설정하게 됩니다.`, async () => {
                    setUploadMsg(`[${staff.name}] 비밀번호 초기화 중...`);
                    try {
                        const email = staff.id; // 계정 문서 ID = 로그인 이메일
                        const secondaryApp = getSecondaryApp();
                        try {
                            const cred = await secondaryApp.auth().signInWithEmailAndPassword(email, '123456');
                            await secondaryApp.auth().signOut();
                            await db.collection('users').doc(email).update({ tempPw: '123456', authStatus: 'success' });
                            setUploadMsg(`✅ [${staff.name}] 이미 초기 비밀번호(123456) 상태입니다.`);
                            setTimeout(() => setUploadMsg(''), 5000);
                            return;
                        } catch (signInErr) {
                            // 초기 비번이 아니면 삭제 후 재생성 경로로 진행
                        }
                        try {
                            await secondaryApp.auth().createUserWithEmailAndPassword(email, '123456');
                        } catch (createErr) {
                            if (createErr.code === 'auth/email-already-in-use') {
                                throw new Error(
                                    `[${staff.name}] 직원은 초기 비밀번호를 이미 본인 것으로 변경한 상태라,\n` +
                                    `보안 정책상 이 화면(브라우저)에서는 초기화할 수 없습니다.\n\n` +
                                    `아래 순서로 Firebase 콘솔에서 처리해주세요.\n` +
                                    `① console.firebase.google.com 접속 → 우리 프로젝트 선택\n` +
                                    `② 왼쪽 메뉴 [Authentication] → [Users] 탭\n` +
                                    `③ 아래 계정을 찾아 오른쪽 ⋮(점 3개) → '사용자 삭제'\n` +
                                    `    계정 : ${email}\n` +
                                    `④ 삭제 후, 이 화면 [직원 명부]에서 해당 직원의 '개별 발급' 버튼을 다시 누르면\n` +
                                    `    초기 비밀번호(123456)로 계정이 재생성됩니다.\n\n` +
                                    `※ 연차·인사 정보는 삭제되지 않고 그대로 유지되니 안심하세요.`
                                );
                            }
                            throw createErr;
                        }
                        await secondaryApp.auth().signOut();
                        await db.collection('users').doc(email).update({ tempPw: '123456', authStatus: 'success' });
                        setUploadMsg(`✅ [${staff.name}] 초기 비밀번호(123456)로 초기화 완료!`);

        const ResignedStaffTab = ({ staffList, onOpenModal, onEditClick, onNameClick, showAlert, showConfirm }) => {
            const [isPastMode, setIsPastMode] = useState(false);
            const resignedFileInputRef = useRef(null);
            const resignedList = useMemo(() => staffList.filter(s => s.status === 'resigned' || (s.resignDate && String(s.resignDate).trim())), [staffList]);
            const handleResignedStaffUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        const { cols, startRow } = findColumns(jsonData, STAFF_NEEDS, 5);
                        const c = { name: cols.name ?? 0, birth: cols.birth ?? 1, phone: cols.phone ?? 2, join: cols.join ?? 3, work: cols.work ?? 4, resign: cols.resign ?? 5 };
                        const batch = db.batch(); let count = 0;
                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const name = String(row[c.name] || '').trim(); if (!name) continue;
                            const phoneRaw = row[c.phone] || '';
                            const joinDate = safeDateRecent(row[c.join]);
                            const leaveInfo = calculateAnnualLeave(joinDate);
                            const email = `${name}_${String(phoneRaw).trim().slice(-4)}@ygnurim.com`;
                            batch.set(db.collection('users').doc(email), { name, birth: safeDate(row[c.birth]), phone: phoneRaw, workHours: row[c.work] || '', joinDate, role: 'staff', tempPw: '123456', annualLeaveTotal: leaveInfo.total || 0, annualLeavePeriod: leaveInfo.period || '-', status: 'resigned', resignDate: safeDateRecent(row[c.resign]) || '', offDays: [0] }, { merge: true });
                            count++;
                        }
                        await batch.commit(); showAlert(`✅ 퇴사자 ${count}명 명부 등록 완료!`);
                    } catch (err) { showAlert('오류: ' + err.message); }
                };
            };

                            <input type="file" ref={resignedFileInputRef} onChange={handleResignedStaffUpload} accept=".xlsx, .xls" className="hidden" />
                            <button onClick={() => resignedFileInputRef.current.click()} className="bg-orange-500 text-white px-4 py-3 md:py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-orange-600 transition shadow-lg shadow-orange-200"><Icons.Upload /> 퇴사자 명부 업로드</button>
                        </div>

                    </div>
                </div>

        // ── 개별 연차 1건을 보여주는 공통 행 (수정 / 삭제 버튼 포함) ──
        const DashboardLeaveRow = ({ rec, staffName, dailyHours, onEdit, onDelete, busy }) => (

                <div className="flex items-center gap-1.5 shrink-0">

                </div>

        );
        // ── ① [금일 휴가자] 팝업 ──
        const TodayLeaveModal = ({ staffList, adminName, onEditClick, onClose, showAlert, showConfirm }) => {
            const [busy, setBusy] = useState('');
            const todayStr = toLocalYMD(new Date());
            const rows = useMemo(() => {
                const list = [];
                (staffList || []).forEach(staff => {
                    (staff.leaveHistory || []).forEach((rec, index) => {
                        if (rec.date === todayStr) list.push({ rec, index, staff });
                    });
                });
                return list.sort((a, b) => String(a.staff.name || '').localeCompare(String(b.staff.name || '')));
            }, [staffList, todayStr]);
            const handleDelete = (row) => {
                showConfirm(`${row.staff.name} 직원의 ${row.rec.date} (${row.rec.type}) 휴가를 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.`, async () => {
                    setBusy(row.rec.id);
                    try {
                        await processLeaveTransaction(row.staff.id, adminName || '관리자', {
                            type: 'DELETE', leaves: [], targetId: row.rec.id, origin: 'Dashboard.TodayLeaveModal'
                        });
                    } catch (err) { showAlert('오류: ' + err.message); }
                    finally { setBusy(''); }
                });
            };
            return (
                <DashboardModalShell title="금일 휴가자" subtitle={`${todayStr} 기준 · 여기서 바로 수정·삭제할 수 있습니다`}

                    {rows.length === 0

                                    onDelete={() => handleDelete(row)} />
                            ))}
                        </div>}
                </DashboardModalShell>
            );
        };
        // ── ② [연차 초과자] 팝업 ──
        const OverLimitModal = ({ staffList, adminName, onEditClick, onClose, showAlert, showConfirm }) => {
            const [busy, setBusy] = useState('');
            const [openId, setOpenId] = useState('');
            const rows = useMemo(() => {
                const list = [];
                (staffList || []).forEach(staff => {
                    const li = calculateAnnualLeave(staff.joinDate);
                    const dh = safeParseFloat(staff.workHours) || 8;
                    const totalHours = (li.total || 0) * dh;
                    const usedHours = sumUsedHours(staff.leaveHistory, li.startDate, li.endDate);
                    const remainingHours = totalHours - usedHours;
                    if (remainingHours >= 0) return;
                    const history = (staff.leaveHistory || [])
                        .map((rec, index) => ({ rec, index }))
                        .filter(x => x.rec.date >= li.startDate && x.rec.date <= li.endDate)
                        .sort((a, b) => String(b.rec.date).localeCompare(String(a.rec.date)));
                    list.push({ staff, li, dh, totalHours, usedHours, remainingHours, history });
                });
                return list.sort((a, b) => a.remainingHours - b.remainingHours);
            }, [staffList]);

                showConfirm(`${staff.name} 직원의 ${rec.date} (${rec.type}) 휴가를 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.`, async () => {

                        await processLeaveTransaction(staff.id, adminName || '관리자', {
                            type: 'DELETE', leaves: [], targetId: rec.id, origin: 'Dashboard.OverLimitModal'
                        });

                    finally { setBusy(''); }

                                            {row.history.length === 0

                                                        onDelete={() => handleDelete(row.staff, x.rec)} />
                                                ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>}
                </DashboardModalShell>
            );

        //     · plan-preview-doc : 모달 안에서 '보기용'. 화면 크기에 맞춰 축소(transform)됩니다.

        const PLAN_PRINT_CSS = `
@media print {
  body * { visibility: hidden !important; }
  #plan-print-area, #plan-print-area * { visibility: visible !important; }
  #plan-print-area {
    position: static !important; left: auto !important; top: auto !important;
    width: 100% !important; margin: 0 !important; padding: 0 !important;
    overflow: visible !important; background: #fff !important;
  }
  #plan-print-doc { width: 100% !important; min-height: 0 !important; padding: 0 !important; }
}
@page { size: A4 portrait; margin: 12mm; }
`;
        const PlanPreviewModal = ({ plan, onClose, showAlert, viewerRole = 'staff' }) => {
            const [busy, setBusy] = useState(false);
            // 화면이 좁으면 기본 배율을 낮춰 문서 전체가 한눈에 들어오게 합니다.
            const [scale, setScale] = useState(() => (typeof window !== 'undefined' && window.innerWidth < 900) ? 0.5 : 0.9);
            useEscClose(onClose, !busy);
            const fileName = `연차사용계획서_${plan.staffName || ''}_${String(plan.submittedAt || '').substring(0, 10)}.pdf`;
            const handlePrint = () => {
                // 브라우저 인쇄창 → 사용자가 '대상: PDF로 저장'을 골라도 됩니다.

        // ============================================================================

        // ============================================================================
        const SubmittedPlansView = ({ staffList, showAlert }) => {

        };
        // [v6.25.0-beta1] 1년 미만 연차(최대 11일)를 9일분 / 2일분으로 나눠 잔여를 계산합니다.
        //   연차는 먼저 발생한 것부터 사용된다고 보아(선입선출), 9일분을 먼저 소진한 것으로 계산합니다.
        const splitUnder1Portion = (totalDays, remainingDays) => {
            const total = Math.max(0, safeParseFloat(totalDays));
            const remain = Math.max(0, safeParseFloat(remainingDays));
            const used = Math.max(0, total - remain);
            const nineTotal = Math.min(total, 9);
            const twoTotal = Math.max(0, total - nineTotal);
            const nineUsed = Math.min(used, nineTotal);
            const twoUsed = Math.max(0, used - nineUsed);
            return {
                nineTotal, twoTotal,
                nineRemaining: Math.round((nineTotal - nineUsed) * 10) / 10,
                twoRemaining: Math.round((twoTotal - twoUsed) * 10) / 10
            };
        };
        const PromotionTab = ({ staffList, allStaffList, showAlert, onOpenModal, adminName }) => {
            const today = new Date();
            const defaultMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            const [startMonth, setStartMonth] = useState(defaultMonth);
            const [endMonth, setEndMonth] = useState(defaultMonth);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
            const [showAuditModal, setShowAuditModal] = useState(false);
            // [v6.26.0-beta1] 상위 뷰 : 'notice'(촉진 대상 통보 관리) | 'plans'(제출된 사용 계획서 관리)
            const [mainView, setMainView] = useState('notice');
            // 제출된 계획서 총 건수 — 상위 뷰 버튼의 배지에 사용
            const submittedPlanCount = useMemo(() =>
                (allStaffList || staffList || []).reduce((sum, s) => sum + (Array.isArray(s.submittedPlans) ? s.submittedPlans.length : 0), 0),
            [allStaffList, staffList]);
            // [v6.25.0-beta1] 촉진 유형 탭 : 'over1'(1년 이상 정기) | 'under1'(1년 미만 신입)
            const [promoView, setPromoView] = useState('over1');
            const [guideOpen, setGuideOpen] = useState(true);
            // 2차 촉진은 법적으로 '1차 계획서 미제출자'에게만 보내므로 기본적으로 제출자를 숨깁니다.
            const [hideSubmittedSecond, setHideSubmittedSecond] = useState(true);
            const [togglingKey, setTogglingKey] = useState('');
            // ── 조회 기간 내 '모든' 촉진 의무를 (직원 × 촉진건) 단위로 평탄화 ──
            const { allRows, countOver1, countUnder1 } = useMemo(() => {
                const rows = [];
                const [sY, sM] = startMonth.split('-').map(Number);
                const [eY, eM] = endMonth.split('-').map(Number);
                if (isNaN(sY) || isNaN(eY) || isNaN(sM) || isNaN(eM)) return { allRows: rows, countOver1: 0, countUnder1: 0 };
                const startVal = sY * 12 + sM, endVal = eY * 12 + eM;
                if (endVal < startVal) return { allRows: rows, countOver1: 0, countUnder1: 0 };
                const seen = new Set();
                staffList.forEach(staff => {
                    for (let val = startVal; val <= endVal; val++) {
                        const y = Math.floor((val - 1) / 12), m = ((val - 1) % 12) + 1;
                        const statusList = getPromotionStatusList(staff, y, m);
                        statusList.forEach(status => {
                            // 같은 (직원 · 산정기간 · 촉진유형) 조합이 중복 집계되지 않도록 방어
                            const rowKey = `${staff.id}__${status.baseYear}__${status.portion}__${status.step}`;
                            if (seen.has(rowKey)) return;
                            seen.add(rowKey);
                            const leaveInfo = status.leaveInfo;
                            const dailyHours = safeParseFloat(staff.workHours) || 8;
                            const totalDays = leaveInfo.total || 0;
                            const totalHours = totalDays * dailyHours;
                            const usedHours = sumUsedHours(staff.leaveHistory, leaveInfo.startDate, leaveInfo.endDate);
                            const remainingHours = totalHours - usedHours;
                            const remainingDays = dailyHours > 0 ? Math.round((remainingHours / dailyHours) * 10) / 10 : 0;
                            // 1년 미만은 9일분 / 2일분 중 '이 통보서가 다루는 몫'만 대상 일수로 씁니다.
                            let portionRemainingDays = remainingDays;
                            if (status.promoCategory === 'under1') {
                                const split = splitUnder1Portion(totalDays, remainingDays);
                                portionRemainingDays = status.portion === '9days' ? split.nineRemaining : split.twoRemaining;
                            }
                            const plan = resolvePlanSubmitted(staff, status);
                            rows.push(Object.assign({}, staff, {
                                rowKey,
                                pdfId: `pdf-content-${staff.id}-${status.baseYear}-${status.portion}-${status.step}`,
                                promoStatus: status, targetDate: `${y}년 ${m}월`, targetY: y, targetM: m,
                                leaveInfo, dailyHours, totalDays, totalHours, usedHours, remainingHours,
                                usedDays: dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0,
                                remainingDays, portionRemainingDays,
                                promoPlanKey: status.promoPlanKey,
                                isPlanSubmitted: plan.submitted, isLegacyPlan: plan.fromLegacy
                            }));
                        });
                    }
                });
                rows.sort((a, b) => (a.targetY - b.targetY) || (a.targetM - b.targetM)
                    || (a.promoStatus.order - b.promoStatus.order)
                    || String(a.name || '').localeCompare(String(b.name || '')));
                return {
                    allRows: rows,
                    countOver1: rows.filter(r => r.promoStatus.promoCategory === 'over1').length,
                    countUnder1: rows.filter(r => r.promoStatus.promoCategory === 'under1').length
                };
            }, [staffList, startMonth, endMonth]);
            // 선택된 탭 + '2차는 미제출자만' 필터를 적용한 최종 목록
            const promotionList = useMemo(() => {
                let list = allRows.filter(r => r.promoStatus.promoCategory === promoView);
                if (hideSubmittedSecond) list = list.filter(r => !(r.promoStatus.step === 2 && r.isPlanSubmitted));
                return list;
            }, [allRows, promoView, hideSubmittedSecond]);
            const hiddenSecondCount = useMemo(() => {
                if (!hideSubmittedSecond) return 0;
                return allRows.filter(r => r.promoStatus.promoCategory === promoView && r.promoStatus.step === 2 && r.isPlanSubmitted).length;

                        const fixedY = y - 100;                           // 2041 → 1941
                        if (fixedY < 1900) return;

                            let batch = db.batch(), count = 0, total = 0;

                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-amber-200">

                                    <h4 className="font-bold text-slate-800 mb-1">생년월일 오류 점검 및 수정</h4>
                                    <p className="text-xs text-slate-500 leading-relaxed">과거 버전에서 두 자리 연도를 잘못 해석해 <b className="text-amber-700">1941년생이 2041년(미래)</b>으로 저장된 경우가 있습니다.<br/>미래 날짜로 저장된 직원을 찾아 100년 앞당겨 바로잡습니다.</p>
                                </div>

                            <div className="flex gap-2 w-full md:w-auto">
                                <button onClick={scanBirthIssues} disabled={isProcessing} className="flex-1 md:flex-none bg-amber-500 text-white px-5 py-3 rounded-xl font-bold hover:bg-amber-600 transition shadow-lg shadow-amber-200 flex justify-center items-center gap-2 text-sm"><Icons.Search /> 오류 점검 시작</button>
                                {birthIssues && birthIssues.length > 0 && (<button onClick={applyBirthFix} disabled={isProcessing} className="flex-1 md:flex-none bg-blue-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex justify-center items-center gap-2 text-sm"><Icons.CheckCircle /> {birthIssues.length}명 일괄 수정</button>)}

        // ============================================================================
        // [v6.23.0-beta1 신규] 관리자 '결재 관리' 탭 (ApprovalManagementTab)
        //   · 전 직원 중 pendingRequests에 데이터가 1건이라도 있는 직원의 요청 내역을 모아 보여줍니다.
        //   · [승인] : [v6.24.0-beta1] processLeaveTransaction(type:'ADD') 한 번으로
        //              ① pendingRequests 제거 ② leaveHistory 추가 ③ 잔여 연차 재계산
        //              ④ audit_logs 기록 을 '하나의 트랜잭션'으로 원자 처리합니다.
        //              (종전에는 pendingRequests 갱신과 연차 반영이 분리돼 있어,
        //               중간에 실패하면 요청만 사라지고 연차는 반영되지 않을 수 있었습니다.)
        //   · [반려] : 관리자에게 반려 사유를 입력받는 프롬프트 창을 띄운 뒤,
        //              pendingRequests에서 제거하고 rejectReason을 포함해 rejectedRequests에 보관합니다.
        // ============================================================================
        const ApprovalManagementTab = ({ staffList, adminName, showAlert, showConfirm }) => {
            const [processingId, setProcessingId] = useState('');
            // 전 직원의 pendingRequests를 평탄화해서 하나의 목록으로 구성
            const requestRows = useMemo(() => {
                const rows = [];
                (staffList || []).forEach(staff => {
                    (staff.pendingRequests || []).forEach(req => {
                        rows.push({ req, staffId: staff.id, staffName: staff.name, staffWorkHours: staff.workHours });
                    });
                });
                rows.sort((a, b) => String(a.req.requestedAt || a.req.createdAt || '').localeCompare(String(b.req.requestedAt || b.req.createdAt || '')));
                return rows;
            }, [staffList]);
            const handleApprove = (row) => {
                showConfirm(`[${row.staffName}] ${row.req.date} (${fmt(row.req.days)}시간 · ${row.req.type}) 과거 연차 요청을 승인하시겠습니까?\n\n승인 시 정식 연차 내역에 등록되고 잔여 연차가 즉시 차감됩니다.`, async () => {
                    setProcessingId(row.req.id);
                    try {
                        const staff = staffList.find(s => s.id === row.staffId);
                        if (!staff) { showAlert('❌ 대상 직원 정보를 찾을 수 없습니다.'); return; }
                        const newHistoryRec = {
                            id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                            date: row.req.date, days: row.req.days, type: row.req.type, reason: row.req.reason || '',
                            addedBy: (adminName || '관리자') + '(과거 연차 승인)', createdAt: new Date().toISOString(),
                            startTime: row.req.startTime || '', endTime: row.req.endTime || '', breakStart: row.req.breakStart || '', breakEnd: row.req.breakEnd || '',
                            approvedFrom: 'pastLeaveRequest', originalRequestId: row.req.id
                        };
                        // [v6.24.0-beta1] pendingRequests 제거 + 연차 반영 + 감사 로그를 단일 트랜잭션으로 처리.
                        //   extraUpdates 에 함수를 넘기면 '트랜잭션 안에서 방금 읽은 최신 문서'를 인자로 받으므로,
                        //   다른 관리자가 그 사이에 다른 요청을 처리했더라도 그 결과가 유실되지 않습니다.
                        await processLeaveTransaction(row.staffId, adminName || '관리자', {
                            type: 'ADD',
                            leaves: [newHistoryRec],
                            targetId: null,
                            origin: 'ApprovalManagementTab.handleApprove',
                            extraUpdates: (freshData) => ({
                                pendingRequests: (freshData.pendingRequests || []).filter(r => r.id !== row.req.id)
                            })
                        });
                        showAlert(`✅ [${row.staffName}] 요청을 승인했습니다.\n연차 내역에 반영되고 잔여 연차가 차감되었습니다.`);
                    } catch (err) { showAlert('❌ 오류: ' + err.message); }
                    finally { setProcessingId(''); }
                });
            };
            const handleReject = (row) => {
                // [지시사항] 관리자에게 '반려 사유'를 입력받는 프롬프트 창을 띄웁니다.
                const reasonInput = window.prompt(`[${row.staffName}] ${row.req.date} 요청을 반려합니다.\n반려 사유를 입력해주세요 (직원 화면에 표시됩니다):`, '');
                if (reasonInput === null) return; // 취소를 누르면 아무 것도 하지 않음
                const rejectReason = reasonInput.trim() || '(사유 미입력)';
                (async () => {
                    setProcessingId(row.req.id);
                    try {
                        const staff = staffList.find(s => s.id === row.staffId);
                        if (!staff) { showAlert('❌ 대상 직원 정보를 찾을 수 없습니다.'); return; }
                        const newPending = (staff.pendingRequests || []).filter(r => r.id !== row.req.id);
                        const rejectedRec = { ...row.req, rejectReason, rejectedAt: new Date().toISOString(), rejectedBy: adminName || '관리자' };
                        const newRejected = [...(staff.rejectedRequests || []), rejectedRec];

        const expandYear2Recent = (yy) => {

        const _dateCache = new Map();
        const _safeDateRaw = (val, recent) => {
            const expand = recent ? expandYear2Recent : expandYear2;
            if (!val) return ''; let str = String(val).trim().replace(/[\.\/]/g, '-');
            if (str.length === 6 && !isNaN(str) && !str.includes('-')) { const y = expand(str.substring(0,2)); return `${y}-${str.substring(2,4)}-${str.substring(4,6)}`; }
            if (str.length === 8 && !isNaN(str) && !str.includes('-')) return `${str.substring(0,4)}-${str.substring(4,6)}-${str.substring(6,8)}`;
            const parts = str.split('-');
            if (parts.length === 3) { let y = parts[0]; if (y.length === 2) y = String(expand(y)); const m = parts[1].padStart(2, '0'); const d = parts[2].padStart(2, '0'); if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return `${y}-${m}-${d}`; }
            if (/^\d{5,6}$/.test(str)) { const n = parseInt(str); if (n > 20000 && n < 60000) { try { const date = new Date((n - 25569) * 86400 * 1000); date.setHours(date.getHours() + 9); return toLocalYMD(date); } catch(e) { return ''; } } }

        };
        const safeDate = (val) => {

        const calculateLeaveForYear = (rawJoinDate, targetYear) => {
            const joinDateStr = safeDate(rawJoinDate);
            if (!joinDateStr || joinDateStr.length < 10) return { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };

            const [jYear, jMonth, jDay] = joinDateStr.split('-').map(Number);

            let result;
            if (isNaN(joinDate.getTime())) result = { total: 0, period: '-', startDate: '', endDate: '', notJoined: true };
            else if (jYear > targetYear) result = { total: 0, period: '입사 전', startDate: '', endDate: '', notJoined: true };
            else {
                const startDate = new Date(targetYear, jMonth - 1, jDay);
                const endDate = new Date(targetYear + 1, jMonth - 1, jDay); endDate.setDate(endDate.getDate() - 1);
                const yearsWorked = targetYear - jYear;
                let totalLeave;
                if (yearsWorked < 1) {
                    const today = new Date();
                    let monthsWorked = (today.getFullYear() - jYear) * 12 + (today.getMonth() - (jMonth - 1));
                    if (today.getDate() < jDay) monthsWorked--;

                } else totalLeave = Math.min(25, 15 + Math.floor((yearsWorked - 1) / 2));
                result = { total: totalLeave, period: `${toLocalYMD(startDate)} ~ ${toLocalYMD(endDate)}`, startDate: toLocalYMD(startDate), endDate: toLocalYMD(endDate), notJoined: false, yearsWorked };

        const findColumns = (jsonData, needs, scanRows = 10) => {

                        if (hit === -1) continue;
                        const sc = list.length - hit; // 앞쪽 키워드일수록 높은 점수
                        if (key === 'name') { if (rowScore.name === undefined || sc > rowScore.name) { foundName = j; rowScore.name = sc; } }
                        else if (rowScore[key] === undefined || sc > rowScore[key]) { rowCols[key] = j; rowScore[key] = sc; }
                    }
                }
                if (foundName === -1) continue;
                const quality = Object.keys(rowCols).length; // 이름 외 인식 항목 수
                if (!best || quality > best.quality) {
                    best = { quality, cols: Object.assign({}, rowCols, { name: foundName }), startRow: i + 1 };
                }
                if (quality >= 2) break; // 충분히 좋은 헤더면 즉시 확정
            }
            return best ? { cols: best.cols, startRow: best.startRow } : { cols: {}, startRow: 1 };
        };

        // [공통화] 달력 주(week) 배열 생성
        const buildWeeks = (year, month) => {
            const startDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weeks = []; let curr = new Array(startDay).fill(null);
            for (let i = 1; i <= daysInMonth; i++) { curr.push(i); if (curr.length === 7) { weeks.push(curr); curr = []; } }
            if (curr.length > 0) { while (curr.length < 7) curr.push(null); weeks.push(curr); }
            while (weeks.length < 6) weeks.push(new Array(7).fill(null));
            return weeks;
        };

        const getPromotionStatus = (staff, checkYear, checkMonth) => {
            if (!staff.joinDate) return null;
            const [jYear, jMonth, jDay] = safeDate(staff.joinDate).split('-').map(Number);
            if (isNaN(jYear)) return null;
            for (let baseYear = checkYear - 1; baseYear <= checkYear; baseYear++) {
                if (baseYear < jYear) continue;
                const leaveInfo = calculateLeaveForYear(staff.joinDate, baseYear);
                if (leaveInfo.notJoined) continue;
                const [eYear, eMonth, eDay] = leaveInfo.endDate.split('-').map(Number);
                const endDate = new Date(eYear, eMonth - 1, eDay);
                if (leaveInfo.yearsWorked < 1) {
                    const notifyDate = new Date(jYear, jMonth - 1, jDay);
                    notifyDate.setFullYear(notifyDate.getFullYear() + 1); notifyDate.setMonth(notifyDate.getMonth() - 3);
                    if (notifyDate.getFullYear() === checkYear && (notifyDate.getMonth() + 1) === checkMonth) return { type: '1년미만 1차', msg: '1년 도래 3개월 전', color: 'bg-purple-100 text-purple-700', leaveInfo, baseYear };
                } else {
                    const n1 = new Date(endDate); n1.setMonth(n1.getMonth() - 6);
                    const n2 = new Date(endDate); n2.setMonth(n2.getMonth() - 2);
                    if (n1.getFullYear() === checkYear && (n1.getMonth() + 1) === checkMonth) return { type: '1차 촉진', msg: '만료 6개월 전', color: 'bg-blue-100 text-blue-700', leaveInfo, baseYear };
                    if (n2.getFullYear() === checkYear && (n2.getMonth() + 1) === checkMonth) return { type: '2차 촉진', msg: '만료 2개월 전', color: 'bg-red-100 text-red-700', leaveInfo, baseYear };
                }
            } return null;
        };

        // [공통화] 지정일 문자열 파싱 (4.1 / 2026.5.21 / 2026-05-21)
        const parseCustomDates = (input, defaultYear) => {
            const out = [];
            input.split(/[, ]+/).forEach(p => {
                const s = p.trim(); if (!s) return;
                const mFull = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})$/);
                const mMd = s.match(/^(\d{1,2})[\.\-\/](\d{1,2})$/);
                if (mFull) out.push(`${mFull[1]}-${mFull[2].padStart(2,'0')}-${mFull[3].padStart(2,'0')}`);
                else if (mMd) out.push(`${defaultYear}-${mMd[1].padStart(2,'0')}-${mMd[2].padStart(2,'0')}`);
                else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) out.push(s);
            });
            return out;
        };

        // [공통화] 기간 내 근무일(휴무일 제외) 나열
        const listWorkingDates = (start, end, offDays) => {
            const dates = []; const curr = new Date(start); const last = new Date(end);
            if (isNaN(curr.getTime()) || isNaN(last.getTime()) || curr > last) return dates;
            const off = offDays && offDays.length ? offDays : [0];
            while (curr <= last) { if (!off.includes(curr.getDay())) dates.push(toLocalYMD(curr)); curr.setDate(curr.getDate() + 1); }
            return dates;
        };

        // ============ [v6.17.0] 월별 마감 · 미래(예정) 판정 공통 유틸 ============
        // [3번 월별 마감] 직원은 '당월 1일'부터만 등록/수정/삭제할 수 있습니다.
        //   currentMonthStart() = 이번 달 1일 00:00 의 'YYYY-MM-01' 문자열.
        //   isPastLockedForStaff(dateStr) = 그 날짜가 당월 1일보다 이전이면 true(직원 잠금).
        //   ※ 관리자에게는 이 함수를 적용하지 않습니다(제한 없음).
        const currentMonthStart = () => {
            const t = new Date();
            return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-01`;
        };
        const isPastLockedForStaff = (dateStr) => {
            if (!dateStr) return false;
            return String(dateStr) < currentMonthStart();
        };
        // 달력에서 '과거로 잠긴 달'인지 판정 (해당 월의 말일이 당월 1일보다 이전이면 그 달 전체가 과거)
        const isMonthPastLocked = (year, month0) => {
            const lastDay = new Date(year, month0 + 1, 0);
            return toLocalYMD(lastDay) < currentMonthStart();
        };

        // [4번 미래 '예정' 표시] 오늘(자정 기준)보다 뒤 날짜면 아직 오지 않은 '예정' 연차입니다.
        //   차감·합산은 종전과 동일하게 이뤄지되, 화면에서만 '예정'으로 구분해 보여줍니다.
        const isFutureLeave = (dateStr) => {
            if (!dateStr) return false;
            return String(dateStr) > toLocalYMD(new Date());
        };

        // [2번 ESC 닫기] 모달이 열려 있는 동안 ESC 키를 누르면 onClose를 호출하는 공통 훅.
        //   · enabled=false 면 리스너를 걸지 않습니다(확인·경고·비번강제 등 제외 대상).
        //   · 여러 모달이 동시에 열려도, 각 모달이 자기 리스너를 달았다가 언마운트 시 해제하므로
        //     가장 위(마지막에 열린) 모달부터 순차적으로 닫힙니다.
        const useEscClose = (onClose, enabled = true) => {
            useEffect(() => {
                if (!enabled || typeof onClose !== 'function') return;
                const handler = (e) => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } };
                document.addEventListener('keydown', handler);
                return () => document.removeEventListener('keydown', handler);
            }, [onClose, enabled]);
        };

        // ============ [v6.12.0] 시간(Hour) 단위 정밀 계산 유틸 ============
        const timeToMinutes = (t) => {
            if (!t || typeof t !== 'string' || !/^\d{1,2}:\d{2}$/.test(t)) return null;
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return null;
            return h * 60 + m;
        };
        const calcLeaveHours = (startT, endT, breakStartT, breakEndT) => {
            const s = timeToMinutes(startT), e = timeToMinutes(endT);
            if (s === null || e === null) return { hours: 0, error: '연차 시작·종료 시간을 입력하세요.', workMin: 0, overlapMin: 0 };
            if (e <= s) return { hours: 0, error: '연차 종료 시간은 시작 시간보다 뒤여야 합니다.', workMin: 0, overlapMin: 0 };
            const workMin = e - s;
            const bs = timeToMinutes(breakStartT), be = timeToMinutes(breakEndT);
            if (bs === null || be === null) return { hours: 0, error: '휴게 시작·종료 시간을 입력하세요.', workMin, overlapMin: 0 };
            if (be < bs) return { hours: 0, error: '휴게 종료 시간은 시작 시간보다 뒤여야 합니다.', workMin, overlapMin: 0 };
            const overlapMin = Math.max(0, Math.min(e, be) - Math.max(s, bs));
            const net = workMin - overlapMin;
            if (net <= 0) return { hours: 0, error: '휴게시간을 빼면 실제 차감 시간이 0 이하입니다.', workMin, overlapMin };
            return { hours: Math.round((net / 60) * 100) / 100, error: '', workMin, overlapMin };
        };
        const hourLabel = (h) => `${fmt(h)}시간`;

        // ============ [v6.13.0] 24시간제 시간 선택기 (시·분 드롭다운) ============
        const TimeSelect = ({ value, onChange, accent }) => {
            const [hh, mm] = (value && /^\d{1,2}:\d{2}$/.test(value)) ? value.split(':').map(Number) : [0, 0];
            const border = accent === 'orange' ? 'border-orange-200 focus:border-orange-500' : 'border-slate-200 focus:border-blue-500';
            const setHour = (h) => onChange(`${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`);
            const setMin = (m) => onChange(`${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
            const minutes = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
            const minuteOpts = minutes.includes(mm) ? minutes : [...minutes, mm].sort((a, b) => a - b);
            return (
                <div className="flex items-center gap-1">
                    <select value={hh} onChange={e => setHour(parseInt(e.target.value))} className={`flex-1 min-w-0 border ${border} rounded-lg p-2.5 md:p-2 text-sm outline-none bg-white font-bold text-center cursor-pointer`}>
                        {Array.from({ length: 24 }, (_, h) => <option key={h} value={h}>{h}시</option>)}
                    </select>
                    <select value={mm} onChange={e => setMin(parseInt(e.target.value))} className={`flex-1 min-w-0 border ${border} rounded-lg p-2.5 md:p-2 text-sm outline-none bg-white font-bold text-center cursor-pointer`}>
                        {minuteOpts.map(m => <option key={m} value={m}>{String(m).padStart(2, '0')}분</option>)}
                    </select>
                </div>
            );
        };

        // ============ [v6.13.0] 통합 미니 캘린더 (날짜방식 탭 제거) ============
        // [v6.17.0] lockPast: true 이면 '당월 1일 이전' 날짜를 선택 불가로 잠급니다(직원 월별 마감용).
        //           관리자 등록 모달에서는 lockPast를 넘기지 않아(=false) 과거도 자유롭게 선택 가능합니다.
        const MiniCalendar = ({ value, onChange, offDays, takenDates, lockPast = false }) => {
            const arr = Array.isArray(value) ? value : [];
            const taken = takenDates instanceof Set ? takenDates : new Set();
            const [viewDate, setViewDate] = useState(() => {
                const base = arr.length ? new Date(arr[arr.length - 1]) : new Date();
                return isNaN(base.getTime()) ? new Date() : base;
            });
            const [rangeMode, setRangeMode] = useState(false);
            const [rangeAnchor, setRangeAnchor] = useState(null); // 범위 채우기 시작점

            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());
            const off = offDays && offDays.length ? offDays : [0];

            const isSelected = (dateStr) => arr.includes(dateStr);

            const handleClick = (dateStr) => {
                // [v6.17.0] 직원 월별 마감: 당월 1일 이전 날짜는 선택 불가
                if (lockPast && isPastLockedForStaff(dateStr)) return;
                if (rangeMode) {
                    if (!rangeAnchor) { setRangeAnchor(dateStr); return; }
                    const a = rangeAnchor < dateStr ? rangeAnchor : dateStr;
                    const b = rangeAnchor < dateStr ? dateStr : rangeAnchor;
                    let span = listWorkingDates(a, b, off);
                    // [v6.17.0] 범위 채우기에서도 잠긴 과거 날짜는 제외
                    if (lockPast) span = span.filter(ds => !isPastLockedForStaff(ds));
                    const merged = Array.from(new Set([...arr, ...span])).sort();
                    onChange(merged);
                    setRangeAnchor(null);
                    return;
                }
                onChange(arr.includes(dateStr) ? arr.filter(d => d !== dateStr) : [...arr, dateStr].sort());
            };

            const toggleRangeMode = () => { setRangeMode(v => !v); setRangeAnchor(null); };

            return (
                <div className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm select-none">
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={() => setViewDate(new Date(year, month - 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronLeft /></button>
                        <div className="flex items-center gap-2">
                            <span className="font-black text-slate-800 text-sm">{year}년 {month + 1}월</span>
                            <button type="button" onClick={() => setViewDate(new Date())} className="text-[10px] font-bold text-blue-600 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-md hover:bg-blue-100 transition">오늘</button>
                        </div>
                        <button type="button" onClick={() => setViewDate(new Date(year, month + 1, 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg transition"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex items-center justify-between mb-2 gap-2">
                        <button type="button" onClick={toggleRangeMode} className={`flex-1 text-[11px] font-bold py-1.5 rounded-lg border transition ${rangeMode ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>
                            {rangeMode ? (rangeAnchor ? '끝 날짜를 클릭하세요' : '시작 날짜를 클릭하세요') : '📆 기간 한 번에 선택'}
                        </button>
                        {arr.length > 0 && <button type="button" onClick={() => { onChange([]); setRangeAnchor(null); }} className="text-[11px] font-bold py-1.5 px-3 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-red-500 transition">전체 해제</button>}
                    </div>
                    <div className="grid grid-cols-7 gap-1 mb-1">
                        {WEEK_LABELS.map((d, i) => (<div key={d} className={`text-center text-[10px] font-bold py-1 ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-slate-400'}`}>{d}</div>))}
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                        {weeks.flat().map((d, idx) => {
                            if (!d) return <div key={idx} />;
                            const dateStr = `${prefix}-${String(d).padStart(2, '0')}`;
                            const sel = isSelected(dateStr);
                            const isAnchor = rangeMode && rangeAnchor === dateStr;
                            const isToday = dateStr === todayStr;
                            const isTaken = taken.has(dateStr);
                            const dow = idx % 7;
                            const isOff = off.includes(dow);
                            const isLocked = lockPast && isPastLockedForStaff(dateStr); // [v6.17.0] 과거 잠금 여부
                            let cls = 'text-slate-700';
                            if (isAnchor) cls = 'bg-amber-500 text-white font-black shadow-md ring-2 ring-amber-300';
                            else if (sel) cls = 'bg-blue-600 text-white font-black shadow-md';
                            else if (isToday) cls = 'ring-2 ring-blue-400 text-blue-600 font-bold';
                            else if (dow === 0) cls = 'text-red-400';
                            else if (dow === 6) cls = 'text-blue-400';
                            return (
                                <button key={idx} type="button" disabled={isLocked} onClick={() => handleClick(dateStr)} title={isLocked ? '지난달 이전은 관리자만 등록할 수 있어요' : (isTaken ? '이미 등록된 휴가가 있는 날' : '')} className={`relative h-9 rounded-lg text-xs transition flex items-center justify-center ${isLocked ? 'opacity-30 cursor-not-allowed line-through' : 'hover:bg-slate-100'} ${cls} ${isOff && !sel && !isAnchor && !isLocked ? 'opacity-40' : ''}`}>
                                    {d}
                                    {isTaken && <span className={`absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full ${sel ? 'bg-white' : 'bg-orange-400'}`}></span>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ------------------ 아이콘 세트 ------------------
        const Icons = {
            Menu: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
            Grid: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Users: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            CheckCircle: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Briefcase: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            LogOut: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Upload: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2 2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            SortAsc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>,
            SortDesc: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>,

                } else if (hole.top - GAP - TIP_H_EST > EDGE) {
                    pos = { top: hole.top - GAP - TIP_H_EST, left: hole.left + hole.width / 2 - TIP_W / 2 };
                } else if (hole.left + hole.width + GAP + TIP_W < vw - EDGE) {
                    pos = { top: Math.max(EDGE, hole.top), left: hole.left + hole.width + GAP };
                } else if (hole.left - GAP - TIP_W > EDGE) {
                    pos = { top: Math.max(EDGE, hole.top), left: hole.left - GAP - TIP_W };
                }
                if (!pos) { setTipPos(null); setReady(true); return; }
                pos.left = Math.min(Math.max(EDGE, pos.left), vw - TIP_W - EDGE);
                pos.top = Math.min(Math.max(EDGE, pos.top), vh - TIP_H_EST - EDGE);
                setTipPos(pos); setReady(true);
            }, []);

            const measure = useCallback(() => {
                if (!step) return;
                const el = document.querySelector(`[data-tour="${step.key}"]`);
                if (!el) { setRect(null); setTipPos(null); setReady(true); return; }
                const vw = window.innerWidth, vh = window.innerHeight;
                const r = el.getBoundingClientRect();
                if (r.top < 60 || r.bottom > vh - 60) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => {
                        const el2 = document.querySelector(`[data-tour="${step.key}"]`);
                        if (el2) applyRect(el2.getBoundingClientRect(), window.innerWidth, window.innerHeight);
                    }, 380);
                    return;
                }
                applyRect(r, vw, vh);
            }, [step, applyRect]);

            const finish = useCallback(() => { try { localStorage.setItem(TOUR_KEY, '1'); } catch (e) {} onClose(); }, [onClose]);

            useEffect(() => { setReady(false); measure(); }, [idx, measure]);


            useEffect(() => {
                const onResize = () => measure();
                const onKey = (e) => { if (e.key === 'Escape') finish(); };
                window.addEventListener('resize', onResize);
                window.addEventListener('scroll', onResize, true);
                window.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('resize', onResize); window.removeEventListener('scroll', onResize, true); window.removeEventListener('keydown', onKey); };
            }, [measure, finish]);

            if (!total || !step) { return null; }

            const Card = (
                <div className="bg-white rounded-2xl shadow-2xl p-5 border-2 border-blue-500">

                        </div>
                    </div>
                </div>
            );

            return (
                <>
                    {rect ? (<div className="tour-hole" style={{ top: rect.top, left: rect.left, width: rect.width, height: rect.height, opacity: ready ? 1 : 0 }} />)
                          : (<div className="tour-dim" onClick={finish} />)}

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[300] animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]"><button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b pb-4"><div><h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icons.FileText /> 연차 리포트 센터</h3></div><div className="flex items-center gap-3"><button onClick={exportToPremiumExcel} disabled={isExporting} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-blue-700 transition shadow-lg shadow-blue-200 disabled:opacity-50"><span className="text-lg">📊</span> {isExporting ? "추출 중..." : "전체 보고서"}</button><div className="h-8 w-px bg-slate-200 mx-2"></div><input type="month" value={targetMonth} onChange={e => setTargetMonth(e.target.value)} className="border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:border-blue-500" /><button onClick={handleDownload} className="bg-teal-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-teal-700 transition shadow-sm"><Icons.Download /> 월간 조회</button></div></div>
                    <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl bg-slate-50 custom-scrollbar relative"><table className="w-full text-sm text-left whitespace-nowrap mt-6"><thead className="bg-white text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center">입사일</th><th className="p-3 text-center text-blue-600">해당월 사용(일)</th><th className="p-3 text-center text-red-500">해당월 사용(시간)</th><th className="p-3 w-full">사용 내역 상세</th></tr></thead><tbody className="divide-y divide-slate-200 bg-white">{visibleRows.map(s => (<tr key={s.id} className="hover:bg-slate-50"><td className="p-3 font-bold text-slate-800">{s.name}</td><td className="p-3 text-center text-slate-500">{safeDate(s.joinDate)}</td><td className="p-3 text-center font-bold text-blue-600">{s.usedDays}일</td><td className="p-3 text-center font-bold text-red-500">{s.usedHours}h</td><td className="p-3 text-xs text-slate-600">{s.detailText}</td></tr>))}{visibleRows.length === 0 && (<tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold">해당 월에 연차를 사용한 직원이 없습니다.</td></tr>)}</tbody></table></div>
                    <div className="mt-4 flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200"><span className="text-sm font-bold text-slate-500">해당월 총 사용 시간 합계:</span><span className="text-lg font-black text-red-500">{fmt(totalMonthHours)}h</span></div>
                    <table id="premium-excel-table" style={{ display: 'none' }}><thead><tr><th colSpan="7" className="title" style={{ backgroundColor: '#1e3a8a', color: 'white', fontSize: '20px', padding: '15px' }}>사단법인 장애인의 양지누림 전체 임직원 연차 현황</th></tr><tr><th colSpan="7" style={{ textAlign: 'right', padding: '5px', backgroundColor: 'white', color: '#6b7280', fontSize: '12px' }}>출력일자: {new Date().toLocaleDateString()}</th></tr><tr><th style={{ backgroundColor: '#f3f4f6', width: '60px' }}>No</th><th style={{ backgroundColor: '#f3f4f6', width: '100px' }}>이름</th><th style={{ backgroundColor: '#f3f4f6', width: '120px' }}>입사일</th><th style={{ backgroundColor: '#f3f4f6', width: '200px' }}>연차 산정 기간</th><th style={{ backgroundColor: '#eff6ff', color: '#1d4ed8', width: '100px' }}>총 발생 (일)</th><th style={{ backgroundColor: '#fef2f2', color: '#b91c1c', width: '100px' }}>사용 연차 (일)</th><th style={{ backgroundColor: '#f0fdf4', color: '#15803d', width: '100px' }}>잔 연차 (일)</th></tr></thead>
                        <tbody>{staffList.filter(s => s.status !== 'resigned').map((staff, index) => {
                            const leaveInfo = calculateAnnualLeave(staff.joinDate);
                            const dailyHours = safeParseFloat(staff.workHours) || 8;
                            const totalDays = leaveInfo.total || 0;
                            const usedHours = sumUsedHours(staff.leaveHistory, leaveInfo.startDate, leaveInfo.endDate);
                            const usedDays = dailyHours > 0 ? Math.round((usedHours / dailyHours) * 10) / 10 : 0;
                            const remainingDays = Math.round((totalDays - usedDays) * 10) / 10;
                            return (<tr key={staff.id}><td>{index + 1}</td><td style={{ fontWeight: 'bold' }}>{staff.name}</td><td>{safeDate(staff.joinDate)}</td><td style={{ fontSize: '12px', color: '#6b7280' }}>{leaveInfo.period}</td><td style={{ fontWeight: 'bold', color: '#1d4ed8' }}>{totalDays}</td><td style={{ fontWeight: 'bold', color: '#b91c1c' }}>{usedDays}</td><td className={remainingDays < 0 ? 'negative' : 'positive'} style={remainingDays < 0 ? { color: '#dc2626', fontWeight: 'bold' } : { color: '#16a34a', fontWeight: 'bold' }}>{remainingDays}</td></tr>);
                        })}</tbody>
                    </table>
                </div></div>
            );
        };

        // ================= [v6.7.0] 다중 엑셀 정밀 대조 엔진 =================
        // [v6.15.0] 개선점: 오차 내역의 [연차 등록] 버튼을 누를 때, 직원 ID뿐 아니라
        //           '누락된 오차 시간(r.diff)'까지 함께 모달로 전달합니다.
        //           → 연차 등록 모달이 '시간 직접 입력' 모드로 열리며 해당 시간이 미리 채워집니다.
        const AdvancedAuditModal = ({ staffList, onClose, showAlert, onOpenModal, defaultPromoFilter = false }) => {
            const today = new Date();
            const defaultMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            useEscClose(onClose); // [v6.17.0] ESC로 닫기
            const [step, setStep] = useState(1);
            const [mappings, setMappings] = useState([]);
            const [results, setResults] = useState(null);
            const [skippedCount, setSkippedCount] = useState(0);
            const [diag, setDiag] = useState(null); // [v6.8.1] 대조 진단 정보
            const [isProcessing, setIsProcessing] = useState(false);
            const [isPromoFilterEnabled, setIsPromoFilterEnabled] = useState(defaultPromoFilter);
            const [filterPromoMonth, setFilterPromoMonth] = useState(defaultMonth);

            // ===== [v6.9.0] 재직/퇴사 판정 및 대조 대상 구성 =====
            const isResigned = (s) => s.status === 'resigned' || !!(s.resignDate && String(s.resignDate).trim());
            const activeStaffs = useMemo(() => staffList.filter(s => !isResigned(s)), [staffList]);
            const resignedStaffs = useMemo(() => staffList.filter(isResigned), [staffList]);

            const resignedIndex = useMemo(() => {
                const byName = new Map();   // 이름 → 퇴사자 수
                const byKey = new Set();    // 이름|생년월일
                resignedStaffs.forEach(s => {
                    const n = cleanName(s.name); if (!n) return;
                    byName.set(n, (byName.get(n) || 0) + 1);
                    const b = normalizeString(safeDate(s.birth));
                    if (b) byKey.add(n + '|' + b);
                });
                return { byName, byKey };
            }, [resignedStaffs]);

            const activeNameCount = useMemo(() => {
                const m = new Map();
                activeStaffs.forEach(s => { const n = cleanName(s.name); if (n) m.set(n, (m.get(n) || 0) + 1); });
                return m;
            }, [activeStaffs]);

            const handleFileSelect = (e) => {
                const selected = Array.from(e.target.files); if (!selected.length) return;
                const newMappings = selected.map(file => {
                    let guessedMonth = '';
                    const match = file.name.match(/(\d{2,4})[년\-\._\s]+(\d{1,2})[월\-\._\s]/);
                    if (match) { let y = match[1]; if (y.length === 2) y = '20' + y; guessedMonth = `${y}-${match[2].padStart(2, '0')}`; }
                    return { file, month: guessedMonth, id: Math.random().toString() };
                });
                setMappings(prev => [...prev, ...newMappings]); setStep(2); e.target.value = '';
            };

            const handleRemoveFile = (id) => { const updated = mappings.filter(m => m.id !== id); setMappings(updated); if (!updated.length) setStep(1); };
            const handleMonthChange = (id, val) => setMappings(mappings.map(m => m.id === id ? { ...m, month: val } : m));

            const runAudit = async () => {
                if (mappings.some(m => !m.month)) { showAlert("모든 파일의 '대조할 월'을 지정해주세요."); return; }
                setIsProcessing(true);
                try {
                    let targetStaffList = activeStaffs;
                    if (isPromoFilterEnabled && filterPromoMonth) {
                        const [pY, pM] = filterPromoMonth.split('-').map(Number);
                        targetStaffList = activeStaffs.filter(s => getPromotionStatus(s, pY, pM) !== null);
                        if (!targetStaffList.length) { showAlert(`${filterPromoMonth} 기준 대상자가 없습니다.`); setIsProcessing(false); return; }
                    }

                    const excelDataMap = {}; const unmatchedExcelData = []; let skipped = 0;
                    const autoFixedFiles = []; const failedFiles = []; const ambiguousRows = [];
                    const NEEDS = {
                        name: ['근로지원인', '성명', '이름'],
                        hour: ['휴가사용시간', '연차사용시간', '사용시간', '휴가시간', '연차시간', '사용연차', '휴가', '연차', '시간'],
                        info: ['생년월일', '휴대폰', '연락처', '전화']
                    };

                    for (const mapItem of mappings) {
                        const buffer = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(new Uint8Array(ev.target.result));
                            reader.onerror = reject; reader.readAsArrayBuffer(mapItem.file);
                        });
                        const wb = XLSX.read(buffer, { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        const { cols, startRow } = findColumns(jsonData, NEEDS, 10);
                        const nameCol = cols.name !== undefined ? cols.name : 1;
                        let hourCol = cols.hour !== undefined ? cols.hour : -1;
                        const infoCol = cols.info !== undefined ? cols.info : -1;

                        const colSum = (c) => {
                            if (c < 0) return 0;
                            let sum = 0;
                            for (let i = startRow; i < jsonData.length; i++) {
                                const row = jsonData[i]; if (!row) continue;
                                const v = safeParseFloat(row[c]); if (v > 0) sum += v;
                            }
                            return sum;
                        };
                        if (colSum(hourCol) <= 0) {
                            let bestCol = -1, bestSum = 0, maxLen = 0;
                            for (let i = startRow; i < jsonData.length; i++) { if (jsonData[i]) maxLen = Math.max(maxLen, jsonData[i].length); }
                            for (let c = 0; c < maxLen; c++) {
                                if (c === nameCol || c === infoCol) continue;
                                const sum = colSum(c);
                                if (sum > bestSum) { bestSum = sum; bestCol = c; }
                            }
                            if (bestCol !== -1) { hourCol = bestCol; autoFixedFiles.push(mapItem.file.name); }
                        }
                        if (hourCol < 0) { failedFiles.push(mapItem.file.name); continue; }

                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i]; if (!row || !row.length) continue;
                            const rawName = String(row[nameCol] || '').trim();
                            const hours = safeParseFloat(row[hourCol]);
                            if (!rawName || hours <= 0) continue;

                            const exName = cleanName(rawName);
                            if (isNotPersonName(exName)) continue;

                            const infoStr = infoCol !== -1 ? normalizeString(row[infoCol]) : '';
                            const exBirth = normalizeString(safeDate(infoStr));

                            const sameName = activeStaffs.filter(s => cleanName(s.name) === exName);
                            let targetStaffId = null;

                            if (sameName.length === 1) {
                                const only = sameName[0];
                                const onlyBirth = normalizeString(safeDate(only.birth));
                                if (onlyBirth && exBirth && onlyBirth !== exBirth) {
                                    if (resignedIndex.byKey.has(exName + '|' + exBirth)) { skipped++; continue; }
                                    unmatchedExcelData.push({ name: rawName, month: mapItem.month, hours });
                                    continue;
                                }
                                targetStaffId = only.id;
                            } else if (sameName.length > 1) {
                                const found = sameName.find(s => {
                                    const sBirth = normalizeString(safeDate(s.birth));
                                    const sPhone = normalizeString(s.phone);
                                    return (sBirth && exBirth && sBirth === exBirth)
                                        || (sPhone && infoStr && (sPhone.includes(infoStr) || infoStr.includes(sPhone)));
                                });
                                if (found) targetStaffId = found.id;
                                else { ambiguousRows.push({ name: rawName, month: mapItem.month, hours }); continue; }
                            }

                            if (!targetStaffId) {
                                const isResignedPerson = exBirth
                                    ? resignedIndex.byKey.has(exName + '|' + exBirth) || (resignedIndex.byName.has(exName) && !activeNameCount.has(exName))
                                    : resignedIndex.byName.has(exName) && !activeNameCount.has(exName);
                                if (isResignedPerson) { skipped++; continue; }
                                unmatchedExcelData.push({ name: rawName, month: mapItem.month, hours });
                                continue;
                            }

                            const key = `${targetStaffId}_${mapItem.month}`;
                            excelDataMap[key] = (excelDataMap[key] || 0) + hours;
                        }
                    }

                    const auditMonths = new Set(mappings.map(m => m.month));
                    const auditRes = [];
                    targetStaffList.forEach(staff => {
                        const dbMonths = {};
                        (staff.leaveHistory || []).forEach(l => { if (l.date) { const ym = l.date.substring(0, 7); dbMonths[ym] = (dbMonths[ym] || 0) + safeParseFloat(l.days); } });
                        const allMonths = new Set([...Object.keys(dbMonths), ...auditMonths]);
                        allMonths.forEach(ym => {
                            if (!auditMonths.has(ym)) return;
                            const exH = excelDataMap[`${staff.id}_${ym}`] || 0;
                            const dbH = dbMonths[ym] || 0;
                            if (exH !== dbH) auditRes.push({ id: `${staff.id}_${ym}`, staffId: staff.id, name: staff.name, month: ym, excelHours: exH, dbHours: dbH, diff: Math.round(Math.abs(exH - dbH) * 100) / 100, type: exH > dbH ? 'missing_in_db' : 'over_in_db' });
                        });
                    });

                    if (!isPromoFilterEnabled) {
                        unmatchedExcelData.forEach((u, idx) => {
                            if (!auditMonths.has(u.month)) return;
                            auditRes.push({ id: `unknown_${idx}_${u.month}`, staffId: null, name: u.name + " (명부 미등록)", month: u.month, excelHours: u.hours, dbHours: '-', diff: u.hours, type: 'missing_in_db' });
                        });
                    }

                    auditRes.sort((a, b) => a.month.localeCompare(b.month) || a.name.localeCompare(b.name));
                    const totalExcelHours = Object.values(excelDataMap).reduce((a, b) => a + b, 0)
                        + unmatchedExcelData.reduce((a, u) => a + u.hours, 0);
                    setDiag({ autoFixed: autoFixedFiles, failed: failedFiles, totalExcelHours, ambiguous: ambiguousRows });
                    setResults(auditRes); setSkippedCount(skipped); setStep(3);
                } catch (e) { showAlert("대조 중 오류 발생: " + e.message); }
                setIsProcessing(false);
            };

            const handleDownloadResults = () => {
                if (!results || !results.length) { showAlert("다운로드할 오차 내역이 없습니다."); return; }
                const wsData = [ [`양지누림 월별 연차 대조(Audit) 결과`], [`출력 일자: ${new Date().toLocaleDateString()} / 재직자 한정 대조 (퇴사자 ${skippedCount}건 제외)`], [], ['이름', '발생 월', '엑셀 사용시간', '시스템(DB) 내역', '오차 시간', '상태'] ];
                results.forEach(r => wsData.push([r.name, r.month, `${r.excelHours}h`, `${r.dbHours}h`, `${r.diff}h`, r.type === 'missing_in_db' ? '엑셀에만 있음 (DB 누락)' : 'DB에만 있음 (과다)']));
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 18 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 25 }];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "오차리포트");
                XLSX.writeFile(wb, `양지누림_사전대조_오차리포트_${toLocalYMD(new Date()).replace(/-/g, '')}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-[400] animate-fade-in backdrop-blur-sm p-4"><div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-4xl relative flex flex-col max-h-[90vh]"><button type="button" onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-600"><Icons.X /></button>
                    <div className="mb-6 border-b pb-4"><h3 className="text-2xl font-black text-slate-800 flex items-center gap-2"><Icons.CheckCircle /> 다중 엑셀 정밀 대조 엔진</h3><p className="text-sm text-slate-500 font-bold mt-2">수십 개의 엑셀을 한 번에 올려 월별 누락을 핀포인트로 찾아내고 즉시 보완합니다.</p><p className="text-[11px] text-blue-600 font-bold mt-1.5 bg-blue-50 inline-block px-2 py-1 rounded border border-blue-100">🛡️ 재직 중인 직원만 대조 · 🎯 v6.15.0 : [연차 등록] 시 오차 시간이 자동으로 미리 채워집니다</p></div>
                    {isProcessing && (<div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center rounded-3xl backdrop-blur-sm"><div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div><p className="font-bold text-indigo-700">모든 엑셀 데이터를 월별로 병합하여 분석 중입니다...</p></div>)}
                    {!results && !isProcessing && (
                        <div className="mb-4 bg-orange-50 p-4 rounded-xl border border-orange-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div><label className="flex items-center gap-2 cursor-pointer font-black text-orange-800"><input type="checkbox" checked={isPromoFilterEnabled} onChange={e => setIsPromoFilterEnabled(e.target.checked)} className="w-4 h-4 accent-orange-600" />특정 월 촉진 대상자만 필터링하여 대조</label><p className="text-xs text-orange-600 mt-1 font-bold pl-6">체크 해제 시, 현재 재직 중인 '전체 직원'을 대상으로 대조합니다.</p></div>
                            {isPromoFilterEnabled && (<input type="month" value={filterPromoMonth} onChange={e => setFilterPromoMonth(e.target.value)} className="border-2 border-orange-300 rounded-lg px-3 py-1.5 text-sm font-bold outline-none focus:border-orange-500 bg-white text-orange-800" />)}
                        </div>
                    )}
                    {step === 1 && (<div className="flex flex-col items-center justify-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300"><div className="bg-indigo-100 text-indigo-500 w-16 h-16 rounded-full flex items-center justify-center mb-4"><Icons.Upload /></div><p className="font-bold text-slate-700 text-lg mb-2">대조할 여러 달의 엑셀 파일을 모두 선택해주세요</p><p className="text-sm text-slate-500 mb-6">파일을 여러 개 드래그하거나 클릭하여 한 번에 업로드할 수 있습니다.</p><input type="file" id="multi-audit-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="multi-audit-upload" className="cursor-pointer bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">엑셀 파일 여러 개 선택하기</label></div>)}
                    {step === 2 && (
                        <div className="flex flex-col flex-1 overflow-hidden"><div className="bg-indigo-50 p-4 rounded-xl mb-4 border border-indigo-100 flex justify-between items-center"><div><p className="font-bold text-indigo-800">총 {mappings.length}개의 파일이 준비되었습니다.</p><p className="text-xs text-indigo-600 mt-1">시스템이 유추한 월이 맞는지 확인해주세요. (틀렸다면 직접 수정 가능)</p></div><div className="flex gap-2"><input type="file" id="add-more-upload" multiple onChange={handleFileSelect} accept=".xlsx, .xls, .csv" className="hidden" /><label htmlFor="add-more-upload" className="cursor-pointer bg-white text-indigo-600 border border-indigo-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition">+ 파일 추가</label><button onClick={runAudit} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-indigo-700 transition shadow-md">월별 정밀 대조 시작</button></div></div>
                            <div className="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                                {mappings.map((m) => (<div key={m.id} className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 hover:border-indigo-300 transition shadow-sm"><div className="flex items-center gap-3 overflow-hidden"><div className="bg-slate-100 p-2 rounded-lg text-slate-500"><Icons.FileText /></div><span className="font-bold text-slate-700 truncate max-w-[200px] md:max-w-[400px] text-sm">{m.file.name}</span></div><div className="flex items-center gap-3"><input type="month" value={m.month} onChange={(e) => handleMonthChange(m.id, e.target.value)} className={`border rounded-lg px-3 py-1.5 text-sm font-bold outline-none transition ${!m.month ? 'border-red-400 bg-red-50 text-red-600' : 'border-indigo-200 bg-indigo-50/30 text-indigo-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100'}`} required /><button onClick={() => handleRemoveFile(m.id)} className="text-slate-400 hover:text-red-500 p-1 rounded-md hover:bg-red-50 transition"><Icons.Trash /></button></div></div>))}
                            </div>
                        </div>
                    )}
                    {step === 3 && (
                        <div className="flex flex-col flex-1 overflow-hidden"><div className="flex justify-between items-center mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200"><div><span className="font-black text-slate-800 text-lg">오차 검출: <span className="text-red-600">{results.length}</span>건</span><p className="text-xs font-bold text-slate-500 mt-1">재직자 {activeStaffs.length}명 기준 대조 완료{skippedCount > 0 && <span className="text-orange-600"> · 퇴사자 {skippedCount}건 자동 제외됨</span>}{diag && <span className="text-indigo-600"> · 엑셀에서 읽은 총 {fmt(diag.totalExcelHours)}h</span>}</p></div><div className="flex gap-2"><button onClick={handleDownloadResults} className="bg-green-50 text-green-700 border border-green-200 px-4 py-2 rounded-xl font-bold text-sm hover:bg-green-100 transition shadow-sm flex items-center gap-2"><Icons.Download /> 결과 엑셀</button><button onClick={() => { setStep(1); setMappings([]); setResults(null); setSkippedCount(0); setDiag(null); }} className="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-700 transition shadow-sm">초기화</button></div></div>
                            {diag && (diag.failed.length > 0 || diag.autoFixed.length > 0 || diag.totalExcelHours <= 0 || (diag.ambiguous && diag.ambiguous.length > 0)) && (
                                <div className={`mb-3 p-3 rounded-xl border text-xs font-bold ${diag.totalExcelHours <= 0 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                                    {diag.totalExcelHours <= 0 && (<p className="mb-1">⚠️ 엑셀에서 읽어들인 사용시간 합계가 0입니다. 시간이 적힌 열을 찾지 못했을 수 있습니다.</p>)}
                                    {diag.autoFixed.length > 0 && (<p className="mb-1">🔧 헤더 인식 실패로 숫자 열을 자동 탐색했습니다: {diag.autoFixed.join(', ')}</p>)}
                                    {diag.failed.length > 0 && (<p>❌ 시간 열을 찾지 못해 건너뛴 파일: {diag.failed.join(', ')}</p>)}
                                    {diag.ambiguous && diag.ambiguous.length > 0 && (<p className="mb-1">👥 동명이인이라 특정하지 못한 인원: {diag.ambiguous.map(a => a.name).join(', ')} — 직원 명부에 생년월일을 입력하면 자동 구분됩니다.</p>)}
                                    <p className="mt-1 font-medium opacity-80">엑셀 첫 행의 열 제목에 '휴가' 또는 '사용시간' 이 포함되어 있는지 확인해주세요.</p>
                                </div>
                            )}
                            <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar relative">
                                {results.length > 0 ? (
                                    <table className="w-full text-sm text-left whitespace-nowrap"><thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200"><tr><th className="p-3">이름</th><th className="p-3 text-center">발생 월</th><th className="p-3 text-center text-slate-500 border-l border-slate-200">엑셀 기록</th><th className="p-3 text-center text-slate-500">DB(시스템)</th><th className="p-3 text-center text-red-500">오차 시간</th><th className="p-3 text-center w-32">즉시 보완</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {/* [v6.15.0] onOpenModal 호출 시 두 번째 인자로 r.diff(오차 시간)를 함께 전달 →
                                                        연차 등록 모달이 '시간 직접 입력' 모드로 열리며 이 시간이 미리 채워집니다. */}
                                            {results.map((r) => (<tr key={r.id} className="hover:bg-red-50/30 transition"><td className="p-3 font-bold text-slate-800">{r.name}</td><td className="p-3 text-center font-bold text-indigo-600">{r.month}</td><td className="p-3 text-center font-bold text-slate-600 border-l border-slate-100">{r.excelHours}h</td><td className="p-3 text-center font-bold text-slate-600">{r.dbHours}h</td><td className="p-3 text-center"><span className="bg-red-50 text-red-600 px-2 py-1 rounded font-black border border-red-100">{r.diff}h 차이</span><div className="text-[10px] text-red-400 mt-1">{r.type === 'missing_in_db' ? 'DB 누락됨' : 'DB 데이터 초과'}</div></td><td className="p-3 text-center"><button onClick={() => { if (r.staffId) onOpenModal(r.staffId, r.diff); else showAlert("직원 명부에 등록되지 않은 인원입니다.\n[직원 명부] 탭에서 먼저 등록해주세요."); }} className={`text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center justify-center gap-1 w-full active:scale-95 ${r.staffId ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-400 cursor-not-allowed'}`}><Icons.Plus /> 연차 등록</button></td></tr>))}
                                        </tbody>
                                    </table>
                                ) : (<div className="flex flex-col items-center justify-center h-full py-20 text-slate-400"><div className="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-4 border border-green-100 shadow-sm"><Icons.CheckCircle /></div><p className="font-bold text-lg text-slate-700">모든 데이터가 완벽하게 일치합니다!</p><p className="text-sm mt-1">업로드하신 엑셀 파일과 DB 내역에 오차가 없습니다.</p></div>)}
                            </div>
                        </div>
                    )}
                </div></div>
            );
        };

        // [공통화] 캘린더 헤더 네비게이션
        const CalendarNav = ({ year, month, setCurrentDate, compact }) => {
            const yearOptions = useMemo(() => { const b = new Date().getFullYear(); return Array.from({ length: 15 }, (_, i) => b - 10 + i); }, []);
            return (
                <div className="flex items-center gap-1 md:gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-100 shadow-sm">
                    <button type="button" onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronLeft /></button>
                    <select value={year} onChange={e => setCurrentDate(new Date(parseInt(e.target.value), month, 1))} className="bg-white border border-slate-200 rounded-md px-1 md:px-2 py-1 text-xs md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">{yearOptions.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                    <select value={month} onChange={e => setCurrentDate(new Date(year, parseInt(e.target.value), 1))} className="bg-white border border-slate-200 rounded-md px-1 md:px-2 py-1 text-xs md:text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">{Array.from({ length: 12 }, (_, i) => i).map(m => <option key={m} value={m}>{m + 1}월</option>)}</select>
                    <button type="button" onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="p-2 text-slate-600 hover:bg-white rounded-lg transition shadow-sm"><Icons.ChevronRight /></button>
                    <button type="button" onClick={() => setCurrentDate(new Date())} className={`font-bold text-blue-600 bg-white border border-blue-100 px-2 md:px-3 py-1.5 rounded-lg ml-1 md:ml-2 hover:bg-blue-50 transition shadow-sm ${compact ? 'text-xs' : 'text-[10px] md:text-xs'}`}>오늘</button>
                </div>
            );
        };

        // ============================================================================
        //  [v6.16.0-beta] 대시보드 '전사 휴가 캘린더' — 삭제 기능 추가
        //   ▷ 새 prop: showConfirm / showAlert  (App에서 함께 내려줍니다)
        //   ▷ 두 가지 삭제 방식을 모두 제공합니다.
        //     ① 개별 삭제 : 각 휴가 블록 위에 상시 표시되는 작은 X 버튼 → 그 1건만 삭제
        //     ② 여러 개 삭제 : [여러 개 삭제] 버튼으로 '선택 모드'에 진입 → 블록을 눌러
        //                       여러 건을 체크한 뒤 [선택 삭제]로 한 번에 삭제
        //   ▷ 삭제는 기존 recalcAndSave(직원별로 leaveHistory에서 해당 id 제거 후 재계산)를
        //     그대로 사용하므로 데이터 구조·집계 방식은 종전과 100% 동일합니다.
        //   ▷ 전사 캘린더는 여러 직원의 휴가가 섞여 있으므로, 삭제 시 직원(staffId)별로
        //     묶어서 각 직원 문서를 한 번씩만 갱신합니다.
        //
        //  [v6.19.0-beta] 모바일 UI 개선
        //   ▷ 좁은 화면(md 미만)에서는 기존 격자 캘린더 대신 '날짜별 리스트/카드 뷰'로
        //     자동 전환합니다(휴가가 있는 날짜만 위→아래로 카드로 나열).
        //     · PC(md 이상)는 종전과 동일한 격자 캘린더를 유지합니다.
        //     · 리스트 뷰에서도 기존과 동일하게 수정·개별삭제·다중삭제가 가능합니다.
        // ============================================================================
        const CalendarView = ({ staffList, onEditClick, showConfirm, showAlert }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            // [v6.16.0] 선택 모드 및 체크된 항목(id) 목록
            const [selectMode, setSelectMode] = useState(false);
            const [checkedIds, setCheckedIds] = useState([]);
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;

            const leaveMap = useMemo(() => {
                const map = {};
                staffList.forEach(staff => {
                    (staff.leaveHistory || []).forEach(leave => {
                        if (leave.date && leave.date.startsWith(prefix)) {
                            (map[leave.date] = map[leave.date] || []).push({ ...leave, name: staff.name, staffId: staff.id });
                        }
                    });
                });
                return map;
            }, [staffList, prefix]);

            const weeks = useMemo(() => buildWeeks(year, month), [year, month]);
            const todayStr = toLocalYMD(new Date());

            // [v6.16.0] 이번 달 화면에 보이는 전체 휴가 건들을 평탄화 — 삭제 대상 조회용
            const monthLeaves = useMemo(() => Object.values(leaveMap).flat(), [leaveMap]);

            // [v6.19.0] 모바일 리스트 뷰용 — 휴가가 있는 날짜만 오름차순 정렬
            const sortedDaysWithLeaves = useMemo(() => Object.keys(leaveMap).sort(), [leaveMap]);

            const toggleCheck = (id) => setCheckedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            const exitSelectMode = () => { setSelectMode(false); setCheckedIds([]); };

            // [v6.16.0] 공통 삭제 실행기 — 삭제할 record 배열을 받아 직원별로 묶어 일괄 반영
            //  recs: [{ id, staffId, ... }]  (leaveMap이 만들어 준 name·staffId 포함 객체)
            const deleteRecords = async (recs) => {
                // 직원 id → 삭제할 휴가 id Set 으로 그룹화
                const byStaff = {};
                recs.forEach(r => { (byStaff[r.staffId] = byStaff[r.staffId] || new Set()).add(r.id); });
                for (const staffId of Object.keys(byStaff)) {
                    const staff = staffList.find(s => s.id === staffId);
                    if (!staff) continue;
                    const idSet = byStaff[staffId];
                    const newHistory = (staff.leaveHistory || []).filter(h => !idSet.has(h.id));
                    await recalcAndSave(staffId, staff.joinDate, newHistory);
                }
            };

            // ① 개별 삭제 (X 버튼)
            const handleDeleteOne = (l) => {
                showConfirm(`${l.name} 직원의 ${l.date} (${l.type}) 휴가를 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.`, async () => {
                    try { await deleteRecords([l]); }
                    catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            // ② 여러 개 삭제 (선택 모드)
            const handleBulkDelete = () => {
                if (!checkedIds.length) return;
                const recs = monthLeaves.filter(l => checkedIds.includes(l.id));
                if (!recs.length) return;
                const preview = recs.slice(0, 8).map(r => `${r.date} ${r.name}(${r.type})`).join('\n');
                const more = recs.length > 8 ? `\n… 외 ${recs.length - 8}건` : '';
                showConfirm(`선택한 ${recs.length}건의 휴가를 삭제하시겠습니까?\n삭제 시 각 직원의 잔여 연차가 자동으로 복구됩니다.\n\n${preview}${more}`, async () => {
                    try { await deleteRecords(recs); exitSelectMode(); showAlert(`🗑️ ${recs.length}건 삭제 완료!`); }
                    catch (err) { showAlert('오류: ' + err.message); }
                });
            };

            // 블록 클릭 동작: 선택 모드면 체크 토글, 아니면 기존처럼 수정 모달 열기
            const handleBlockClick = (l) => { if (selectMode) toggleCheck(l.id); else onEditClick && onEditClick(l.staffId, 0, l); };

            // [v6.17.1] 하루 칸에 최대 몇 건까지 미리 보여줄지 (초과분은 'N개 더보기'로 팝업)
            const MAX_VISIBLE = 2;
            // [v6.17.1] 그 날 일정 팝업(모달) 대상 날짜. null이면 닫힘.
            const [dayModalDate, setDayModalDate] = useState(null);
            // 팝업은 항상 '최신 staffList'가 반영되도록 leaveMap에서 매 렌더 다시 읽습니다.
            const dayModalLeaves = dayModalDate ? (leaveMap[dayModalDate] || []) : [];
            // 팝업 안에 표시할 요일 라벨
            const dayModalWeekday = useMemo(() => {
                if (!dayModalDate) return '';
                const [yy, mm, dd] = dayModalDate.split('-').map(Number);
                return WEEK_LABELS[new Date(yy, mm - 1, dd).getDay()];
            }, [dayModalDate]);
            useEscClose(() => setDayModalDate(null), !!dayModalDate); // [v6.17.1] 팝업 ESC 닫기

            // 팝업에서 삭제하면, 그 날 남은 항목이 없을 때 팝업도 함께 닫습니다.
            const handleDeleteFromModal = (l) => {
                showConfirm(`${l.name} 직원의 ${l.date} (${l.type}) 휴가를 삭제하시겠습니까?\n삭제 시 잔여 연차가 자동으로 복구됩니다.`, async () => {
                    try {
                        await deleteRecords([l]);
                        // 삭제 후 그 날 항목이 1건뿐이었다면 팝업 닫기 (leaveMap은 다음 렌더에 갱신됨)
                        if ((leaveMap[l.date] || []).length <= 1) setDayModalDate(null);
                    } catch (err) { showAlert('오류: ' + err.message); }
                });
            };
            // 팝업에서 수정 클릭 → 기존 수정 모달로 연결하고 팝업은 닫음
            const handleEditFromModal = (l) => { setDayModalDate(null); onEditClick && onEditClick(l.staffId, 0, l); };

            return (
                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 md:p-6 animate-fade-in overflow-hidden flex flex-col h-full min-h-[400px]">
                    {/* ═══════ [v6.17.1] 그 날 일정 팝업 (업로드 이미지 스타일) ═══════ */}
                    {dayModalDate && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[450] animate-fade-in backdrop-blur-sm p-4" onClick={() => setDayModalDate(null)}>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm relative overflow-hidden" onClick={(e) => e.stopPropagation()}>
                                {/* 상단 헤더: 요일 + 날짜 + 닫기 (이미지의 다크 헤더 느낌) */}
                                <div className="bg-slate-800 text-white p-5 relative">
                                    <button type="button" onClick={() => setDayModalDate(null)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/15 hover:bg-white/25 transition" title="닫기 (ESC)"><Icons.X /></button>
                                    <p className="text-xs font-bold text-slate-300 mb-0.5">{dayModalWeekday}요일</p>
                                    <p className="text-3xl font-black tracking-tight">{parseInt(dayModalDate.slice(-2), 10)}<span className="text-base font-bold text-slate-300 ml-2">{dayModalDate.slice(0, 7).replace('-', '. ')}</span></p>
                                    <p className="text-xs font-bold text-slate-300 mt-1">이 날 휴가 {dayModalLeaves.length}건</p>
                                </div>
                                {/* 항목 리스트 (수정·삭제 가능) */}
                                <div className="p-4 max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2">
                                    {dayModalLeaves.length === 0 ? (
                                        <p className="text-center text-slate-400 font-bold py-8 text-sm">이 날 남은 휴가가 없습니다.</p>
                                    ) : dayModalLeaves.map((l, i) => {
                                        const isPartial = l.type.includes('반차') || l.type.includes('시간');
                                        const future = isFutureLeave(l.date);
                                        return (
                                            <div key={l.id || i} className={`flex items-center justify-between gap-2 p-3 rounded-xl border ${isPartial ? 'bg-orange-50 border-orange-200' : 'bg-blue-50 border-blue-200'} ${future ? 'ring-1 ring-dashed ring-slate-800/30' : ''}`}>
                                                <div className="min-w-0">
                                                    <div className="flex items-center gap-1.5">
                                                        <span className="font-black text-slate-800 text-sm truncate">{l.name}</span>
                                                        {future && <span className="px-1 rounded-sm bg-slate-800 text-white text-[9px] font-black flex-shrink-0">예정</span>}
                                                    </div>
                                                    <p className={`text-xs font-bold mt-0.5 ${isPartial ? 'text-orange-600' : 'text-blue-600'}`}>{fmt(safeParseFloat(l.days))}시간 · {l.type}{l.reason ? ` · ${l.reason}` : ''}</p>
                                                </div>
                                                <div className="flex gap-1.5 flex-shrink-0">
                                                    <button type="button" onClick={() => handleEditFromModal(l)} title="수정" className="text-blue-500 p-2 bg-white rounded-lg shadow-sm border hover:bg-blue-50 transition"><Icons.Edit /></button>
                                                    <button type="button" onClick={() => handleDeleteFromModal(l)} title="삭제" className="text-red-500 p-2 bg-white rounded-lg shadow-sm border hover:bg-red-50 transition"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

        // ============================================================================
        // [v6.15.0-stable ★전면 개편] 관리자용 연차 등록/수정 모달 (LeaveActionModal)
        //   기존: 직원 검색 + 등록단위(일/시간) + 날짜방식 3탭(단일/기간/지정일)
        //   변경: 직원 검색 + MiniCalendar(달력 클릭 선택) + 시간(Hour) 정밀 입력
        //         + [목록에 담기] 장바구니(cart) + [전체 등록하기] 일괄 저장
        //
        //   ▷ 추가된 prop:

        //     · days   : 실제 차감 시간(시간 단위 숫자)  → 관리자 집계/엑셀대조 그대로 호환
        //     · type   : '8시간' 같은 라벨
        //     · date / reason / addedBy / createdAt
        //     · (시간 정밀입력 시) startTime/endTime/breakStart/breakEnd 추가 필드
        //     · (온종일 처리 시) fullDay: true
        //   ============================================================================
        const LeaveActionModal = ({ onClose, staffList, adminName, initialData = null, prefillHours = null, showAlert, showConfirm }) => {
            const isEdit = !!(initialData && initialData.id); // 기존 내역 '수정' 여부

            // ---- 직원 선택 (기존 검색 드롭다운 UI 그대로 유지) ----
            const [selectedStaffId, setSelectedStaffId] = useState(initialData?.staffId || '');
            const [staffSearch, setStaffSearch] = useState('');
            const [isStaffDropdownOpen, setIsStaffDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            // ---- [v6.15.0] 날짜: MiniCalendar 다중 선택 (기존 dateMode 3탭 제거) ----
            //  · 신규 등록: 달력에서 여러 날짜 클릭 → selectedDates 배열
            //  · 수정(isEdit): 해당 1건의 날짜만 담아 시작
            const [selectedDates, setSelectedDates] = useState(
                isEdit && initialData?.date ? [initialData.date] : []
            );

            // ---- [v6.15.0] 시간 입력 방식 ----
            //  'time'   : 연차/휴게 시작·종료로 실제 차감 시간 자동 계산 (TimeSelect)
            //  'manual' : 차감 시간(숫자)을 직접 입력  ← 엑셀 대조 Pre-fill이 여기로 들어옵니다
            const [inputMode, setInputMode] = useState('manual'); // 기본은 '직접 입력'(관리자 편의)
            const [startTime, setStartTime] = useState('00:00');
            const [endTime, setEndTime] = useState('00:00');
            const [breakStart, setBreakStart] = useState('00:00');
            const [breakEnd, setBreakEnd] = useState('00:00');
            const [manualHours, setManualHours] = useState(''); // 직접 입력 시간(문자열)

            const [reason, setReason] = useState(initialData?.reason || '');
            const [msg, setMsg] = useState('');

            // ---- [v6.15.0] 장바구니(cart) ----
            //  각 항목: { key, dates:[YYYY-MM-DD...], deductHours, inputMode,
            //            startTime, endTime, breakStart, breakEnd, reason }
            const [cart, setCart] = useState([]);

            useEscClose(onClose); // [v6.17.0] ESC로 닫기

            // 드롭다운 바깥 클릭 시 닫기
            useEffect(() => {
                const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsStaffDropdownOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            // 수정 모드로 열릴 때 직원 이름을 검색창에 표시
            useEffect(() => { if (initialData && staffList.length) { const s = staffList.find(x => x.id === initialData.staffId); if (s) setStaffSearch(s.name); } }, [initialData, staffList]);

            // 수정 모드: 기존 내역의 시간 정보를 폼에 채움
            useEffect(() => {
                if (initialData && isEdit) {
                    if (initialData.startTime && initialData.endTime) {
                        // 시각 정보가 있으면 '시각으로 계산' 모드로 복원
                        setInputMode('time');
                        setStartTime(initialData.startTime); setEndTime(initialData.endTime);
                        setBreakStart(initialData.breakStart || '00:00'); setBreakEnd(initialData.breakEnd || '00:00');

                        // 옛 데이터(시각 없음)는 '직접 입력' 모드로, 기존 차감 시간을 보존
                        setInputMode('manual');
                        setManualHours(String(safeParseFloat(initialData.days) || ''));

            }, [initialData, isEdit]);

            // ★[v6.15.0 핵심] 엑셀 대조 Pre-fill: prefillHours가 넘어오면
            //  '직접 입력' 모드로 강제 전환 + 오차 시간을 인풋칸에 미리 채웁니다.
            useEffect(() => {
                if (!isEdit && prefillHours !== null && prefillHours !== undefined && safeParseFloat(prefillHours) > 0) {
                    setInputMode('manual');
                    setManualHours(String(safeParseFloat(prefillHours)));
                }
            }, [prefillHours, isEdit]);

            const filteredStaffList = useMemo(() => [...staffList].sort((a,b) => a.name.localeCompare(b.name)).filter(s => s.name.toLowerCase().includes(staffSearch.toLowerCase())), [staffList, staffSearch]);
            const selectedStaff = useMemo(() => staffList.find(s => s.id === selectedStaffId), [staffList, selectedStaffId]);
            const dailyHours = safeParseFloat(selectedStaff?.workHours) || 8;

            // ---- 실시간 차감 시간 계산 ----
            const calc = useMemo(() => calcLeaveHours(startTime, endTime, breakStart, breakEnd), [startTime, endTime, breakStart, breakEnd]);
            const deductHours = inputMode === 'time' ? calc.hours : safeParseFloat(manualHours);
            const blockingError = inputMode === 'time' ? calc.error : (deductHours <= 0 ? '차감 시간을 입력하세요.' : '');
            const ratio = dailyHours > 0 ? Math.min(1, deductHours / dailyHours) : 0;

            // 선택 날짜(정렬)
            const validDates = useMemo(() => [...selectedDates].sort(), [selectedDates]);

            // 이미 휴가가 등록된 날 (달력 주황 점 + 중복 확인용)
            const takenDates = useMemo(() => {
                const s = new Set();
                (selectedStaff?.leaveHistory || []).forEach(h => { if (h.date) s.add(h.date); });
                return s;
            }, [selectedStaff]);
            // 장바구니에 담긴 날도 중복 대상에 포함
            const cartDates = useMemo(() => { const s = new Set(); cart.forEach(it => it.dates.forEach(d => s.add(d))); return s; }, [cart]);
            const dupDates = useMemo(() => validDates.filter(d => takenDates.has(d) || cartDates.has(d)), [validDates, takenDates, cartDates]);
            const calendarTaken = useMemo(() => new Set([...takenDates, ...cartDates]), [takenDates, cartDates]);
            const cartTotalDays = useMemo(() => cart.reduce((sum, it) => sum + it.dates.length, 0), [cart]);

            // ---- [v6.15.0] 목록에 담기 (등록하지 않고 장바구니에만 추가) ----
            const addToCart = () => {
                if (!selectedStaffId || !selectedStaff) { setMsg('❌ 먼저 직원을 검색·선택해주세요.'); return; }
                if (blockingError) { setMsg('❌ ' + blockingError); return; }
                if (deductHours <= 0) { setMsg('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (!validDates.length) { setMsg('❌ 달력에서 날짜를 먼저 선택해주세요.'); return; }
                if (dupDates.length) { setMsg(`❌ 다음 날짜는 이미 등록됐거나 담겨 있습니다: ${dupDates.join(', ')}`); return; }
                const item = {
                    key: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                    dates: [...validDates], deductHours, inputMode,
                    startTime, endTime, breakStart, breakEnd, reason
                };
                setCart(prev => [...prev, item]);
                // 다음 입력을 위해 날짜·사유만 비우고 시간 설정은 유지(연속 입력 편의)
                setSelectedDates([]); setReason(''); setMsg('');
            };

            const removeFromCart = (key) => setCart(prev => prev.filter(it => it.key !== key));

            // ---- 저장 헬퍼: 장바구니 항목 배열을 leaveHistory 레코드로 변환 ----
            const buildRecords = (items) => {
                const recs = [];
                items.forEach((item, ci) => {
                    const tText = hourLabel(item.deductHours);
                    item.dates.forEach((d, idx) => {
                        const rec = {
                            id: Date.now().toString() + Math.floor(Math.random() * 1000) + ci + '_' + idx,
                            date: safeDate(d), days: item.deductHours, type: tText,
                            reason: item.reason, addedBy: adminName, createdAt: new Date().toISOString()
                        };
                        if (item.inputMode === 'time') { rec.startTime = item.startTime; rec.endTime = item.endTime; rec.breakStart = item.breakStart; rec.breakEnd = item.breakEnd; }
                        else { rec.startTime = ''; rec.endTime = ''; rec.breakStart = ''; rec.breakEnd = ''; }
                        recs.push(rec);
                    });
                });
                return recs;
            };

            // ---- 장바구니 전체 등록 ----
            const doRegisterCart = async () => {
                try {
                    const newHistory = [...(selectedStaff.leaveHistory || []), ...buildRecords(cart)];
                    await recalcAndSave(selectedStaffId, selectedStaff.joinDate, newHistory);
                    setMsg('✅ 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 900);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            // ---- 현재 입력 한 건만 바로 등록 (장바구니 미사용 경로) ----
            const doRegisterSingle = async () => {
                try {
                    const singleItem = [{ dates: validDates, deductHours, inputMode, startTime, endTime, breakStart, breakEnd, reason }];
                    const newHistory = [...(selectedStaff.leaveHistory || []), ...buildRecords(singleItem)];
                    await recalcAndSave(selectedStaffId, selectedStaff.joinDate, newHistory);
                    setMsg('✅ 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 900);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            // ---- 기존 내역 '수정' 저장 ----
            const doSaveEdit = async () => {
                try {
                    const newHistory = [...(selectedStaff.leaveHistory || [])];
                    const idx = newHistory.findIndex(h => h.id === initialData.id);
                    if (idx !== -1) {
                        const tText = hourLabel(deductHours);
                        const rec = { ...newHistory[idx], date: safeDate(validDates[0] || initialData.date), days: deductHours, type: tText, reason, addedBy: adminName, updatedAt: new Date().toISOString() };
                        if (inputMode === 'time') { rec.startTime = startTime; rec.endTime = endTime; rec.breakStart = breakStart; rec.breakEnd = breakEnd; }
                        else { rec.startTime = ''; rec.endTime = ''; rec.breakStart = ''; rec.breakEnd = ''; }
                        newHistory[idx] = rec;
                    }
                    await recalcAndSave(selectedStaffId, selectedStaff.joinDate, newHistory);
                    setMsg('✅ 수정 완료!'); setTimeout(() => { setMsg(''); onClose(); }, 900);
                } catch (err) { setMsg('❌ 오류 발생'); showAlert('오류: ' + err.message); }
            };

            // ---- 메인 제출 핸들러 ----
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedStaffId || !selectedStaff) { setMsg('❌ 직원을 검색하여 선택해주세요.'); return; }
                if (blockingError) { setMsg('❌ ' + blockingError); return; }

                // (1) 수정 모드
                if (isEdit) {
                    if (!validDates.length) { setMsg('❌ 날짜를 선택해주세요.'); return; }
                    setMsg('처리 중...'); doSaveEdit(); return;
                }

                // (2) 장바구니에 담긴 항목이 있으면 그것을 등록
                if (cart.length) {
                    // 입력창에 아직 담지 않은 유효 날짜가 남아있으면 안내
                    if (validDates.length && !dupDates.length && deductHours > 0) {
                        showConfirm(`장바구니에 담긴 ${cart.length}건과 별도로, 지금 입력한 날짜(${validDates.length}일)는 아직 담지 않았습니다.\n\n담긴 ${cart.length}건만 등록할까요?\n(현재 입력분도 넣으려면 취소 후 [목록에 담기]를 누르세요)`, () => { setMsg('처리 중...'); doRegisterCart(); });
                        return;
                    }
                    setMsg('처리 중...'); doRegisterCart(); return;
                }

                // (3) 장바구니가 비어 있으면 현재 입력 한 건을 바로 등록
                if (deductHours <= 0) { setMsg('❌ 실제 차감 시간이 0입니다. 시간을 확인해주세요.'); return; }
                if (!validDates.length) { setMsg('❌ 달력에서 날짜를 선택해주세요.'); return; }
                if (dupDates.length) {
                    showConfirm(`선택한 날짜 중 ${dupDates.length}일은 이미 휴가가 등록되어 있습니다.\n\n· ${dupDates.join(', ')}\n\n그래도 추가로 등록하시겠습니까? (같은 날에 여러 건이 쌓입니다)`, () => { setMsg('처리 중...'); doRegisterSingle(); });
                    return;
                }
                setMsg('처리 중...'); doRegisterSingle();
            };

            return (
                // [v6.17.0] PC에서는 max-w-4xl 2단(좌: 달력 / 우: 입력), 모바일은 max-w-md 세로.
